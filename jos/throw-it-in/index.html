<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Throw It In</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body { margin:0; height:100%; overflow:hidden; background:#87ceeb; font-family:'Trebuchet MS',Arial,sans-serif; user-select:none; }
  canvas#gl { position:fixed; inset:0; width:100%; height:100%; display:block; }
  #hud { position:fixed; top:14px; left:16px; color:#fff; font-size:26px; font-weight:bold; text-shadow:0 2px 0 #0007; pointer-events:none; line-height:1.4; }
  #hud small { font-size:16px; }
  #cross { position:fixed; left:50%; top:50%; width:8px; height:8px; margin:-4px 0 0 -4px; border-radius:50%; background:#fff; border:2px solid #0006; pointer-events:none; }
  #hint { position:fixed; bottom:22px; left:50%; transform:translateX(-50%); color:#fff; font-size:20px; font-weight:bold; text-shadow:0 2px 0 #000a; pointer-events:none; transition:opacity .2s; opacity:0; background:#0005; padding:6px 16px; border-radius:20px; white-space:nowrap; }
  #msg { position:fixed; left:50%; top:28%; transform:translate(-50%,0); font-size:40px; font-weight:bold; color:#fff; text-shadow:0 3px 0 #000a; pointer-events:none; opacity:0; text-align:center; white-space:nowrap; }
  #msg.go { animation:msgpop 1.4s ease-out; }
  @keyframes msgpop { 0% { opacity:1; transform:translate(-50%,10px) scale(.7); } 12% { transform:translate(-50%,0) scale(1.1); } 75% { opacity:1; } 100% { opacity:0; transform:translate(-50%,-30px) scale(1); } }
  #crank { position:fixed; left:50%; bottom:70px; transform:translateX(-50%); width:360px; height:26px; border-radius:14px; background:#0007; border:3px solid #fff; overflow:hidden; display:none; pointer-events:none; }
  #crankFill { height:100%; width:0; background:#ffb300; }
  #menu, #shop { position:fixed; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; color:#fff; text-align:center; gap:14px; z-index:5; background:#000b; }
  #menu h1 { font-size:68px; margin:0; letter-spacing:3px; text-shadow:0 5px 0 #000a; }
  #menu h2, #shop h2 { font-size:46px; margin:0; }
  #menu p { font-size:19px; margin:0; max-width:600px; line-height:1.5; }
  #menu b.k { background:#fff; color:#000; padding:2px 10px; border-radius:6px; }
  .mbtn { font-family:inherit; font-size:28px; font-weight:bold; padding:12px 44px; border-radius:16px; border:5px solid #fff; background:#2f7bff; color:#fff; cursor:pointer; box-shadow:0 6px 0 #0007; min-width:280px; }
  .mbtn.alt { background:#555; font-size:20px; min-width:0; padding:8px 28px; }
  #shop { background:#1b2a41f2; justify-content:flex-start; padding-top:26px; overflow:auto; }
  #tabs { display:flex; gap:10px; }
  .tab { font-family:inherit; font-size:22px; font-weight:bold; padding:8px 24px; border-radius:12px 12px 0 0; border:4px solid #fff; border-bottom:none; background:#345; color:#fff; cursor:pointer; }
  .tab.on { background:#2f7bff; }
  #list { width:min(780px,92vw); max-height:56vh; overflow-y:auto; background:#0b1a2e; border:4px solid #fff; border-radius:0 0 14px 14px; margin-top:-14px; }
  .row { display:flex; align-items:center; gap:14px; padding:10px 16px; border-bottom:2px solid #fff3; text-align:left; }
  .row .tx { flex:1; font-size:16px; line-height:1.35; }
  .row .tx b { font-size:21px; display:block; }
  .row button { font-family:inherit; font-size:20px; font-weight:bold; padding:8px 0; width:130px; border-radius:12px; border:4px solid #fff; background:#27ae60; color:#fff; cursor:pointer; }
  .row button:disabled { background:#666; border-color:#aaa; cursor:not-allowed; }
  #fall { position:fixed; inset:0; z-index:25; display:none; pointer-events:none; overflow:hidden; }
  .gc { position:absolute; border-radius:50%; transform:translate(-50%,-50%); animation:gcpulse .6s ease-in-out infinite alternate; }
  @keyframes gcpulse { from { transform:translate(-50%,-50%) scale(.8); } to { transform:translate(-50%,-50%) scale(1.15); } }
  #splat { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; opacity:0; z-index:4; image-rendering:pixelated; }
  #odds { position:fixed; top:14px; right:16px; color:#fff; font-size:17px; font-weight:bold; text-shadow:0 2px 0 #0008; pointer-events:none; background:#0004; padding:8px 14px; border-radius:12px; line-height:1.5; text-align:right; }
  #boxInfo { position:fixed; left:50%; top:56%; transform:translateX(-50%); display:none; color:#fff; text-align:center; font-weight:bold; font-size:18px; text-shadow:0 2px 0 #000a; background:#0007; padding:10px 18px; border-radius:14px; pointer-events:none; max-width:440px; line-height:1.4; }
  #boxInfo b { font-size:26px; display:block; }
  #boxInfo .bar { height:16px; border-radius:9px; background:#0007; border:3px solid #fff; overflow:hidden; margin:6px 0; }
  #boxInfo .bar div { height:100%; background:#ffb300; }
  #boxInfo .ret { display:inline-block; margin-top:8px; background:#c62828; border:3px solid #fff; border-radius:10px; padding:4px 16px; font-size:20px; }
  #combo { position:fixed; top:14px; left:50%; transform:translateX(-50%); width:380px; display:none; text-align:center; color:#fff; font-weight:bold; font-size:18px; text-shadow:0 2px 0 #000a; pointer-events:none; }
  #combo .bar { height:20px; border-radius:11px; background:#0007; border:3px solid #fff; overflow:hidden; }
  #comboFill { height:100%; background:#43a047; }
  #stars { position:fixed; inset:0; z-index:20; pointer-events:none; display:none; }
  #stars div { position:absolute; width:54px; height:54px; margin:-27px 0 0 -27px; background:#ffd600; clip-path:polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); }
  #big { position:fixed; inset:0; z-index:30; background:transparent; color:#000; -webkit-text-stroke:3px #fff; paint-order:stroke fill; display:none; flex-direction:column; align-items:center; justify-content:center; font-family:'Arial Black','Arial Bold',Arial,sans-serif; font-weight:900; line-height:1; white-space:nowrap; overflow:hidden; }
  .card button:disabled { background:#666; border-color:#aaa; cursor:not-allowed; }
</style>
</head>
<body>

<div id="hud"></div>
<div id="cross"></div>
<div id="crank"><div id="crankFill"></div></div>
<div id="combo"><div class="bar"><div id="comboFill"></div></div><span id="comboTxt">BONUS</span></div>
<canvas id="splat"></canvas>
<div id="odds"></div>
<div id="boxInfo"></div>

<script src="lib/three.min.js"></script>
<script src="junk3d.js?v=3"></script>
<script>
// =====================================================================
// THROW IT IN — a game by Jos.
// Turn the wheels on the machine. Junk comes out. Throw it in the hole. Coins fly out. Pick them up.
// =====================================================================

// ---- the 150 pieces of junk. Each one has its own 3D shape. The shapes are in junk3d.js. ----
// Every 10th one is rare and worth more.
const JUNK = `
Tin can, Old shoe, Broken TV, Banana peel, Soggy box, Smelly sock, Flat tyre, Old newspaper, Mouldy pizza, One-eyed teddy,
Crackly radio, Old phone, Floppy disk, Video tape, Dead battery, Blown bulb, Wobbly chair, Cracked toilet, Soggy loo roll, Muddy boot,
Squashed hat, Lost glove, Bent glasses, Stopped watch, Broken camera, Stringless guitar, Dented trumpet, Burst drum, Toy piano, Broken banjo,
Rotten apple, Bendy carrot, Stinky cheese, Bad egg, Stale bread, Chewed bone, Fish bones, Sour milk, Empty juice box, Crushed cup,
Empty bottle, Sticky jar, Old takeaway, Rock-hard donut, Nibbled corn, Chicken bone, Sprouting onion, Green potato, Squeezed lemon, Cracked coconut,
Rusty spanner, Headless hammer, Bent screwdriver, Blunt saw, Rusty cog, Loose bolt, Rusty chain, Weak magnet, Leaky bucket, Bald broom,
Crusty sponge, Old toothbrush, Empty shampoo, Hairy soap, Blunt razor, Cracked mirror, Tiny bath, Drippy shower, Plunger, Empty extinguisher,
Flat football, Flat basketball, Bald tennis ball, Broken bat, Three-wheel skateboard, One roller skate, Chipped bowling ball, Lonely boxing glove, Bent racket, Rusty ice skate,
Bent bike, Wobbly scooter, Wonky trolley, Toy car, Toy train, Toy plane, Toy rocket, Toy UFO, Toy boat, Toy helicopter,
Old monitor, Sticky keyboard, Broken computer mouse, Jammed printer, Scratched CD, Smashed phone, Sticky controller, Wobbly joystick, Chewed plug, Bent dish,
Soggy books, Boring book, Tiny pencil, Snapped crayon, Blunt scissors, Giant paperclip, Snapped ruler, Crusty paintbrush, Bent pin, Bin lid,
Holey T-shirt, Ripped jeans, Faded cap, Ugly tie, Itchy scarf, Broken handbag, Ripped backpack, Inside-out umbrella, Plastic crown, Toy ring,
Dead plant, Spiky cactus, Bag of leaves, Rotten log, Boring rock, Chipped shell, Empty nest, Squashed pumpkin, Old Christmas tree, Droopy sunflower,
Popped balloon, Empty present, Tangled yo-yo, Ripped kite, Lonely jigsaw piece, Lucky dice, Bent card, Chipped doll, Rusty robot, Glitchy game,
Stopped clock, Loud alarm clock, Cracked bell, Melted candle, Dim torch, Confused compass, Mystery key, Rusty padlock, Fake trophy, Fake diamond
`.split(',').map((s, i) => ({ name: s.trim(), value: i % 10 === 9 ? 25 : 2 + (i*37) % 9, rare: i % 10 === 9 }));

// ---- numbers you can change ----
const CRANK_TIMES = [7, 6, 5, 4, 3, 2];      // seconds of turning the wheels before junk comes out
const POP_GAPS = [1.5, 1.2, 1, .7, .5, .3, .1];      // the machine pops while you turn it. These are the waits between pops (seconds). Each pop is higher.
const AUTO_TIMES = [15, 12, 9, 6, 3];        // seconds the automatic junk thrower waits between junk
const MAX_JUNK = 60;                          // the machines stop when this much junk is lying in the yard
const goalFor = n => 100 + 200*n;             // HOLE GROWS BIGGER at 100 pieces of junk, then 300, then 500, then 700...
const HOLE_GROW = .15;                        // how much wider the hole gets each time (half a foot, in metres)
const YARD_ACROSS = 16, YARD_DEEP = 10;       // how big the yard is at the start: 16 metres across, 10 metres from the garage to the front hedge
const YARD_GROW = 2;                          // how far the hedge moves out each time (metres)
const CLOCK_AT = 200;                         // the alarm clock drops from the sky at this many pieces of junk
const AUTO_AT = 3;                            // the automatic junk thrower arrives the 3rd time the hole grows (that is 500)
const COIN_WALK = 1.2;                         // automatic coin pick up: how close you have to walk to a coin (metres)
const COINS = [                               // name, how many pounds it is worth, colour
  { name: 'bronze', v: 1,  col: 0xcd7f32, ink: '#5a3410' },
  { name: 'silver', v: 2,  col: 0xcfd4d8, ink: '#555' },
  { name: 'gold',   v: 5,  col: 0xffc400, ink: '#7a5200' },
  { name: 'plasma', v: 10, col: 0x3a3f47, ink: '#cfd8dc' },
];
const UPGRADES = [                            // id, name, what it does, first price, how many levels, when you can see it
  ['arm',   'Stronger arm',   'You throw further.',                                   20, 5],
  ['speed', 'Faster machine', 'Junk comes out one second sooner.',                    30, 5],
  ['fancy', 'Fancier junk',   'Every piece of junk is worth more.',                   50, 5],
  ['coins', 'Automatic coin pick up', 'Walk over a coin and you pick it up. No clicking.',             120, 1],
  ['fan',   'Stronger fans',  'Fans push a little bit harder.',                       40, 5],
  ['mstr',  'Magnet strength', 'The magnet holds on tighter when you turn fast.',     40, 5, () => hasMagnet],
  ['mrad',  'Magnet pull radius', 'The magnet reaches further.',                      40, 5, () => hasMagnet],
  ['auto',  'Faster automatic junk thrower', 'It waits 3 seconds less.',              80, 4, () => ms >= AUTO_AT],
  ['walk',  'Faster walking', 'You walk faster.',                                     25, 5],
  ['reach', 'Longer reach',   'Pick up junk from 1 metre further away.',              30, 4],
  ['lucky', 'Lucky machine',  'Rare junk comes out more often.',                      60, 5],
  ['rare',  'Richer rare junk', 'Rare junk is worth £10 more.',                       60, 5],
  ['double','Double junk',    'A bigger chance that two pieces come out at once.',    70, 5],
  ['room',  'More room',      'The machines keep going with 20 more junk in the yard.', 35, 4],
  ['scoop', 'Coin scoop',     'Click one coin and the coins near it come too.',       40, 3],
  ['rim',   'Slippery rim',   'Junk that stops right at the edge of the hole slides in.', 45, 3],
  ['fanlen','Longer fans',    'Fans blow 1 metre further.',                           40, 5],
  ['bouncy','Bouncier trampolines', 'Trampolines throw junk higher.',                 30, 5],
  ['bigbox','Bigger box',     'Your box gets half a metre bigger each way.',          60, 4, () => placed.some(o => o.t === 'box')],
];
const BONUSES = [                             // these go in the Bonus list. Same shape as the upgrades.
  ['bdur', 'Bonus duration', 'You get 1 more second to keep a combo going.',         50, 5],
  ['b20',  'Twice money',    'Every 20th piece of junk pays 2 times as much.',      100, 1],
  ['b30',  'Times 3',        'Every 30th piece of junk pays 3 times as much.',      200, 1],
  ['b50',  'Times 5',        'Every 50th piece of junk pays 5 times as much.',      400, 1],
  ['gch',  'More gold junk',   'More chance to spawn a gold junk. 1% more each time.',   90, 5],
  ['sch',  'More silver junk', 'More chance to spawn a silver junk. 1% more each time.', 60, 5],
];
const BONUS_SECONDS = 3;                      // how long the green bonus bar lasts (each Bonus duration upgrade adds 1 second)
const COMBO_STEP = .5;                        // COMBO x2 pays 1.5 times, x3 pays 2 times, x4 pays 2.5 times...
const TOOLS = [                               // id, name, what it does, price
  ['fan',    'Fan',         'Blows junk along. One fan is weak, so use a few.',        40],
  ['tramp',  'Trampoline',  'Junk bounces off it.',                                    30],
  ['panel',  'Panel',       'Just a wall. Junk bounces off it. You can tilt it.',      20],
  ['magnet', 'Junk magnet', 'Space takes it out. Space twice quickly turns it on.',    60],
  ['box',    'Box',         'Holds junk in a small space. 1 metre by 1 metre. You can only have one.', 50],
];
const TOOL_NAME = { fan: 'Fan', tramp: 'Trampoline', panel: 'Panel', box: 'Box' };
const BOX_WALL = .7, boxSize = () => 1 + .5*up.bigbox;      // how tall the walls of the box are, and how wide the box is (metres)
const X_FAR = 4;                                               // how far in front of a machine its X is (metres). Junk always lands on the X.
const DUSTER_CHANCE = 30;                                      // out of 100 vacuum cleaners, this many go and put dust on a machine
const FLIP_SECONDS = 1.5;                                      // how long the box stays upside down when you flip it
const STUN_SECONDS = 3;                                        // how long you cannot move after the box hits you on the head
const TOOL_SIZE = { fan: .25, tramp: .5, panel: .5, box: 1 };      // how big each tool is. 1 is the old full size, .5 is half of that.
const CLOCK = { name: 'ALARM CLOCK', shape: 'Loud alarm clock', value: 1, clock: true };

// ---- your save ----
const SAVE = 'throw-it-in-v2';
let money = 0, up = {};
for (const u of UPGRADES.concat(BONUSES)) up[u[0]] = 0;
let pot = 0, sunk = 0, ms = 0, hasMagnet = false, clock = 0, autoOn = false, savedTools = [];
let savedJunk = null, savedCoins = [], savedBox = null, savedBoxWait = 60, savedTape = null;      // what was lying in the yard when you left, and the cleaner box
const ZB = -10, yardW = () => YARD_ACROSS/2 + YARD_GROW*ms, yardZ1 = () => ZB + YARD_DEEP + YARD_GROW*ms;      // ZB is the back of the yard. yardW is half way across. yardZ1 is the front.
const HOLE = { x: YARD_ACROSS*.15, z: ZB + YARD_DEEP*.6, r: .7 };
try {
  const s = JSON.parse(localStorage.getItem(SAVE) || 'null');
  if (s) { money = (s.money || 0) + (s.pot || 0); Object.assign(up, s.up || {}); sunk = s.sunk || 0; ms = s.ms || 0; hasMagnet = !!s.hasMagnet; clock = s.clock || 0; autoOn = !!s.autoOn; savedTools = s.tools || [];
    savedJunk = s.junk || null; savedCoins = s.coins || []; savedBox = s.box || null; savedTape = s.tape || null; if (s.boxWait > 0) savedBoxWait = s.boxWait;
    if (s.hole && Math.abs(s.hole.x) < yardW() - s.hole.r && s.hole.z > ZB + s.hole.r && s.hole.z < yardZ1() - s.hole.r) Object.assign(HOLE, s.hole); }      // only if the saved hole is inside the yard
  else { const old = JSON.parse(localStorage.getItem('throw-it-in-v1') || 'null'); if (old) money = old.money || 0; }
} catch (e) {}
// Jos asked (21 Nov) to go back to zero junk in the hole after testing. This happens once: the hole goes back to its first size and the clock starts again.
// Your money, upgrades and tools stay. Anything you got from the test (the automatic junk thrower) goes, and comes back when you earn it.
if (!localStorage.getItem('throw-it-in-zero-1')) { sunk = 0; ms = 0; clock = 0; HOLE.r = .7; HOLE.x = YARD_ACROSS*.15; HOLE.z = ZB + YARD_DEEP*.6; try { localStorage.setItem('throw-it-in-zero-1', '1'); } catch (e) {} }
function save() {
  try {
    const r2 = n => Math.round(n*100)/100;                      // 2 numbers after the dot is plenty
    localStorage.setItem(SAVE, JSON.stringify({ money, pot, up, sunk, ms, hasMagnet, clock, autoOn, hole: HOLE, tools: placed.map(o => ({ t: o.t, x: o.x, z: o.z, yaw: o.yaw, pitch: o.pitch })),
      // every piece of junk in the yard (the one in your hand too), every coin, and the cleaner box with the time it has left
      junk: junk.filter(j => !j.d.vac && !j.d.clock && j.state !== 'sink').map(j => ({ n: JUNK.indexOf(j.d), t: j.tint, x: r2(j === held ? P.x : j.mesh.position.x), z: r2(j === held ? P.z : j.mesh.position.z) })),
      coins: coins.map(o => ({ c: COINS.indexOf(o.c), x: r2(o.mesh.position.x), z: r2(o.mesh.position.z) })),
      box: cbox ? { x: cbox.x, z: cbox.z, t: r2(cbox.t), roll: r2(cbox.roll), ret: !!cbox.ret } : null, boxWait: r2(boxWait),
      // the red tape on the hole: how many clicks each piece has had, whether the hole is shut, and how many pieces the vacuum cleaners still want to stick on
      tape: { clicks: tapes.filter(t => !t.going).map(t => t.clicks), taped, want: tapeJob ? tapeJob.want : 0 } }));
  } catch (e) {}
}
const maxJunk = () => MAX_JUNK + 20*up.room, bonusDur = () => BONUS_SECONDS + up.bdur;
const crankTime = () => CRANK_TIMES[up.speed], throwSpeed = () => 8 + 2*up.arm, valueMul = () => 1 + .5*up.fancy;
const magR = () => .3 + .25*up.mrad, magK = () => 14 + 22*up.mstr;          // the magnet reaches one foot (0.3 m) to start with

const $ = id => document.getElementById(id);
const rnd = (a, b) => a + Math.random()*(b - a), lerp = (a, b, k) => a + (b - a)*k;

// ====================== THE WORLD ======================
const cv = $('gl');
const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true, logarithmicDepthBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 60, 400);
const camera = new THREE.PerspectiveCamera(70, 1, .05, 1200);
scene.add(camera);
function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
scene.add(new THREE.HemisphereLight(0xffffff, 0x557744, .78));
{ const sun = new THREE.DirectionalLight(0xffffff, .6); sun.position.set(30, 50, 20); scene.add(sun); }

const M = (c, o) => new THREE.MeshLambertMaterial(Object.assign({ color: c }, o || {}));
const HIT = new THREE.MeshBasicMaterial({ visible: false });       // see-through shapes, only used to tell what you are looking at
function box(w, h, d, c, x, y, z, parent) { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), M(c)); m.position.set(x, y, z); (parent || scene).add(m); return m; }

// things that happen over time (the hedge sinking, the tube from the sky...)
const anims = [];
function after(sec, fn) { let t = 0; anims.push(dt => (t += dt) >= sec ? (fn(), true) : false); }
function tween(sec, fn, done) { let t = 0; anims.push(dt => { t += dt; const k = Math.min(1, t/sec); fn(k); if (k >= 1) { if (done) done(); return true; } return false; }); }

// Metal: every 2 feet there is a black line round it, with black dots (rivets) above and below the line.
// The tube from the sky is made of it, and so is the inside of the hole.
function metalTex(around, length) {
  const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 128, 0);
  gr.addColorStop(0, '#aeb6bb'); gr.addColorStop(.5, '#d5dadd'); gr.addColorStop(1, '#aeb6bb'); g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
  g.fillStyle = '#000'; g.fillRect(0, 61, 128, 6);
  for (const x of [32, 96]) for (const y of [42, 86]) { g.beginPath(); g.arc(x, y, 6, 0, 7); g.fill(); }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(around, length/.61); return t;       // 0.61 metres is 2 feet
}
const PIT_DEEP = 16, PIT_TEX = metalTex(4, PIT_DEEP);
const PIT_METAL = new THREE.MeshBasicMaterial({ map: PIT_TEX, vertexColors: true, side: THREE.BackSide, fog: false }), PIT_DARK = new THREE.MeshBasicMaterial({ color: 0x000000, side: THREE.BackSide, fog: false });

// the grass, with a real hole cut in it. It is rebuilt whenever the hole moves or grows.
let groundM = null, pitG = null;
function buildGround() {
  if (groundM) { scene.remove(groundM); groundM.geometry.dispose(); scene.remove(pitG); pitG.traverse(o => o.geometry && o.geometry.dispose()); }
  const R = HOLE.r;
  const sh = new THREE.Shape(); sh.moveTo(-500, -500); sh.lineTo(500, -500); sh.lineTo(500, 500); sh.lineTo(-500, 500); sh.lineTo(-500, -500);
  const h = new THREE.Path(); h.absarc(HOLE.x, -HOLE.z, R, 0, Math.PI*2, true); sh.holes.push(h);
  groundM = new THREE.Mesh(new THREE.ShapeGeometry(sh, 32), GRASS); groundM.rotation.x = -Math.PI/2; scene.add(groundM);
  pitG = new THREE.Group(); pitG.position.set(HOLE.x, 0, HOLE.z);
  // the top of the hole is a metal tube that gets darker and darker as it goes down. Below that it is black, 300 metres deep, so you never see a bottom.
  const tg = new THREE.CylinderGeometry(R, R, PIT_DEEP, 32, 16, true), pos = tg.attributes.position, col = new Float32Array(pos.count*3);
  for (let i = 0; i < pos.count; i++) { const k = Math.pow(Math.max(0, (pos.getY(i) + PIT_DEEP/2)/PIT_DEEP), 1.6); col[i*3] = col[i*3 + 1] = col[i*3 + 2] = k; }
  tg.setAttribute('color', new THREE.BufferAttribute(col, 3)); PIT_TEX.repeat.x = Math.max(3, Math.round(2*Math.PI*R/1.1));

  if (carried) msg = 'Click to put the ' + TOOL_NAME[carried.t].toLowerCase() + ' down · K L turn it' + (carried.t === 'box' ? ' · F flip it over' : ' · O M tilt it');
  else if (clockHeld) msg = 'Press M to activate';
  else if (held && held.d.vac) msg = 'Click to throw the vacuum cleaner. It is always worth £2 in the hole.';
  else if (held) msg = 'Click to throw the ' + (held.tint ? held.tint + ' ' : '') + held.d.name + '. Aim for the hole!';
  else if (aim && aim.junk) msg = 'Click to pick up the ' + (aim.junk.tint ? aim.junk.tint + ' ' : '') + aim.junk.d.name;
  else if (aim && aim.coin) msg = 'Click to pick up the ' + aim.coin.c.name + ' coin (£' + aim.coin.c.v + ')';
  else if (aim && aim.tool) msg = TOOL_NAME[aim.tool.t] + ' · E carry it · K L turn it' + (aim.tool.t === 'box' ? ' · F flip it over' : ' · O M tilt it');
  else if (aim && aim.tape) msg = 'Click the red tape to pull it loose · ' + aim.tape.clicks + ' of ' + TAPE_CLICKS + ' · ' + tapes.length + ' pieces left';
  else if (aim && aim.shop) msg = 'Click to open the shop';
  else if (aim && aim.mach && aim.mach.dusted) msg = 'A vacuum cleaner is putting dust on it! Pick the vacuum cleaner up.';
  else if (aim && aim.mach && aim.mach.broken > 0) msg = 'Broken! It works again in ' + Math.ceil(aim.mach.broken) + ' seconds';
  else if (aim && aim.mach === mach) msg = full ? 'The yard is full of junk! Throw some in the hole.' : 'Hold the mouse button down to turn the wheels';
  else if (aim && aim.mach) msg = 'Automatic junk thrower · click to switch it ' + (autoOn ? 'OFF' : 'ON');
  const h = $('hint'); h.textContent = msg; h.style.opacity = msg ? 1 : 0;
  const bi = $('boxInfo');
  if (aim && aim.box && cbox && !cbox.ret) { const t = Math.max(0, cbox.t), mm = Math.floor(t/60), ss = String(Math.floor(t % 60)).padStart(2, '0');
    bi.style.display = 'block'; bi.innerHTML = '<b>Cleaner box</b>' + mm + ':' + ss + ' minutes left<div class="bar"><div style="width:' + (t/(BOX_MINUTES*60)*100) + '%"></div></div>Vacuum cleaners come out depending on how much junk you have on the ground.<br>Right now: ' + groundJunk() + ' pieces of junk = ' + vacChance() + '% chance<div class="ret">Return (Press X)</div>'; }
  else bi.style.display = 'none';
  const m = aim && aim.mach; $('crank').style.display = m ? 'block' : 'none'; if (m) $('crankFill').style.width = (m.prog*100) + '%';
  $('hud').innerHTML = '£' + money.toLocaleString() + (magOut ? '<br><small>Magnet ' + (magOn ? 'ON' : 'off') + '</small>' : '');
}

// ====================== SHOP AND MENUS ======================
// Click the garage door: it rolls up, you walk in to the computer, and the shop opens on it.
function openShop() {
  cut = true; mouseDown = false; $('hint').style.opacity = 0; $('crank').style.display = 'none'; whoosh();
  const from = camera.position.clone(), to = new THREE.Vector3(GAR.x, 1.5, GZ0 + 2.1), y0 = P.yaw, p0 = P.pitch;
  let dy = (0 - y0) % (Math.PI*2); if (dy > Math.PI) dy -= Math.PI*2; if (dy < -Math.PI) dy += Math.PI*2;          // turn the short way round
  tween(.6, k => { doorG.scale.y = 1 - .95*k; }, () => tween(1.2, k => { const e = k*k*(3 - 2*k); camera.position.lerpVectors(from, to, e); camera.rotation.set(lerp(p0, -.02, e), y0 + dy*e, 0, 'YXZ'); },
    () => { shopOpen = true; document.exitPointerLock(); drawShop(); $('shop').style.display = 'flex'; }));
}
function closeShop() {                                           // you come back out, and the door rolls down behind you
  cut = false; P.x = GAR.x; P.z = ZB + 2.2; P.yaw = Math.PI; P.pitch = 0;
  tween(.6, k => { doorG.scale.y = .05 + .95*k; });
}
function drawShop(note) {
  const rows = shopTab === 'tools' ? TOOLS : shopTab === 'bonus' ? BONUSES : UPGRADES.filter(u => !u[5] || u[5]());
  let h = '<h2>The Shop</h2><div style="font-size:26px;color:#ffd54f;font-weight:bold">£' + money.toLocaleString() + '</div><div style="font-size:19px;min-height:24px">' + (note || '') + '</div>' +
    '<div id="tabs">' + [['up', 'Upgrades'], ['tools', 'Tools'], ['bonus', 'Bonus']].map(([id, name]) => '<button class="tab' + (shopTab === id ? ' on' : '') + '" data-tab="' + id + '">' + name + '</button>').join('') + '</div><div id="list">';
  for (const [id, name, what, price, max] of rows) {
    let cost = price, off = false, label, extra = '';
    if (shopTab === 'tools') { off = (id === 'magnet' && hasMagnet) || (id === 'box' && placed.some(o => o.t === 'box')); label = off ? 'Got it' : '£' + price; }
    else { const lv = up[id]; cost = price*Math.pow(2, lv); off = lv >= max; label = off ? 'MAX' : '£' + cost; extra = max > 1 ? ' · level ' + lv + ' of ' + max : ''; }
    h += '<div class="row"><div class="tx"><b>' + name + '</b>' + what + extra + '</div><button data-buy="' + id + '"' + (off || money < cost ? ' disabled' : '') + '>' + label + '</button></div>';
  }
  h += '</div><button class="mbtn" id="bBack">Back to the yard</button>';
  const top = $('list') ? $('list').scrollTop : 0;
  $('shop').innerHTML = h; $('list').scrollTop = note === 0 ? 0 : top;
  $('bBack').onclick = () => cv.requestPointerLock();
  for (const b of $('shop').querySelectorAll('.tab')) b.onclick = () => { shopTab = b.dataset.tab; drawShop(0); };
  for (const b of $('shop').querySelectorAll('button[data-buy]')) b.onclick = () => {
    const id = b.dataset.buy; let note = '';
    if (shopTab === 'tools') { const t = TOOLS.find(x => x[0] === id); money -= t[3];
      if (id === 'magnet') { hasMagnet = true; note = 'Press Space to take the magnet out.'; }
      else { const o = mkTool(id, rnd(-yardW() + 1.3, yardW() - 1.3), rnd(ZB + 1.6, yardZ1() - .7), 0, id === 'tramp' ? -Math.PI/2 : 0); if (offTheHole(o)) applyTool(o); note = 'Your ' + t[1].toLowerCase() + ' is waiting outside the garage. Look at it and press E to carry it.'; } }
    else { const u = UPGRADES.concat(BONUSES).find(x => x[0] === id); money -= u[3]*Math.pow(2, up[id]); up[id]++; const b = placed.find(o => o.t === 'box'); if (b) applyTool(b); }
    ching(); save(); drawOdds(); drawShop(note);
  };
}
function showMenu(mode) {
  menuMode = mode; const m = $('menu'); m.style.display = 'flex';
  const help = '<p><b class="k">W A S D</b> walk · <b class="k">mouse</b> look · <b class="k">click</b> pick up and throw<br><b class="k">E</b> carry a tool · <b class="k">K L</b> turn it · <b class="k">O M</b> tilt it · <b class="k">Space</b> magnet</p>';
  if (mode === 'home') {
    m.innerHTML = '<h1>THROW IT IN</h1>' + help + '<p>Turn the wheels on the machine. Junk comes out. Throw it in the hole, and pick up the coins!</p>' +
      '<button class="mbtn" id="bPlay">' + (started || money || sunk ? 'Continue' : 'Play') + '</button>' +
      '<a class="mbtn alt" href="../index.html" style="text-decoration:none">← Jos\'s home page</a>';
    $('bPlay').onclick = () => { started = true; cv.requestPointerLock(); };
  } else {
    m.innerHTML = '<h2>PAUSED</h2>' + help + '<button class="mbtn" id="bRes">Resume</button><button class="mbtn alt" id="bHome">Home screen</button>';
    $('bRes').onclick = () => cv.requestPointerLock();
    $('bHome').onclick = () => { save(); showMenu('home'); };
  }
}
document.addEventListener('pointerlockchange', () => {
  locked = document.pointerLockElement === cv;
  if (locked) { if (shopOpen) closeShop(); menuMode = null; shopOpen = false; $('menu').style.display = 'none'; $('shop').style.display = 'none'; }
  else if (started && !shopOpen && !menuMode) showMenu('pause');
});
document.addEventListener('pointerlockerror', () => { if (!menuMode && !shopOpen) showMenu('pause'); });
setInterval(save, 4000); addEventListener('beforeunload', save);

// Put back what was in the yard when you left: the junk, the coins and the cleaner box.
// The very first time you play there is nothing saved, so you get three pieces of junk to throw straight away.
{ const inX = x => Math.max(-yardW() + .5, Math.min(yardW() - .5, x)), inZ = z => Math.max(ZB + .6, Math.min(yardZ1() - .5, z));
  if (savedJunk) for (const o of savedJunk) { if (!JUNK[o.n]) continue; const j = mkJunk(JUNK[o.n], new THREE.Vector3(inX(o.x), .4, inZ(o.z)), new THREE.Vector3(), o.t); j.pushed = true; }
  else for (const [x, z] of [[-.6, ZB + YARD_DEEP*.7], [.7, ZB + YARD_DEEP*.5], [-.9, ZB + YARD_DEEP*.3]]) mkJunk(JUNK[Math.floor(Math.random()*JUNK.length)], new THREE.Vector3(x, .4, z), new THREE.Vector3());
  for (const o of savedCoins) if (COINS[o.c]) { const c = mkCoin(COINS[o.c], new THREE.Vector3(inX(o.x), .04, inZ(o.z)), new THREE.Vector3()); c.state = 'rest'; c.mesh.rotation.y = rnd(0, 6); }
  if (savedBox) spawnBox(savedBox);
  // the red tape comes back, each piece just as loose as you left it
  if (savedTape && savedTape.clicks.length) {
    tapeJob = { want: savedTape.want || savedTape.clicks.length, wait: 1.5 };
    for (const c of savedTape.clicks) { addTape(); const t = tapes[tapes.length - 1]; t.clicks = c; t.peel = c/TAPE_CLICKS*.8; if (c) bendTape(t, t.peel, .34); }
    taped = !!savedTape.taped; tapeJob = null;
  }
  // the vacuum cleaners had not finished: they come back and stick on the rest
  if (savedTape && savedTape.want > tapes.length) sendTapers(HOLE.x, HOLE.z, savedTape.want); }

if (clock === 1) mkJunk(CLOCK, new THREE.Vector3(0, .6, ZB + YARD_DEEP*.65), new THREE.Vector3());      // you have an alarm clock you have not used yet

let last = performance.now(), homeT = 0;
function frame(now) {
  const dt = Math.min(.05, (now - last)/1000); last = now;
  if (menuMode === 'home') { homeT += dt*.12; const far = 9 + yardW(), mid = (ZB + yardZ1())/2; camera.position.set(Math.sin(homeT)*far, 7, mid + Math.cos(homeT)*far); camera.rotation.set(0, 0, 0); camera.lookAt(0, 1, mid); }
  else if (!menuMode && !shopOpen) {
    for (let n = anims.length - 1; n >= 0; n--) if (anims[n](dt)) anims.splice(n, 1);
    if (!cover && !cut) update(dt);
  }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
drawOdds();
showMenu('home');
requestAnimationFrame(frame);
</script>
