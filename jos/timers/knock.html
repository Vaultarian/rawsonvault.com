<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knock-the-Number Timer — Jos</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #080818;
      font-family: 'Nunito', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      padding: 20px;
    }

    .back-link {
      position: fixed;
      top: 20px;
      left: 20px;
      font-family: 'Fredoka One', cursive;
      color: #ffffff44;
      text-decoration: none;
      font-size: 1rem;
      letter-spacing: 1px;
      transition: color 0.2s;
      z-index: 50;
    }
    .back-link:hover { color: #fff; }

    .title {
      font-family: 'Fredoka One', cursive;
      font-size: 1.6rem;
      background: linear-gradient(90deg, #f72585, #7fff00, #00f5ff, #f72585);
      background-size: 300% 100%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: rainbowShift 4s linear infinite;
      letter-spacing: 4px;
      margin-bottom: 28px;
      text-align: center;
    }
    @keyframes rainbowShift {
      0%   { background-position: 0% 50%; }
      100% { background-position: 300% 50%; }
    }

    /* The minutes : seconds boxes you type into */
    .timer-setup {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 32px;
    }
    .timer-setup input {
      font-family: 'Fredoka One', cursive;
      font-size: 2.5rem;
      width: 90px;
      text-align: center;
      background: #ffffff11;
      border: 3px solid #f72585;
      border-radius: 14px;
      color: #f72585;
      padding: 6px;
      outline: none;
    }
    .timer-setup input:focus { border-color: #fff; color: #fff; }
    .timer-setup span {
      font-family: 'Fredoka One', cursive;
      font-size: 2.5rem;
      color: #ffffff33;
    }

    /* ---------- The clock: a row of slots, one per digit ---------- */
    .clock {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Fredoka One', cursive;
      /* one digit is this tall. Everything in a slot is sized in em, so it scales with this */
      font-size: clamp(3.4rem, 16vw, 9rem);
      line-height: 1;
      margin-bottom: 48px;
      position: relative;
      z-index: 2;
    }
    .slot {
      width: 0.74em;
      height: 1em;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .slot.colon { width: 0.36em; color: #ffffff33; }

    /* A plain digit, how the timer looks before anything gets knocked */
    .digit {
      font-family: 'Fredoka One', cursive;
      font-size: 1em;
      line-height: 1;
      display: block;
    }

    /* A ball with a number painted on it. Flat cartoon: colour fill + thick outline */
    .ball {
      width: 0.9em;
      height: 0.9em;
      border-radius: 50%;
      border: 0.055em solid #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Fredoka One', cursive;
      line-height: 1;
      flex-shrink: 0;
    }
    .ball .num {
      font-size: 0.56em;
      color: #080818;
      line-height: 1;
      transform: translateY(0.02em);
    }

    /* The see-through layer over the whole screen where balls fly and digits fall */
    .sky {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 3;
      font-family: 'Fredoka One', cursive;
    }
    .sky .digit, .sky .ball {
      position: absolute;
      left: 0;
      top: 0;
      will-change: transform;
    }

    /* Buttons */
    .buttons { display: flex; gap: 14px; position: relative; z-index: 4; }
    .btn {
      font-family: 'Fredoka One', cursive;
      font-size: 1.4rem;
      padding: 14px 50px;
      border-radius: 50px;
      border: none;
      cursor: pointer;
      letter-spacing: 1px;
      transition: transform 0.1s, opacity 0.1s;
    }
    .btn:active { transform: scale(0.93); }
    #start-btn { background: linear-gradient(135deg, #7fff00, #00f5ff); color: #080818; }
    #start-btn.pause-mode { background: linear-gradient(135deg, #f72585, #7209b7); color: #fff; }
    .btn-reset { background: transparent; border: 3px solid #ffffff22; color: #fff; }
    .btn-reset:hover { border-color: #ffffff55; }

    /* DONE text at the end */
    .done-text {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Fredoka One', cursive;
      font-size: clamp(3rem, 12vw, 6rem);
      color: #f72585;
      animation: doneAnim 1.4s ease-out forwards;
      pointer-events: none;
      z-index: 20;
    }
    @keyframes doneAnim {
      0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
      30%  { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
      70%  { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1.2); }
    }
  </style>
</head>
<body>

  <a class="back-link" href="../">← back</a>

  <div class="title">KNOCK-THE-NUMBER TIMER</div>

  <div class="timer-setup">
    <input type="number" id="min-input" value="1" min="0" max="99">
    <span>:</span>
    <input type="number" id="sec-input" value="30" min="0" max="59">
  </div>

  <!-- the digits get built into here by the code -->
  <div class="clock" id="clock"></div>

  <div class="buttons">
    <button class="btn" id="start-btn">START</button>
    <button class="btn btn-reset" id="reset-btn">RESET</button>
  </div>

  <!-- flying balls and falling digits live in here, on top of everything -->
  <div class="sky" id="sky"></div>

<script>
  // ============================================================
  //  Knock-the-Number Timer
  //  Every time a digit changes, a ball flies in from a random
  //  direction, knocks the old digit off, and stays in its place
  //  with the new number on it. The old digit falls with gravity.
  // ============================================================

  const clockBox  = document.getElementById('clock');
  const sky       = document.getElementById('sky');
  const minInput  = document.getElementById('min-input');
  const secInput  = document.getElementById('sec-input');
  const startBtn  = document.getElementById('start-btn');
  const resetBtn  = document.getElementById('reset-btn');

  const PINK  = '#f72585';   // minutes
  const GREEN = '#7fff00';   // seconds

  // ---- the clock ----
  let totalMs     = 90000;   // how long the countdown is (set from the boxes)
  let leftMs      = totalMs; // how much time is left right now
  let running     = false;
  let finished    = false;
  let startedAt   = 0;       // performance.now() when we pressed START
  let leftAtStart = 0;       // how much was left when we pressed START
  let minuteDigits = 1;      // how many digits the minutes use (1 or 2), fixed when we set up
  let shownText   = '';      // the time the digits are showing right now, like "1:30"

  // ---- the moving things ----
  let slots   = [];   // one per character of the time, e.g. ['1', ':', '3', '0']
  let flyers  = [];   // balls flying in towards a slot
  let fallers = [];   // digits (or balls) that got knocked off and are falling

  const GRAVITY   = 2600;  // pixels per second per second, pulls fallers down
  const HIT_SPEED = 900;   // how fast a knocked digit shoots away
  const FLY_TIME  = 420;   // milliseconds for a ball to fly in

  function readInputs() {
    const m = Math.max(0, parseInt(minInput.value) || 0);
    const s = Math.max(0, Math.min(59, parseInt(secInput.value) || 0));
    return (m * 60 + s) * 1000;
  }

  // Turns milliseconds into text like "1:30". Rounds UP, so 89.5 s still says 1:30.
  function timeText(ms) {
    const wholeSeconds = Math.ceil(ms / 1000);
    const m = Math.floor(wholeSeconds / 60);
    const s = wholeSeconds % 60;
    return String(m).padStart(minuteDigits, '0') + ':' + String(s).padStart(2, '0');
  }

  // How many pixels tall one digit is right now (the font-size of the clock)
  function digitPx() {
    return parseFloat(getComputedStyle(clockBox).fontSize);
  }

  function colourForSlot(i) {
    // everything before the colon is minutes (pink), after it is seconds (green)
    return slots[i].isMinutes ? PINK : GREEN;
  }

  // ---- building the digits ----
  function makeDigit(character, colour) {
    const d = document.createElement('span');
    d.className = 'digit';
    d.textContent = character;
    d.style.color = colour;
    return d;
  }

  function makeBall(number, colour) {
    const b = document.createElement('div');
    b.className = 'ball';
    b.style.background = colour;
    const n = document.createElement('span');
    n.className = 'num';
    n.textContent = number;
    b.appendChild(n);
    return b;
  }

  // Build the row of slots fresh, showing plain digits (the "looks normal" start)
  function buildSlots(text) {
    clockBox.innerHTML = '';
    slots = [];
    let pastColon = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      const slot = document.createElement('div');
      slot.className = 'slot' + (ch === ':' ? ' colon' : '');
      const isDigit = ch !== ':';
      const isMinutes = isDigit && !pastColon;
      if (ch === ':') pastColon = true;
      slots.push({ el: slot, character: ch, isDigit: isDigit, isMinutes: isMinutes });
      if (isDigit) {
        slot.appendChild(makeDigit(ch, isMinutes ? PINK : GREEN));
      } else {
        slot.textContent = ':';
      }
      clockBox.appendChild(slot);
    }
    shownText = text;
  }

  // Show a new time. Only the slots whose character changed get a ball.
  function showTime(text) {
    for (let i = 0; i < slots.length; i++) {
      if (slots[i].character === text[i]) continue;   // this digit did not change, leave it alone
      slots[i].character = text[i];
      if (slots[i].isDigit) launchBall(i, text[i]);
    }
    shownText = text;
  }

  // ---- balls flying in ----
  function launchBall(slotIndex, number) {
    const rect = slots[slotIndex].el.getBoundingClientRect();
    const targetX = rect.left + rect.width / 2;
    const targetY = rect.top + rect.height / 2;

    // pick a random direction and start the ball off-screen in that direction
    const angle = Math.random() * Math.PI * 2;
    const far = Math.hypot(window.innerWidth, window.innerHeight) * 0.6 + 120;
    const startX = targetX + Math.cos(angle) * far;
    const startY = targetY + Math.sin(angle) * far;

    const ball = makeBall(number, colourForSlot(slotIndex));
    ball.style.fontSize = digitPx() + 'px';
    sky.appendChild(ball);

    flyers.push({
      el: ball,
      startX, startY, targetX, targetY,
      dirX: -Math.cos(angle),       // the way the ball is travelling
      dirY: -Math.sin(angle),
      startTime: performance.now(),
      slotIndex: slotIndex
    });
  }

  function place(el, x, y, spin) {
    el.style.transform = 'translate(' + x + 'px,' + y + 'px) translate(-50%,-50%) rotate(' + spin + 'deg)';
  }

  // The ball has arrived: knock off whatever is in the slot and sit there instead
  function ballHits(flyer) {
    const slot = slots[flyer.slotIndex];
    const oldThing = slot.el.firstElementChild;

    if (oldThing) {
      // move the old digit (or old ball) out into the sky and give it a push
      const r = oldThing.getBoundingClientRect();
      slot.el.removeChild(oldThing);
      oldThing.style.fontSize = digitPx() + 'px';
      sky.appendChild(oldThing);
      fallers.push({
        el: oldThing,
        x: r.left + r.width / 2,
        y: r.top + r.height / 2,
        vx: flyer.dirX * HIT_SPEED + (Math.random() - 0.5) * 200,
        vy: flyer.dirY * HIT_SPEED - 300,                 // a little upward pop, then gravity wins
        spin: 0,
        spinSpeed: (Math.random() - 0.5) * 900             // degrees per second
      });
    }

    // the ball stays where the old digit was
    const ball = flyer.el;
    sky.removeChild(ball);
    ball.style.fontSize = '';
    ball.style.transform = '';
    slot.el.appendChild(ball);
  }

  // ---- the one animation loop ----
  let lastFrame = performance.now();

  function frame(now) {
    let dt = (now - lastFrame) / 1000;   // seconds since last frame
    if (dt > 0.05) dt = 0.05;            // if the tab was hidden, don't let physics explode
    lastFrame = now;

    // 1. the clock, from real elapsed time so it never drifts
    if (running) {
      // never above leftAtStart: a frame's timestamp can be a few ms before the moment we started
      leftMs = Math.min(leftAtStart, Math.max(0, leftAtStart - (now - startedAt)));
      const text = timeText(leftMs);
      if (text !== shownText) showTime(text);
      if (leftMs === 0) {
        running = false;
        finished = true;
        startBtn.textContent = 'START';
        startBtn.classList.remove('pause-mode');
        setTimeout(showDone, FLY_TIME + 200);
      }
    }

    // 2. balls flying in (they finish their flight even if paused)
    for (let i = flyers.length - 1; i >= 0; i--) {
      const f = flyers[i];
      let p = (now - f.startTime) / FLY_TIME;
      if (p >= 1) {
        ballHits(f);
        flyers.splice(i, 1);
        continue;
      }
      const eased = p * p;   // starts slow, ends fast, like a throw
      const x = f.startX + (f.targetX - f.startX) * eased;
      const y = f.startY + (f.targetY - f.startY) * eased;
      place(f.el, x, y, 0);
    }

    // 3. knocked-off digits falling under gravity
    for (let i = fallers.length - 1; i >= 0; i--) {
      const d = fallers[i];
      d.vy += GRAVITY * dt;
      d.x  += d.vx * dt;
      d.y  += d.vy * dt;
      d.spin += d.spinSpeed * dt;
      place(d.el, d.x, d.y, d.spin);
      // gone well off the screen: tidy it away
      if (d.y > window.innerHeight + 300 || d.x < -400 || d.x > window.innerWidth + 400) {
        d.el.remove();
        fallers.splice(i, 1);
      }
    }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ---- buttons ----
  function start() {
    if (finished) reset();
    if (leftMs <= 0) return;
    running = true;
    startedAt = performance.now();
    leftAtStart = leftMs;
    startBtn.textContent = 'PAUSE';
    startBtn.classList.add('pause-mode');
  }

  function pause() {
    running = false;
    startBtn.textContent = 'START';
    startBtn.classList.remove('pause-mode');
  }

  // Back to the start: plain digits, no balls, nothing falling
  function reset() {
    running = false;
    finished = false;
    startBtn.textContent = 'START';
    startBtn.classList.remove('pause-mode');
    totalMs = readInputs();
    leftMs = totalMs;
    minuteDigits = Math.min(2, Math.max(1, String(Math.floor(totalMs / 60000)).length));
    flyers = [];
    fallers = [];
    sky.innerHTML = '';
    buildSlots(timeText(totalMs));
  }

  function showDone() {
    const txt = document.createElement('div');
    txt.className = 'done-text';
    txt.textContent = 'DONE!';
    document.body.appendChild(txt);
    setTimeout(() => txt.remove(), 1500);
  }

  startBtn.addEventListener('click', () => running ? pause() : start());
  resetBtn.addEventListener('click', reset);
  // typing a new time while stopped shows it straight away
  minInput.addEventListener('input', () => { if (!running) reset(); });
  secInput.addEventListener('input', () => { if (!running) reset(); });

  reset();
</script>

<!-- ===== Theme picker (identical block on every timer page) ===== -->
<style>
  .theme-picker {
    position: fixed;
    right: 16px;
    bottom: 16px;
    z-index: 2147483647;
    font-family: 'Fredoka One', cursive;
  }
  .theme-button {
    font-family: 'Fredoka One', cursive;
    font-size: 1.1rem;
    letter-spacing: 1px;
    color: #00f5ff;
    background: #080818;
    border: 3px solid #00f5ff;
    border-radius: 50px;
    padding: 8px 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .theme-button:hover { color: #fff; border-color: #fff; }
  /* the little arrow: a triangle drawn with borders. Points UP when closed, DOWN when open */
  .theme-arrow {
    display: inline-block;
    width: 0;
    height: 0;
    border-left: 7px solid transparent;
    border-right: 7px solid transparent;
    border-bottom: 9px solid currentColor;
  }
  .theme-picker.open .theme-arrow {
    border-bottom: none;
    border-top: 9px solid currentColor;
  }
  /* the list opens UPWARDS from the button */
  .theme-list {
    display: none;
    position: absolute;
    right: 0;
    bottom: calc(100% + 10px);
    flex-direction: column;
    background: #080818;
    border: 3px solid #f72585;
    border-radius: 18px;
    padding: 8px 0;
    min-width: 200px;
  }
  .theme-picker.open .theme-list { display: flex; }
  .theme-list a, .theme-list span {
    font-family: 'Fredoka One', cursive;
    font-size: 1.05rem;
    letter-spacing: 1px;
    color: #fff;
    text-decoration: none;
    padding: 8px 18px;
    white-space: nowrap;
  }
  .theme-list a:hover { color: #7fff00; background: #ffffff11; }
  .theme-list span.current { color: #7fff00; cursor: default; }
  .theme-list span.current::after { content: '  ●'; font-size: 0.7em; }
</style>
<div class="theme-picker" id="theme-picker">
  <button class="theme-button" id="theme-button" type="button">Type <span class="theme-arrow"></span></button>
  <div class="theme-list" id="theme-list">
    <a href="puzzle.html">Puzzle</a>
    <a href="coke.html">Coke Bottle</a>
    <a href="bomb.html">Bomb</a>
    <a href="tsunami.html">Tsunami</a>
    <a href="rocket.html">Rocket</a>
    <a href="knock.html">Knock-the-Number</a>
    <a href="runner.html">Running Man</a>
    <a href="traffic.html">Traffic Light</a>
    <a href="sun.html">Dying Sun</a>
    <a href="book.html">Flipbook</a>
  </div>
</div>
<script>
  (function () {
    const picker = document.getElementById('theme-picker');
    const button = document.getElementById('theme-button');
    const list   = document.getElementById('theme-list');

    // the page we are on right now is shown as current and cannot be clicked
    const here = window.location.pathname.split('/').pop() || 'index.html';
    list.querySelectorAll('a').forEach(link => {
      if (link.getAttribute('href') === here) {
        const current = document.createElement('span');
        current.className = 'current';
        current.textContent = link.textContent;
        link.replaceWith(current);
      }
    });

    button.addEventListener('click', e => {
      e.stopPropagation();
      picker.classList.toggle('open');
    });
    // clicking anywhere else closes the list
    document.addEventListener('click', () => picker.classList.remove('open'));
    list.addEventListener('click', e => e.stopPropagation());
  })();
</script>
</body>
</html>
