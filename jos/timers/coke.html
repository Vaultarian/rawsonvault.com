<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coke Bottle Timer — Jos</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #080818;
      font-family: 'Nunito', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      color: #fff;
    }

    /* THE PICTURE LAYER — a canvas that fills the whole screen.
       Normally it sits BEHIND the numbers (z-index 1 is lower than the numbers' 5). */
    #scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;   /* clicks go straight through it to the buttons */
    }
    /* When the body gets the "front" class, the picture jumps IN FRONT of the numbers. */
    body.front #scene { z-index: 8; }

    /* everything you read and click lives in here, on top of the picture */
    .ui {
      position: relative;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 12px;
      width: 100%;
    }

    .back-link {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 20;
      font-family: 'Fredoka One', cursive;
      color: #ffffff44;
      text-decoration: none;
      font-size: 1rem;
      letter-spacing: 1px;
      transition: color 0.2s;
    }
    .back-link:hover { color: #fff; }

    /* the rainbow title, same as the main timer page */
    .title {
      font-family: 'Fredoka One', cursive;
      font-size: clamp(1.1rem, 4.5vw, 1.6rem);
      background: linear-gradient(90deg, #f72585, #7fff00, #00f5ff, #f72585);
      background-size: 300% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: rainbowShift 4s linear infinite;
      letter-spacing: 4px;
      margin-bottom: 22px;
      text-align: center;
    }
    @keyframes rainbowShift {
      0%   { background-position: 0% 50%; }
      100% { background-position: 300% 50%; }
    }

    /* the minutes : seconds boxes for choosing how long the countdown is */
    .setup { display: flex; gap: 10px; align-items: center; margin-bottom: 18px; }
    .setup input {
      font-family: 'Fredoka One', cursive;
      font-size: 2rem;
      width: 80px;
      text-align: center;
      background: #ffffff11;
      border: 3px solid #f72585;
      border-radius: 14px;
      color: #f72585;
      padding: 6px;
      outline: none;
    }
    .setup input:focus { border-color: #fff; color: #fff; }
    .setup span { font-family: 'Fredoka One', cursive; font-size: 2rem; color: #ffffff33; }

    /* the big digits */
    .display { display: flex; align-items: flex-start; gap: 6px; margin-bottom: 28px; }
    .unit-wrap { display: flex; flex-direction: column; align-items: center; }
    .unit-label {
      font-family: 'Fredoka One', cursive;
      font-size: 0.85rem;
      letter-spacing: 3px;
      margin-bottom: 6px;
      text-transform: uppercase;
      opacity: 0.8;
    }
    .unit-val {
      font-family: 'Fredoka One', cursive;
      font-size: clamp(4.5rem, 22vw, 8rem);
      line-height: 1;
      min-width: 2ch;
      text-align: center;
    }
    .mm .unit-label, .mm .unit-val { color: #f72585; }
    .ss .unit-label, .ss .unit-val { color: #7fff00; }
    .colon {
      font-family: 'Fredoka One', cursive;
      font-size: clamp(3.8rem, 18vw, 7rem);
      color: #ffffff22;
      padding-top: 24px;
      line-height: 1;
    }
    .colon.pulse { animation: blink 1s step-start infinite; }
    @keyframes blink { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

    /* buttons */
    .buttons { display: flex; gap: 14px; }
    .btn {
      font-family: 'Fredoka One', cursive;
      font-size: 1.3rem;
      padding: 12px 36px;
      border-radius: 50px;
      border: none;
      cursor: pointer;
      letter-spacing: 1px;
      transition: transform 0.1s;
    }
    .btn:active { transform: scale(0.93); }
    #start-btn { background: linear-gradient(135deg, #7fff00, #00f5ff); color: #080818; }
    #start-btn.pause-mode { background: linear-gradient(135deg, #f72585, #7209b7); color: #fff; }
    .btn-reset { background: transparent; border: 3px solid #ffffff22; color: #fff; }
    .btn-reset:hover { border-color: #ffffff55; }

    /* ===== THEME PICKER — the "Type" drop-UP in the bottom-right corner (same on every page) ===== */
    .theme-picker {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 100000;            /* on top of EVERYTHING, even an explosion */
      font-family: 'Fredoka One', cursive;
    }
    .theme-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'Fredoka One', cursive;
      font-size: 1.1rem;
      letter-spacing: 1px;
      color: #00f5ff;
      background: #080818;
      border: 3px solid #00f5ff;
      border-radius: 50px;
      padding: 8px 18px;
      cursor: pointer;
    }
    .theme-btn:hover { background: #00f5ff22; }
    /* the little arrow is a triangle made out of borders — it points UP when the list is closed */
    .theme-arrow {
      width: 0;
      height: 0;
      border-left: 7px solid transparent;
      border-right: 7px solid transparent;
      border-bottom: 9px solid #00f5ff;
      transition: transform 0.2s;
    }
    /* ...and flips to point DOWN when the list is open */
    .theme-picker.open .theme-arrow { transform: rotate(180deg); }
    .theme-list {
      display: none;
      position: absolute;
      right: 0;
      bottom: calc(100% + 10px);   /* sits ABOVE the button, so it opens upwards */
      list-style: none;
      min-width: 230px;
      white-space: nowrap;
      max-height: 70vh;
      overflow-y: auto;
      background: #080818;
      border: 3px solid #f72585;
      border-radius: 18px;
      padding: 8px 0;
    }
    .theme-picker.open .theme-list { display: block; }
    .theme-list a, .theme-list .current {
      display: block;
      padding: 7px 18px;
      font-size: 1.05rem;
      letter-spacing: 1px;
      color: #fff;
      text-decoration: none;
    }
    .theme-list a:hover { background: #f72585; color: #080818; }
    .theme-list .current { color: #7fff00; cursor: default; }
    .theme-list .current::after { content: ' ●'; font-size: 0.7em; }
  </style>
</head>
<body>

  <a class="back-link" href="../">← back</a>

  <!-- the picture: everything animated is drawn on this canvas -->
  <canvas id="scene"></canvas>

  <div class="ui">
    <div class="title">COKE BOTTLE TIMER</div>

    <div class="setup">
      <input type="number" id="min-input" value="0" min="0" max="99" aria-label="minutes">
      <span>:</span>
      <input type="number" id="sec-input" value="30" min="0" max="59" aria-label="seconds">
    </div>

    <div class="display">
      <div class="unit-wrap mm">
        <div class="unit-label">MIN</div>
        <div class="unit-val" id="min-val">00</div>
      </div>
      <div class="colon" id="colon">:</div>
      <div class="unit-wrap ss">
        <div class="unit-label">SEC</div>
        <div class="unit-val" id="sec-val">30</div>
      </div>
    </div>

    <div class="buttons">
      <button class="btn" id="start-btn" onclick="toggleTimer()">START</button>
      <button class="btn btn-reset" onclick="resetTimer()">RESET</button>
    </div>
  </div>

  <!-- ===== THEME PICKER (Jos's idea — this block is identical on every timer page) ===== -->
  <div class="theme-picker" id="theme-picker">
    <ul class="theme-list" id="theme-list">
      <li><a href="puzzle.html">Puzzle</a></li>
      <li><a href="coke.html">Coke Bottle</a></li>
      <li><a href="bomb.html">Bomb</a></li>
      <li><a href="tsunami.html">Tsunami</a></li>
      <li><a href="rocket.html">Rocket</a></li>
      <li><a href="knock.html">Knock-the-Number</a></li>
      <li><a href="runner.html">Running Man</a></li>
      <li><a href="traffic.html">Traffic Light</a></li>
      <li><a href="sun.html">Dying Sun</a></li>
      <li><a href="book.html">Flipbook</a></li>
    </ul>
    <button class="theme-btn" id="theme-btn" type="button">Type <span class="theme-arrow"></span></button>
  </div>

<script>
  // ===================== THEME PICKER (identical on every page) =====================
  (function () {
    const picker = document.getElementById('theme-picker');
    const button = document.getElementById('theme-btn');
    const list = document.getElementById('theme-list');

    // work out which page we are on, e.g. "coke.html"
    const here = (location.pathname.split('/').pop() || '').toLowerCase();
    list.querySelectorAll('a').forEach(function (link) {
      if (link.getAttribute('href').toLowerCase() === here) {
        // this is the theme we are already on: show it, but it is not a link
        const label = document.createElement('span');
        label.className = 'current';
        label.textContent = link.textContent;
        link.replaceWith(label);
      }
    });

    button.addEventListener('click', function (event) {
      event.stopPropagation();   // otherwise the "click anywhere else" rule below would close it straight away
      picker.classList.toggle('open');
    });
    // click anywhere else on the page and the list closes
    document.addEventListener('click', function (event) {
      if (!picker.contains(event.target)) picker.classList.remove('open');
    });
  })();

  // ===================== THE SCREEN =====================
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0;   // the width and height of the screen, in CSS pixels

  // Make the canvas exactly the size of the window (and sharp on phones with high-res screens).
  function fitCanvas() {
    const dpr = window.devicePixelRatio || 1;
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', fitCanvas);
  fitCanvas();

  // little drawing helpers used by the scene and the explosion
  function disc(x, y, r, colour) {
    ctx.beginPath();
    ctx.arc(x, y, Math.max(0, r), 0, Math.PI * 2);
    ctx.fillStyle = colour;
    ctx.fill();
  }
  function roundBox(x, y, w, h, r, colour) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
    ctx.fillStyle = colour;
    ctx.fill();
  }
  function triangle(x1, y1, x2, y2, x3, y3, colour) {
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.lineTo(x3, y3);
    ctx.closePath();
    ctx.fillStyle = colour;
    ctx.fill();
  }

  // ===================== THE CLOCK =====================
  // The clock uses performance.now(), which is the browser's own stopwatch.
  // We remember the exact moment the countdown will hit zero (endMoment), and every
  // frame we work out how much is left from that. So it never drifts, however slow the drawing is.
  const minInput = document.getElementById('min-input');
  const secInput = document.getElementById('sec-input');
  const minVal = document.getElementById('min-val');
  const secVal = document.getElementById('sec-val');
  const colon = document.getElementById('colon');
  const startBtn = document.getElementById('start-btn');

  let totalMs = 0;        // how long the whole countdown is, in milliseconds
  let remainingMs = 0;    // how much time is left right now
  let running = false;    // is the clock ticking?
  let finished = false;   // have we hit zero?
  let endMoment = 0;      // the performance.now() time at which we reach zero

  function readInputs() {
    const mins = Math.max(0, parseInt(minInput.value, 10) || 0);
    const secs = Math.max(0, Math.min(59, parseInt(secInput.value, 10) || 0));
    totalMs = (mins * 60 + secs) * 1000;
  }

  function startTimer() {
    if (finished) resetTimer();       // pressing start after the bang begins a fresh countdown
    if (totalMs <= 0) return;         // nothing to count down
    running = true;
    endMoment = performance.now() + remainingMs;
    startBtn.textContent = 'PAUSE';
    startBtn.classList.add('pause-mode');
    colon.classList.add('pulse');
    onStart();
  }

  function pauseTimer() {
    running = false;
    remainingMs = Math.max(0, endMoment - performance.now());
    startBtn.textContent = 'START';
    startBtn.classList.remove('pause-mode');
    colon.classList.remove('pulse');
    onPause();
  }

  function toggleTimer() {
    if (running) pauseTimer(); else startTimer();
  }

  // Reset puts EVERYTHING back to the beginning: the clock, the layers, the picture.
  function resetTimer() {
    running = false;
    finished = false;
    readInputs();
    remainingMs = totalMs;
    startBtn.textContent = 'START';
    startBtn.classList.remove('pause-mode');
    colon.classList.remove('pulse');
    document.body.classList.remove('front');   // numbers back in front of the picture
    clearExplosion();
    resetScene();
    showDigits();
  }

  // called once per frame
  function tickClock(now) {
    if (running) {
      // (clamped to totalMs too: a frame's timestamp can be a whisker earlier than the moment we pressed start)
      remainingMs = Math.min(totalMs, Math.max(0, endMoment - now));
      if (remainingMs === 0) {
        running = false;
        finished = true;
        startBtn.textContent = 'START';
        startBtn.classList.remove('pause-mode');
        colon.classList.remove('pulse');
        onZero();   // the big moment — each timer does its own thing here
      }
    }
    showDigits();
  }

  function showDigits() {
    const secsLeft = Math.ceil(remainingMs / 1000);
    minVal.textContent = pad(Math.min(99, Math.floor(secsLeft / 60)));
    secVal.textContent = pad(secsLeft % 60);
  }
  function pad(n) { return String(n).padStart(2, '0'); }

  // how far through the countdown we are: 0 = just started, 1 = time's up
  function progress() { return totalMs > 0 ? Math.min(1, Math.max(0, 1 - remainingMs / totalMs)) : 0; }

  // changing the minutes or seconds boxes (while not running) resets the countdown to the new length
  minInput.addEventListener('input', function () { if (!running) resetTimer(); });
  secInput.addEventListener('input', function () { if (!running) resetTimer(); });

  // ===================== THE EXPLOSION (the same one in every timer) =====================
  const BOOM_COLOURS = ['#f72585', '#7fff00', '#00f5ff', '#ffd60a', '#ff6b00', '#ffffff'];
  const boom = { on: false, startedAt: 0, x: 0, y: 0, bits: [], rings: [], fireballRadius: 0, holdMs: 0, bitsDelayMs: 0 };

  // Call this to go BANG at a point on the screen. options (all optional):
  //   fireballRadius — how big the fireball grows (bigger than the screen = covers everything)
  //   holdMs         — how long the fireball stays at full size before it fades away
  //   bitsDelayMs    — wait this long before the flying bits appear
  //   count          — how many flying bits
  //   extraColours   — extra colours for the bits (e.g. brown for cola)
  function startExplosion(x, y, options) {
    options = options || {};
    boom.on = true;
    boom.startedAt = performance.now();
    boom.x = x;
    boom.y = y;
    boom.fireballRadius = options.fireballRadius || 0.3 * Math.min(W, H);
    boom.holdMs = options.holdMs || 250;
    boom.bitsDelayMs = options.bitsDelayMs || 0;
    const colours = BOOM_COLOURS.concat(options.extraColours || []);
    const count = options.count || 150;
    boom.bits = [];
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 250 + Math.random() * 800;   // pixels per second
      boom.bits.push({
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 150,       // a little upward kick
        size: 5 + Math.random() * 16,
        colour: colours[Math.floor(Math.random() * colours.length)],
        square: Math.random() < 0.4,             // some bits are squares, some are circles
        spin: (Math.random() - 0.5) * 10
      });
    }
    boom.rings = [
      { delay: 0,   colour: '#ffffff' },
      { delay: 120, colour: '#f72585' },
      { delay: 260, colour: '#00f5ff' }
    ];
  }

  function clearExplosion() {
    boom.on = false;
    boom.bits = [];
    boom.rings = [];
  }

  function drawExplosion(now) {
    if (!boom.on) return;
    const t = (now - boom.startedAt) / 1000;   // seconds since the bang
    const hold = boom.holdMs / 1000;
    const GROW = 0.25;                          // the fireball takes a quarter of a second to reach full size

    // --- the fireball: three flat discs, orange, yellow, white ---
    let alpha = 1;
    if (t > GROW + hold) alpha = Math.max(0, 1 - (t - GROW - hold) / 0.6);   // then it fades out
    if (alpha > 0) {
      const r = boom.fireballRadius * Math.min(1, t / GROW);
      const wobble = Math.sin(now / 50) * r * 0.04;   // so the fire looks alive
      ctx.globalAlpha = alpha;
      disc(boom.x, boom.y, r, '#ff6b00');
      disc(boom.x + wobble, boom.y - wobble, r * 0.68, '#ffd60a');
      disc(boom.x - wobble, boom.y + wobble, r * 0.36, '#ffffff');
      ctx.globalAlpha = 1;
    }

    // --- the shock rings racing outwards ---
    boom.rings.forEach(function (ring) {
      const rt = t - ring.delay / 1000;
      if (rt < 0 || rt > 0.9) return;
      ctx.globalAlpha = 1 - rt / 0.9;
      ctx.lineWidth = 12;
      ctx.strokeStyle = ring.colour;
      ctx.beginPath();
      ctx.arc(boom.x, boom.y, 20 + rt * 1000, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    });

    // --- the flying bits ---
    const bt = t - boom.bitsDelayMs / 1000;
    const BITS_LIFE = 1.8;   // seconds the bits fly for
    if (bt > 0 && bt < BITS_LIFE) {
      const travel = (1 - Math.exp(-2.5 * bt)) / 2.5;   // the bits start fast and slow down
      const shrink = 1 - bt / BITS_LIFE;                 // and get smaller as they go
      boom.bits.forEach(function (bit) {
        const bx = boom.x + bit.vx * travel;
        const by = boom.y + bit.vy * travel + 450 * bt * bt;   // gravity pulls them down
        const size = bit.size * shrink;
        if (bit.square) {
          ctx.save();
          ctx.translate(bx, by);
          ctx.rotate(bit.spin * bt);
          ctx.fillStyle = bit.colour;
          ctx.fillRect(-size / 2, -size / 2, size, size);
          ctx.restore();
        } else {
          disc(bx, by, size / 2, bit.colour);
        }
      });
    }

    // --- the white flash right at the start ---
    if (t < 0.2) {
      ctx.globalAlpha = 1 - t / 0.2;
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
    }

    // all over?
    if (t > GROW + hold + 0.6 && bt > BITS_LIFE) boom.on = false;
  }

  // ===================== THE COKE BOTTLE =====================
  let bottleGone = false;     // true after the bang — there is no bottle left to draw
  let shakePhase = 0;         // how far round a wobble we are (keeps going round and round)
  let lastFrameTime = 0;
  let frameDt = 0;            // seconds since the last frame

  // the bubbles inside the bottle: x is across (0 = middle), y runs from -1 (top) to 1 (bottom)
  const bubbles = [];
  for (let i = 0; i < 16; i++) {
    bubbles.push({ x: Math.random() * 0.5 - 0.25, y: Math.random() * 1.7 - 0.8, size: 0.015 + Math.random() * 0.03, speed: 0.15 + Math.random() * 0.3 });
  }

  function resetScene() { bottleGone = false; shakePhase = 0; }
  function onStart() {}
  function onPause() {}

  function onZero() {
    // 1. SWAP THE LAYERS: the bottle comes to the front and the numbers drop behind it
    document.body.classList.add('front');
    // 2. a moment later the pressure wins and the bottle EXPLODES
    setTimeout(function () {
      if (!finished) return;   // reset was pressed in between — no bang
      bottleGone = true;
      startExplosion(W / 2, bottleCentreY(), {
        extraColours: ['#4a1d07', '#8a4a1e', '#c8b090'],   // cola splashes and foam
        fireballRadius: 0.3 * Math.min(W, H),
        holdMs: 250
      });
    }, 450);
  }

  function bottleHeight() { return Math.min(H * 0.66, W * 1.5); }
  function bottleCentreY() { return H * 0.52; }

  function drawScene(now) {
    frameDt = lastFrameTime ? Math.min(0.05, (now - lastFrameTime) / 1000) : 0;
    lastFrameTime = now;
    if (bottleGone) return;

    // How far through the countdown are we? 0 = just started, 1 = time's up.
    const p = progress();
    // The shake starts slow and gentle and gets faster and harder as the time runs out.
    // Using p*p*p keeps it calm for most of the countdown, then it goes mad in the last few seconds.
    const wildness = p * p * p;
    const wobblesPerSecond = 2 + 30 * wildness;   // how FAST it shakes
    const shakeSize = 3 + 45 * wildness;          // how FAR it moves, in pixels

    let dx = 0, dy = 0, tilt = 0;
    if (running) {   // it only shakes while the timer is running — paused means still
      shakePhase += frameDt * wobblesPerSecond;
      dx = Math.sin(shakePhase * Math.PI * 2) * shakeSize;                       // left and right
      dy = Math.sin(shakePhase * Math.PI * 2 * 1.37 + 1) * shakeSize * 0.8;      // up and down
      tilt = Math.sin(shakePhase * Math.PI * 2 * 0.7) * 0.15 * wildness;        // a little rocking
      if (p > 0.75) {   // in the last quarter add random jitter so it looks out of control
        dx += (Math.random() - 0.5) * shakeSize * 0.6;
        dy += (Math.random() - 0.5) * shakeSize * 0.6;
      }
    }
    drawBottle(W / 2 + dx, bottleCentreY() + dy, bottleHeight(), tilt, p);
  }

  // The outline of the RIGHT half of the bottle, from the neck down to the base.
  // x is how far out from the middle, y runs from -1 (top) to 1 (bottom). The left half is a mirror.
  const BOTTLE_SIDE = [
    [0.15, -0.88],   // top of the neck (the cap sits over this)
    [0.13, -0.62],   // bottom of the neck
    [0.36, -0.34],   // shoulder
    [0.36,  0.00],
    [0.30,  0.18],   // the waist
    [0.36,  0.42],
    [0.36,  0.88],
    [0.26,  1.00]    // base
  ];

  // Traces a smooth closed shape: the right side, then the left side mirrored.
  // It curves through the halfway points between the corners so nothing looks jagged.
  function traceBottle(s) {
    const pts = [[0, BOTTLE_SIDE[0][1]]];
    BOTTLE_SIDE.forEach(function (p) { pts.push([p[0], p[1]]); });
    pts.push([0, 1]);
    for (let i = BOTTLE_SIDE.length - 1; i >= 0; i--) pts.push([-BOTTLE_SIDE[i][0], BOTTLE_SIDE[i][1]]);
    const n = pts.length;
    function mid(a, b) { return [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2]; }
    let m = mid(pts[n - 1], pts[0]);
    ctx.beginPath();
    ctx.moveTo(m[0] * s, m[1] * s);
    for (let i = 0; i < n; i++) {
      const m2 = mid(pts[i], pts[(i + 1) % n]);
      ctx.quadraticCurveTo(pts[i][0] * s, pts[i][1] * s, m2[0] * s, m2[1] * s);
    }
    ctx.closePath();
  }

  function drawBottle(cx, cy, height, tilt, p) {
    const s = height / 2;   // scale: 1 unit = half the bottle's height
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(tilt);

    // --- the bottle full of cola: one flat brown shape ---
    traceBottle(s);
    ctx.fillStyle = '#4a1d07';
    ctx.fill();

    ctx.save();
    ctx.clip();   // from here on, anything we draw stays inside the bottle
    // a lighter stripe down the left, so it looks like shiny glass
    ctx.fillStyle = '#7a3a15';
    ctx.fillRect(-0.30 * s, -0.9 * s, 0.09 * s, 2 * s);
    // the red label
    ctx.fillStyle = '#e01b24';
    ctx.fillRect(-s, -0.05 * s, 2 * s, 0.42 * s);
    // the word on the label
    ctx.fillStyle = '#ffffff';
    ctx.font = (0.15 * s) + 'px "Fredoka One", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('COKE', 0, 0.09 * s);
    // the white wavy ribbon under the word
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 0.035 * s;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-0.38 * s, 0.28 * s);
    ctx.bezierCurveTo(-0.15 * s, 0.18 * s, 0.15 * s, 0.38 * s, 0.38 * s, 0.28 * s);
    ctx.stroke();
    // bubbles rising — the fizz gets quicker as the pressure builds
    bubbles.forEach(function (b) {
      if (running) b.y -= b.speed * (1 + 6 * p) * frameDt;
      if (b.y < -0.85) b.y = 0.95;
      disc(b.x * s, b.y * s, b.size * s, '#ffffff55');
    });
    ctx.restore();

    // --- the cap ---
    roundBox(-0.17 * s, -1.0 * s, 0.34 * s, 0.14 * s, 0.03 * s, '#e01b24');
    ctx.fillStyle = '#a50f16';
    ctx.fillRect(-0.17 * s, -0.89 * s, 0.34 * s, 0.03 * s);

    ctx.restore();
  }


  // ===================== THE FRAME LOOP =====================
  // requestAnimationFrame calls this about 60 times a second, whenever the screen is ready to draw.
  function frame(now) {
    tickClock(now);
    ctx.clearRect(0, 0, W, H);
    drawScene(now);
    drawExplosion(now);
    requestAnimationFrame(frame);
  }
  resetTimer();
  requestAnimationFrame(frame);
</script>
</body>
