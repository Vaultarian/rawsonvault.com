<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flipbook Timer — Jos</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --book-w: min(88vw, 720px);                 /* the open book is this wide (two pages) */
      --book-h: calc(var(--book-w) * 0.62);       /* and this tall */
      --cream: #fff4cc;                           /* page colour */
      --cream-dark: #efdfa8;                      /* inside of the cover */
      --ink: #080818;                             /* what the numbers are written in */
    }

    body {
      background: #080818;
      font-family: 'Nunito', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      padding: 20px;
    }

    .back-link {
      position: fixed;
      top: 20px;
      left: 20px;
      font-family: 'Fredoka One', cursive;
      color: #ffffff44;
      text-decoration: none;
      font-size: 1rem;
      letter-spacing: 1px;
      transition: color 0.2s;
      z-index: 50;
    }
    .back-link:hover { color: #fff; }

    .title {
      font-family: 'Fredoka One', cursive;
      font-size: 1.6rem;
      background: linear-gradient(90deg, #f72585, #7fff00, #00f5ff, #f72585);
      background-size: 300% 100%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: rainbowShift 4s linear infinite;
      letter-spacing: 4px;
      margin-bottom: 28px;
      text-align: center;
    }
    @keyframes rainbowShift {
      0%   { background-position: 0% 50%; }
      100% { background-position: 300% 50%; }
    }

    /* The minutes : seconds boxes you type into */
    .timer-setup {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 32px;
    }
    .timer-setup input {
      font-family: 'Fredoka One', cursive;
      font-size: 2.5rem;
      width: 90px;
      text-align: center;
      background: #ffffff11;
      border: 3px solid #f72585;
      border-radius: 14px;
      color: #f72585;
      padding: 6px;
      outline: none;
    }
    .timer-setup input:focus { border-color: #fff; color: #fff; }
    .timer-setup span {
      font-family: 'Fredoka One', cursive;
      font-size: 2.5rem;
      color: #ffffff33;
    }

    /* ---------- The book ---------- */
    .book {
      position: relative;
      width: var(--book-w);
      height: var(--book-h);
      margin-bottom: 48px;
      perspective: 1800px;     /* this is what makes the page turns look 3D */
      font-family: 'Fredoka One', cursive;
    }

    /* the back cover: a dark pink board that peeks out around the pages */
    .back-cover {
      position: absolute;
      top: -3%;
      bottom: -3%;
      right: -2%;
      left: 48%;               /* the code slides this to -2% as the book opens */
      background: #b0135c;
      border-radius: 4% 6% 6% 4% / 5% 8% 8% 5%;
      z-index: 0;
    }

    /* the right-hand page that is lying still. It shows the time */
    .page-right {
      position: absolute;
      left: 50%;
      top: 0;
      width: 50%;
      height: 100%;
      background: var(--cream);
      border-radius: 0 3% 3% 0 / 0 4% 4% 0;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* a couple of page edges peeking out so it looks like a stack of pages */
    .page-right::before, .page-right::after {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--cream);
      border-radius: inherit;
      border-right: 2px solid #d9c98a;
      z-index: -1;
    }
    .page-right::before { transform: translate(3px, 3px); }
    .page-right::after  { transform: translate(6px, 6px); }

    /* the dark line down the middle where the pages meet */
    .spine {
      position: absolute;
      left: calc(50% - 3px);
      width: 6px;
      top: 0;
      bottom: 0;
      background: #0000002a;
      z-index: 3;
      pointer-events: none;
    }

    /* a page in the middle of turning over. Front shows the old time, back is blank */
    .flip {
      position: absolute;
      left: 50%;
      top: 0;
      width: 50%;
      height: 100%;
      transform-origin: left center;   /* it swings on the spine */
      transform-style: preserve-3d;
      z-index: 5;
    }
    .face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 0 3% 3% 0 / 0 4% 4% 0;
    }
    .face.front { background: var(--cream); }
    .face.back  { background: var(--cream); transform: rotateY(180deg); border-radius: 3% 0 0 3% / 4% 0 0 4%; }

    /* the front cover. Closed it sits over the right page; open it swings round to the left */
    .cover {
      position: absolute;
      left: 50%;
      top: -3%;
      width: 52%;
      height: 106%;
      transform-origin: left center;
      transform-style: preserve-3d;
      z-index: 10;
    }
    .cover .face.front {
      background: #f72585;
      border-radius: 2% 6% 6% 2% / 3% 8% 8% 3%;
      flex-direction: column;
      gap: 6%;
    }
    /* a cyan strip near the spine, like a real cover binding */
    .cover .face.front::before {
      content: '';
      position: absolute;
      left: 5%;
      top: 0;
      bottom: 0;
      width: 5%;
      background: #00f5ff;
    }
    .cover .face.back {
      background: var(--cream-dark);
      border-radius: 6% 2% 2% 6% / 8% 3% 3% 8%;
    }

    /* the writing */
    .page-time {
      font-family: 'Fredoka One', cursive;
      font-size: calc(var(--book-w) * 0.15);
      color: var(--ink);
      line-height: 1;
    }
    .cover-title {
      font-family: 'Fredoka One', cursive;
      font-size: calc(var(--book-w) * 0.05);
      letter-spacing: 3px;
      color: #080818;
    }
    .cover-time {
      font-family: 'Fredoka One', cursive;
      font-size: calc(var(--book-w) * 0.12);
      color: #ffffff;
      line-height: 1;
    }

    /* Buttons */
    .buttons { display: flex; gap: 14px; }
    .btn {
      font-family: 'Fredoka One', cursive;
      font-size: 1.4rem;
      padding: 14px 50px;
      border-radius: 50px;
      border: none;
      cursor: pointer;
      letter-spacing: 1px;
      transition: transform 0.1s, opacity 0.1s;
    }
    .btn:active { transform: scale(0.93); }
    #start-btn { background: linear-gradient(135deg, #7fff00, #00f5ff); color: #080818; }
    #start-btn.pause-mode { background: linear-gradient(135deg, #f72585, #7209b7); color: #fff; }
    .btn-reset { background: transparent; border: 3px solid #ffffff22; color: #fff; }
    .btn-reset:hover { border-color: #ffffff55; }
  </style>
</head>
<body>

  <a class="back-link" href="../">← back</a>

  <div class="title">FLIPBOOK TIMER</div>

  <div class="timer-setup">
    <input type="number" id="min-input" value="1" min="0" max="99">
    <span>:</span>
    <input type="number" id="sec-input" value="30" min="0" max="59">
  </div>

  <div class="book" id="book">
    <div class="back-cover" id="back-cover"></div>
    <div class="page-right"><div class="page-time" id="page-time">1:30</div></div>
    <div class="spine" id="spine"></div>
    <!-- turning pages get added here by the code -->
    <div class="cover" id="cover">
      <div class="face front">
        <div class="cover-title">JOS'S TIMER</div>
        <div class="cover-time" id="cover-time">1:30</div>
      </div>
      <div class="face back"></div>
    </div>
  </div>

  <div class="buttons">
    <button class="btn" id="start-btn">START</button>
    <button class="btn btn-reset" id="reset-btn">RESET</button>
  </div>

<script>
  // ============================================================
  //  Flipbook Timer
  //  The page you can see IS the time. Every second a page turns
  //  over and the new page shows the new time. The book starts
  //  closed, opens on play, and closes again at 0.
  // ============================================================

  const book      = document.getElementById('book');
  const backCover = document.getElementById('back-cover');
  const cover     = document.getElementById('cover');
  const coverTime = document.getElementById('cover-time');
  const pageTime  = document.getElementById('page-time');
  const spine     = document.getElementById('spine');
  const minInput  = document.getElementById('min-input');
  const secInput  = document.getElementById('sec-input');
  const startBtn  = document.getElementById('start-btn');
  const resetBtn  = document.getElementById('reset-btn');

  // ---- the clock ----
  let totalMs     = 90000;   // how long the countdown is (set from the boxes)
  let leftMs      = totalMs; // how much time is left right now
  let running     = false;   // is the clock ticking?
  let finished    = false;
  let startedAt   = 0;       // performance.now() when the clock started ticking
  let leftAtStart = 0;
  let shownText   = '';      // the time written on the page you can see

  // ---- the cover ----
  // 0 = shut, 180 = fully open. The cover swings towards coverTarget a bit each frame.
  let coverAngle  = 0;
  let coverTarget = 0;
  const COVER_SPEED = 220;           // degrees per second
  let waitingForCover = false;       // pressed START, clock begins once the cover is open

  // ---- pages in the middle of turning ----
  let flips = [];
  const FLIP_TIME = 550;             // milliseconds for one page to turn

  function readInputs() {
    const m = Math.max(0, parseInt(minInput.value) || 0);
    const s = Math.max(0, Math.min(59, parseInt(secInput.value) || 0));
    return (m * 60 + s) * 1000;
  }

  // Turns milliseconds into text like "1:30". Rounds UP, so 89.5 s still says 1:30.
  function timeText(ms) {
    const wholeSeconds = Math.ceil(ms / 1000);
    const m = Math.floor(wholeSeconds / 60);
    const s = wholeSeconds % 60;
    return m + ':' + String(s).padStart(2, '0');
  }

  // Turn a page: the old time swings over to the left, the new time is underneath
  function flipPage(oldText, newText) {
    const page = document.createElement('div');
    page.className = 'flip';
    const front = document.createElement('div');
    front.className = 'face front';
    const writing = document.createElement('div');
    writing.className = 'page-time';
    writing.textContent = oldText;
    front.appendChild(writing);
    const back = document.createElement('div');
    back.className = 'face back';
    page.appendChild(front);
    page.appendChild(back);
    book.insertBefore(page, cover);        // under the cover, over the still page

    pageTime.textContent = newText;        // the page underneath already has the new time
    coverTime.textContent = newText;
    shownText = newText;

    flips.push({ el: page, startTime: performance.now() });
  }

  function easeInOut(p) { return p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2; }

  // Draw the cover at its current angle, and slide the book so a shut book sits in the middle
  function drawCover() {
    const open = coverAngle / 180;                 // 0 shut ... 1 open
    cover.style.transform = 'rotateY(' + (-coverAngle) + 'deg)';
    backCover.style.left = (48 - 50 * open) + '%';
    book.style.transform = 'translateX(' + (-25 * (1 - open)) + '%)';
    spine.style.opacity = open;
    // while the cover is moving it must be on top of everything; once open it lies under the pages
    cover.style.zIndex = (coverAngle >= 180) ? 1 : 10;
  }

  // ---- the one animation loop ----
  let lastFrame = performance.now();

  function frame(now) {
    let dt = (now - lastFrame) / 1000;
    if (dt > 0.05) dt = 0.05;
    lastFrame = now;

    // 1. the cover swinging open or shut
    if (coverAngle !== coverTarget) {
      const step = COVER_SPEED * dt;
      if (coverAngle < coverTarget) coverAngle = Math.min(coverTarget, coverAngle + step);
      else coverAngle = Math.max(coverTarget, coverAngle - step);
      drawCover();
      // the clock starts ticking the moment the book is fully open
      if (waitingForCover && coverAngle === 180) {
        waitingForCover = false;
        beginTicking();
      }
    }

    // 2. the clock, from real elapsed time so it never drifts
    if (running) {
      // never above leftAtStart: a frame's timestamp can be a few ms before the moment we started
      leftMs = Math.min(leftAtStart, Math.max(0, leftAtStart - (now - startedAt)));
      const text = timeText(leftMs);
      if (text !== shownText) flipPage(shownText, text);
      if (leftMs === 0) {
        running = false;
        finished = true;
        startBtn.textContent = 'START';
        startBtn.classList.remove('pause-mode');
        // let the 0:00 page finish turning, then close the book
        setTimeout(() => { if (finished) coverTarget = 0; }, FLIP_TIME + 500);
      }
    }

    // 3. pages turning over
    for (let i = flips.length - 1; i >= 0; i--) {
      const f = flips[i];
      const p = (now - f.startTime) / FLIP_TIME;
      if (p >= 1) {
        f.el.remove();          // it has landed on the left, blank side up, same as the pile
        flips.splice(i, 1);
        continue;
      }
      f.el.style.transform = 'rotateY(' + (-180 * easeInOut(p)) + 'deg)';
    }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ---- buttons ----
  function beginTicking() {
    running = true;
    startedAt = performance.now();
    leftAtStart = leftMs;
  }

  function start() {
    if (finished) reset();
    if (leftMs <= 0) return;
    startBtn.textContent = 'PAUSE';
    startBtn.classList.add('pause-mode');
    coverTarget = 180;                       // open the book
    if (coverAngle >= 180) beginTicking();   // already open (we were paused): carry on
    else waitingForCover = true;             // otherwise tick once it has opened
  }

  function pause() {
    running = false;
    waitingForCover = false;
    startBtn.textContent = 'START';
    startBtn.classList.remove('pause-mode');
  }

  // Back to the start: book shut, showing the time you set
  function reset() {
    running = false;
    finished = false;
    waitingForCover = false;
    startBtn.textContent = 'START';
    startBtn.classList.remove('pause-mode');
    totalMs = readInputs();
    leftMs = totalMs;
    flips.forEach(f => f.el.remove());
    flips = [];
    shownText = timeText(totalMs);
    pageTime.textContent = shownText;
    coverTime.textContent = shownText;
    coverTarget = 0;                         // shut the book
  }

  startBtn.addEventListener('click', () => running || waitingForCover ? pause() : start());
  resetBtn.addEventListener('click', reset);
  // typing a new time while stopped shows it straight away
  minInput.addEventListener('input', () => { if (!running) reset(); });
  secInput.addEventListener('input', () => { if (!running) reset(); });

  reset();
  drawCover();
</script>

<style>
  .theme-picker {
    position: fixed;
    right: 16px;
    bottom: 16px;
    z-index: 2147483647;
    font-family: 'Fredoka One', cursive;
  }
  .theme-button {
    font-family: 'Fredoka One', cursive;
    font-size: 1.1rem;
    letter-spacing: 1px;
    color: #00f5ff;
    background: #080818;
    border: 3px solid #00f5ff;
    border-radius: 50px;
    padding: 8px 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .theme-button:hover { color: #fff; border-color: #fff; }
  /* the little arrow: a triangle drawn with borders. Points UP when closed, DOWN when open */
  .theme-arrow {
    display: inline-block;
    width: 0;
    height: 0;
    border-left: 7px solid transparent;
    border-right: 7px solid transparent;
    border-bottom: 9px solid currentColor;
  }
  .theme-picker.open .theme-arrow {
    border-bottom: none;
    border-top: 9px solid currentColor;
  }
  /* the list opens UPWARDS from the button */
  .theme-list {
    display: none;
    position: absolute;
    right: 0;
    bottom: calc(100% + 10px);
    flex-direction: column;
    background: #080818;
    border: 3px solid #f72585;
    border-radius: 18px;
    padding: 8px 0;
    min-width: 200px;
  }
  .theme-picker.open .theme-list { display: flex; }
  .theme-list a, .theme-list span {
    font-family: 'Fredoka One', cursive;
    font-size: 1.05rem;
    letter-spacing: 1px;
    color: #fff;
    text-decoration: none;
    padding: 8px 18px;
    white-space: nowrap;
  }
  .theme-list a:hover { color: #7fff00; background: #ffffff11; }
  .theme-list span.current { color: #7fff00; cursor: default; }
  .theme-list span.current::after { content: '  ●'; font-size: 0.7em; }
</style>

<script>
  (function () {
    const picker = document.getElementById('theme-picker');
    const button = document.getElementById('theme-button');
    const list   = document.getElementById('theme-list');

    // the page we are on right now is shown as current and cannot be clicked
    const here = window.location.pathname.split('/').pop() || 'index.html';
    list.querySelectorAll('a').forEach(link => {
      if (link.getAttribute('href') === here) {
        const current = document.createElement('span');
        current.className = 'current';
        current.textContent = link.textContent;
        link.replaceWith(current);
      }
    });

    button.addEventListener('click', e => {
      e.stopPropagation();
      picker.classList.toggle('open');
    });
    // clicking anywhere else closes the list
    document.addEventListener('click', () => picker.classList.remove('open'));
    list.addEventListener('click', e => e.stopPropagation());
  })();
</script>
