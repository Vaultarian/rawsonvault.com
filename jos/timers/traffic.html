<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Traffic Light Timer — Jos</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #080818;
      font-family: 'Nunito', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 70px 16px 90px;
      overflow-x: hidden;
    }

    .back-link {
      position: fixed;
      top: 20px;
      left: 20px;
      font-family: 'Fredoka One', cursive;
      color: #ffffff44;
      text-decoration: none;
      font-size: 1rem;
      letter-spacing: 1px;
      transition: color 0.2s;
      z-index: 50;
    }
    .back-link:hover { color: #fff; }

    .title {
      font-family: 'Fredoka One', cursive;
      font-size: 1.6rem;
      background: linear-gradient(90deg, #f72585, #7fff00, #00f5ff, #f72585);
      background-size: 300% 100%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: rainbowShift 4s linear infinite;
      letter-spacing: 4px;
      margin-bottom: 20px;
      text-align: center;
    }
    @keyframes rainbowShift {
      0% { background-position: 0% 50%; }
      100% { background-position: 300% 50%; }
    }

    /* Set how long the countdown is */
    .timer-setup {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 18px;
    }
    .timer-setup input {
      font-family: 'Fredoka One', cursive;
      font-size: 2.2rem;
      width: 84px;
      text-align: center;
      background: #ffffff11;
      border: 3px solid #f72585;
      border-radius: 14px;
      color: #f72585;
      padding: 6px;
      outline: none;
    }
    .timer-setup input:focus { border-color: #fff; color: #fff; }
    .timer-setup span {
      font-family: 'Fredoka One', cursive;
      font-size: 2.2rem;
      color: #ffffff33;
    }

    /* The big digits */
    .display {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      margin-bottom: 22px;
    }
    .unit-wrap { display: flex; flex-direction: column; align-items: center; }
    .unit-label {
      font-family: 'Fredoka One', cursive;
      font-size: 0.85rem;
      letter-spacing: 3px;
      margin-bottom: 4px;
      text-transform: uppercase;
      opacity: 0.8;
    }
    .unit-val {
      font-family: 'Fredoka One', cursive;
      font-size: clamp(3.4rem, 14vw, 5.5rem);
      line-height: 1;
      min-width: 2ch;
      text-align: center;
    }
    .mm .unit-label, .mm .unit-val { color: #f72585; }
    .ss .unit-label, .ss .unit-val { color: #7fff00; }
    .colon {
      font-family: 'Fredoka One', cursive;
      font-size: clamp(3rem, 12vw, 4.8rem);
      color: #ffffff22;
      padding-top: 22px;
      line-height: 1;
    }
    .colon.pulse { animation: blink 1s step-start infinite; }
    @keyframes blink { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

    /* ===== The traffic light, drawn with CSS shapes ===== */
    .traffic {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 26px;
      --lamp: clamp(48px, min(14vw, 10vh), 84px);   /* size of one lamp */
    }
    .housing {
      background: #1c1c30;
      border: 4px solid #ffffff22;
      border-radius: calc(var(--lamp) * 0.5);
      padding: calc(var(--lamp) * 0.18);
      display: flex;
      flex-direction: column;
      gap: calc(var(--lamp) * 0.16);
    }
    .lamp {
      width: var(--lamp);
      height: var(--lamp);
      border-radius: 50%;
      background: #0b0b18;            /* an OFF lamp is dark */
      border: 4px solid #000;
      transition: background 0.15s;
    }
    /* each lamp lit up in its own colour */
    .lamp.red.on    { background: #ff3b3b; }
    .lamp.yellow.on { background: #ffd60a; }
    .lamp.green.on  { background: #7fff00; }
    /* the pole it stands on */
    .pole {
      width: calc(var(--lamp) * 0.22);
      height: calc(var(--lamp) * 0.6);
      background: #1c1c30;
      border: 4px solid #ffffff22;
      border-top: none;
    }
    .foot {
      width: calc(var(--lamp) * 1.2);
      height: calc(var(--lamp) * 0.16);
      background: #1c1c30;
      border: 4px solid #ffffff22;
      border-radius: 8px;
    }
    /* At 0:00 all three lamps flash green together */
    .traffic.flash .lamp { animation: flashGreen 0.5s step-start infinite; }
    @keyframes flashGreen {
      0%, 100% { background: #7fff00; }
      50%      { background: #0b0b18; }
    }

    /* Buttons */
    .buttons { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
    .btn {
      font-family: 'Fredoka One', cursive;
      font-size: 1.4rem;
      padding: 14px 44px;
      border-radius: 50px;
      border: none;
      cursor: pointer;
      letter-spacing: 1px;
      transition: transform 0.1s, opacity 0.1s;
    }
    .btn:active { transform: scale(0.93); }
    #start-btn { background: linear-gradient(135deg, #7fff00, #00f5ff); color: #080818; }
    #start-btn.pause-mode { background: linear-gradient(135deg, #f72585, #7209b7); color: #fff; }
    .btn-reset { background: transparent; border: 3px solid #ffffff22; color: #fff; }
    .btn-reset:hover { border-color: #ffffff55; }

    /* ===== Theme picker (Jos's drop-UP bar) — identical on every page ===== */
    .type-picker {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 2147483647;      /* always on top of everything */
      font-family: 'Fredoka One', cursive;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }
    .type-btn {
      font-family: 'Fredoka One', cursive;
      font-size: 1.1rem;
      letter-spacing: 2px;
      color: #080818;
      background: #00f5ff;
      border: none;
      border-radius: 50px;
      padding: 10px 18px 10px 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      user-select: none;
    }
    .type-btn:active { transform: scale(0.95); }
    /* the little arrow: points UP when closed, DOWN when open */
    .type-arrow {
      width: 0; height: 0;
      border-left: 7px solid transparent;
      border-right: 7px solid transparent;
      border-bottom: 9px solid #080818;
      transition: transform 0.2s;
    }
    .type-picker.open .type-arrow { transform: rotate(180deg); }
    .type-list {
      list-style: none;
      display: none;
      flex-direction: column;
      margin-bottom: 10px;
      background: #080818;
      border: 3px solid #00f5ff;
      border-radius: 18px;
      padding: 8px;
      min-width: 190px;
      max-height: 70vh;
      overflow-y: auto;
    }
    .type-picker.open .type-list { display: flex; }
    .type-list a, .type-list span {
      display: block;
      padding: 8px 14px;
      border-radius: 12px;
      text-decoration: none;
      color: #fff;
      font-size: 1rem;
      letter-spacing: 1px;
    }
    .type-list a:hover { background: #f72585; color: #080818; }
    .type-list span.current { background: #7fff00; color: #080818; cursor: default; }
  </style>
</head>
<body>

  <a class="back-link" href="../">← back</a>

  <div class="title">🚦 TRAFFIC LIGHT TIMER 🚦</div>

  <div class="timer-setup">
    <input type="number" id="tm-min" value="3" min="0" max="99">
    <span>:</span>
    <input type="number" id="tm-sec" value="1" min="0" max="59">
  </div>

  <div class="display">
    <div class="unit-wrap mm">
      <div class="unit-label">MIN</div>
      <div class="unit-val" id="mm-val">03</div>
    </div>
    <div class="colon" id="colon">:</div>
    <div class="unit-wrap ss">
      <div class="unit-label">SEC</div>
      <div class="unit-val" id="ss-val">01</div>
    </div>
  </div>

  <!-- the traffic light -->
  <div class="traffic" id="traffic">
    <div class="housing">
      <div class="lamp red"    id="lamp-red"></div>
      <div class="lamp yellow" id="lamp-yellow"></div>
      <div class="lamp green"  id="lamp-green"></div>
    </div>
    <div class="pole"></div>
    <div class="foot"></div>
  </div>

  <div class="buttons">
    <button class="btn" id="start-btn" onclick="startOrPause()">START</button>
    <button class="btn btn-reset" onclick="resetAll()">RESET</button>
  </div>

  <!-- ===== Theme picker (Jos's drop-UP bar) — identical on every page ===== -->
  <div class="type-picker" id="type-picker">
    <ul class="type-list" id="type-list">
      <li><a href="puzzle.html">Puzzle</a></li>
      <li><a href="coke.html">Coke Bottle</a></li>
      <li><a href="bomb.html">Bomb</a></li>
      <li><a href="tsunami.html">Tsunami</a></li>
      <li><a href="rocket.html">Rocket</a></li>
      <li><a href="knock.html">Knock-the-Number</a></li>
      <li><a href="runner.html">Running Man</a></li>
      <li><a href="traffic.html">Traffic Light</a></li>
      <li><a href="sun.html">Dying Sun</a></li>
      <li><a href="book.html">Flipbook</a></li>
    </ul>
    <button class="type-btn" id="type-btn">Type <span class="type-arrow"></span></button>
  </div>
  <script>
    // Theme picker: click "Type" to open the list upwards, click again (or anywhere) to close.
    // The page you are already on is shown in green and cannot be clicked.
    (function () {
      const picker = document.getElementById('type-picker');
      const button = document.getElementById('type-btn');
      const thisPage = location.pathname.split('/').pop() || 'index.html';
      picker.querySelectorAll('.type-list a').forEach(link => {
        if (link.getAttribute('href') === thisPage) {
          const here = document.createElement('span');
          here.className = 'current';
          here.textContent = link.textContent;
          link.replaceWith(here);
        }
      });
      button.addEventListener('click', (e) => {
        e.stopPropagation();
        picker.classList.toggle('open');
      });
      document.addEventListener('click', (e) => {
        if (!picker.contains(e.target)) picker.classList.remove('open');
      });
    })();
  </script>

<script>
  // ===================== THE CLOCK =====================
  // Driven by real time (performance.now) so it never drifts.
  let totalMs = 0;
  let remainingMs = 0;
  let elapsedBefore = 0;   // time used up before the last pause
  let startStamp = 0;
  let running = false;
  let finished = false;

  const minInput = document.getElementById('tm-min');
  const secInput = document.getElementById('tm-sec');
  const startBtn = document.getElementById('start-btn');
  const traffic  = document.getElementById('traffic');
  const lamps = {
    red:    document.getElementById('lamp-red'),
    yellow: document.getElementById('lamp-yellow'),
    green:  document.getElementById('lamp-green')
  };

  function readInputs() {
    const mm = Math.max(0, parseInt(minInput.value) || 0);
    const ss = Math.max(0, Math.min(59, parseInt(secInput.value) || 0));
    return (mm * 60 + ss) * 1000;
  }

  function startOrPause() {
    if (running) { pause(); return; }
    if (finished || remainingMs <= 0) {
      totalMs = readInputs();
      if (totalMs <= 0) return;
      elapsedBefore = 0;
      remainingMs = totalMs;
      finished = false;
      lastSeconds = -1;          // the light watches the seconds from scratch
      setLight('off');
    }
    running = true;
    startStamp = performance.now();
    startBtn.textContent = 'PAUSE';
    startBtn.classList.add('pause-mode');
    document.getElementById('colon').classList.add('pulse');
  }

  function pause() {
    running = false;
    elapsedBefore += performance.now() - startStamp;
    startBtn.textContent = 'START';
    startBtn.classList.remove('pause-mode');
    document.getElementById('colon').classList.remove('pulse');
  }

  function resetAll() {
    running = false;
    finished = false;
    elapsedBefore = 0;
    totalMs = readInputs();
    remainingMs = totalMs;
    lastSeconds = -1;
    startBtn.textContent = 'START';
    startBtn.classList.remove('pause-mode');
    document.getElementById('colon').classList.remove('pulse');
    setLight('off');
    showTime(remainingMs);
  }

  function pad(n) { return String(n).padStart(2, '0'); }

  function showTime(ms) {
    const totalSec = Math.ceil(ms / 1000);
    document.getElementById('mm-val').textContent = pad(Math.min(99, Math.floor(totalSec / 60)));
    document.getElementById('ss-val').textContent = pad(totalSec % 60);
  }

  // ===================== THE LIGHT =====================
  // Jos's rule: the light is driven by the SECONDS, and repeats every minute.
  //   seconds hit :59 -> RED
  //   seconds hit :30 -> YELLOW
  //   seconds hit :10 -> GREEN
  //   next :59        -> RED again, round and round.
  // At 0:00 (and only then) all three lamps flash green together.
  const triggers = [
    { at: 59, colour: 'red' },
    { at: 30, colour: 'yellow' },
    { at: 10, colour: 'green' }
  ];
  let lastSeconds = -1;   // the seconds we saw on the last frame

  function setLight(colour) {
    traffic.classList.remove('flash');
    for (const name in lamps) lamps[name].classList.toggle('on', name === colour);
    if (colour === 'flash') traffic.classList.add('flash');
  }

  // Called every frame with the seconds currently on the display.
  function watchSeconds(sec) {
    if (sec === lastSeconds) return;
    if (lastSeconds === -1) {
      // first look after Start: only counts as a hit if we are sitting exactly on a trigger
      for (const t of triggers) if (t.at === sec) setLight(t.colour);
      lastSeconds = sec;
      return;
    }
    // Which trigger numbers did the seconds pass on the way down from lastSeconds to sec?
    // (Usually just one step, but if the tab was hidden the clock may have jumped.)
    let newColour = null;
    for (const t of triggers) {
      const wrapped = sec > lastSeconds;                 // went past :00 and round to :59
      const passed = wrapped ? (t.at < lastSeconds || t.at >= sec)
                             : (t.at < lastSeconds && t.at >= sec);
      if (passed) newColour = t.colour;                  // the lowest one passed wins
    }
    if (newColour) setLight(newColour);
    lastSeconds = sec;
  }

  // ===================== THE LOOP =====================
  function loop(now) {
    if (running) {
      const elapsed = elapsedBefore + (now - startStamp);
      remainingMs = Math.max(0, totalMs - elapsed);
      showTime(remainingMs);
      if (remainingMs === 0) {
        finishUp();
      } else {
        watchSeconds(Math.ceil(remainingMs / 1000) % 60);
      }
    }
    requestAnimationFrame(loop);
  }

  function finishUp() {
    running = false;
    finished = true;
    startBtn.textContent = 'START';
    startBtn.classList.remove('pause-mode');
    document.getElementById('colon').classList.remove('pulse');
    setLight('flash');    // 0:00 — all three flash green
  }

  minInput.addEventListener('input', () => { if (!running) resetAll(); });
  secInput.addEventListener('input', () => { if (!running) resetAll(); });

  resetAll();
  requestAnimationFrame(loop);
</script>
</body>
</html>
