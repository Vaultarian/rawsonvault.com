<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jos's Spirograph</title>
<style>
  /* ============================================================
     JOS'S SPIROGRAPH — the look of the app
     ============================================================ */

  :root {
    --bg:      #edece5;   /* the greyish background behind the paper */
    --paper:   #ffffff;   /* the white spinning paper */
    --purple:  #a02be0;
    --purple-d:#4a0d73;
    --orange:  #ff9e1b;
    --blue:    #22b0f0;
    --pink:    #ff1b5e;
    --navy:    #12303f;
  }

  * { box-sizing: border-box; -webkit-user-select: none; user-select: none; }

  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: var(--bg);
    font-family: "Arial Black", "Helvetica Neue", Impact, sans-serif;
    cursor: none;                 /* we draw our own cursor */
    touch-action: none;
  }

  canvas#stage { display: block; position: fixed; inset: 0; }

  /* ---------- generic chunky button ---------- */
  .btn {
    border: 4px solid var(--purple-d);
    background: var(--purple);
    color: #fff;
    border-radius: 999px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    box-shadow: 0 4px 0 rgba(0,0,0,.18);
    transition: transform .08s ease, filter .12s ease;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.18); }
  .btn:hover  { filter: brightness(1.08); }

  /* ---------- top bar ---------- */
  #save {
    position: fixed; top: 22px; left: 24px; z-index: 20;
    height: 68px; padding: 0 26px; gap: 12px;
    font-size: 26px; letter-spacing: 1px;
  }
  #pause {
    position: fixed; top: 22px; right: 24px; z-index: 20;
    width: 78px; height: 78px; font-size: 30px;
  }

  /* ---------- left orange panel (spin controls) ---------- */
  #left {
    position: fixed; left: 18px; top: 50%; transform: translateY(-50%);
    z-index: 20;
    width: 108px;
    background: var(--orange);
    border-radius: 54px;
    padding: 16px 0 10px;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    box-shadow: 0 6px 0 rgba(0,0,0,.13);
    transition: transform .28s cubic-bezier(.3,1.4,.5,1);
  }
  #left.hidden { transform: translate(-118px, -50%); }

  /* the little swirl badge at the top of the orange panel — click it! */
  .swirl { width: 62px; height: 62px; cursor: pointer; transition: transform .12s ease; }
  .swirl:hover  { transform: scale(1.12); }
  .swirl:active { transform: scale(.95); }

  /* ---------- the small black arrows that bring a hidden panel back ---------- */
  .reopen {
    position: fixed; top: 50%; z-index: 21;
    width: 44px; height: 66px;
    background: #111; color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; cursor: pointer;
    box-shadow: 0 3px 0 rgba(0,0,0,.28);
    transform: translateY(-50%) scale(0);
    transition: transform .26s cubic-bezier(.34,1.7,.5,1);
  }
  .reopen.show  { transform: translateY(-50%) scale(1); }
  .reopen:hover { filter: brightness(1.6); }
  #reopenLeft  { left: 0;  border-radius: 0 24px 24px 0; }
  #reopenRight { right: 0; border-radius: 24px 0 0 24px; }

  /* SPIN SPEED — a tapered slider, fat at the top, thin at the bottom */
  #speedTrack {
    position: relative;
    width: 74px; height: 290px;
    cursor: ns-resize;
  }
  #speedTrack svg { position: absolute; inset: 0; pointer-events: none; }
  #speedHandle {
    position: absolute; left: 4px; width: 66px; height: 13px;
    background: #fff; border-radius: 7px;
    box-shadow: 0 2px 4px rgba(0,0,0,.25);
    pointer-events: none;
    transform: translateY(-50%);
  }

  /* round black control buttons that sit inside the coloured panels */
  .knob {
    width: 84px; height: 84px; border-radius: 50%;
    background: #111; color: #fff;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; position: relative;
    box-shadow: 0 3px 0 rgba(0,0,0,.25);
    transition: transform .08s ease;
  }
  .knob:active { transform: translateY(3px); }
  .knob.on { box-shadow: 0 0 0 5px var(--pink), 0 3px 0 rgba(0,0,0,.25); }

  .hideTab {
    width: 100%; height: 40px;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 24px; cursor: pointer; opacity: .95;
  }

  /* ---------- right blue panel (paint controls) ---------- */
  #right {
    position: fixed; right: 18px; top: 50%; transform: translateY(-50%);
    z-index: 20;
    width: 108px;
    background: var(--blue);
    border-radius: 54px;
    padding: 12px 0 10px;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    box-shadow: 0 6px 0 rgba(0,0,0,.13);
    transition: transform .28s cubic-bezier(.3,1.4,.5,1);
  }
  #right.hidden { transform: translate(118px, -50%); }

  /* the little orange number on the UNDO knob */
  #undoCount {
    position: absolute; font-size: 20px; color: var(--orange);
    font-family: "Arial Black", sans-serif; pointer-events: none;
  }

  /* ---------- the pink EFFECTS pop-out ---------- */
  #effects {
    position: fixed; right: 148px; top: 50%; transform: translateY(-50%) scale(.7);
    z-index: 25;
    background: var(--pink);
    border-radius: 34px;
    padding: 18px;
    display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
    box-shadow: 0 8px 0 rgba(0,0,0,.15);
    opacity: 0; pointer-events: none;
    transition: opacity .18s ease, transform .18s cubic-bezier(.3,1.5,.5,1);
  }
  #effects.open { opacity: 1; pointer-events: auto; transform: translateY(-50%) scale(1); }
  #effects .tool {
    width: 92px; height: 92px; border-radius: 50%;
    background: #111; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 40px;
    transition: transform .1s ease;
  }
  #effects .tool:hover  { transform: scale(1.06); }
  #effects .tool.active { background: #fff; box-shadow: 0 0 0 5px #fff; }
  #effects .tool.toggled{ box-shadow: 0 0 0 5px #fff; }
  #effects .divider { grid-column: 1 / -1; height: 5px; background: rgba(255,255,255,.55); border-radius: 3px; }
  #effects .label {
    grid-column: 1 / -1; color: #fff; font-size: 13px; text-align: center;
    letter-spacing: 1px; margin-top: -4px;
  }

  /* ---------- the colour pop-out ---------- */
  #colours {
    position: fixed; right: 148px; top: 50%; transform: translateY(-50%) scale(.6);
    z-index: 25;
    background: var(--pink);
    border-radius: 34px; padding: 18px;
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    box-shadow: 0 8px 0 rgba(0,0,0,.15);
    opacity: 0; pointer-events: none;
    transition: opacity .18s ease, transform .26s cubic-bezier(.34,1.7,.5,1);
  }
  #colours.open { opacity: 1; pointer-events: auto; transform: translateY(-50%) scale(1); }

  /* the white card that holds the wheel */
  #wheelCard {
    position: relative; background: #fff; border-radius: 20px; padding: 14px;
    line-height: 0;
  }
  #wheel { display: block; cursor: crosshair; touch-action: none; }
  #wheelKnob {
    position: absolute; width: 26px; height: 26px; border-radius: 50%;
    border: 4px solid #fff; box-shadow: 0 0 0 2px rgba(0,0,0,.35);
    transform: translate(-50%, -50%); pointer-events: none;
  }

  /* the brightness slider under the wheel */
  #briSlider {
    width: 214px; height: 22px; cursor: pointer;
    -webkit-appearance: none; appearance: none;
    border-radius: 11px; border: 3px solid #fff; outline: none;
  }
  #briSlider::-webkit-slider-thumb {
    -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%;
    background: #fff; border: 3px solid #777; cursor: pointer;
  }
  #briSlider::-moz-range-thumb {
    width: 22px; height: 22px; border-radius: 50%;
    background: #fff; border: 3px solid #777; cursor: pointer;
  }

  /* the row of ready-made colours along the bottom */
  #swatchRow { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
  #swatchRow .sw {
    width: 30px; height: 30px; border-radius: 50%; cursor: pointer;
    border: 3px solid rgba(255,255,255,.35);
    transition: transform .1s ease;
  }
  #swatchRow .sw:hover { transform: scale(1.16); }

  /* a switch you cannot use right now (because the eraser is on) */
  #effects .tool.disabled { opacity: .28; cursor: not-allowed; box-shadow: none; }

  /* ---------- the SIZE pop-out ---------- */
  #sizePop {
    position: fixed; right: 148px; top: 50%; transform: translateY(-50%) scale(.6);
    z-index: 25;
    background: var(--pink);
    border-radius: 34px; padding: 20px 24px;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    box-shadow: 0 8px 0 rgba(0,0,0,.15);
    opacity: 0; pointer-events: none;
    transition: opacity .18s ease, transform .26s cubic-bezier(.34,1.7,.5,1);
  }
  #sizePop.open { opacity: 1; pointer-events: auto; transform: translateY(-50%) scale(1); }
  #sizePop .cap { color: #fff; font-size: 14px; letter-spacing: 2px; }
  #sizeRow { display: flex; align-items: center; gap: 10px; }
  #sizePop .step {
    width: 48px; height: 48px; border-radius: 50%; background: #111; color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; cursor: pointer; user-select: none;
  }
  #sizePop .step:active { transform: translateY(2px); }
  #sizeInput {
    width: 128px; height: 62px;
    border: 5px solid #fff; border-radius: 18px;
    background: #111; color: #fff;
    font-family: "Arial Black", sans-serif; font-size: 30px; text-align: center;
    outline: none; appearance: textfield; -moz-appearance: textfield;
  }
  #sizeInput::-webkit-outer-spin-button,
  #sizeInput::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  #sizeSlider { width: 210px; accent-color: #fff; cursor: pointer; }
  #sizePreview {
    width: 210px; height: 100px; background: #fff; border-radius: 18px;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  #sizeDot { border-radius: 50%; background: #111; transition: width .12s ease, height .12s ease; }

  /* ---------- the SPEED pop-out (same idea, but on the left) ---------- */
  #speedPop {
    position: fixed; left: 148px; top: 50%; transform: translateY(-50%) scale(.6);
    z-index: 25;
    background: var(--orange);
    border-radius: 34px; padding: 20px 24px;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    box-shadow: 0 8px 0 rgba(0,0,0,.15);
    opacity: 0; pointer-events: none;
    transition: opacity .18s ease, transform .26s cubic-bezier(.34,1.7,.5,1);
  }
  #speedPop.open { opacity: 1; pointer-events: auto; transform: translateY(-50%) scale(1); }
  #speedPop .cap { color: #fff; font-size: 14px; letter-spacing: 2px; }
  #speedRow { display: flex; align-items: center; gap: 10px; }
  #speedPop .step {
    width: 48px; height: 48px; border-radius: 50%; background: #111; color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; cursor: pointer; user-select: none;
  }
  #speedPop .step:active { transform: translateY(2px); }
  #speedInput {
    width: 128px; height: 62px;
    border: 5px solid #fff; border-radius: 18px;
    background: #111; color: #fff;
    font-family: "Arial Black", sans-serif; font-size: 30px; text-align: center;
    outline: none; appearance: textfield; -moz-appearance: textfield;
  }
  #speedInput::-webkit-outer-spin-button,
  #speedInput::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  #speedSlider { width: 210px; accent-color: #fff; cursor: pointer; }
  #speedPreview {
    width: 210px; height: 100px; background: #fff5e2; border-radius: 18px;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  #speedSquare {
    width: 56px; height: 56px; background: #fff;
    border: 3px solid #12303f; border-radius: 4px;
  }

  /* ---------- the hint that fades away ---------- */
  #hint {
    position: fixed; left: 50%; bottom: 34px; transform: translateX(-50%);
    z-index: 15; color: var(--navy); background: rgba(255,255,255,.82);
    padding: 12px 22px; border-radius: 999px;
    font-size: 16px; letter-spacing: .5px; text-align: center;
    transition: opacity .8s ease; pointer-events: none;
  }
  #hint.gone { opacity: 0; }
</style>
</head>
<body>

<canvas id="stage"></canvas>

<!-- ============ TOP BAR (no back arrow — Jos said remove it) ============ -->
<div class="btn" id="save">SAVE
  <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6"
       stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/>
    <path d="M12 15V3"/><path d="M8 7l4-4 4 4"/>
  </svg>
</div>

<div class="btn" id="pause">
  <svg id="pauseIcon" width="30" height="30" viewBox="0 0 24 24" fill="#fff">
    <rect x="6" y="4" width="4.2" height="16" rx="1.4"/>
    <rect x="13.8" y="4" width="4.2" height="16" rx="1.4"/>
  </svg>
</div>

<!-- ============ LEFT PANEL — SPIN SPEED + SPIN DIRECTION ============ -->
<div id="left">
  <svg class="swirl" id="swirlBtn" title="Type an exact speed"
       viewBox="0 0 64 64" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round">
    <path d="M32 10a22 22 0 1 1-15.6 6.4"/>
    <path d="M32 24a8 8 0 1 0 5.7 2.3"/>
  </svg>

  <div id="speedTrack">
    <svg viewBox="0 0 74 290" preserveAspectRatio="none">
      <path d="M37 8 L48 8 L39 282 L35 282 Z" fill="#111"/>
    </svg>
    <div id="speedHandle" style="top:150px"></div>
  </div>

  <div class="knob" id="dirBtn" title="Spin direction">
    <svg width="46" height="46" viewBox="0 0 48 48" fill="none" stroke-width="5"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 24a12 12 0 0 1 20-8.9" stroke="#ff1b5e"/>
      <path d="M32 8v8h-8"              stroke="#ff1b5e"/>
      <path d="M36 24a12 12 0 0 1-20 8.9" stroke="#fff"/>
      <path d="M16 40v-8h8"              stroke="#fff"/>
    </svg>
  </div>

  <div class="hideTab" id="hideLeft">←</div>
</div>

<!-- ============ RIGHT PANEL — EFFECTS / COLOUR / SIZE / UNDO ============ -->
<div id="right">
  <div class="knob" id="fxBtn" title="Effects">
    <svg width="46" height="46" viewBox="0 0 48 48" fill="#fff">
      <path d="M8 34l14-14 6 6-14 14H8z"/>
      <rect x="27" y="9" width="12" height="9" rx="2.5" transform="rotate(45 33 13.5)"/>
    </svg>
  </div>

  <div class="knob" id="colBtn" title="Colour">
    <svg width="52" height="52" viewBox="0 0 52 52">
      <g id="ring"></g>
      <circle id="colDot" cx="26" cy="26" r="9" fill="#ff1b5e"/>
    </svg>
  </div>

  <div class="knob" id="sizeBtn" title="Size">
    <svg width="52" height="52" viewBox="0 0 52 52" fill="#fff">
      <circle id="sizeDotBig" cx="26" cy="20" r="10"/>
      <circle cx="26" cy="38" r="4"/>
    </svg>
  </div>

  <div class="knob" id="undoBtn" title="Undo">
    <svg width="44" height="44" viewBox="0 0 48 48" fill="none" stroke="#8a8a8a"
         stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 20H32a10 10 0 0 1 0 20h-6"/>
      <path d="M20 12l-8 8 8 8"/>
    </svg>
    <span id="undoCount">0</span>
  </div>

  <div class="hideTab" id="hideRight">→</div>
</div>

<!-- ============ THE PINK EFFECTS MENU ============ -->
<div id="effects">
  <div class="tool active" data-brush="brush"   title="Brush">🖌️</div>
  <div class="tool"        data-brush="eraser"  title="Eraser">🧽</div>
  <div class="tool"        data-brush="rainbow" title="Rainbow">🌈</div>
  <div class="label">PICK ONE ↑</div>
  <div class="divider"></div>
  <div class="tool" data-toggle="pulse" title="Big-small">↕️</div>
  <div class="tool" data-toggle="orbit" title="Orbit">🌀</div>
  <div class="label">SWITCHES ↑</div>
</div>

<!-- ============ THE COLOUR MENU — a proper colour wheel ============ -->
<div id="colours">
  <div id="wheelCard">
    <canvas id="wheel" width="200" height="200"></canvas>
    <div id="wheelKnob"></div>
  </div>
  <input id="briSlider" type="range" min="0" max="100" value="100">
  <div id="swatchRow"></div>
</div>

<!-- ============ THE SIZE POP-UP (type any number you like) ============ -->
<div id="sizePop">
  <div class="cap">HOW FAT?</div>
  <div id="sizeRow">
    <div class="step" id="sizeMinus">−</div>
    <input id="sizeInput" type="number" min="1" max="150" value="10">
    <div class="step" id="sizePlus">+</div>
  </div>
  <input id="sizeSlider" type="range" min="1" max="150" value="10">
  <div id="sizePreview"><div id="sizeDot"></div></div>
</div>

<!-- ============ THE SPEED POP-UP (click the swirl to open) ============ -->
<div id="speedPop">
  <div class="cap">HOW FAST?</div>
  <div id="speedRow">
    <div class="step" id="speedMinus">−</div>
    <input id="speedInput" type="number" min="0" max="100" value="35">
    <div class="step" id="speedPlus">+</div>
  </div>
  <input id="speedSlider" type="range" min="0" max="100" value="35">
  <div id="speedPreview"><div id="speedSquare"></div></div>
</div>

<!-- ============ THE LITTLE ARROWS THAT BRING A PANEL BACK ============ -->
<div class="reopen" id="reopenLeft">→</div>
<div class="reopen" id="reopenRight">←</div>

<div id="hint">HOLD THE MOUSE BUTTON TO PAINT &nbsp;·&nbsp; SPACE = PAUSE &nbsp;·&nbsp; U = UNDO</div>

<script>
/* ================================================================
   ⭐ THINGS YOU CAN CHANGE, JOS ⭐
   Change a number, save the file, refresh the page. See what happens!
   ================================================================ */
const SETTINGS = {

  // --- the 🌀 ORBIT switch ---
  ORBIT_FIXED:      200,   // the circle the paint makes round your mouse, when ↕️ is OFF
  ORBIT_MIN:        100,   // when ↕️ IS on: smallest circle (pixels)
  ORBIT_MAX:        300,   // when ↕️ IS on: biggest circle
  ORBIT_BREATH_SEC: 6,     // seconds to go small -> big -> small
  ORBIT_SPIN_SPEED: 2.4,   // how fast the paint whizzes round (bigger = faster)

  // --- the ↕️ BIG-SMALL switch ---
  PULSE_SEC:        1.6,   // seconds for the line to go fat -> thin -> fat
  PULSE_AMOUNT:     0.85,  // how extreme (0 = no change, 1 = shrinks to nothing)

  // --- the paper ---
  PAPER_PIXELS:     1800,  // how detailed the paper is
  PAPER_FILL:       1.18,  // paper size vs screen (bigger = paper fills more)
  MAX_SPIN:         1.1,   // top spin speed when the slider is all the way up

  // --- brushes ---
  START_SIZE:       10,    // how fat the line is when you open the page
  SIZE_MIN:         1,     // thinnest you are allowed to type
  SIZE_MAX:         150,   // fattest you are allowed to type
  RAINBOW_SPEED:    90,    // how fast the rainbow changes colour
  MAX_UNDO:         15     // how many undos to remember
};

/* ================================================================
   SET UP THE SCREEN AND THE PAPER
   There are TWO canvases:
     "stage" = what you see (the grey background + the paper)
     "paper" = an invisible one that holds the INK. It never rotates.
   We rotate it only when we draw it on screen. That is the trick that
   makes ink stick to the paper. 🪄
   ================================================================ */
const stage = document.getElementById('stage');
const ctx   = stage.getContext('2d');

const paper = document.createElement('canvas');
paper.width = paper.height = SETTINGS.PAPER_PIXELS;
const pctx  = paper.getContext('2d');
pctx.fillStyle = '#ffffff';
pctx.fillRect(0, 0, paper.width, paper.height);
pctx.lineCap = pctx.lineJoin = 'round';

let W, H, cx, cy, paperScreenSize, scale, DPR;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  stage.width  = W * DPR;
  stage.height = H * DPR;
  stage.style.width  = W + 'px';
  stage.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  cx = W / 2; cy = H / 2;
  paperScreenSize = Math.min(W, H) * SETTINGS.PAPER_FILL;
  scale = paperScreenSize / paper.width;
}
window.addEventListener('resize', resize);
resize();

/* ================================================================
   ALL THE THINGS THE APP REMEMBERS
   ================================================================ */
const state = {
  paperAngle:  0,        // how far round the paper has turned
  spinSpeed:   0.35,     // 0 to 1, set by the SPIN SPEED slider
  spinDir:     1,        // 1 or -1
  paused:      false,

  brush:       'brush',  // 'brush' | 'eraser' | 'rainbow'
  pulse:       false,    // ↕️ switch
  orbit:       false,    // 🌀 switch

  size:        SETTINGS.START_SIZE,

  // a colour is stored as three numbers, not as a name:
  //   hue = which colour (0-360, all the way round the wheel)
  //   sat = how strong it is (0 = white, 1 = full colour)
  //   val = how bright it is (0 = black, 1 = full brightness)
  hue: 340, sat: 0.89, val: 1,
  colour:      '#ff1b5e',
  rainbowHue:  0,

  orbitAngle:  0,
  breathT:     0,
  pulseT:      0,

  mouseX: null, mouseY: null,
  drawing: false,
  lastPaperPt: null,

  undoStack: []
};

/* ---- turn a point on the SCREEN into a point on the PAPER ----
   The paper is spinning, so we have to spin the point backwards
   by the same amount. This is the only proper maths in the whole file. */
function screenToPaper(sx, sy) {
  const dx = sx - cx, dy = sy - cy;
  const a = -state.paperAngle;
  const c = Math.cos(a), s = Math.sin(a);
  return {
    x: (dx * c - dy * s) / scale + paper.width  / 2,
    y: (dx * s + dy * c) / scale + paper.height / 2
  };
}

/* ================================================================
   DRAWING
   ================================================================ */
function currentWidth() {
  let w = state.size;
  // The paint circle stays exactly the size you typed...
  // ...UNLESS the ↕️ big-small switch is on. Then it breathes.
  if (state.pulse) {
    // goes fat -> thin -> fat using a wave
    const wave = 0.5 - 0.5 * Math.cos(state.pulseT);
    w = w * (1 - SETTINGS.PULSE_AMOUNT * wave) + 1;
  }
  return w;
}

function currentColour() {
  if (state.brush === 'eraser')  return '#ffffff';
  if (state.brush === 'rainbow') return 'hsl(' + state.rainbowHue + ' 95% 52%)';
  return state.colour;
}

// where the paint actually is on screen (the mouse, or orbiting round it)
function brushScreenPoint() {
  if (!state.orbit) return { x: state.mouseX, y: state.mouseY };

  // The orbit stays EXACTLY the same size...
  let r = SETTINGS.ORBIT_FIXED;
  // ...unless the ↕️ big-small switch is on. Then, and only then, it breathes.
  if (state.pulse) {
    const wave = 0.5 - 0.5 * Math.cos(state.breathT);   // 0 -> 1 -> 0
    r = SETTINGS.ORBIT_MIN + (SETTINGS.ORBIT_MAX - SETTINGS.ORBIT_MIN) * wave;
  }
  return {
    x: state.mouseX + Math.cos(state.orbitAngle) * r,
    y: state.mouseY + Math.sin(state.orbitAngle) * r,
    r: r
  };
}

function paintStep() {
  if (!state.drawing || state.mouseX === null) return;
  const bp = brushScreenPoint();
  const p  = screenToPaper(bp.x, bp.y);

  if (state.lastPaperPt) {
    pctx.strokeStyle = currentColour();
    pctx.lineWidth   = currentWidth();
    pctx.beginPath();
    pctx.moveTo(state.lastPaperPt.x, state.lastPaperPt.y);
    pctx.lineTo(p.x, p.y);
    pctx.stroke();
  }
  state.lastPaperPt = p;
}

/* ================================================================
   UNDO — we photocopy the paper before each new stroke
   ================================================================ */
function pushUndo() {
  const snap = document.createElement('canvas');
  snap.width = paper.width; snap.height = paper.height;
  snap.getContext('2d').drawImage(paper, 0, 0);
  state.undoStack.push(snap);
  if (state.undoStack.length > SETTINGS.MAX_UNDO) state.undoStack.shift();
  refreshUndoCount();
}
function doUndo() {
  const snap = state.undoStack.pop();
  if (!snap) return;
  pctx.clearRect(0, 0, paper.width, paper.height);
  pctx.drawImage(snap, 0, 0);
  refreshUndoCount();
}
function refreshUndoCount() {
  document.getElementById('undoCount').textContent = state.undoStack.length;
}

/* ================================================================
   THE ANIMATION LOOP — runs about 60 times every second
   ================================================================ */
let lastTime = performance.now();

function frame(now) {
  const dt = Math.min((now - lastTime) / 1000, 0.05);   // seconds since last frame
  lastTime = now;

  // --- move everything along ---
  if (!state.paused) {
    state.paperAngle += state.spinSpeed * SETTINGS.MAX_SPIN * state.spinDir * dt;
  }
  state.orbitAngle += SETTINGS.ORBIT_SPIN_SPEED * dt;
  state.breathT    += (Math.PI * 2 / SETTINGS.ORBIT_BREATH_SEC) * dt;
  state.pulseT     += (Math.PI * 2 / SETTINGS.PULSE_SEC) * dt;
  state.rainbowHue  = (state.rainbowHue + SETTINGS.RAINBOW_SPEED * dt) % 360;

  paintStep();

  // --- draw the background ---
  ctx.fillStyle = getComputedStyle(document.documentElement)
                    .getPropertyValue('--bg').trim();
  ctx.fillRect(0, 0, W, H);

  // --- draw the spinning paper (with a soft shadow under it) ---
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(state.paperAngle);
  ctx.shadowColor   = 'rgba(0,0,0,.13)';
  ctx.shadowBlur    = 34;
  ctx.shadowOffsetY = 10;
  ctx.fillStyle = '#fff';
  ctx.fillRect(-paperScreenSize/2, -paperScreenSize/2, paperScreenSize, paperScreenSize);
  ctx.shadowColor = 'transparent';
  ctx.drawImage(paper, -paperScreenSize/2, -paperScreenSize/2,
                        paperScreenSize, paperScreenSize);
  ctx.restore();

  // --- the little navy dot in the middle (the pin the paper spins on) ---
  ctx.fillStyle = '#12303f';
  ctx.beginPath(); ctx.arc(cx, cy, 15, 0, Math.PI * 2); ctx.fill();

  drawCursor();

  // the tiny square in the speed pop-up spins at exactly the real speed,
  // so you can see what a number actually means before you close the box
  speedSquare.style.transform = 'rotate(' + state.paperAngle + 'rad)';

  requestAnimationFrame(frame);
}

function drawCursor() {
  if (state.mouseX === null) return;

  const bp       = brushScreenPoint();
  const previewR = Math.max(currentWidth() / 2, 3);

  // when ORBIT is on, show the ring the paint is travelling round,
  // plus a faint string joining your mouse to the paint
  if (state.orbit) {
    ctx.strokeStyle = 'rgba(18,48,63,.20)';
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 8]);
    ctx.beginPath(); ctx.arc(state.mouseX, state.mouseY, bp.r, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);

    ctx.strokeStyle = 'rgba(18,48,63,.15)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(state.mouseX, state.mouseY);
    ctx.lineTo(bp.x, bp.y);
    ctx.stroke();
  }

  // ⭐ THE PAINT PREVIEW ⭐
  // A 50% see-through circle, sitting exactly where the paint will land,
  // at exactly the size it will be — including every effect you switched on.
  ctx.globalAlpha = 0.5;
  ctx.fillStyle = currentColour();
  ctx.beginPath(); ctx.arc(bp.x, bp.y, previewR, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;

  // an outline round it, so you can still see it on white paper
  // (the eraser gets a pink dashed ring, because white-on-white is invisible)
  const erasing = state.brush === 'eraser';
  ctx.strokeStyle = erasing ? '#ff1b5e' : 'rgba(18,48,63,.5)';
  ctx.lineWidth = 2;
  ctx.setLineDash(erasing ? [5, 5] : []);
  ctx.beginPath(); ctx.arc(bp.x, bp.y, previewR, 0, Math.PI * 2); ctx.stroke();
  ctx.setLineDash([]);

  // the mouse pointer itself
  ctx.strokeStyle = '#12303f';
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(state.mouseX, state.mouseY, 11, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = state.drawing ? currentColour() : 'rgba(255,255,255,.75)';
  ctx.beginPath(); ctx.arc(state.mouseX, state.mouseY, 8, 0, Math.PI * 2); ctx.fill();
}
requestAnimationFrame(frame);

/* ================================================================
   MOUSE
   ================================================================ */
stage.addEventListener('pointermove', e => {
  state.mouseX = e.clientX; state.mouseY = e.clientY;
});
stage.addEventListener('pointerdown', e => {
  stage.setPointerCapture(e.pointerId);
  state.mouseX = e.clientX; state.mouseY = e.clientY;
  pushUndo();
  state.drawing = true;
  state.lastPaperPt = null;
  hideHint();
});
function stopDrawing() { state.drawing = false; state.lastPaperPt = null; }
stage.addEventListener('pointerup', stopDrawing);
stage.addEventListener('pointercancel', stopDrawing);
stage.addEventListener('pointerleave', () => { stopDrawing(); });

/* ================================================================
   THE SPIN SPEED SLIDER
   ================================================================ */
const track  = document.getElementById('speedTrack');
const handle = document.getElementById('speedHandle');
const TRACK_TOP = 8, TRACK_BOTTOM = 282;

const speedPop    = document.getElementById('speedPop');
const speedInput  = document.getElementById('speedInput');
const speedSlider = document.getElementById('speedSlider');
const speedSquare = document.getElementById('speedSquare');

/* ONE function that everything talks to. The bar, the text box, the slider
   and the + / − buttons all just call this. That way they can never
   disagree with each other. */
function setSpeed(percent) {
  percent = Math.round(Number(percent));
  if (!isFinite(percent)) percent = 35;
  percent = Math.max(0, Math.min(100, percent));

  state.spinSpeed = percent / 100;

  // move the white handle on the tapered bar
  handle.style.top = (TRACK_TOP + (1 - percent / 100) * (TRACK_BOTTOM - TRACK_TOP)) + 'px';
  speedInput.value  = percent;
  speedSlider.value = percent;
}

// dragging the tapered bar: work out a percentage, then hand it to setSpeed
function setSpeedFromY(clientY) {
  const box = track.getBoundingClientRect();
  let y = Math.max(TRACK_TOP, Math.min(TRACK_BOTTOM, clientY - box.top));
  // top of the bar = fast, bottom = slow (it is fat at the top!)
  setSpeed((1 - (y - TRACK_TOP) / (TRACK_BOTTOM - TRACK_TOP)) * 100);
}

let draggingSpeed = false;
track.addEventListener('pointerdown', e => {
  draggingSpeed = true; track.setPointerCapture(e.pointerId); setSpeedFromY(e.clientY);
});
track.addEventListener('pointermove', e => { if (draggingSpeed) setSpeedFromY(e.clientY); });
track.addEventListener('pointerup',   () => { draggingSpeed = false; });

/* ---- clicking the swirl opens the pop-up (the bar still works either way) ---- */
document.getElementById('swirlBtn').addEventListener('click', e => {
  e.stopPropagation();
  speedPop.classList.toggle('open');
  closeMenus('speed');
  if (speedPop.classList.contains('open')) { speedInput.focus(); speedInput.select(); }
});
speedPop.addEventListener('click', e => e.stopPropagation());

speedInput.addEventListener('input',  () => setSpeed(speedInput.value));
speedSlider.addEventListener('input', () => setSpeed(speedSlider.value));
document.getElementById('speedPlus').addEventListener('click',  () => setSpeed(state.spinSpeed * 100 + 1));
document.getElementById('speedMinus').addEventListener('click', () => setSpeed(state.spinSpeed * 100 - 1));
speedInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') { speedPop.classList.remove('open'); speedInput.blur(); }
  e.stopPropagation();
});

setSpeed(35);

/* ================================================================
   BUTTONS
   ================================================================ */
document.getElementById('dirBtn').addEventListener('click', () => {
  state.spinDir *= -1;
});

const pauseBtn = document.getElementById('pause');
function togglePause() {
  state.paused = !state.paused;
  document.getElementById('pauseIcon').innerHTML = state.paused
    ? '<path d="M7 4l13 8-13 8z" fill="#fff"/>'
    : '<rect x="6" y="4" width="4.2" height="16" rx="1.4"/><rect x="13.8" y="4" width="4.2" height="16" rx="1.4"/>';
}
pauseBtn.addEventListener('click', togglePause);

document.getElementById('undoBtn').addEventListener('click', doUndo);

document.getElementById('save').addEventListener('click', () => {
  const a = document.createElement('a');
  a.download = 'my-spirograph.png';
  a.href = paper.toDataURL('image/png');
  a.click();
});

/* ---- HIDE a panel, and leave a small black arrow to bring it back ---- */
function setPanelHidden(side, hidden) {
  const panel  = document.getElementById(side === 'left' ? 'left' : 'right');
  const arrow  = document.getElementById(side === 'left' ? 'reopenLeft' : 'reopenRight');
  panel.classList.toggle('hidden', hidden);
  arrow.classList.toggle('show',   hidden);
  if (hidden) closeMenus(null);      // don't leave a pop-up floating on its own
}

document.getElementById('hideLeft').addEventListener('click',  () => setPanelHidden('left',  true));
document.getElementById('hideRight').addEventListener('click', () => setPanelHidden('right', true));
document.getElementById('reopenLeft').addEventListener('click',  () => setPanelHidden('left',  false));
document.getElementById('reopenRight').addEventListener('click', () => setPanelHidden('right', false));

/* ================================================================
   SIZE — type any number you like
   ================================================================ */
const sizePop    = document.getElementById('sizePop');
const sizeInput  = document.getElementById('sizeInput');
const sizeSlider = document.getElementById('sizeSlider');
const sizeDot    = document.getElementById('sizeDot');

sizeInput.min  = sizeSlider.min = SETTINGS.SIZE_MIN;
sizeInput.max  = sizeSlider.max = SETTINGS.SIZE_MAX;

function setSize(n) {
  // keep the number sensible, whatever gets typed in
  n = Math.round(Number(n));
  if (!isFinite(n)) n = SETTINGS.START_SIZE;
  n = Math.max(SETTINGS.SIZE_MIN, Math.min(SETTINGS.SIZE_MAX, n));
  state.size = n;

  sizeInput.value  = n;
  sizeSlider.value = n;

  // the little live preview blob inside the pop-up
  const shown = Math.min(n, 88);
  sizeDot.style.width  = shown + 'px';
  sizeDot.style.height = shown + 'px';

  // and the dot drawn on the round SIZE button itself
  document.getElementById('sizeDotBig')
          .setAttribute('r', Math.max(3, Math.min(13, 3 + n * 0.16)));
}

document.getElementById('sizeBtn').addEventListener('click', e => {
  e.stopPropagation();
  sizePop.classList.toggle('open');
  closeMenus('size');
  if (sizePop.classList.contains('open')) { sizeInput.focus(); sizeInput.select(); }
});
sizePop.addEventListener('click', e => e.stopPropagation());

sizeInput.addEventListener('input',  () => setSize(sizeInput.value));
sizeSlider.addEventListener('input', () => setSize(sizeSlider.value));
document.getElementById('sizePlus').addEventListener('click',  () => setSize(state.size + 1));
document.getElementById('sizeMinus').addEventListener('click', () => setSize(state.size - 1));
sizeInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') { sizePop.classList.remove('open'); sizeInput.blur(); }
  e.stopPropagation();            // so SPACE and U do not fire while typing
});

setSize(SETTINGS.START_SIZE);

/* ================================================================
   THE POP-OUT MENUS
   ================================================================ */
const fxPanel  = document.getElementById('effects');
const colPanel = document.getElementById('colours');

function closeMenus(except) {
  if (except !== 'fx')   fxPanel.classList.remove('open');
  if (except !== 'col')  colPanel.classList.remove('open');
  if (except !== 'size')  document.getElementById('sizePop').classList.remove('open');
  if (except !== 'speed') document.getElementById('speedPop').classList.remove('open');
  document.getElementById('fxBtn').classList.toggle('on',   fxPanel.classList.contains('open'));
  document.getElementById('colBtn').classList.toggle('on',  colPanel.classList.contains('open'));
  document.getElementById('sizeBtn').classList.toggle('on',
    document.getElementById('sizePop').classList.contains('open'));
}

document.getElementById('fxBtn').addEventListener('click', e => {
  e.stopPropagation();
  fxPanel.classList.toggle('open');
  closeMenus('fx');
});
document.getElementById('colBtn').addEventListener('click', e => {
  e.stopPropagation();
  colPanel.classList.toggle('open');
  closeMenus('col');
});
fxPanel.addEventListener('click',  e => e.stopPropagation());
colPanel.addEventListener('click', e => e.stopPropagation());
stage.addEventListener('pointerdown', () => closeMenus(null));

/* ---- the EFFECTS menu ---- */
function applyBrush(name) {
  state.brush = name;
  fxPanel.querySelectorAll('[data-brush]').forEach(o =>
    o.classList.toggle('active', o.dataset.brush === name));

  // ⭐ THE ERASER RULE ⭐
  // An eraser is for tidying up, so all the effects switch OFF
  // and you cannot turn them on while it is selected.
  const erasing = (name === 'eraser');
  if (erasing) { state.pulse = false; state.orbit = false; state.lastPaperPt = null; }
  fxPanel.querySelectorAll('[data-toggle]').forEach(o => {
    o.classList.toggle('disabled', erasing);
    if (erasing) o.classList.remove('toggled');
  });
}

fxPanel.querySelectorAll('[data-brush]').forEach(el => {
  el.addEventListener('click', () => applyBrush(el.dataset.brush));
});

fxPanel.querySelectorAll('[data-toggle]').forEach(el => {
  el.addEventListener('click', () => {
    if (el.classList.contains('disabled')) return;   // eraser is on — no effects
    const key = el.dataset.toggle;
    state[key] = !state[key];
    el.classList.toggle('toggled', state[key]);
    if (key === 'orbit') state.lastPaperPt = null;   // don't drag a line across
  });
});

/* ================================================================
   THE COLOUR WHEEL
   Round the wheel = which colour (hue).
   Middle to edge  = how strong it is (saturation).
   The slider      = how bright it is (value).
   Those three numbers can make every colour there is. 🎨
   ================================================================ */
const wheel  = document.getElementById('wheel');
const wctx   = wheel.getContext('2d');
const knob   = document.getElementById('wheelKnob');
const bri    = document.getElementById('briSlider');

// turn hue/sat/val into red, green and blue
function hsv2rgb(h, s, v) {
  h = ((h % 360) + 360) % 360;
  const c = v * s;
  const x = c * (1 - Math.abs((h / 60) % 2 - 1));
  const m = v - c;
  let r = 0, g = 0, b = 0;
  if      (h <  60) { r = c; g = x; }
  else if (h < 120) { r = x; g = c; }
  else if (h < 180) { g = c; b = x; }
  else if (h < 240) { g = x; b = c; }
  else if (h < 300) { r = x; b = c; }
  else              { r = c; b = x; }
  return [Math.round((r + m) * 255), Math.round((g + m) * 255), Math.round((b + m) * 255)];
}
function hsv2hex(h, s, v) {
  return '#' + hsv2rgb(h, s, v).map(n => n.toString(16).padStart(2, '0')).join('');
}

// paint the wheel, one pixel at a time (40,000 of them!)
function drawWheel() {
  const w = wheel.width, R = w / 2;
  const img = wctx.createImageData(w, w);
  const d = img.data;
  for (let y = 0; y < w; y++) {
    for (let x = 0; x < w; x++) {
      const dx = x - R, dy = y - R;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const i = (y * w + x) * 4;
      if (dist > R) { d[i + 3] = 0; continue; }          // outside the circle
      let ang = Math.atan2(dy, dx) * 180 / Math.PI;
      if (ang < 0) ang += 360;
      const [r, g, b] = hsv2rgb(ang, Math.min(dist / R, 1), state.val);
      d[i] = r; d[i + 1] = g; d[i + 2] = b;
      d[i + 3] = dist > R - 1.5 ? 255 * (R - dist) / 1.5 : 255;   // smooth edge
    }
  }
  wctx.putImageData(img, 0, 0);
}

// everything that has to happen when the colour changes — in ONE place
function updateColour() {
  state.colour = hsv2hex(state.hue, state.sat, state.val);

  const R = wheel.width / 2;
  const a = state.hue * Math.PI / 180;
  knob.style.left = (14 + R + Math.cos(a) * state.sat * R) + 'px';
  knob.style.top  = (14 + R + Math.sin(a) * state.sat * R) + 'px';
  knob.style.background = state.colour;

  // the brightness bar shows black -> your colour at full brightness
  bri.style.background = 'linear-gradient(to right, #000, ' + hsv2hex(state.hue, state.sat, 1) + ')';
  bri.value = Math.round(state.val * 100);

  // and the middle of the COLOUR button shows what you picked
  document.getElementById('colDot').setAttribute('fill', state.colour);
}

// clicking or dragging on the wheel
function pickFromWheel(e) {
  const box = wheel.getBoundingClientRect();
  const R = wheel.width / 2;
  const dx = e.clientX - box.left - R;
  const dy = e.clientY - box.top  - R;
  let ang = Math.atan2(dy, dx) * 180 / Math.PI;
  if (ang < 0) ang += 360;
  state.hue = ang;
  state.sat = Math.min(Math.sqrt(dx * dx + dy * dy) / R, 1);
  if (state.brush === 'rainbow' || state.brush === 'eraser') applyBrush('brush');
  updateColour();
}

let pickingColour = false;
wheel.addEventListener('pointerdown', e => {
  pickingColour = true; wheel.setPointerCapture(e.pointerId); pickFromWheel(e);
});
wheel.addEventListener('pointermove', e => { if (pickingColour) pickFromWheel(e); });
wheel.addEventListener('pointerup',   () => { pickingColour = false; });

bri.addEventListener('input', () => {
  state.val = bri.value / 100;
  drawWheel();            // the whole wheel gets darker or lighter too
  updateColour();
});

/* ---- the ready-made colours along the bottom ----
   Row 1: black, grey, WHITE, then the three PRIMARY colours of light.
   Row 2: the three SECONDARY colours (what you get mixing two primaries),
          then orange, purple and brown, because they are useful.       */
const PRESETS = [
  { h:   0, s: 0,   v: 0,   name: 'black'   },
  { h:   0, s: 0,   v: .5,  name: 'grey'    },
  { h:   0, s: 0,   v: 1,   name: 'white'   },
  { h:   0, s: 1,   v: 1,   name: 'RED — primary'     },
  { h: 120, s: 1,   v: .85, name: 'GREEN — primary'   },
  { h: 240, s: 1,   v: 1,   name: 'BLUE — primary'    },

  { h: 180, s: 1,   v: .9,  name: 'CYAN — green + blue'    },
  { h: 300, s: 1,   v: 1,   name: 'MAGENTA — red + blue'   },
  { h:  60, s: 1,   v: 1,   name: 'YELLOW — red + green'   },
  { h:  28, s: 1,   v: 1,   name: 'orange'  },
  { h: 275, s: .85, v: .95, name: 'purple'  },
  { h:  25, s: .75, v: .5,  name: 'brown'   }
];
const swatchRow = document.getElementById('swatchRow');
PRESETS.forEach(p => {
  const sw = document.createElement('div');
  sw.className = 'sw';
  sw.title = p.name;                      // hover to see what it is called
  sw.style.background = hsv2hex(p.h, p.s, p.v);
  sw.addEventListener('click', () => {
    state.hue = p.h; state.sat = p.s; state.val = p.v;
    if (state.brush === 'rainbow' || state.brush === 'eraser') applyBrush('brush');
    drawWheel();
    updateColour();
  });
  swatchRow.appendChild(sw);
});

drawWheel();
updateColour();

/* ---- the little rainbow ring drawn on the COLOUR button ---- */
const ring = document.getElementById('ring');
for (let i = 0; i < 12; i++) {
  const a0 = (i / 12) * Math.PI * 2, a1 = ((i + 1.06) / 12) * Math.PI * 2;
  const R = 22, r = 13;
  const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  const x = (rad, ang) => 26 + Math.cos(ang) * rad;
  const y = (rad, ang) => 26 + Math.sin(ang) * rad;
  p.setAttribute('d',
    `M${x(R,a0)} ${y(R,a0)} A${R} ${R} 0 0 1 ${x(R,a1)} ${y(R,a1)}
     L${x(r,a1)} ${y(r,a1)} A${r} ${r} 0 0 0 ${x(r,a0)} ${y(r,a0)} Z`);
  p.setAttribute('fill', `hsl(${i * 30} 90% 55%)`);
  ring.appendChild(p);
}

/* ================================================================
   KEYBOARD SHORTCUTS
   ================================================================ */
window.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); togglePause(); }
  if (e.key === 'u' || e.key === 'U') doUndo();
  if (e.key === 's' || e.key === 'S') document.getElementById('save').click();
  if (e.key === 'o' || e.key === 'O')
    fxPanel.querySelector('[data-toggle="orbit"]').click();
});

/* ---- the hint fades away once you start painting ---- */
let hintGone = false;
function hideHint() {
  if (hintGone) return;
  hintGone = true;
  document.getElementById('hint').classList.add('gone');
}
setTimeout(hideHint, 9000);
</script>
