<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Make Your Own</title>
  <style>
    body {
      margin: 0; font-family: 'Comic Sans MS', 'Trebuchet MS', sans-serif;
      background: #0d0d1a; color: #fff; text-align: center; padding: 30px 20px 60px;
    }
    h1 { color: #6bff4e; }
    .hint { color: #aaa; font-size: 1em; max-width: 600px; margin: 0 auto 18px; }
    .editor { max-width: 700px; margin: 0 auto; text-align: left; }
    textarea {
      width: 100%; min-height: 160px; box-sizing: border-box;
      background: #1c1c33; color: #6bff4e; border: 3px solid #4edcff;
      border-radius: 14px; padding: 14px; font-family: monospace;
      font-size: 14px; line-height: 1.5; resize: vertical; /* drag the corner to make it bigger! */
    }

    /* ---------- the name row: what your box will be called ---------- */
    .namerow { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
    .namerow input {
      background: #1c1c33; color: #fff; border: 3px solid #ffe14e;
      border-radius: 12px; padding: 10px 14px; font-size: 1.1em;
      font-family: 'Comic Sans MS', 'Trebuchet MS', sans-serif;
    }
    #titleBox { flex: 1; min-width: 200px; }
    #emojiBox { width: 90px; text-align: center; font-size: 1.6em; }

    .buttons { margin: 14px 0; display: flex; gap: 10px; flex-wrap: wrap; }
    button {
      font-family: 'Comic Sans MS', sans-serif; font-size: 1.1em;
      padding: 10px 20px; border: none; border-radius: 12px; cursor: pointer;
    }
    .run   { background: #6bff4e; color: #000; }
    .add   { background: #4edcff; color: #000; }
    .clear { background: #ff4ec7; color: #000; }
    .saved { color: #6bff4e; font-size: 0.9em; height: 1.2em; }
    iframe {
      width: 100%; height: 360px; border: 3px solid #ffe14e;
      border-radius: 14px; background: #fff; margin-top: 10px;
    }
    a.back { color: #4edcff; font-size: 1.2em; display: inline-block; margin-top: 25px; }
  </style>
</head>
<body>
  <h1>➕ Make Your Own</h1>
  <p class="hint">Paste or write your code here, then press <b>Run it!</b> to test it.
  When you like it, press <b>Add to Museum!</b> and it gets its very own box. 🖼️<br>
  Your code saves all by itself, so it's still here when you come back! 💾</p>

  <div class="editor">
    <textarea id="code" placeholder="// Paste your code here...
// Then press Run it! to see it work!"></textarea>

    <!-- What should the museum box be called? -->
    <div class="namerow">
      <input id="titleBox" placeholder="Name your creation...">
      <input id="emojiBox" value="✨" title="Pick an emoji for your box">
    </div>

    <div class="buttons">
      <button class="run"   onclick="runCode()">▶ Run it!</button>
      <button class="add"   onclick="addToMuseum()">🖼️ Add to Museum!</button>
      <button class="clear" onclick="clearCode()">🗑️ Clear</button>
    </div>
    <div class="saved" id="savedMsg"></div>

    <iframe id="preview" title="Preview"></iframe>
  </div>

  <a class="back" href="index.html">⬅ Back to the museum</a>

  <script>
    const codeBox  = document.getElementById('code');
    const titleBox = document.getElementById('titleBox');
    const emojiBox = document.getElementById('emojiBox');
    const savedMsg = document.getElementById('savedMsg');

    const SAVE_KEY  = 'jos-illusion-code';        // the code you're working on right now
    const MUSEUM_KEY = 'jos-museum-creations';    // ALL the ones you added to the museum

    // 1. When the page opens, load any code we saved before
    const saved = localStorage.getItem(SAVE_KEY);
    if (saved) codeBox.value = saved;

    // 2. Every time Jos types, save it so it never gets lost
    codeBox.addEventListener('input', () => {
      localStorage.setItem(SAVE_KEY, codeBox.value);
      flash('💾 Saved!');
      guessTheTitle();                 // try to fill the name box for you
    });

    function flash(msg) {
      savedMsg.textContent = msg;
      clearTimeout(window._savedTimer);
      window._savedTimer = setTimeout(() => savedMsg.textContent = '', 1500);
    }

    // 3. YOUR IDEA: if the code has a <title> inside it, use that as the name.
    //    (It only works if the code actually HAS a title — so there's a name
    //     box too, for when it doesn't.)
    function guessTheTitle() {
      if (titleBox.value.trim() !== '') return;   // don't overwrite your own name
      const match = codeBox.value.match(/<title>(.*?)<\/title>/i);
      if (match && match[1]) titleBox.value = match[1].trim();
    }

    // 4. Some code is a whole web page, some is just JavaScript.
    //    This works out which one you pasted and builds the right page.
    function buildPage(code) {
      const looksLikeAPage = /<\s*(!doctype|html|body|div|canvas|svg|style|script|h1|p)\b/i.test(code);
      if (looksLikeAPage) return code;                 // already a full page — run it as-is
      return '<!DOCTYPE html><html><head><meta charset="utf-8"></head><body><scr' + 'ipt>' +
             'try{' + code + '}catch(err){document.body.innerHTML=' +
             '"<pre style=\'color:red;font-family:monospace;padding:10px\'>Oops! "+err+"</pre>";}' +
             '</scr' + 'ipt></body></html>';
    }

    // 5. Run the code inside the preview box (safe, isolated)
    function runCode() {
      document.getElementById('preview').srcdoc = buildPage(codeBox.value);
    }

    // 6. THE NEW BIT — put this creation in the museum as its own box
    function addToMuseum() {
      const code = codeBox.value.trim();
      if (code === '') { alert('Write some code first! 🙂'); return; }

      guessTheTitle();
      const title = titleBox.value.trim() || 'My Creation';
      const emoji = emojiBox.value.trim() || '✨';

      const list = JSON.parse(localStorage.getItem(MUSEUM_KEY) || '[]');
      list.push({ id: 'c' + Date.now(), title: title, emoji: emoji, code: code });
      localStorage.setItem(MUSEUM_KEY, JSON.stringify(list));

      flash('🖼️ Added to the museum!');
      if (confirm('"' + title + '" is in the museum! Go and look at it?')) {
        location.href = 'index.html';
      }
    }

    // 7. Clear button — empties the box and the saved code
    function clearCode() {
      if (confirm('Clear your code? This cannot be undone!')) {
        codeBox.value = '';
        titleBox.value = '';
        localStorage.removeItem(SAVE_KEY);
        runCode();
      }
    }

    guessTheTitle();
  </script>
<!-- ===== HARD MODE (added 2026-09-05) ===== -->
<style>
#hmHell{position:fixed;inset:0;pointer-events:none;z-index:2147482000;background:rgba(217,79,58,.30);opacity:0;transition:opacity 1s ease}
#hmHell.on{opacity:1}
#hmEmb{position:fixed;inset:0;pointer-events:none;z-index:2147482001;overflow:hidden;opacity:0;transition:opacity 1s ease}
#hmEmb.on{opacity:1}
#hmEmb i{position:absolute;bottom:-20px;border-radius:50%;background:radial-gradient(circle,#fff3b0 0%,#ffab2b 40%,rgba(255,90,20,0) 75%);box-shadow:0 0 9px 3px rgba(255,150,40,.5);animation:hmRise linear infinite}
@keyframes hmRise{0%{transform:translate(0,0) scale(1);opacity:0}8%{opacity:.95}50%{transform:translate(var(--dx),-50vh) scale(.7);opacity:.8}100%{transform:translate(calc(var(--dx) * -0.6),-104vh) scale(.2);opacity:0}}
#hmShield{position:fixed;top:12px;right:12px;z-index:2147483000;width:46px;height:54px;pointer-events:none;opacity:0;transition:opacity .6s ease;filter:drop-shadow(0 0 9px rgba(255,80,20,.95))}
#hmShield.on{opacity:1;animation:hmPulse 1.6s ease-in-out infinite alternate}
@keyframes hmPulse{from{transform:scale(1)}to{transform:scale(1.08)}}
#hmShield span{position:absolute;left:0;right:0;top:44%;transform:translateY(-50%);text-align:center;font-size:21px;line-height:1}
</style>
<script>
(function(){
  try { if (sessionStorage.getItem('jos-hard-mode') !== 'on') return; } catch(e) { return; }
  function go(){
    var hell = document.createElement('div'); hell.id = 'hmHell';
    var emb  = document.createElement('div'); emb.id  = 'hmEmb';
    for (var i = 0; i < 18; i++) {
      var e = document.createElement('i'), s = 5 + Math.random() * 9;
      e.style.left = (Math.random() * 100) + 'vw';
      e.style.width = s + 'px'; e.style.height = s + 'px';
      e.style.setProperty('--dx', (Math.random() * 120 - 60) + 'px');
      e.style.animationDuration = (4 + Math.random() * 5) + 's';
      e.style.animationDelay = (Math.random() * 5) + 's';
      emb.appendChild(e);
    }
    var sh = document.createElement('div'); sh.id = 'hmShield';
    sh.innerHTML = '<svg viewBox="0 0 46 54" width="46" height="54" xmlns="http://www.w3.org/2000/svg">' +
      '<path d="M23 1 L44 8 V27 C44 40 34 49 23 53 C12 49 2 40 2 27 V8 Z" fill="#8c1408" stroke="#ffb03a" stroke-width="3" stroke-linejoin="round"/>' +
      '</svg><span>\uD83D\uDE08</span>';
    document.body.appendChild(hell); document.body.appendChild(emb); document.body.appendChild(sh);
    void hell.offsetWidth;
    hell.className = 'on'; emb.className = 'on'; sh.className = 'on';
  }
  if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', go); } else { go(); }
})();
</script>
</body>
</html>
