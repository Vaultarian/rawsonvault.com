<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jos's Optical Illusions</title>
  <style>
    body {
      margin: 0;
      font-family: 'Comic Sans MS', 'Trebuchet MS', sans-serif;
      background: #0d0d1a;
      color: #fff;
      text-align: center;
    }
    header { padding: 40px 20px 10px; }
    h1 {
      font-size: 3em;
      margin: 0;
      background: linear-gradient(90deg, #ff4ec7, #4edcff, #ffe14e, #6bff4e);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    p.tag { color: #aaa; font-size: 1.2em; }
    .gallery {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      padding: 30px;
    }

    /* each box sits in a wrapper so the little ✕ can float on top of it */
    .card-wrap { position: relative; }

    .card {
      width: 220px;
      height: 180px;
      background: #1c1c33;
      border-radius: 18px;
      border: 3px solid #4edcff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-decoration: none;
      color: #fff;
      font-size: 1.3em;
      transition: transform 0.15s, box-shadow 0.15s;
      padding: 8px;
      box-sizing: border-box;
    }
    .card:hover {
      transform: scale(1.06) rotate(-1deg);
      box-shadow: 0 0 25px var(--glow, #4edcff);
    }
    .card .emoji { font-size: 3em; }
    .card .title { word-break: break-word; }

    .new-card { border: 3px dashed #6bff4e; color: #6bff4e; }
    .new-card:hover { box-shadow: 0 0 25px #6bff4e; }

    /* the little delete button on YOUR creations */
    .del {
      position: absolute; top: -8px; right: -8px;
      width: 30px; height: 30px; border-radius: 50%;
      border: none; background: #ff4ec7; color: #000;
      font-family: inherit; font-size: 1em; font-weight: bold;
      cursor: pointer; line-height: 30px; padding: 0;
    }
    .del:hover { background: #fff; }

    .mine-label { color: #ffe14e; margin-top: 25px; font-size: 1.3em; }
    footer { padding: 30px; color: #555; }
  </style>
</head>
<body>
  <header>
    <h1>Jos's Optical Illusions</h1>
    <p class="tag">A museum of mind-bending tricks 👁️✨</p>
    <p><a href="../" style="color:#4edcff; text-decoration:none; font-size:1.1em;">⬅ Back to Jos' Projects</a></p>
  </header>

  <div class="gallery" id="gallery">
    <!-- Boxes get added here automatically by the code below -->
  </div>

  <footer>Made by Jos &amp; Dad 🚀</footer>

  <script>
    // 🎨 THE BUILT-IN LIST
    // To add a permanent one, add a line here like the example.
    // { title, emoji, file }
    const ILLUSIONS = [
      { title: "Loading Glitch", emoji: "🌀", file: "illusions/loading.html" },
    ];

    const MUSEUM_KEY = 'jos-museum-creations';   // the ones YOU made
    const gallery = document.getElementById('gallery');

    // pick a bright random colour for each box
    function randomColor() {
      const hue = Math.floor(Math.random() * 360);
      return `hsl(${hue}, 90%, 62%)`;
    }

    // makes one box. Returns the <a> so we can fiddle with it after.
    function makeCard(emoji, title, href, extraClass) {
      const wrap = document.createElement('div');
      wrap.className = 'card-wrap';

      const a = document.createElement('a');
      a.className = 'card' + (extraClass ? ' ' + extraClass : '');
      a.href = href;

      const color = randomColor();
      a.style.borderColor = color;
      a.style.setProperty('--glow', color);

      a.innerHTML = `<div class="emoji">${emoji}</div><div class="title"></div>`;
      a.querySelector('.title').textContent = title;   // safe: no code can sneak in

      wrap.appendChild(a);
      gallery.appendChild(wrap);
      return { wrap, a };
    }

    // ---------- 1. the built-in ones (they live in real files) ----------
    ILLUSIONS.forEach(ill => {
      const { a } = makeCard(ill.emoji, ill.title, ill.file);

      // read the real name from inside the file's <title> tag
      fetch(ill.file)
        .then(r => r.text())
        .then(html => {
          const match = html.match(/<title>(.*?)<\/title>/i);
          if (match && match[1]) a.querySelector('.title').textContent = match[1];
        })
        .catch(() => { /* opening as a plain file can't read other files — keep the backup name */ });
    });

    // ---------- 2. THE NEW BIT: everything you made yourself ----------
    function loadMyCreations() {
      const list = JSON.parse(localStorage.getItem(MUSEUM_KEY) || '[]');

      list.forEach(item => {
        const { wrap } = makeCard(item.emoji, item.title, 'view.html?id=' + item.id);

        // a little ✕ so you can throw one away
        const del = document.createElement('button');
        del.className = 'del';
        del.textContent = '✕';
        del.title = 'Delete this one';
        del.onclick = (e) => {
          e.preventDefault();
          if (confirm('Delete "' + item.title + '" from the museum?')) {
            const now = JSON.parse(localStorage.getItem(MUSEUM_KEY) || '[]');
            localStorage.setItem(MUSEUM_KEY, JSON.stringify(now.filter(c => c.id !== item.id)));
            location.reload();
          }
        };
        wrap.appendChild(del);
      });
    }
    loadMyCreations();

    // ---------- 3. the "make your own" button — always last ----------
    makeCard('➕', 'Make Your Own', 'make-new.html', 'new-card');
  </script>
<!-- ===== HARD MODE (added 2026-09-05) ===== -->
<style>
#hmHell{position:fixed;inset:0;pointer-events:none;z-index:2147482000;background:rgba(217,79,58,.30);opacity:0;transition:opacity 1s ease}
#hmHell.on{opacity:1}
#hmEmb{position:fixed;inset:0;pointer-events:none;z-index:2147482001;overflow:hidden;opacity:0;transition:opacity 1s ease}
#hmEmb.on{opacity:1}
#hmEmb i{position:absolute;bottom:-20px;border-radius:50%;background:radial-gradient(circle,#fff3b0 0%,#ffab2b 40%,rgba(255,90,20,0) 75%);box-shadow:0 0 9px 3px rgba(255,150,40,.5);animation:hmRise linear infinite}
@keyframes hmRise{0%{transform:translate(0,0) scale(1);opacity:0}8%{opacity:.95}50%{transform:translate(var(--dx),-50vh) scale(.7);opacity:.8}100%{transform:translate(calc(var(--dx) * -0.6),-104vh) scale(.2);opacity:0}}
#hmShield{position:fixed;top:12px;right:12px;z-index:2147483000;width:46px;height:54px;pointer-events:none;opacity:0;transition:opacity .6s ease;filter:drop-shadow(0 0 9px rgba(255,80,20,.95))}
#hmShield.on{opacity:1;animation:hmPulse 1.6s ease-in-out infinite alternate}
@keyframes hmPulse{from{transform:scale(1)}to{transform:scale(1.08)}}
#hmShield span{position:absolute;left:0;right:0;top:44%;transform:translateY(-50%);text-align:center;font-size:21px;line-height:1}
</style>
<script>
(function(){
  try { if (sessionStorage.getItem('jos-hard-mode') !== 'on') return; } catch(e) { return; }
  function go(){
    var hell = document.createElement('div'); hell.id = 'hmHell';
    var emb  = document.createElement('div'); emb.id  = 'hmEmb';
    for (var i = 0; i < 18; i++) {
      var e = document.createElement('i'), s = 5 + Math.random() * 9;
      e.style.left = (Math.random() * 100) + 'vw';
      e.style.width = s + 'px'; e.style.height = s + 'px';
      e.style.setProperty('--dx', (Math.random() * 120 - 60) + 'px');
      e.style.animationDuration = (4 + Math.random() * 5) + 's';
      e.style.animationDelay = (Math.random() * 5) + 's';
      emb.appendChild(e);
    }
    var sh = document.createElement('div'); sh.id = 'hmShield';
    sh.innerHTML = '<svg viewBox="0 0 46 54" width="46" height="54" xmlns="http://www.w3.org/2000/svg">' +
      '<path d="M23 1 L44 8 V27 C44 40 34 49 23 53 C12 49 2 40 2 27 V8 Z" fill="#8c1408" stroke="#ffb03a" stroke-width="3" stroke-linejoin="round"/>' +
      '</svg><span>\uD83D\uDE08</span>';
    document.body.appendChild(hell); document.body.appendChild(emb); document.body.appendChild(sh);
    void hell.offsetWidth;
    hell.className = 'on'; emb.className = 'on'; sh.className = 'on';
  }
  if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', go); } else { go(); }
})();
</script>
<!-- ===== HARD MODE: tools cannot be trusted ===== -->
<style>
#hmNo{position:fixed;inset:0;z-index:2147483600;display:none;align-items:center;justify-content:center;background:rgba(10,0,0,.82);
      color:#ff3b1a;font-family:'Fredoka One',Impact,sans-serif;font-size:clamp(38px,11vw,120px);letter-spacing:4px;text-align:center;
      text-shadow:0 0 26px rgba(255,60,20,.95);cursor:pointer}
#hmNo.on{display:flex}
</style>
<script>
(function () {
  try { if (sessionStorage.getItem('jos-hard-mode') !== 'on') return; } catch (e) { return; }
  function go() {
    var veil = document.createElement('div');
    veil.id = 'hmNo';
    veil.textContent = 'NO ANSWAR';
    veil.addEventListener('click', function () { veil.classList.remove('on'); });
    document.body.appendChild(veil);

    var cooling = false;
    document.addEventListener('click', function (e) {
      if (e.target === veil || cooling) return;
      if (Math.random() >= 0.25) return;          /* only one click in four is sabotaged */
      cooling = true;
      setTimeout(function () { cooling = false; }, 1500);
      var r = Math.random();
      if (r < 0.34) {
        veil.classList.add('on');                 /* refuses to answer */
        setTimeout(function () { veil.classList.remove('on'); }, 1600);
      } else if (r < 0.67) {
        window.location.reload();                 /* starts over */
      } else {
        window.location.href = (window.location.pathname.indexOf('marble_run') > -1) ? './' : '../';
      }
    }, true);
  }
  if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', go); } else { go(); }
})();
</script>
</body>
</html>
