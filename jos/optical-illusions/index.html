<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jos's Optical Illusions</title>
  <style>
    body {
      margin: 0;
      font-family: 'Comic Sans MS', 'Trebuchet MS', sans-serif;
      background: #0d0d1a;
      color: #fff;
      text-align: center;
    }
    header { padding: 40px 20px 10px; }
    h1 {
      font-size: 3em;
      margin: 0;
      background: linear-gradient(90deg, #ff4ec7, #4edcff, #ffe14e, #6bff4e);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    p.tag { color: #aaa; font-size: 1.2em; }
    .gallery {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      padding: 30px;
    }

    /* each box sits in a wrapper so the little ✕ can float on top of it */
    .card-wrap { position: relative; }

    .card {
      width: 220px;
      height: 180px;
      background: #1c1c33;
      border-radius: 18px;
      border: 3px solid #4edcff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-decoration: none;
      color: #fff;
      font-size: 1.3em;
      transition: transform 0.15s, box-shadow 0.15s;
      padding: 8px;
      box-sizing: border-box;
    }
    .card:hover {
      transform: scale(1.06) rotate(-1deg);
      box-shadow: 0 0 25px var(--glow, #4edcff);
    }
    .card .emoji { font-size: 3em; }
    .card .title { word-break: break-word; }

    .new-card { border: 3px dashed #6bff4e; color: #6bff4e; }
    .new-card:hover { box-shadow: 0 0 25px #6bff4e; }

    /* the little delete button on YOUR creations */
    .del {
      position: absolute; top: -8px; right: -8px;
      width: 30px; height: 30px; border-radius: 50%;
      border: none; background: #ff4ec7; color: #000;
      font-family: inherit; font-size: 1em; font-weight: bold;
      cursor: pointer; line-height: 30px; padding: 0;
    }
    .del:hover { background: #fff; }

    .mine-label { color: #ffe14e; margin-top: 25px; font-size: 1.3em; }
    footer { padding: 30px; color: #555; }
  </style>
</head>
<body>
  <header>
    <h1>Jos's Optical Illusions</h1>
    <p class="tag">A museum of mind-bending tricks 👁️✨</p>
    <p><a href="../" style="color:#4edcff; text-decoration:none; font-size:1.1em;">⬅ Back to Jos' Projects</a></p>
  </header>

  <div class="gallery" id="gallery">
    <!-- Boxes get added here automatically by the code below -->
  </div>

  <footer>Made by Jos &amp; Dad 🚀</footer>

  <script>
    // 🎨 THE BUILT-IN LIST
    // To add a permanent one, add a line here like the example.
    // { title, emoji, file }
    const ILLUSIONS = [
      { title: "Loading Glitch", emoji: "🌀", file: "illusions/loading.html" },
    ];

    const MUSEUM_KEY = 'jos-museum-creations';   // the ones YOU made
    const gallery = document.getElementById('gallery');

    // pick a bright random colour for each box
    function randomColor() {
      const hue = Math.floor(Math.random() * 360);
      return `hsl(${hue}, 90%, 62%)`;
    }

    // makes one box. Returns the <a> so we can fiddle with it after.
    function makeCard(emoji, title, href, extraClass) {
      const wrap = document.createElement('div');
      wrap.className = 'card-wrap';

      const a = document.createElement('a');
      a.className = 'card' + (extraClass ? ' ' + extraClass : '');
      a.href = href;

      const color = randomColor();
      a.style.borderColor = color;
      a.style.setProperty('--glow', color);

      a.innerHTML = `<div class="emoji">${emoji}</div><div class="title"></div>`;
      a.querySelector('.title').textContent = title;   // safe: no code can sneak in

      wrap.appendChild(a);
      gallery.appendChild(wrap);
      return { wrap, a };
    }

    // ---------- 1. the built-in ones (they live in real files) ----------
    ILLUSIONS.forEach(ill => {
      const { a } = makeCard(ill.emoji, ill.title, ill.file);

      // read the real name from inside the file's <title> tag
      fetch(ill.file)
        .then(r => r.text())
        .then(html => {
          const match = html.match(/<title>(.*?)<\/title>/i);
          if (match && match[1]) a.querySelector('.title').textContent = match[1];
        })
        .catch(() => { /* opening as a plain file can't read other files — keep the backup name */ });
    });

    // ---------- 2. THE NEW BIT: everything you made yourself ----------
    function loadMyCreations() {
      const list = JSON.parse(localStorage.getItem(MUSEUM_KEY) || '[]');

      list.forEach(item => {
        const { wrap } = makeCard(item.emoji, item.title, 'view.html?id=' + item.id);

        // a little ✕ so you can throw one away
        const del = document.createElement('button');
        del.className = 'del';
        del.textContent = '✕';
        del.title = 'Delete this one';
        del.onclick = (e) => {
          e.preventDefault();
          if (confirm('Delete "' + item.title + '" from the museum?')) {
            const now = JSON.parse(localStorage.getItem(MUSEUM_KEY) || '[]');
            localStorage.setItem(MUSEUM_KEY, JSON.stringify(now.filter(c => c.id !== item.id)));
            location.reload();
          }
        };
        wrap.appendChild(del);
      });
    }
    loadMyCreations();

    // ---------- 3. the "make your own" button — always last ----------
    makeCard('➕', 'Make Your Own', 'make-new.html', 'new-card');
  </script>
</body>
</html>
