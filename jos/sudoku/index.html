<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sudoku</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:#14213d;color:#fff;font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center}
  .screen{display:none;flex-direction:column;align-items:center;gap:18px;padding:16px;text-align:center}
  .screen.on{display:flex}
  h1{font-size:84px;margin:0;letter-spacing:8px;background:linear-gradient(90deg,#fca311,#ffe29a,#fca311);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 4s linear infinite;filter:drop-shadow(0 0 18px rgba(252,163,17,.45))}
  @keyframes shine{to{background-position:200% 0}}
  #start{position:relative;z-index:2}
  #playBtn{font-size:30px;padding:16px 44px;box-shadow:0 0 28px rgba(252,163,17,.5);animation:pulse 2s ease-in-out infinite}
  @keyframes pulse{50%{transform:scale(1.07)}}
  body{background:radial-gradient(circle at 50% 40%,#22345f,#0d1630 70%)}
  #bg{position:fixed;inset:0;overflow:hidden;z-index:1;display:none}
  #bg.on{display:block}
  .fl{position:absolute;animation:drift var(--d) ease-in-out infinite alternate;animation-delay:var(--s)}
  @keyframes drift{from{transform:translate(0,0) rotate(var(--r0))}to{transform:translate(var(--dx),var(--dy)) rotate(var(--r1))}}
  .num{font-size:var(--sz);font-weight:800;color:rgba(252,163,17,.55);pointer-events:none}
  @property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
  .mini{display:grid;grid-template-columns:repeat(2,1fr);width:72px;height:72px;gap:4px;padding:5px;background:linear-gradient(145deg,#ffffff,#cfd9f2);border-radius:14px;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.35),0 0 14px rgba(160,190,255,.35);transition:background .6s,box-shadow .6s,filter .2s}
  .mini:hover{filter:brightness(1.1)}
  .mini div{display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;color:#1b2b55;background:linear-gradient(160deg,#f4f6fc,#dfe5f5);border-radius:8px;position:relative;z-index:1}
  .mini div.empty{background:#fff3d6;box-shadow:inset 0 0 0 2px #fca311;color:transparent}
  .mini div.popnum{color:#0b7a33;animation:popnum .5s cubic-bezier(.2,1.6,.4,1)}
  @keyframes popnum{0%{transform:scale(0)}60%{transform:scale(1.9)}100%{transform:scale(1)}}
  .mini .sweep{position:absolute;inset:0;border-radius:14px;z-index:2;pointer-events:none;background:conic-gradient(from 0deg,rgba(63,209,107,.88) calc(var(--a) - 50deg),rgba(63,209,107,0) var(--a));animation:sweepa 1.1s linear forwards,sweepout .5s 1.1s ease forwards}
  @keyframes sweepout{to{opacity:0}}
  @keyframes sweepa{from{--a:0deg}to{--a:410deg}}
  .mini.ok{background:#3fd16b;box-shadow:0 0 26px rgba(63,209,107,.8)}
  .mini.ok div{background:#c9f2d3}
  .mini div{transition:background .5s,transform .22s ease}
  @keyframes bump{0%{transform:scale(.4)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
  .mini div.bump{animation:bump .35s ease}
  .mini .pip{position:absolute;left:50%;top:50%;width:6px;height:15px;margin:-7px 0 0 -3px;border-radius:3px;background:#3fd16b;box-shadow:0 0 8px #3fd16b;z-index:3;pointer-events:none;transform:translate(var(--x),var(--y)) rotate(var(--ang)) scale(0);animation:pippop .3s var(--del) forwards}
  @keyframes pippop{0%{transform:translate(var(--x),var(--y)) rotate(var(--ang)) scale(0)}60%{transform:translate(var(--x),var(--y)) rotate(var(--ang)) scale(1.6)}100%{transform:translate(var(--x),var(--y)) rotate(var(--ang)) scale(1)}}
  @keyframes sweepin{from{opacity:0}to{opacity:1}}
  @keyframes sweepb{from{--a:410deg}to{--a:0deg}}
  @keyframes pipb{0%{transform:translate(var(--x),var(--y)) rotate(var(--ang)) scale(1)}40%{transform:translate(var(--x),var(--y)) rotate(var(--ang)) scale(1.6)}100%{transform:translate(var(--x),var(--y)) rotate(var(--ang)) scale(0)}}
  @keyframes popnumb{0%{transform:scale(1)}40%{transform:scale(1.9)}100%{transform:scale(0)}}
  .mini.rev .sweep{animation:sweepin .5s ease both,sweepb 1.1s .5s linear both}
  .mini.rev .pip{animation:pipb .3s var(--rdel) both}
  .mini div.unpop{animation:popnumb .5s 1.6s both;color:#0b7a33}
  #pullLock{position:fixed;left:0;right:0;bottom:6px;text-align:center;font-size:40px;opacity:0;pointer-events:none;z-index:5}
  #swirlLock{position:fixed;inset:0;display:none;align-items:center;justify-content:center;font-size:140px;pointer-events:none;z-index:30}
  #hint{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:10;pointer-events:none}
  #hint.on{display:flex}
  #hintBox{width:170px;height:170px;border-radius:14px;border:4px solid #fff;color:#fff;font-size:100px;font-weight:800;display:flex;align-items:center;justify-content:center;
    background-color:#22345f;background-image:linear-gradient(rgba(255,255,255,.35) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.35) 2px,transparent 2px);background-size:56.6px 56.6px;animation:hintfade 1.4s ease forwards}
  @keyframes hintfade{0%{opacity:0;transform:scale(.8)}15%{opacity:1;transform:scale(1)}75%{opacity:1}100%{opacity:0}}
  button{font:inherit;cursor:pointer;border:0;border-radius:12px;background:#fca311;color:#14213d;font-weight:700;padding:12px 24px;font-size:20px}
  button:hover{filter:brightness(1.1)}
  #levelScreen{position:fixed;inset:0;justify-content:flex-start;gap:10px;padding:10px}
  #levels{display:grid;grid-template-columns:repeat(10,1fr);grid-auto-rows:1fr;gap:6px;width:100%;flex:1;min-height:0}
  #levels button{height:100%;font-size:clamp(14px,3vw,34px);padding:0;border-radius:10px}
  #levels button.hinting{color:#fff;background-color:#22345f;background-image:linear-gradient(rgba(255,255,255,.4) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.4) 2px,transparent 2px);background-size:33.3% 33.3%;box-shadow:0 0 0 3px #fff inset}
  #levels button small{display:block;font-size:clamp(8px,1.2vw,14px);font-weight:600;line-height:1.1}
  #levels button.locked{background:#3a4468;color:#7c86a8}
  #levels button.done{background:#7bd88f}
  #loading{position:fixed;inset:0;background:#050505;z-index:20;justify-content:center}
  #loadCanvas{position:absolute;inset:0;width:100%;height:100%}
  #pct{position:relative;z-index:2;text-shadow:0 0 10px rgba(0,85,255,.6)}
  .bar{width:300px;height:26px;background:#2b3a67;border-radius:13px;overflow:hidden}
  #fill{height:100%;width:0;background:#fca311}
  #pct{font-size:28px;font-weight:700}
  #grid{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));grid-template-rows:repeat(9,minmax(0,1fr));width:min(92vw,450px);aspect-ratio:1;border:3px solid #fff;background:#fff}
  .cell{transition:background .12s,color .5s;display:flex;align-items:center;justify-content:center;font-size:clamp(18px,5vw,30px);color:#14213d;background:#fff;border:1px solid #bbb;cursor:pointer;user-select:none}
  .cell.r{border-right:3px solid #14213d}
  .cell.b{border-bottom:3px solid #14213d}
  .cell.given{background:#e5e5e5;font-weight:800}
  .cell.sel{background:#ffd98a}
  .cell.bad{color:#d00000;background:#ffd6d6}
  .cell.mine{color:#1d5fd1;font-weight:700}
  #padRow{display:flex;align-items:center;gap:12px;width:min(92vw,450px)}
  #pad{display:grid;grid-template-columns:repeat(9,1fr);gap:5px;flex:1}
  #pad button{padding:10px 0;font-size:22px;border-radius:10px;transition:background .25s,box-shadow .25s,transform .15s}
  #pad button.armed{background:#ffe14d;box-shadow:0 0 16px 5px rgba(255,214,0,.85);transform:translateY(-3px)}
  #pad button.gray{background:#3a4468;color:#7c86a8;box-shadow:none;cursor:default;transform:none}
  #tools{display:flex;gap:10px}
  .tool{display:flex;align-items:center;justify-content:center;width:72px;height:54px;padding:0;border-radius:14px}
  .tool svg{display:block;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}
  .tool.on{background:#7bd88f}
  #gridWrap{position:relative;margin-bottom:24px}
  #axisL{position:absolute;right:calc(100% + 6px);top:0;height:100%;display:grid;grid-template-rows:repeat(9,1fr)}
  #axisB{position:absolute;top:calc(100% + 4px);left:0;width:100%;display:grid;grid-template-columns:repeat(9,1fr)}
  #axisL i,#axisB i{font-style:normal;font-weight:700;font-size:16px;color:#9aa0b5;display:flex;align-items:center;justify-content:center}
  #hintBtn{position:relative;flex:none;width:52px;height:46px}
  #bulbBtn{width:100%;height:100%;padding:0;border-radius:10px;display:flex;align-items:center;justify-content:center}
  #plusBtn{position:absolute;top:-9px;right:-9px;width:24px;height:24px;border-radius:50%;padding:0;font-size:18px;line-height:22px;background:#3fd16b;color:#14213d;border:2px solid #14213d}
  #helpList .blankrow{display:flex;align-items:center;justify-content:center;gap:8px;font-size:18px;font-weight:700;background:#3a4468;color:#7c86a8;border-radius:10px;padding:10px}
  #helpList .blankrow input{width:56px;font:inherit;text-align:center;border-radius:8px;border:0;padding:4px;background:#e9ebf2;color:#14213d}
  .cell.hinted{position:relative;z-index:2;animation:hintpulse 1s ease-in-out 4}
  @keyframes hintpulse{50%{background:#ffe14d;box-shadow:0 0 14px 4px rgba(255,214,0,.9);transform:scale(1.12)}}
  #helpMenu,#confirmBox{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:30}
  #helpMenu.on,#confirmBox.on{display:flex}
  #confirmBox{z-index:31}
  .hbox{background:#1d2a4f;border-radius:16px;padding:20px;width:min(90vw,360px);display:flex;flex-direction:column;gap:10px;color:#fff;text-align:center}
  .htitle{font-size:24px;font-weight:700}
  #helpList button{width:100%;margin-bottom:8px;font-size:18px;padding:10px;border-radius:10px;display:flex;justify-content:space-between;gap:8px}
  #helpList .hrow{display:flex;gap:8px;margin-bottom:8px}
  #helpList .hrow button{margin:0}
  #helpList .hrow .use{flex:1;display:flex;justify-content:space-between;align-items:center;gap:8px;background:#fca311;color:#14213d;font-weight:700;font-size:18px;padding:10px;border-radius:10px;cursor:pointer}
  #helpList .hrow .use.off{background:#3a4468;color:#7c86a8;cursor:default}
  #helpList .hrow .buy{width:auto;flex:none;background:#3fd16b;font-size:14px;padding:6px 10px;white-space:nowrap;justify-content:center}
  #helpList .use input{width:46px;font:inherit;text-align:center;border-radius:6px;border:0;padding:2px;background:#e9ebf2;color:#14213d}
  #helpList button:disabled{background:#3a4468;color:#7c86a8;cursor:default}
  #confirmText{font-size:20px;font-weight:700}
  .crow{display:flex;gap:10px;justify-content:center}
  .crow button{font-size:20px;padding:10px 24px;border-radius:10px}
  #rule{width:min(92vw,450px);min-height:26px;font-size:17px;font-weight:700;color:#ff9a9a;text-align:center;opacity:0;transition:opacity .5s}
  #rule.show{opacity:1}
  #zap{position:relative;flex:none;width:62px;height:34px;border-radius:17px;padding:0;background:#9aa0b5;overflow:visible;transition:background .3s}
  #zap .knob{position:absolute;left:3px;top:3px;width:28px;height:28px;border-radius:50%;background:#e9ebf2;color:#5d6378;display:flex;align-items:center;justify-content:center;transition:left .25s,background .25s,color .25s}
  #zap.on{background:#3fd16b}
  #zap.on .knob{left:31px;background:#fff9d6;color:#ffd400}
  #zap.sparking .knob svg{animation:spark .7s}
  @keyframes spark{0%{transform:scale(1)}15%{transform:scale(1.7) rotate(-12deg);filter:drop-shadow(0 0 6px #ffd400)}30%{transform:scale(.9) rotate(8deg)}45%{transform:scale(1.5);filter:drop-shadow(0 0 8px #ffd400)}100%{transform:scale(1);filter:none}}
  #zap i.sp{position:absolute;left:43px;top:12px;width:3px;height:9px;border-radius:2px;background:#ffd400;opacity:0;pointer-events:none}
  #zap.sparking i.sp{animation:sp .6s ease-out}
  @keyframes sp{0%{opacity:1;transform:rotate(var(--a)) translateY(-8px)}100%{opacity:0;transform:rotate(var(--a)) translateY(-26px)}}
  #coinBar{position:fixed;top:14px;right:18px;z-index:40;display:none;align-items:center;gap:8px;background:rgba(20,33,61,.9);border:2px solid #fca311;border-radius:24px;padding:4px 16px 4px 8px;font-weight:800;font-size:22px;color:#fff}
  #coinBar.on{display:flex}
  .coin{display:inline-block;width:26px;height:26px;border-radius:50%;box-sizing:border-box;background:radial-gradient(circle at 35% 30%,#fff3a0,#ffc400 55%,#c98a00);border:2px solid #a56b00}
  .flycoin{position:fixed;z-index:60;pointer-events:none}
  .popfx{position:fixed;z-index:60;pointer-events:none;width:30px;height:30px;border-radius:50%;border:3px solid #ffe14d;box-shadow:0 0 10px #ffc400}
  #plusTen{position:absolute;right:14px;top:100%;color:#3fd16b;font-weight:800;font-size:24px;opacity:0;pointer-events:none}
  #plusTen.go{animation:plusfade 1.5s ease-out}
  @keyframes plusfade{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-28px)}}
  #doneTab{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:35}
  #doneTab.on{display:flex}
  #doneTab .dcard{background:#1d2a4f;border:3px solid #fca311;border-radius:22px;padding:26px 34px;text-align:center;color:#fff;box-shadow:0 10px 40px rgba(0,0,0,.5);animation:tabin .35s cubic-bezier(.3,1.5,.6,1)}
  @keyframes tabin{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
  #doneTab h2{margin:0 0 4px;font-size:30px}
  #doneTab .drow{display:flex;gap:12px;justify-content:center;margin-top:90px}
  #confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:36}
  #rewindWrap{display:none;justify-content:center;padding:6px}
  #game.cv #tools,#game.cv #padRow{display:none}
  #game.cv #rewindWrap{display:flex}
  #rewindBtn{width:88px;height:88px;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center;transition:opacity .6s}
  #rewindBtn.gone{opacity:0;pointer-events:none}
  #rewindBtn:hover svg{animation:spinrw .8s linear infinite}
  @keyframes spinrw{to{transform:rotate(-360deg)}}
  .fadein{animation:fadein .9s ease-out}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  .cell.fadeout{color:transparent !important}
  .cell.helped{color:#e0a800;font-weight:800}
  .cell.hold{position:relative;z-index:2;background:#7be59a;box-shadow:0 0 12px 3px rgba(63,209,107,.9)}
  .cell.flash{position:relative;z-index:2;animation:cellflash .9s ease-out}
  @keyframes cellflash{0%{transform:scale(1)}18%{background:#3fd16b;transform:scale(1.18);box-shadow:0 0 14px 3px rgba(63,209,107,.9)}70%{background:#7be59a;transform:scale(1.05);box-shadow:0 0 8px rgba(63,209,107,.6)}100%{transform:scale(1);box-shadow:none}}
  .notes{display:grid;grid-template-columns:repeat(3,1fr);width:100%;height:100%;font-size:clamp(7px,1.6vw,11px);color:#555;font-weight:600}
  .notes i{font-style:normal;display:flex;align-items:center;justify-content:center}
  #msg{font-size:24px;min-height:32px;color:#7bd88f;font-weight:700}
  .top{display:flex;gap:12px;align-items:center}
</style>
</head>
<body>

<div id="bg" class="on"></div>

<div id="start" class="screen on">
  <h1>SUDOKU</h1>
  <div>Put 1 to 9 in every row, column and box.</div>
  <button id="playBtn">▶ Play</button>
</div>

<div id="pullLock">🔒</div>
<div id="swirlLock">🔒</div>

<div id="levelScreen" class="screen">
  <div class="top" style="width:100%"><button id="backStart">Back</button><div style="font-size:26px;font-weight:700">Pick a level</div></div>
  <div id="levels"></div>
</div>

<div id="loading" class="screen"><canvas id="loadCanvas"></canvas><div id="pct">0%</div></div>

<div id="coinBar"><span class="coin"></span><b id="coinNum">0</b><span id="plusTen">+10</span></div>
<div id="doneTab"><div class="dcard"><h2 id="doneTitle">Level completed!</h2><div class="drow"><button id="nextBtn">Next level</button><button id="toLevelsBtn">Levels</button></div></div></div>

<div id="helpMenu"><div class="hbox"><div class="htitle">Hints</div><div id="helpCoins" style="font-size:17px;color:#ffe14d"></div><div id="helpList"></div><button id="helpClose">Close</button></div></div>
<div id="confirmBox"><div class="hbox"><div id="confirmText"></div><div class="crow"><button id="confirmYes">Yes</button><button id="confirmNo">No</button></div></div></div>

<div id="game" class="screen">
  <div class="top"><button id="backLevels">Levels</button><div id="title" style="font-size:24px;font-weight:700"></div></div>
  <div id="gridWrap"><div id="axisL"></div><div id="grid"></div><div id="axisB"></div></div>
  <div id="rule"></div>
  <div id="tools">
    <button id="pencilBtn" class="tool" title="Pencil notes" aria-label="Pencil notes"><svg viewBox="0 0 32 32" width="42" height="42" aria-hidden="true"><g transform="rotate(45 16 16)" stroke="#14213d" stroke-opacity=".35" stroke-width=".6" stroke-linejoin="round">
        <rect x="12" y="1.5" width="8" height="5" rx="1.8" fill="#f48a9c"/>
        <rect x="12" y="6.5" width="8" height="3" fill="#c3c9d8"/>
        <path d="M12 9.5h8V23h-8z" fill="#ffd23f"/><path d="M16 9.5h4V23h-4z" fill="#f0b400" stroke="none"/>
        <path d="M12 23h8l-4 7.5z" fill="#f4d6a8"/><path d="M14.6 27.6h2.8L16 30.5z" fill="#2f3347" stroke="none"/>
        <path d="M13.3 10v12.5" stroke="#fff" stroke-opacity=".55" stroke-width="1" stroke-linecap="round"/>
      </g></svg></button>
    <button id="eraseBtn" class="tool" title="Eraser" aria-label="Eraser"><svg viewBox="0 0 32 32" width="42" height="42" aria-hidden="true"><g transform="rotate(-30 16 16.5)" stroke="#14213d" stroke-opacity=".35" stroke-width=".6" stroke-linejoin="round">
        <path d="M14 10.5h10a3.2 3.2 0 0 1 3.2 3.2v5.1a3.2 3.2 0 0 1-3.2 3.2H14z" fill="#f48a9c"/>
        <path d="M8.2 10.5H14v11.5H8.2A3.2 3.2 0 0 1 5 18.8v-5.1a3.2 3.2 0 0 1 3.2-3.2z" fill="#5b8def"/>
        <path d="M8 12.2h4.5" stroke="#fff" stroke-opacity=".6" stroke-width="1.1" stroke-linecap="round"/>
        <path d="M16.5 12.2H23" stroke="#fff" stroke-opacity=".55" stroke-width="1.1" stroke-linecap="round"/>
      </g></svg></button>
  </div>
  <div id="rewindWrap"><button id="rewindBtn" aria-label="Start this level again" title="Start again"><svg viewBox="0 0 24 24" width="50" height="50" fill="none" stroke="#14213d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg></button></div>
  <div id="padRow">
    <div id="hintBtn"><button id="bulbBtn" aria-label="Get a hint" title="Get a hint"><svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path fill="#ffe14d" stroke="#14213d" stroke-width="1.3" stroke-linejoin="round" d="M12 2.5a6.5 6.5 0 0 0-3.7 11.9c.6.5.9 1.1.9 1.8v.8h5.6v-.8c0-.7.3-1.3.9-1.8A6.5 6.5 0 0 0 12 2.5z"/><path fill="#14213d" d="M9.2 18.5h5.6v1.2a1.3 1.3 0 0 1-1.3 1.3h-3a1.3 1.3 0 0 1-1.3-1.3z"/></svg></button><button id="plusBtn" aria-label="More hints" title="More hints">+</button></div>
    <div id="pad"></div>
    <button id="zap" aria-label="Lightning mode"><span class="knob"><svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg></span><i class="sp" style="--a:0deg"></i><i class="sp" style="--a:72deg"></i><i class="sp" style="--a:144deg"></i><i class="sp" style="--a:216deg"></i><i class="sp" style="--a:288deg"></i></button>
  </div>
  <div id="msg"></div>
</div>

<script src="gen.js"></script>
<script>
const LEVELS = 100;
// Level 1 has the most starting numbers (34); every 6 levels it gets one fewer, down to 18 at level 100.
const givensFor = l => Math.max(18, 34 - Math.floor((l - 1) / 6));
let unlocked = 1, doneSet = {};
let savedRecs = {};
try { savedRecs = JSON.parse(localStorage.sudokuSaved || '{}'); } catch (e) {}
try { unlocked = +localStorage.sudokuUnlocked || 1; doneSet = JSON.parse(localStorage.sudokuDone || '{}'); } catch (e) {}

const $ = id => document.getElementById(id);
// The address bar follows the screen: #/levels, then #/levels/T1 (tutorial 1) or #/levels/L1 (level 1).
const tagOf = l => l <= 3 ? 'T' + l : 'L' + (l - 3);
function levelOfTag(t) {
  const m = /^([TL])(\d+)$/i.exec(t || ''); if (!m) return 0;
  const n = +m[2], tut = m[1].toUpperCase() === 'T';

  cv.width = innerWidth; cv.height = innerHeight;
  const cx = cv.width / 2, cy = cv.height / 2, R = 160;

  const t0 = Date.now(), total = 1500;

  // The sudoku is made right now, while the dots go round.
  setTimeout(() => { const rec = savedRecs[l]; made = rec ? { puzzle: rec.puzzle, solution: rec.vals, rec } : makeSudoku(givensFor(l)); }, 50);
  (function loop() {
    const f = Math.min(1, (Date.now() - t0) / total);
    // 0% -> 50% -> 90% -> 100%
    let p = f < 0.35 ? (f / 0.35) * 50 : f < 0.8 ? 50 + ((f - 0.35) / 0.45) * 40 : 90 + ((f - 0.8) / 0.2) * 10;

    emit += 0.04 + shown * 0.003;
    for (const d of parts) {
      d.a += d.v; const x = cx + Math.cos(d.a) * R, y = cy + Math.sin(d.a) * R;
      d.h.push([x, y]); if (d.h.length > 6) d.h.shift();

// A good number glows green. Finish a row, column or box and green spreads out along it from the square you just filled.
function flash(k, ms) {

  c.style.animationDelay = ms + 'ms'; c.classList.add('flash');
  c.addEventListener('animationend', () => { c.classList.remove('flash'); c.style.animationDelay = ''; }, { once: true });
}
// Green runs along three squares at a time: when the third lights up, the first goes out, and so on to the end.
const WAVE = 250, TAIL = 3;   // milliseconds between squares; each square stays green until the third one after it lights
function hold(k, onAt, offAt) {

  setTimeout(() => { c.glow = Math.max(0, (c.glow || 1) - 1); if (!c.glow) c.classList.remove('hold'); }, offAt);
}
// steps: Map of square -> how many steps from the start (0 = the square you put in, or the middle).
function wave(steps, after) {
  const last = Math.max(...steps.values());
  steps.forEach((st, k) => hold(k, st * WAVE, (st + TAIL) * WAVE));
  if (after) setTimeout(after, (last + TAIL) * WAVE + 250);
}
const boardFull = () => { for (let i = 0; i < 81; i++) if (!value(i) || isBad(i)) return false; return true; };
function celebrate(i) {
  if (!value(i) || isBad(i)) return;
  if (boardFull()) return;                      // the whole-board wave (from the middle) takes over
  const r = i / 9 | 0, col = i % 9;
  const row = [], column = [], box = [];
  const br = r - r % 3, bc = col - col % 3;
  for (let k = 0; k < 9; k++) { row.push(r * 9 + k); column.push(k * 9 + col); box.push((br + (k / 3 | 0)) * 9 + bc + k % 3); }
  const complete = arr => { const set = new Set(arr.map(value)); return !set.has(0) && set.size === 9 && arr.every(k => !isBad(k)); };
  const steps = new Map();
  [row, column, box].filter(complete).forEach(arr => arr.forEach(k => {
    const d = Math.max(Math.abs((k / 9 | 0) - r), Math.abs(k % 9 - col));   // 0 = the square you just put in
    steps.set(k, Math.min(d, steps.has(k) ? steps.get(k) : d));
  }));
  if (!steps.size) { flash(i, 0); return; }     // just one good number: the quick green glow
  wave(steps);
}

// when all nine of a number are in (and right), its button whirls away and goes gray
function updateDigits() {
  for (let n = 1; n <= 9; n++) {
    let count = 0, ok = true;
    for (let i = 0; i < 81; i++) if (value(i) === n) { count++; if (isBad(i)) ok = false; }
    const complete = count === 9 && ok;
    if (complete && !digitDone[n]) { digitDone[n] = true; if (armed === n) armed = 0; swirlDigit(n); }
    else if (!complete && digitDone[n]) digitDone[n] = false;
  }
  paintPad();
}
function swirlDigit(n) {
  const btn = padBtns[n - 1], r = btn.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  const pic = document.createElement('canvas'); pic.width = Math.round(r.width * dpr); pic.height = Math.round(r.height * dpr);
  const c = pic.getContext('2d');
  c.fillStyle = '#fca311'; c.beginPath(); c.roundRect(0, 0, pic.width, pic.height, 10 * dpr); c.fill();
  c.fillStyle = '#14213d'; c.font = '700 ' + (22 * dpr) + 'px system-ui,sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText(String(n), pic.width / 2, pic.height / 2 + dpr);
  whirl(pic, r.left, r.top, r.width, r.height, { intro: false, hold: 0, outro: true, ms: 900 });
}

function checkWin() {
  if (won || !boardFull()) return;
  won = true;
  coinShown = coins;                                   // the counter stays on the old number until the coins arrive
  if ((!cheated || forceCoins) && !replay) coins += 10;
  doneSet[level] = 1;
  savedRecs[level] = { puzzle: puzzle.slice(), vals: Array.from({ length: 81 }, (_, i) => value(i)), helped: helped.map(Boolean) };
  try { localStorage.sudokuSaved = JSON.stringify(savedRecs); } catch (e) {}
  unlocked = Math.min(LEVELS, Math.max(unlocked, level + 1));
  try { localStorage.sudokuUnlocked = unlocked; localStorage.sudokuDone = JSON.stringify(doneSet); } catch (e) {}
  saveCoins(); $('msg').textContent = '';
  // green spreads out from the middle square, ring by ring, then the message tab comes up
  const steps = new Map();
  for (let k = 0; k < 81; k++) steps.set(k, Math.max(Math.abs((k / 9 | 0) - 4), Math.abs(k % 9 - 4)));
  wave(steps, showDone);
}

// ---- The "Level completed" tab: confetti, a fanfare, and coins that fly to the counter ----
let coinShown = 0, pendingCoins = [];
const showCoins = () => { $('coinNum').textContent = coinShown; };

function fanfare() {                                   // "too, toooo!"
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)(), t0 = ac.currentTime;
    [[523.25, 0, .14], [783.99, .2, .85]].forEach(([f, t, d]) => {
      const o = ac.createOscillator(), g = ac.createGain(), fl = ac.createBiquadFilter();
      o.type = 'sawtooth'; o.frequency.value = f; fl.type = 'lowpass'; fl.frequency.value = 1800;
      g.gain.setValueAtTime(0, t0 + t); g.gain.linearRampToValueAtTime(.25, t0 + t + .02); g.gain.exponentialRampToValueAtTime(.001, t0 + t + d);
      o.connect(fl); fl.connect(g); g.connect(ac.destination); o.start(t0 + t); o.stop(t0 + t + d + .05);
    });
  } catch (e) {}
}
function confetti() {                                  // coloured paper pieces falling from the top
  const cv = document.createElement('canvas'); cv.id = 'confetti'; cv.width = innerWidth; cv.height = innerHeight; document.body.appendChild(cv);
  const x = cv.getContext('2d'), cols = ['#ff4d6d', '#ffd23f', '#3fd16b', '#4d9bff', '#b967ff', '#ff9a3c'];
  const bits = Array.from({ length: 160 }, () => ({ x: rnd(0, cv.width), y: rnd(-260, -10), vx: rnd(-1.5, 1.5), vy: rnd(2, 5), w: rnd(6, 12), h: rnd(4, 8), a: rnd(0, 6.3), va: rnd(-.2, .2), c: cols[Math.random() * cols.length | 0] }));

    bits.forEach(b => { b.x += b.vx; b.y += b.vy; b.a += b.va; x.save(); x.translate(b.x, b.y); x.rotate(b.a); x.fillStyle = b.c; x.fillRect(-b.w / 2, -b.h / 2, b.w, b.h); x.restore(); });
    if (t - t0 < 4500 && bits.some(b => b.y < cv.height + 20)) requestAnimationFrame(go); else cv.remove();
  })(t0);
}
// a coin pops out of (x, y), flies off a little way and waits
function coinAt(x, y, i, spread) {
  const c = document.createElement('div'); c.className = 'coin flycoin'; c.style.left = (x - 13) + 'px'; c.style.top = (y - 13) + 'px'; document.body.appendChild(c);
  const a = rnd(0, 6.28), r = rnd(spread * .4, spread);
  c._x = x + Math.cos(a) * r; c._y = y + Math.sin(a) * r * .7; c._bx = x; c._by = y;
  c.style.transform = 'scale(0)';
  c.animate([{ transform: 'translate(0,0) scale(0)' }, { transform: `translate(${c._x - x}px,${c._y - y}px) scale(1.3)`, offset: .7 }, { transform: `translate(${c._x - x}px,${c._y - y}px) scale(1)` }], { duration: 450, delay: i * 40, fill: 'forwards', easing: 'ease-out' });
  return c;
}
function popCoin(c) {                                  // disappear with a pop
  const r = c.getBoundingClientRect(); c.remove();
  const p = document.createElement('div'); p.className = 'popfx'; p.style.left = (r.left + r.width / 2 - 15) + 'px'; p.style.top = (r.top + r.height / 2 - 15) + 'px'; document.body.appendChild(p);
  p.animate([{ transform: 'scale(.3)', opacity: 1 }, { transform: 'scale(1.9)', opacity: 0 }], { duration: 260, easing: 'ease-out' }); setTimeout(() => p.remove(), 300);
}
function flyCoins(list) {                              // zoom to the counter, pop, and add them up
  const bar = $('coinBar').getBoundingClientRect(), tx = bar.left + 22, ty = bar.top + bar.height / 2;
  let arrived = 0;
  list.forEach((c, i) => {
    c.animate([{ transform: `translate(${c._x - c._bx}px,${c._y - c._by}px) scale(1)` }, { transform: `translate(${tx - c._bx}px,${ty - c._by}px) scale(.8)` }], { duration: 650, delay: i * 70, fill: 'forwards', easing: 'cubic-bezier(.5,0,.9,.5)' });
    setTimeout(() => {
      popCoin(c); coinShown++; showCoins(); arrived++;
      if (arrived === list.length) { coinShown = coins; showCoins(); const p = $('plusTen'); p.classList.remove('go'); void p.offsetWidth; p.classList.add('go'); }
    }, i * 70 + 650);
  });
}
let owed = false, tabCenter = [0, 0];
function tabBurst() {                                  // coins pop out of the tab, then pop away a second later
  const r = document.querySelector('#doneTab .dcard').getBoundingClientRect();
  tabCenter = [r.left + r.width / 2, r.top + r.height / 2]; owed = true;
  const list = Array.from({ length: 10 }, (_, i) => coinAt(tabCenter[0], tabCenter[1], i, 120));
  setTimeout(() => list.forEach(popCoin), 1100);
}
function showDone() {
  if (!document.querySelector('#game.on')) { coinShown = coins; showCoins(); return; }
  $('doneTitle').textContent = level <= 3 ? 'Tutorial completed!' : 'Level completed!';
  $('nextBtn').style.display = level < LEVELS ? '' : 'none';
  $('doneTab').classList.add('on'); confetti(); fanfare();
  if ((!cheated || forceCoins) && !replay) setTimeout(tabBurst, 350);
  else { coinShown = coins; showCoins(); }
}
function leaveTab() { $('doneTab').classList.remove('on'); }
$('nextBtn').onclick = () => {
  leaveTab(); const was = owed, [x, y] = tabCenter; owed = false;
  startLevel(level + 1);
  if (!was) return;
  const list = Array.from({ length: 10 }, (_, i) => coinAt(x, y, i, 60));   // the coins pop out again, then zoom to the counter
  setTimeout(() => flyCoins(list), 450);
};
$('toLevelsBtn').onclick = () => {
  leaveTab(); const was = owed; owed = false;
  buildLevels(); show('levelScreen');
  if (!was) return;
  setTimeout(() => {                                   // coins pop out of the level you just did
    const t = $('levels').children[level - 1], r = t.getBoundingClientRect();
    const list = Array.from({ length: 10 }, (_, i) => coinAt(r.left + r.width / 2, r.top + r.height / 2, i, 50));

// ---- Hints menu (+ button) ----
// Each game gives free uses. Bought uses go in a bag that is kept between games. Coins: 10 for every game you finish.
let cheated = false, typed = '', won = false, forceCoins = false;
let coins = 0, bag = { complete: 0, selected: 0, random: 0, blanks: 0, hint: 0 }, autoToken = 0;
try { coins = +localStorage.sudokuCoins || 0; Object.assign(bag, JSON.parse(localStorage.sudokuBag || '{}')); } catch (e) {}
coinShown = coins; showCoins();
const saveCoins = () => { try { localStorage.sudokuCoins = coins; localStorage.sudokuBag = JSON.stringify(bag); } catch (e) {} };
const PRICE = { complete: 20, selected: 5, random: 5, blanks: 8, hint: 2 };
const leftOf = k => replay ? Infinity : helpLeft[k] + bag[k];
const lbl = k => leftOf(k) === Infinity ? '∞' : leftOf(k);
function consume(k) { if (replay) return; if (helpLeft[k] > 0) helpLeft[k]--; else bag[k]--; saveCoins(); }
const closeHelp = () => $('helpMenu').classList.remove('on');
const openCells = () => { const a = []; for (let i = 0; i < 81; i++) if (!value(i) || isBad(i)) a.push(i); return a; };
// the real answer for the board as it is now (falls back to the plain puzzle if your numbers can't be finished)
function currentSolution() {
  const g = puzzle.slice(); for (let i = 0; i < 81; i++) if (!puzzle[i] && vals[i] && !isBad(i)) g[i] = vals[i];
  return solve(g, 20000) || solve(puzzle, 20000) || solutionGrid;
}
function putIn(i, n) { const was = pencil; pencil = false; placeAt(i, n, true); pencil = was; }

function openHelp() {
  const list = $('helpList'); list.innerHTML = '';
  $('helpCoins').textContent = '🪙 ' + coins + ' coins';
  const row = (key, mid, go) => {
    const d = document.createElement('div'); d.className = 'hrow';
    const u = document.createElement('div'); u.className = 'use' + (leftOf(key) < 1 ? ' off' : ''); u.innerHTML = mid; u.onclick = () => { if (leftOf(key) >= 1) go(); };
    const by = document.createElement('button'); by.className = 'buy'; by.textContent = 'Buy 🪙' + PRICE[key];
    by.onclick = () => { if (coins < PRICE[key]) { $('helpCoins').textContent = 'Not enough coins yet. Finish a game for 10.'; return; } coins -= PRICE[key]; bag[key]++; saveCoins(); openHelp(); };
    d.append(u); if (!replay) d.append(by); list.appendChild(d); return u;
  };
  row('complete', '<span>Complete game</span><span>' + lbl('complete') + ' left</span>', () => helpDo('complete'));
  row('selected', '<span>Reveal selected square</span><span>' + lbl('selected') + ' left</span>', () => helpDo('selected'));
  row('random', '<span>Reveal random square</span><span>' + lbl('random') + ' left</span>', () => helpDo('random'));
  const u = row('blanks', '<span>Reveal <input id="blankN" type="number" min="1" max="10" placeholder="_" onclick="event.stopPropagation()"> squares</span><span>' + lbl('blanks') + ' left</span>', () => helpDo('blanks'));
  row('hint', '<span>Hint</span><span>' + lbl('hint') + ' left</span>', () => { closeHelp(); giveHint(); });
  $('helpMenu').classList.add('on');
}
function ask(text, yes) {
  $('confirmText').textContent = text; $('confirmBox').classList.add('on');
  $('confirmYes').onclick = () => { $('confirmBox').classList.remove('on'); yes(); };
  $('confirmNo').onclick = () => $('confirmBox').classList.remove('on');
}
function helpDo(key) {
  if (key === 'selected') {
    if (cur < 0 || puzzle[cur]) { closeHelp(); $('msg').textContent = 'Click an empty square first, then try again.'; return; }
    ask('Reveal the selected square?', () => { consume('selected'); closeHelp(); $('msg').textContent = ''; putIn(cur, currentSolution()[cur]); });
  } else if (key === 'random') {
    ask('Reveal a random square?', () => {
      const o = openCells(); if (!o.length) return;
      consume('random'); closeHelp(); const i = o[Math.random() * o.length | 0]; cur = i; putIn(i, currentSolution()[i]);
      $('msg').textContent = 'Revealed ' + 'ABCDEFGHI'[i % 9] + (9 - (i / 9 | 0)) + '.';
    });
  } else if (key === 'blanks') {
    const n = Math.floor(+($('blankN') || {}).value);
    if (!(n >= 1 && n <= 10)) { $('helpCoins').textContent = 'Type a number from 1 to 10 in the blank.'; return; }
    ask('Reveal ' + n + ' random squares?', () => {
      const o = openCells(); if (!o.length) return;
      consume('blanks'); closeHelp();
      const sol = currentSolution();
      for (let k = o.length - 1; k > 0; k--) { const j = Math.random() * (k + 1) | 0; [o[k], o[j]] = [o[j], o[k]]; }
      o.slice(0, n).forEach(i => putIn(i, sol[i]));
      $('msg').textContent = 'Revealed ' + Math.min(n, o.length) + ' squares.';
    });
  } else if (key === 'complete') {
    ask('Complete the whole game? It fills in one square every tenth of a second.', () => {
      consume('complete'); cheated = true; closeHelp(); $('msg').textContent = '';
      const sol = currentSolution(), o = openCells(), my = ++autoToken;
      const step = () => { if (my !== autoToken || !o.length) return; const i = o.shift(); putIn(i, sol[i]); if (o.length) setTimeout(step, 100); };
      step();
    });
  }
}
// Secret code word, just for Jos: type  finish  while playing and the game completes itself. Free, no coins.
addEventListener('keydown', e => {
  if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  if (e.key.length !== 1) return;
  typed = (typed + e.key.toLowerCase()).slice(-8);
  if (typed.endsWith('coins') && document.querySelector('#game.on')) {   // secret: show me the coins even after finish
    typed = ''; forceCoins = true;
    if (won && cheated && !replay && $('doneTab').classList.contains('on') && !owed) { coins += 10; saveCoins(); tabBurst(); }
    return;
  }
  if (typed.endsWith('finish') && document.querySelector('#game.on')) {
    typed = ''; cheated = true; closeHelp();
    const sol = currentSolution(), o = openCells(), my = ++autoToken;
    const step = () => { if (my !== autoToken || !o.length) return; const i = o.shift(); putIn(i, sol[i]); if (o.length) setTimeout(step, 100); };
    step();
  }
});
$('plusBtn').onclick = openHelp;
$('bulbBtn').onclick = giveHint;

// Hint: 11 kinds. 9 tell you a number (70%), 1 lists what a square could be (20%), 1 puts a number in for you (10%). Five per game.
const rowOf = i => i / 9 | 0, colOf = i => i % 9;
const boxCells = i => { const br = rowOf(i) - rowOf(i) % 3, bc = colOf(i) - colOf(i) % 3, a = []; for (let k = 0; k < 9; k++) a.push((br + (k / 3 | 0)) * 9 + bc + k % 3); return a; };
const rowCells = i => Array.from({ length: 9 }, (_, k) => rowOf(i) * 9 + k);
const colCells = i => Array.from({ length: 9 }, (_, k) => k * 9 + colOf(i));
const BOXNAME = i => ['top', 'middle', 'bottom'][rowOf(i) / 3 | 0] + '-' + ['left', 'middle', 'right'][colOf(i) / 3 | 0];
function glow(list) {
  list.forEach(k => { const c = cells[k]; c.classList.remove('hinted'); void c.offsetWidth; c.classList.add('hinted'); c.addEventListener('animationend', () => c.classList.remove('hinted'), { once: true }); });
}
function giveHint() {
  if (leftOf('hint') < 1) { $('msg').textContent = 'No hints left. Press + to buy more with coins.'; return; }
  const open = openCells();
  if (!open.length) return;
  const sol = currentSolution();
  const i = open[Math.random() * open.length | 0], n = sol[i], r = 9 - rowOf(i), c = 'ABCDEFGHI'[colOf(i)];
  consume('hint'); cur = i; paint();
  const roll = Math.random(), tail = ' Hints left: ' + lbl('hint');
  let text;
  if (roll < 0.10) {                                   // 10%: put it in for you
    putIn(i, n);
    text = 'Hint: I put a ' + n + ' in ' + c + r + ' for you.';
  } else if (roll < 0.30) {                            // 20%: what it might be
    let best = i, bestC = null;
    open.forEach(k => {
      const seen = new Set();
      for (let m = 0; m < 81; m++) if (m !== k && value(m) && !isBad(m) && (rowOf(m) === rowOf(k) || colOf(m) === colOf(k) || sameBox(m, k))) seen.add(value(m));
      const cand = [1, 2, 3, 4, 5, 6, 7, 8, 9].filter(x => !seen.has(x));
      if (!bestC || cand.length < bestC.length) { best = k; bestC = cand; }
    });
    cur = best; paint(); glow([best]);
    text = 'Hint: ' + 'ABCDEFGHI'[colOf(best)] + (9 - rowOf(best)) + ' might be ' + bestC.join(', ') + '. Add them as pencil notes.';
  } else {                                             // 70%: nine ways of telling you a number
    const kind = Math.random() * 9 | 0;
    let left = 0; for (let k = 0; k < 81; k++) if (value(k) !== n || isBad(k)) { if (sol[k] === n) left++; }
    const texts = [
      () => { glow([i]); return 'Hint: the glowing square is a ' + n + '.'; },
      () => { glow(rowCells(i)); return 'Hint: row ' + r + ' is missing a ' + n + '. It goes in the square that is selected.'; },
      () => { glow(colCells(i)); return 'Hint: column ' + c + ' is missing a ' + n + '. It goes in the square that is selected.'; },
      () => { glow(boxCells(i)); return 'Hint: the ' + BOXNAME(i) + ' box is missing a ' + n + '. It goes in the square that is selected.'; },
      () => { glow([i]); return 'Hint: ' + n + ' goes in ' + c + r + '.'; },
      () => { glow([i]); return 'Hint: there are still ' + left + ' ' + n + (left === 1 ? '' : "'s") + ' to place. One is in the glowing square.'; },
      () => { glow([i]); return 'Hint: look at where the other ' + n + "'s are. The glowing square is a " + n + '.'; },
      () => { glow(rowCells(i)); return 'Hint: find the ' + n + ' for row ' + r + '. It is in column ' + c + '.'; },
      () => { glow(colCells(i)); return 'Hint: find the ' + n + ' for column ' + c + '. It is in row ' + r + '.'; },
    ];
    text = texts[kind]();
  }
  $('msg').textContent = text + tail;
}
$('helpClose').onclick = closeHelp;

// Rewind: your numbers fade away (the puzzle's own stay), then the number pad and tools fade back in.
function rewind() {
  $('rewindBtn').classList.add('gone');
  cells.forEach((c, i) => { if (!puzzleGiven(i)) c.classList.add('fadeout'); });
  setTimeout(() => {
    vals.fill(0); helped.fill(false); notes.forEach(n => n.clear()); digitDone = {}; fitCache = new Map();
    cells.forEach(c => c.classList.remove('fadeout'));
    $('game').classList.remove('cv'); won = false; cheated = false; forceCoins = false; autoToken++;
    ['tools', 'padRow'].forEach(id => { const e = $(id); e.classList.remove('fadein'); void e.offsetWidth; e.classList.add('fadein'); });
    paint(); paintPad();
  }, 700);
}
$('rewindBtn').onclick = rewind;

$('pencilBtn').onclick = () => { pencil = !pencil; $('pencilBtn').classList.toggle('on', pencil); };
$('eraseBtn').onclick = erase;
$('zap').onclick = () => {
  lightning = !lightning; armed = 0;
  const z = $('zap'); z.classList.toggle('on', lightning); z.classList.remove('sparking');
  if (lightning) { void z.offsetWidth; z.classList.add('sparking'); setTimeout(() => z.classList.remove('sparking'), 800); }
  paintPad();
};

  if (!$('game').classList.contains('on')) return;
  if (e.key >= '1' && e.key <= '9') padPress(+e.key);
  else if (e.key === 'Backspace' || e.key === 'Delete' || e.key === '0') erase();
