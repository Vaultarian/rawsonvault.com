<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sudoku</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:#14213d;color:#fff;font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center}
  .screen{display:none;flex-direction:column;align-items:center;gap:18px;padding:16px;text-align:center}
  .screen.on{display:flex}
  h1{font-size:84px;margin:0;letter-spacing:8px;background:linear-gradient(90deg,#fca311,#ffe29a,#fca311);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 4s linear infinite;filter:drop-shadow(0 0 18px rgba(252,163,17,.45))}
  @keyframes shine{to{background-position:200% 0}}
  #start{position:relative;z-index:2}
  #playBtn{font-size:30px;padding:16px 44px;box-shadow:0 0 28px rgba(252,163,17,.5);animation:pulse 2s ease-in-out infinite}
  @keyframes pulse{50%{transform:scale(1.07)}}
  body{background:radial-gradient(circle at 50% 40%,#22345f,#0d1630 70%)}
  #bg{position:fixed;inset:0;overflow:hidden;z-index:1;display:none}
  #bg.on{display:block}
  .fl{position:absolute;animation:drift var(--d) ease-in-out infinite alternate;animation-delay:var(--s)}
  @keyframes drift{from{transform:translate(0,0) rotate(var(--r0))}to{transform:translate(var(--dx),var(--dy)) rotate(var(--r1))}}
  .num{font-size:var(--sz);font-weight:800;color:rgba(252,163,17,.55);pointer-events:none}
  @property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
  .mini{display:grid;grid-template-columns:repeat(2,1fr);width:72px;height:72px;gap:4px;padding:5px;background:linear-gradient(145deg,#ffffff,#cfd9f2);border-radius:14px;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.35),0 0 14px rgba(160,190,255,.35);transition:background .6s,box-shadow .6s,filter .2s}
  .mini:hover{filter:brightness(1.1)}
  .mini div{display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;color:#1b2b55;background:linear-gradient(160deg,#f4f6fc,#dfe5f5);border-radius:8px;position:relative;z-index:1}
  .mini div.empty{background:#fff3d6;box-shadow:inset 0 0 0 2px #fca311;color:transparent}
  .mini div.popnum{color:#0b7a33;animation:popnum .5s cubic-bezier(.2,1.6,.4,1)}
  @keyframes popnum{0%{transform:scale(0)}60%{transform:scale(1.9)}100%{transform:scale(1)}}
  .mini .sweep{position:absolute;inset:0;border-radius:14px;z-index:2;pointer-events:none;background:conic-gradient(from 0deg,rgba(63,209,107,.88) calc(var(--a) - 50deg),rgba(63,209,107,0) var(--a));animation:sweepa 1.1s linear forwards,sweepout .5s 1.1s ease forwards}
  @keyframes sweepout{to{opacity:0}}
  @keyframes sweepa{from{--a:0deg}to{--a:410deg}}
  .mini.ok{background:#3fd16b;box-shadow:0 0 26px rgba(63,209,107,.8)}
  .mini.ok div{background:#c9f2d3}
  .mini div{transition:background .5s,transform .22s ease}
  @keyframes bump{0%{transform:scale(.4)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
  .mini div.bump{animation:bump .35s ease}
  .mini .pip{position:absolute;left:50%;top:50%;width:6px;height:15px;margin:-7px 0 0 -3px;border-radius:3px;background:#3fd16b;box-shadow:0 0 8px #3fd16b;z-index:3;pointer-events:none;transform:translate(var(--x),var(--y)) rotate(var(--ang)) scale(0);animation:pippop .3s var(--del) forwards}
  @keyframes pippop{0%{transform:translate(var(--x),var(--y)) rotate(var(--ang)) scale(0)}60%{transform:translate(var(--x),var(--y)) rotate(var(--ang)) scale(1.6)}100%{transform:translate(var(--x),var(--y)) rotate(var(--ang)) scale(1)}}
  @keyframes sweepin{from{opacity:0}to{opacity:1}}
  @keyframes sweepb{from{--a:410deg}to{--a:0deg}}
  @keyframes pipb{0%{transform:translate(var(--x),var(--y)) rotate(var(--ang)) scale(1)}40%{transform:translate(var(--x),var(--y)) rotate(var(--ang)) scale(1.6)}100%{transform:translate(var(--x),var(--y)) rotate(var(--ang)) scale(0)}}
  @keyframes popnumb{0%{transform:scale(1)}40%{transform:scale(1.9)}100%{transform:scale(0)}}
  .mini.rev .sweep{animation:sweepin .5s ease both,sweepb 1.1s .5s linear both}
  .mini.rev .pip{animation:pipb .3s var(--rdel) both}
  .mini div.unpop{animation:popnumb .5s 1.6s both;color:#0b7a33}
  #pullLock{position:fixed;left:0;right:0;bottom:6px;text-align:center;font-size:40px;opacity:0;pointer-events:none;z-index:5}
  #swirlLock{position:fixed;inset:0;display:none;align-items:center;justify-content:center;font-size:140px;pointer-events:none;z-index:30}
  #hint{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:10;pointer-events:none}
  #hint.on{display:flex}
  #hintBox{width:170px;height:170px;border-radius:14px;border:4px solid #fff;color:#fff;font-size:100px;font-weight:800;display:flex;align-items:center;justify-content:center;
    background-color:#22345f;background-image:linear-gradient(rgba(255,255,255,.35) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.35) 2px,transparent 2px);background-size:56.6px 56.6px;animation:hintfade 1.4s ease forwards}
  @keyframes hintfade{0%{opacity:0;transform:scale(.8)}15%{opacity:1;transform:scale(1)}75%{opacity:1}100%{opacity:0}}
  button{font:inherit;cursor:pointer;border:0;border-radius:12px;background:#fca311;color:#14213d;font-weight:700;padding:12px 24px;font-size:20px}
  button:hover{filter:brightness(1.1)}
  #levelScreen{position:fixed;inset:0;justify-content:flex-start;gap:10px;padding:10px}
  #levels{display:grid;grid-template-columns:repeat(10,1fr);grid-auto-rows:1fr;gap:6px;width:100%;flex:1;min-height:0}
  #levels button{height:100%;font-size:clamp(14px,3vw,34px);padding:0;border-radius:10px}
  #levels button.hinting{color:#fff;background-color:#22345f;background-image:linear-gradient(rgba(255,255,255,.4) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.4) 2px,transparent 2px);background-size:33.3% 33.3%;box-shadow:0 0 0 3px #fff inset}
  #levels button.locked{background:#3a4468;color:#7c86a8}
  #levels button.done{background:#7bd88f}
  #loading{position:fixed;inset:0;background:#050505;z-index:20;justify-content:center}
  #loadCanvas{position:absolute;inset:0;width:100%;height:100%}
  #pct{position:relative;z-index:2;text-shadow:0 0 10px rgba(0,85,255,.6)}
  .bar{width:300px;height:26px;background:#2b3a67;border-radius:13px;overflow:hidden}
  #fill{height:100%;width:0;background:#fca311}
  #pct{font-size:28px;font-weight:700}
  #grid{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));grid-template-rows:repeat(9,minmax(0,1fr));width:min(92vw,450px);aspect-ratio:1;border:3px solid #fff;background:#fff}
  .cell{transition:background .5s,color .5s;display:flex;align-items:center;justify-content:center;font-size:clamp(18px,5vw,30px);color:#14213d;background:#fff;border:1px solid #bbb;cursor:pointer;user-select:none}
  .cell.r{border-right:3px solid #14213d}
  .cell.b{border-bottom:3px solid #14213d}
  .cell.given{background:#e5e5e5;font-weight:800}
  .cell.sel{background:#ffd98a}
  .cell.bad{color:#d00000;background:#ffd6d6}
  .cell.mine{color:#1d5fd1;font-weight:700}
  #padRow{display:flex;align-items:center;gap:12px;width:min(92vw,450px)}
  #pad{display:grid;grid-template-columns:repeat(9,1fr);gap:5px;flex:1}
  #pad button{padding:10px 0;font-size:22px;border-radius:10px;transition:background .25s,box-shadow .25s,transform .15s}
  #pad button.armed{background:#ffe14d;box-shadow:0 0 16px 5px rgba(255,214,0,.85);transform:translateY(-3px)}
  #pad button.gray{background:#3a4468;color:#7c86a8;box-shadow:none;cursor:default;transform:none}
  #tools{display:flex;gap:10px}
  .tool{display:flex;align-items:center;justify-content:center;width:72px;height:54px;padding:0;border-radius:14px}
  .tool svg{display:block;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}
  .tool.on{background:#7bd88f}
  #rule{width:min(92vw,450px);min-height:26px;font-size:17px;font-weight:700;color:#ff9a9a;text-align:center;opacity:0;transition:opacity .5s}
  #rule.show{opacity:1}
  #zap{position:relative;flex:none;width:62px;height:34px;border-radius:17px;padding:0;background:#9aa0b5;overflow:visible;transition:background .3s}
  #zap .knob{position:absolute;left:3px;top:3px;width:28px;height:28px;border-radius:50%;background:#e9ebf2;color:#5d6378;display:flex;align-items:center;justify-content:center;transition:left .25s,background .25s,color .25s}
  #zap.on{background:#3fd16b}
  #zap.on .knob{left:31px;background:#fff9d6;color:#ffd400}
  #zap.sparking .knob svg{animation:spark .7s}
  @keyframes spark{0%{transform:scale(1)}15%{transform:scale(1.7) rotate(-12deg);filter:drop-shadow(0 0 6px #ffd400)}30%{transform:scale(.9) rotate(8deg)}45%{transform:scale(1.5);filter:drop-shadow(0 0 8px #ffd400)}100%{transform:scale(1);filter:none}}
  #zap i.sp{position:absolute;left:43px;top:12px;width:3px;height:9px;border-radius:2px;background:#ffd400;opacity:0;pointer-events:none}
  #zap.sparking i.sp{animation:sp .6s ease-out}
  @keyframes sp{0%{opacity:1;transform:rotate(var(--a)) translateY(-8px)}100%{opacity:0;transform:rotate(var(--a)) translateY(-26px)}}
  .cell.flash{position:relative;z-index:2;animation:cellflash .9s ease-out}
  @keyframes cellflash{0%{transform:scale(1)}18%{background:#3fd16b;transform:scale(1.18);box-shadow:0 0 14px 3px rgba(63,209,107,.9)}70%{background:#7be59a;transform:scale(1.05);box-shadow:0 0 8px rgba(63,209,107,.6)}100%{transform:scale(1);box-shadow:none}}
  .notes{display:grid;grid-template-columns:repeat(3,1fr);width:100%;height:100%;font-size:clamp(7px,1.6vw,11px);color:#555;font-weight:600}
  .notes i{font-style:normal;display:flex;align-items:center;justify-content:center}
  #msg{font-size:24px;min-height:32px;color:#7bd88f;font-weight:700}
  .top{display:flex;gap:12px;align-items:center}
</style>
</head>
<body>

<div id="bg" class="on"></div>

<div id="start" class="screen on">
  <h1>SUDOKU</h1>
  <div>Put 1 to 9 in every row, column and box.</div>
  <button id="playBtn">▶ Play</button>
</div>

<div id="pullLock">🔒</div>
<div id="swirlLock">🔒</div>

<div id="levelScreen" class="screen">
  <div class="top" style="width:100%"><button id="backStart">Back</button><div style="font-size:26px;font-weight:700">Pick a level</div></div>
  <div id="levels"></div>
</div>

<div id="loading" class="screen"><canvas id="loadCanvas"></canvas><div id="pct">0%</div></div>

<div id="game" class="screen">
  <div class="top"><button id="backLevels">Levels</button><div id="title" style="font-size:24px;font-weight:700"></div></div>
  <div id="grid"></div>
  <div id="rule"></div>
  <div id="tools">
    <button id="pencilBtn" class="tool" title="Pencil notes" aria-label="Pencil notes"><svg viewBox="0 0 32 32" width="42" height="42" aria-hidden="true"><g transform="rotate(45 16 16)" stroke="#14213d" stroke-opacity=".35" stroke-width=".6" stroke-linejoin="round">
        <rect x="12" y="1.5" width="8" height="5" rx="1.8" fill="#f48a9c"/>
        <rect x="12" y="6.5" width="8" height="3" fill="#c3c9d8"/>
        <path d="M12 9.5h8V23h-8z" fill="#ffd23f"/><path d="M16 9.5h4V23h-4z" fill="#f0b400" stroke="none"/>
        <path d="M12 23h8l-4 7.5z" fill="#f4d6a8"/><path d="M14.6 27.6h2.8L16 30.5z" fill="#2f3347" stroke="none"/>
        <path d="M13.3 10v12.5" stroke="#fff" stroke-opacity=".55" stroke-width="1" stroke-linecap="round"/>
      </g></svg></button>
    <button id="eraseBtn" class="tool" title="Eraser" aria-label="Eraser"><svg viewBox="0 0 32 32" width="42" height="42" aria-hidden="true"><g transform="rotate(-30 16 16.5)" stroke="#14213d" stroke-opacity=".35" stroke-width=".6" stroke-linejoin="round">
        <path d="M14 10.5h10a3.2 3.2 0 0 1 3.2 3.2v5.1a3.2 3.2 0 0 1-3.2 3.2H14z" fill="#f48a9c"/>
        <path d="M8.2 10.5H14v11.5H8.2A3.2 3.2 0 0 1 5 18.8v-5.1a3.2 3.2 0 0 1 3.2-3.2z" fill="#5b8def"/>
        <path d="M8 12.2h4.5" stroke="#fff" stroke-opacity=".6" stroke-width="1.1" stroke-linecap="round"/>
        <path d="M16.5 12.2H23" stroke="#fff" stroke-opacity=".55" stroke-width="1.1" stroke-linecap="round"/>
      </g></svg></button>
  </div>
  <div id="padRow">
    <div id="pad"></div>
    <button id="zap" aria-label="Lightning mode"><span class="knob"><svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg></span><i class="sp" style="--a:0deg"></i><i class="sp" style="--a:72deg"></i><i class="sp" style="--a:144deg"></i><i class="sp" style="--a:216deg"></i><i class="sp" style="--a:288deg"></i></button>
  </div>
  <div id="msg"></div>
</div>

<script src="gen.js"></script>
<script>
const LEVELS = 100;
// Level 1 has the most starting numbers (34); every 6 levels it gets one fewer, down to 18 at level 100.
const givensFor = l => Math.max(18, 34 - Math.floor((l - 1) / 6));
let unlocked = 1, doneSet = {};
try { unlocked = +localStorage.sudokuUnlocked || 1; doneSet = JSON.parse(localStorage.sudokuDone || '{}'); } catch (e) {}

const $ = id => document.getElementById(id);
function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id));
  $('bg').classList.toggle('on', id === 'start');
}

// Locked level clicked: that square shows the level you need to beat next, on a little grid, then goes back.
function hint(btn, l, n) {
  if (btn.classList.contains('hinting')) return;
  btn.classList.add('hinting'); btn.textContent = n;
  setTimeout(() => { btn.classList.remove('hinting'); btn.textContent = l; }, 1300);
}

// Floating numbers and little 2x2 grids around the edges of the home screen.
function rnd(a, b) { return a + Math.random() * (b - a); }
function edgeSpot() {
  // keep things on the outside: left strip or right strip, or top/bottom strip
  const side = (Math.random() * 4) | 0;
  if (side === 0) return [rnd(1, 14), rnd(2, 88)];
  if (side === 1) return [rnd(80, 94), rnd(2, 88)];
  if (side === 2) return [rnd(14, 80), rnd(1, 11)];
  return [rnd(14, 80), rnd(80, 90)];
}
function makeMini(x, y) {
  const el = document.createElement('div'); el.className = 'fl mini';
  setFloat(el, x, y);
  const cells = [0, 1, 2, 3].map(() => document.createElement('div'));
  const newPuzzle = () => ({ nums: [1, 2, 3, 4].sort(() => Math.random() - 0.5), hole: (Math.random() * 4) | 0 });
  const bump = d => { d.classList.remove('bump'); void d.offsetWidth; d.classList.add('bump'); };
  const set = (d, n, blank) => { d.className = blank ? 'empty' : ''; d.textContent = blank ? '' : n; d.dataset.n = n; };

  function build() {                         // first time: just put the numbers in
    const { nums, hole } = newPuzzle();
    cells.forEach((d, i) => { set(d, nums[i], i === hole); el.appendChild(d); });
    el.dataset.busy = '';
  }

  // swap two squares by sliding them past each other
  function slide(a, b) {
    const ax = a.offsetLeft, ay = a.offsetTop, bx = b.offsetLeft, by = b.offsetTop;
    const order = [...el.children], ia = order.indexOf(a), ib = order.indexOf(b);
    order[ia] = b; order[ib] = a; order.forEach(n => el.appendChild(n));
    [[a, ax - a.offsetLeft, ay - a.offsetTop], [b, bx - b.offsetLeft, by - b.offsetTop]].forEach(([d, dx, dy]) => {
      d.style.transition = 'none'; d.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
      void d.offsetWidth;
      d.style.transition = 'transform .22s ease, background .5s'; d.style.transform = '';
    });
  }

  // new puzzle: the blank wanders, the numbers change into other numbers, then they settle
  function morph() {
    el.classList.remove('ok', 'rev');
    el.querySelectorAll('.sweep,.pip').forEach(n => n.remove());
    const kids = () => [...el.children];
    kids().forEach(d => { d.style.transform = ''; d.classList.remove('popnum', 'unpop', 'bump'); if (d.classList.contains('empty')) { d.textContent = ''; bump(d); } });
    const { nums, hole } = newPuzzle();
    const STEPS = 6;
    for (let k = 1; k <= STEPS; k++) {
      setTimeout(() => {
        const ks = kids(), i = (Math.random() * 4) | 0; let j = (Math.random() * 4) | 0; if (j === i) j = (j + 1) % 4;
        slide(ks[i], ks[j]);
        const t = ks[(Math.random() * 4) | 0];                       // one number turns into another
        if (!t.classList.contains('empty')) { t.textContent = 1 + ((Math.random() * 4) | 0); bump(t); }
      }, k * 260);
    }
    setTimeout(() => {                                                // settle into the new puzzle
      kids().forEach((d, i) => { set(d, nums[i], i === hole); bump(d); });
      setTimeout(() => { el.dataset.busy = ''; }, 450);
    }, (STEPS + 1) * 260);
  }

  el.onclick = () => {
    if (el.dataset.busy) return;
    el.dataset.busy = '1';
    const c = el.querySelector('.empty'); c.textContent = c.dataset.n; c.classList.add('popnum');
    const sw = document.createElement('i'); sw.className = 'sweep'; el.appendChild(sw);
    // green bars pop out one after another, clockwise from the top, back round to the top
    for (let k = 0; k < 16; k++) {
      const pip = document.createElement('i'); pip.className = 'pip';
      // walk round the outline of the square (just off the edge), clockwise from the top middle
      const h = 44; let d = k * (8 * h / 16), x, y, ang;
      if (d <= h) { x = d; y = -h; ang = 0; }
      else if (d < 3 * h) { x = h; y = -h + (d - h); ang = 90; }
      else if (d < 5 * h) { x = h - (d - 3 * h); y = h; ang = 180; }
      else if (d < 7 * h) { x = -h; y = h - (d - 5 * h); ang = 270; }
      else { x = -h + (d - 7 * h); y = -h; ang = 0; }
      if (Math.abs(x) === h && Math.abs(y) === h) ang = x > 0 ? (y < 0 ? 45 : 135) : (y > 0 ? 225 : 315);
      pip.style.setProperty('--x', x + 'px'); pip.style.setProperty('--y', y + 'px');
      pip.style.setProperty('--ang', ang + 'deg'); pip.style.setProperty('--del', (k * 0.065) + 's');
      el.appendChild(pip);
    }
    setTimeout(() => el.classList.add('ok'), 1000);   // fades into solid green
    setTimeout(() => {                                 // then the whole thing plays backwards
      el.classList.remove('ok');
      el.querySelectorAll('.pip').forEach((pp, k) => pp.style.setProperty('--rdel', (0.5 + (15 - k) * 0.065) + 's'));
      c.classList.remove('popnum'); void c.offsetWidth; c.classList.add('unpop');
      el.classList.add('rev');
    }, 2000);
    setTimeout(morph, 4300);                           // then the squares shuffle into a new puzzle
  };
  build(); return el;
}
function setFloat(el, x, y) {
  el.style.left = x + '%'; el.style.top = y + '%';
  el.style.setProperty('--d', rnd(5, 10) + 's'); el.style.setProperty('--s', '-' + rnd(0, 8) + 's');
  el.style.setProperty('--dx', rnd(-30, 30) + 'px'); el.style.setProperty('--dy', rnd(-40, 40) + 'px');
  el.style.setProperty('--r0', rnd(-12, 0) + 'deg'); el.style.setProperty('--r1', rnd(0, 12) + 'deg');
}
(function buildBg() {
  const bg = $('bg');
  for (let i = 0; i < 16; i++) {
    const [x, y] = edgeSpot(), el = document.createElement('div');
    el.className = 'fl num'; el.textContent = 1 + ((Math.random() * 9) | 0);
    el.style.setProperty('--sz', rnd(28, 70) + 'px'); setFloat(el, x, y); bg.appendChild(el);
  }
  for (let i = 0; i < 7; i++) { const [x, y] = edgeSpot(); bg.appendChild(makeMini(x, y)); }
})();

function buildLevels() {
  const box = $('levels'); box.innerHTML = '';
  for (let l = 1; l <= LEVELS; l++) {
    const b = document.createElement('button');
    b.textContent = l;
    if (l > unlocked) b.className = 'locked';
    else if (doneSet[l]) b.className = 'done';
    b.onclick = l <= unlocked ? () => startLevel(l) : () => hint(b, l, unlocked);
    box.appendChild(b);
  }
}

// Scratch's "whirl" (same maths as swirl.js on the home page): a picture is twisted round its middle.
const WFRAG = 'precision mediump float;uniform sampler2D u_img;uniform float u_whirl;uniform float u_fade;uniform vec2 u_size;varying vec2 v_uv;' +
  'void main(){vec2 p=(v_uv-0.5)*u_size;float r=0.5*length(u_size);float f=max(1.0-length(p)/r,0.0);float a=u_whirl*f*f;float s=sin(a),c=cos(a);' +
  'vec2 q=mat2(c,-s,s,c)*p/u_size+0.5;vec4 t=texture2D(u_img,q);vec3 g=vec3(0.18,0.8,0.42)*t.a;gl_FragColor=vec4(mix(t.rgb,g,u_fade)*(1.0-u_fade),t.a*(1.0-u_fade));}';
const WVERT = 'attribute vec2 a_pos;varying vec2 v_uv;void main(){v_uv=vec2(a_pos.x*0.5+0.5,0.5-a_pos.y*0.5);gl_Position=vec4(a_pos,0,1);}';
const wsmooth = (a, b, k) => { const x = Math.min(1, Math.max(0, (k - a) / (b - a))); return x * x * (3 - 2 * x); };
// o: { intro, hold, outro, ms, done } -- intro = whirl in out of green, outro = whirl away into green
function whirl(pic, left, top, w, h, o) {
  const cv = document.createElement('canvas'); cv.width = pic.width; cv.height = pic.height;
  const gl = cv.getContext('webgl'); if (!gl) { if (o.done) o.done(); return; }
  cv.style.cssText = 'position:fixed;left:' + left + 'px;top:' + top + 'px;width:' + w + 'px;height:' + h + 'px;z-index:30;pointer-events:none';
  const sh = (t, src) => { const x = gl.createShader(t); gl.shaderSource(x, src); gl.compileShader(x); return x; };
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, WVERT)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, WFRAG));
  gl.linkProgram(prog); gl.useProgram(prog);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'a_pos'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  gl.bindTexture(gl.TEXTURE_2D, gl.createTexture());
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, pic);
  gl.clearColor(0, 0, 0, 0);
  gl.uniform2f(gl.getUniformLocation(prog, 'u_size'), cv.width, cv.height); gl.viewport(0, 0, cv.width, cv.height);
  const uW = gl.getUniformLocation(prog, 'u_whirl'), uF = gl.getUniformLocation(prog, 'u_fade');
  const draw = (amt, fade) => { gl.uniform1f(uW, amt * Math.PI / 180); gl.uniform1f(uF, fade); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4); };
  const MAX = 500, IN = o.intro ? o.ms : 0, HOLD = o.hold || 0, OUT = o.outro ? o.ms : 0, TOTAL = IN + HOLD + OUT;
  const ease = k => 0.5 - 0.5 * Math.cos(Math.PI * k);
  draw(IN ? MAX : 0, IN ? 1 : 0); document.body.appendChild(cv);
  const t0 = performance.now();
  (function step(now) {
    const t = now - t0;
    if (t < IN) { const k = t / IN; draw(MAX * (1 - ease(k)), 1 - wsmooth(0, 0.7, k)); }
    else if (t < IN + HOLD) draw(0, 0);
    else if (t < TOTAL) { const k = (t - IN - HOLD) / OUT; draw(MAX * ease(k), wsmooth(0.3, 1, k)); }
    else { cv.remove(); if (o.done) o.done(); return; }
    requestAnimationFrame(step);
  })(t0);
}

// Pull the level screen down a tiny bit; pull more and a lock shows. Let go and a lock swirls in and fades.
(function () {
  const ls = $('levelScreen'), lv = $('levels'), pl = $('pullLock'), sl = $('swirlLock');
  let pull = 0, idle, y0 = 0;
  function apply() {
    lv.style.transition = 'none'; lv.style.transform = 'translateY(' + (-Math.min(pull, 40)) + 'px)';
    pl.style.opacity = pull > 60 ? Math.min(1, (pull - 60) / 40) : 0;
  }
  function release() {
    const was = pull > 60; pull = 0;
    lv.style.transition = 'transform .25s'; lv.style.transform = ''; pl.style.opacity = 0;
    if (was) swirlLock();
  }
  let busy = false;
  function swirlLock() {
    if (busy) return; busy = true;
    const W = innerWidth, H = innerHeight;
    const pic = document.createElement('canvas'); pic.width = W; pic.height = H;
    const c2 = pic.getContext('2d');
    c2.font = Math.round(Math.min(W, H) * 0.5) + 'px serif'; c2.textAlign = 'center'; c2.textBaseline = 'middle';
    c2.fillText('🔒', W / 2, H / 2);
    whirl(pic, 0, 0, W, H, { intro: true, hold: 500, outro: true, ms: 1100, done: () => { busy = false; } });
  }
  ls.addEventListener('wheel', e => {
    if (!ls.classList.contains('on')) return;
    e.preventDefault();
    pull = Math.max(0, Math.min(140, pull + e.deltaY * 0.5)); apply();
    clearTimeout(idle); idle = setTimeout(release, 200);
  }, { passive: false });
  ls.addEventListener('touchstart', e => { y0 = e.touches[0].clientY; });
  ls.addEventListener('touchmove', e => { e.preventDefault(); pull = Math.max(0, Math.min(140, (y0 - e.touches[0].clientY) * 0.6)); apply(); }, { passive: false });
  ls.addEventListener('touchend', release);
})();

$('playBtn').onclick = () => { buildLevels(); show('levelScreen'); };
$('backStart').onclick = () => show('start');
$('backLevels').onclick = () => { buildLevels(); show('levelScreen'); };

let level = 1, puzzle = [], cells = [], cur = -1;

function startLevel(l) {
  level = l; show('loading');
  const cv = $('loadCanvas'), ctx = cv.getContext('2d'), pct = $('pct');
  cv.width = innerWidth; cv.height = innerHeight;
  const cx = cv.width / 2, cy = cv.height / 2, R = 160;
  let made = null, shown = 0, parts = [], emit = -Math.PI / 2, ringA = 0, finished = false;
  const t0 = Date.now(), total = 1500;
  pct.textContent = '0%';
  ctx.fillStyle = '#050505'; ctx.fillRect(0, 0, cv.width, cv.height);
  // The sudoku is made right now, while the dots go round.
  setTimeout(() => { made = makeSudoku(givensFor(l)); }, 50);
  (function loop() {
    const f = Math.min(1, (Date.now() - t0) / total);
    // 0% -> 50% -> 90% -> 100%
    let p = f < 0.35 ? (f / 0.35) * 50 : f < 0.8 ? 50 + ((f - 0.35) / 0.45) * 40 : 90 + ((f - 0.8) / 0.2) * 10;
    if (f === 1 && !made) p = 99;          // wait for the sudoku to be ready
    p = Math.round(p);
    if (p > shown) { for (let i = 0; i < Math.min(5, p - shown); i++) parts.push({ a: emit + i * 0.04, v: 0.03 + p * 0.0025 + Math.random() * 0.01, r: 4 + Math.random() * 1.5, h: [] }); shown = p; pct.textContent = p + '%'; }
    ctx.fillStyle = 'rgba(5,5,5,.4)'; ctx.fillRect(0, 0, cv.width, cv.height);
    emit += 0.04 + shown * 0.003;
    for (const d of parts) {
      d.a += d.v; const x = cx + Math.cos(d.a) * R, y = cy + Math.sin(d.a) * R;
      d.h.push([x, y]); if (d.h.length > 6) d.h.shift();
      ctx.beginPath(); ctx.moveTo(d.h[0][0], d.h[0][1]); d.h.forEach(q => ctx.lineTo(q[0], q[1]));
      ctx.strokeStyle = 'rgba(0,60,255,.4)'; ctx.lineWidth = d.r * 0.7; ctx.stroke();
      ctx.beginPath(); ctx.arc(x, y, d.r, 0, 7); ctx.fillStyle = '#0055ff'; ctx.fill();
    }
    if (f === 1 && made) {
      if (!finished) { finished = true; pct.textContent = '100%'; setTimeout(() => begin(made.puzzle), 350); }
      ringA = Math.min(1, ringA + 0.08);
      ctx.beginPath(); ctx.lineWidth = 10; ctx.lineCap = 'round'; ctx.arc(cx, cy, R, 0, 7);
      ctx.strokeStyle = 'rgba(0,85,255,' + ringA + ')'; ctx.stroke();
    }
    if ($('loading').classList.contains('on')) requestAnimationFrame(loop);
  })();
}

let vals = [], notes = [], pencil = false, lightning = false, armed = 0, digitDone = {}, padBtns = [];

function begin(p) {
  puzzle = p.slice(); cur = -1; vals = new Array(81).fill(0);
  notes = Array.from({ length: 81 }, () => new Set());
  pencil = false; lightning = false; armed = 0; digitDone = {};
  $('pencilBtn').classList.remove('on'); $('zap').classList.remove('on', 'sparking');
  $('title').textContent = 'Level ' + level; $('msg').textContent = ''; $('rule').classList.remove('show');
  const grid = $('grid'); grid.innerHTML = ''; cells = [];
  for (let i = 0; i < 81; i++) {
    const d = document.createElement('div');
    d.className = 'cell' + ((i % 9) % 3 === 2 && i % 9 !== 8 ? ' r' : '') + ((((i / 9) | 0) % 3) === 2 && i < 72 ? ' b' : '') + (puzzle[i] ? ' given' : '');
    d.textContent = puzzle[i] || '';
    d.onclick = () => cellClick(i);
    grid.appendChild(d); cells.push(d);
  }
  const pad = $('pad'); pad.innerHTML = ''; padBtns = [];
  for (let n = 1; n <= 9; n++) { const b = document.createElement('button'); b.textContent = n; b.onclick = () => padPress(n); pad.appendChild(b); padBtns.push(b); }
  show('game'); paint(); paintPad();
}

function puzzleGiven(i) { return cells[i].classList.contains('given'); }
function value(i) { return puzzleGiven(i) ? puzzle[i] : vals[i]; }
const sameBox = (a, b) => ((a / 9 | 0) / 3 | 0) === ((b / 9 | 0) / 3 | 0) && ((a % 9) / 3 | 0) === ((b % 9) / 3 | 0);

// which rules does square i break? (row, column, box)
function conflictWhy(i) {
  const v = value(i), why = [];
  if (!v) return why;
  for (let k = 0; k < 81; k++) {
    if (k === i || value(k) !== v) continue;
    if ((k / 9 | 0) === (i / 9 | 0) && !why.includes('row')) why.push('row');
    if (k % 9 === i % 9 && !why.includes('column')) why.push('column');
    if (sameBox(k, i) && !why.includes('3×3 box')) why.push('3×3 box');
  }
  return why;
}
const conflict = i => conflictWhy(i).length > 0;

function paint() {
  cells.forEach((c, i) => {
    if (!puzzleGiven(i)) {
      const html = vals[i] ? String(vals[i])
        : notes[i].size ? '<span class="notes">' + [1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => '<i>' + (notes[i].has(n) ? n : '') + '</i>').join('') + '</span>' : '';
      if (c.dataset.h !== html) { c.innerHTML = html; c.dataset.h = html; }
    }
    c.classList.toggle('sel', i === cur);
    c.classList.toggle('mine', !puzzleGiven(i) && !!vals[i]);
    c.classList.toggle('bad', conflict(i));
  });
}
function paintPad() {
  padBtns.forEach((b, k) => { b.classList.toggle('armed', lightning && armed === k + 1); b.classList.toggle('gray', !!digitDone[k + 1]); b.disabled = !!digitDone[k + 1]; });
}

function cellClick(i) {
  if (puzzle[i]) return;
  cur = i;
  if (lightning && armed) { placeAt(i, (!pencil && vals[i] === armed) ? 0 : armed); return; }   // lightning: the lit number goes straight in
  paint();
}
function padPress(n) {
  if (digitDone[n]) return;
  if (lightning) { armed = armed === n ? 0 : n; paintPad(); return; }                          // light it up, then click squares
  if (cur >= 0) placeAt(cur, n);
}
function erase() { if (cur >= 0 && !puzzle[cur]) placeAt(cur, 0); }

function placeAt(i, n) {
  if (puzzle[i]) return;
  if (n === 0) { vals[i] = 0; notes[i].clear(); }
  else if (pencil) { if (vals[i]) return; notes[i].has(n) ? notes[i].delete(n) : notes[i].add(n); }
  else {
    vals[i] = n; notes[i].clear();
    for (let k = 0; k < 81; k++) if (k !== i && ((k / 9 | 0) === (i / 9 | 0) || k % 9 === i % 9 || sameBox(k, i))) notes[k].delete(n);
  }
  paint(); updateDigits(); showRule(i); if (n && !pencil) celebrate(i); checkWin();
}

function showRule(i) {
  const why = conflictWhy(i), r = $('rule');
  if (why.length) { r.textContent = "Rule: the same number can't be twice in the same " + (why.length > 1 ? why.slice(0, -1).join(', ') + ' and ' + why[why.length - 1] : why[0]) + '.'; r.classList.add('show'); }
  else r.classList.remove('show');
}

// A good number glows green. Finish a row, column or box and green spreads out along it from the square you just filled.
function flash(k, ms) {
  const c = cells[k];
  c.classList.remove('flash'); void c.offsetWidth;
  c.style.animationDelay = ms + 'ms'; c.classList.add('flash');
  c.addEventListener('animationend', () => { c.classList.remove('flash'); c.style.animationDelay = ''; }, { once: true });
}
function celebrate(i) {
  if (!value(i) || conflict(i)) return;
  const r = i / 9 | 0, col = i % 9, br = r - r % 3, bc = col - col % 3;
  const row = [], column = [], box = [];
  for (let k = 0; k < 9; k++) { row.push(r * 9 + k); column.push(k * 9 + col); box.push((br + (k / 3 | 0)) * 9 + bc + k % 3); }
  const complete = arr => { const set = new Set(arr.map(value)); return !set.has(0) && set.size === 9; };
  const delays = new Map();
  [row, column, box].filter(complete).forEach(arr => arr.forEach(k => {
    const ms = Math.round(Math.hypot((k / 9 | 0) - r, (k % 9) - col) * 90);
    delays.set(k, Math.min(ms, delays.has(k) ? delays.get(k) : ms));
  }));
  if (!delays.size) delays.set(i, 0);
  delays.forEach((ms, k) => flash(k, ms));
}

// when all nine of a number are in (and right), its button whirls away and goes gray
function updateDigits() {
  for (let n = 1; n <= 9; n++) {
    let count = 0, ok = true;
    for (let i = 0; i < 81; i++) if (value(i) === n) { count++; if (conflict(i)) ok = false; }
    const complete = count === 9 && ok;
    if (complete && !digitDone[n]) { digitDone[n] = true; if (armed === n) armed = 0; swirlDigit(n); }
    else if (!complete && digitDone[n]) digitDone[n] = false;
  }
  paintPad();
}
function swirlDigit(n) {
  const btn = padBtns[n - 1], r = btn.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  const pic = document.createElement('canvas'); pic.width = Math.round(r.width * dpr); pic.height = Math.round(r.height * dpr);
  const c = pic.getContext('2d');
  c.fillStyle = '#fca311'; c.beginPath(); c.roundRect(0, 0, pic.width, pic.height, 10 * dpr); c.fill();
  c.fillStyle = '#14213d'; c.font = '700 ' + (22 * dpr) + 'px system-ui,sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText(String(n), pic.width / 2, pic.height / 2 + dpr);
  whirl(pic, r.left, r.top, r.width, r.height, { intro: false, hold: 0, outro: true, ms: 900 });
}

function checkWin() {
  for (let i = 0; i < 81; i++) if (!value(i) || conflict(i)) return;
  $('msg').textContent = '🎉 You did it!';
  doneSet[level] = 1;
  if (level === unlocked && unlocked < LEVELS) unlocked++;
  try { localStorage.sudokuUnlocked = unlocked; localStorage.sudokuDone = JSON.stringify(doneSet); } catch (e) {}
  setTimeout(() => { buildLevels(); show('levelScreen'); }, 1800);
}

$('pencilBtn').onclick = () => { pencil = !pencil; $('pencilBtn').classList.toggle('on', pencil); };
$('eraseBtn').onclick = erase;
$('zap').onclick = () => {
  lightning = !lightning; armed = 0;
  const z = $('zap'); z.classList.toggle('on', lightning); z.classList.remove('sparking');
  if (lightning) { void z.offsetWidth; z.classList.add('sparking'); setTimeout(() => z.classList.remove('sparking'), 800); }
  paintPad();
};

document.addEventListener('keydown', e => {
  if (!$('game').classList.contains('on')) return;
  if (e.key >= '1' && e.key <= '9') padPress(+e.key);
  else if (e.key === 'Backspace' || e.key === 'Delete' || e.key === '0') erase();
  else if (e.key === 'p' || e.key === 'P') $('pencilBtn').click();
});
</script>
