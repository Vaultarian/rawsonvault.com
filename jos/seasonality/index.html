<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SEASONALITY!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">

<style>
/* ============================================================
   SEASONALITY! — intro screens
   Screen 1: the Rawson Vault logo
   Screen 2: the game title
   ============================================================ */

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  height: 100vh;
  overflow: hidden;
  background: #0b2a16;
  font-family: 'Fredoka', system-ui, sans-serif;
  cursor: pointer;
}

/* Both screens sit on top of each other. We fade between them. */
.screen {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 700ms ease;
}
.screen.on { opacity: 1; }


/* ============================================================
   SCREEN 1 — the orb falls and turns into the Mobius strip
   ============================================================ */

#screen1 {
  background: radial-gradient(circle at 50% 38%, #1d6b38 0%, #0f4526 55%, #072d17 100%);
}

/* the stage keeps everything centred */
.stage {
  position: relative;
  width: 340px;
  height: 340px;
  perspective: 900px;
}

/* --- the orange orb that falls in --- */
#orb {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 54px;
  height: 54px;
  margin: -27px 0 0 -27px;
  border-radius: 50%;
  background: radial-gradient(circle at 34% 30%, #ffe0a8 0%, #ffab4a 38%, #e07a1c 72%, #a34e0c 100%);
  box-shadow: 0 0 40px 10px rgba(255,160,60,.55);
  opacity: 0;
}

/* --- the ring the orb stretches into, before the real logo --- */
#ring {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 250px;
  height: 250px;
  margin: -125px 0 0 -125px;
  border-radius: 50%;
  border: 34px solid;
  border-color: #f0b271 #c87a34 #8a4a15 #e0a05c;
  opacity: 0;
  transform: scale(.15) rotateX(78deg) rotateZ(-200deg);
  box-shadow: 0 0 60px rgba(255,170,80,.4);
}

/* --- the real logo image --- */
#logo {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 260px;
  margin: -120px 0 0 -130px;
  opacity: 0;
  transform: scale(.7) rotateZ(-25deg);
  filter: drop-shadow(0 14px 30px rgba(0,0,0,.45));
}

/* --- RAWSON VAULT --- */
#brand {
  position: absolute;
  left: 50%;
  top: 50%;
  margin-top: 130px;
  transform: translateX(-50%);
  white-space: nowrap;
  font-family: 'Cinzel', serif;
  font-weight: 700;
  font-size: 30px;
  letter-spacing: .34em;
  color: #f4d9b4;
}
#brand span {
  display: inline-block;
  opacity: 0;
  transform: translateY(14px);
}


/* ============================================================
   SCREEN 2 — the forest grows, then the title
   ============================================================ */

#screen2 {
  flex-direction: column;
  background: linear-gradient(#bfe9f5 0%, #dff3e0 46%, #9fd47f 74%, #6fae52 100%);
}

/* the ground */
#soil {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 22%;
  background: linear-gradient(#5b3a1e, #3a2411);
}
#soil::before {           /* grass on top of the soil */
  content: '';
  position: absolute;
  left: 0; right: 0; top: -10px;
  height: 18px;
  background: #4f9c37;
  border-radius: 50% 50% 0 0 / 100% 100% 0 0;
}

/* each tree grows upward from its base */
.tree {
  position: absolute;
  bottom: 21%;
  transform-origin: 50% 100%;
  transform: scale(0);
  transition: transform 1100ms cubic-bezier(.22,1.4,.4,1);
}
.tree.grown { transform: scale(1); }

/* the title */
#title {
  position: relative;
  z-index: 5;
  margin-bottom: 8%;
  font-weight: 700;
  font-size: clamp(38px, 9vw, 104px);
  letter-spacing: .02em;
  color: #1f6b2a;
  text-shadow: 0 4px 0 #145121, 0 6px 16px rgba(0,0,0,.28);
}
#title span {
  display: inline-block;
  opacity: 0;
  transform: translateY(70px) scale(.4);
  transition: opacity 500ms ease, transform 620ms cubic-bezier(.2,1.5,.4,1);
}
#title span.up { opacity: 1; transform: translateY(0) scale(1); }

/* the play button */
#play {
  position: absolute;
  bottom: 9%;
  padding: 16px 52px;
  font-family: 'Fredoka', sans-serif;
  font-weight: 600;
  font-size: 26px;
  letter-spacing: .12em;
  color: #fff;
  background: #2e8b3d;
  border: none;
  border-bottom: 5px solid #1c5c27;
  border-radius: 14px;
  cursor: pointer;
  opacity: 0;
  transition: opacity 600ms ease, transform 120ms ease;
}
#play.on { opacity: 1; }
#play:hover { background: #35a247; }
#play:active { transform: translateY(3px); border-bottom-width: 2px; }

/* the little "click to skip" hint */
#skip {
  position: absolute;
  right: 18px;
  bottom: 14px;
  font-size: 13px;
  letter-spacing: .14em;
  color: rgba(255,255,255,.4);
}
</style>
</head>

<body>

<!-- ============ SCREEN 1 ============ -->
<div class="screen" id="screen1">
  <div class="stage">
    <div id="orb"></div>
    <div id="ring"></div>
    <img id="logo" src="vault-icon.png" alt="Rawson Vault">
    <div id="brand"></div>
  </div>
</div>

<!-- ============ SCREEN 2 ============ -->
<div class="screen" id="screen2">
  <div id="soil"></div>
  <h1 id="title"></h1>
  <button id="play">PLAY</button>
</div>

<div id="skip">CLICK TO SKIP</div>


<script>
/* ============================================================
   All the timings live here, so they are easy to change.
   Every number is milliseconds from the start of the intro.
   ============================================================ */
const T = {
  screen1On:   200,
  orbFall:     400,    // orb starts falling
  orbLand:    1400,    // orb reaches the middle
  morph:      1600,    // orb stretches into a ring
  toLogo:     2500,    // ring turns into the real logo
  brand:      2900,    // RAWSON VAULT letters come up
  screen1Off: 5000,
  screen2On:  5500,
  trees:      5700,    // the forest starts growing
  titleUp:    7100,    // SEASONALITY! rises out of the ground
  playBtn:    8600
};

const orb   = document.getElementById('orb');
const ring  = document.getElementById('ring');
const logo  = document.getElementById('logo');
const brand = document.getElementById('brand');
const title = document.getElementById('title');
const play  = document.getElementById('play');

/* --- put each letter in its own <span> so we can animate them one by one --- */
function letters(box, text) {
  box.innerHTML = '';
  for (const ch of text) {
    const s = document.createElement('span');
    s.textContent = ch === ' ' ? ' ' : ch;
    box.appendChild(s);
  }
  return box.querySelectorAll('span');
}
const brandLetters = letters(brand, 'RAWSON VAULT');
const titleLetters = letters(title, 'SEASONALITY!');


/* ============================================================
   Build the forest — a row of trees of different sizes
   ============================================================ */
function makeTree(x, size, kind) {
  const el = document.createElement('div');
  el.className = 'tree';
  el.style.left = x + '%';
  el.style.marginLeft = (-size / 2) + 'px';

  if (kind === 'pine') {
    el.innerHTML = `
      <svg width="${size}" height="${size * 1.5}" viewBox="0 0 100 150">
        <rect x="44" y="108" width="12" height="42" fill="#6b4423"/>
        <polygon points="50,6   84,64  16,64" fill="#2f7d3b"/>
        <polygon points="50,40  92,104 8,104" fill="#358c42"/>
        <polygon points="50,72  98,136 2,136" fill="#3c9c4a"/>
      </svg>`;
  } else {
    el.innerHTML = `
      <svg width="${size}" height="${size * 1.5}" viewBox="0 0 100 150">
        <rect x="44" y="96" width="12" height="54" fill="#6b4423"/>
        <circle cx="50" cy="54" r="40" fill="#3c9c4a"/>
        <circle cx="26" cy="74" r="26" fill="#348c42"/>
        <circle cx="74" cy="74" r="26" fill="#45a955"/>
        <circle cx="50" cy="38" r="24" fill="#4fb85f"/>
      </svg>`;
  }
  document.getElementById('screen2').appendChild(el);
  return el;
}

const forest = [
  makeTree(8,  70,  'pine'),
  makeTree(20, 100, 'round'),
  makeTree(33, 62,  'round'),
  makeTree(48, 120, 'pine'),   /* the big willow in the middle */
  makeTree(63, 66,  'round'),
  makeTree(76, 104, 'pine'),
  makeTree(90, 74,  'round')
];


/* ============================================================
   The timeline
   ============================================================ */
const timers = [];
function at(ms, fn) { timers.push(setTimeout(fn, ms)); }

/* --- SCREEN 1 --- */
at(T.screen1On, () => document.getElementById('screen1').classList.add('on'));

at(T.orbFall, () => {
  orb.style.transition = 'none';
  orb.style.transform  = 'translateY(-46vh)';
  orb.style.opacity    = '1';
  /* next frame, let it fall */
  requestAnimationFrame(() => requestAnimationFrame(() => {
    orb.style.transition = `transform ${T.orbLand - T.orbFall}ms cubic-bezier(.5,0,.85,.4)`;
    orb.style.transform  = 'translateY(0)';
  }));
});

/* squash when it lands */
at(T.orbLand, () => {
  orb.style.transition = 'transform 130ms ease-out';
  orb.style.transform  = 'scale(1.35, .62)';
});
at(T.orbLand + 130, () => {
  orb.style.transition = 'transform 120ms ease-in-out';
  orb.style.transform  = 'scale(.9, 1.15)';
});

/* the orb stretches and spins out into a ring */
at(T.morph, () => {
  orb.style.transition = 'transform 500ms ease-in, opacity 500ms ease-in';
  orb.style.transform  = 'scale(2.6, 2.6)';
  orb.style.opacity    = '0';

  ring.style.transition = 'transform 900ms cubic-bezier(.3,.9,.3,1), opacity 300ms ease';
  ring.style.opacity    = '1';
  ring.style.transform  = 'scale(1) rotateX(18deg) rotateZ(0deg)';
});

/* the ring becomes the real Mobius strip */
at(T.toLogo, () => {
  ring.style.transition = 'opacity 500ms ease, transform 700ms ease';
  ring.style.opacity    = '0';
  ring.style.transform  = 'scale(1.06) rotateX(14deg) rotateZ(6deg)';

  logo.style.transition = 'opacity 600ms ease, transform 900ms cubic-bezier(.2,1.3,.4,1)';
  logo.style.opacity    = '1';
  logo.style.transform  = 'scale(1) rotateZ(0deg)';
});

/* RAWSON VAULT, one letter at a time */
at(T.brand, () => {
  brandLetters.forEach((s, i) => {
    setTimeout(() => {
      s.style.transition = 'opacity 400ms ease, transform 500ms cubic-bezier(.2,1.4,.4,1)';
      s.style.opacity   = '1';
      s.style.transform = 'translateY(0)';
    }, i * 65);
  });
});

/* --- swap the screens --- */
at(T.screen1Off, () => document.getElementById('screen1').classList.remove('on'));
at(T.screen2On,  () => document.getElementById('screen2').classList.add('on'));

/* --- SCREEN 2 --- */
at(T.trees, () => {
  forest.forEach((tree, i) => {
    setTimeout(() => tree.classList.add('grown'), i * 150);
  });
});

at(T.titleUp, () => {
  titleLetters.forEach((s, i) => {
    setTimeout(() => s.classList.add('up'), i * 90);
  });
});

at(T.playBtn, () => play.classList.add('on'));


/* ============================================================
   Click anywhere to skip straight to the end
   ============================================================ */
function skipIntro() {
  timers.forEach(clearTimeout);
  document.getElementById('screen1').classList.remove('on');
  document.getElementById('screen2').classList.add('on');
  forest.forEach(t => t.classList.add('grown'));
  titleLetters.forEach(s => s.classList.add('up'));
  play.classList.add('on');
  document.getElementById('skip').style.display = 'none';
}
document.body.addEventListener('click', e => {
  if (e.target.id === 'play') return;
  skipIntro();
});

play.addEventListener('click', () => {
  play.textContent = 'COMING SOON!';
});
</script>
</body>
</html>
