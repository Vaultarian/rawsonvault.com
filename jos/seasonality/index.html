<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SEASONALITY!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">

<style>
/* ============================================================
   SEASONALITY! — intro screens
   Screen 1: the Rawson Vault logo
   Screen 2: the game title
   ============================================================ */

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  height: 100vh;
  overflow: hidden;
  background: #0b2a16;
  font-family: 'Fredoka', system-ui, sans-serif;
  cursor: pointer;
}

/* Both screens sit on top of each other. We fade between them. */
.screen {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 700ms ease;
}
.screen.on { opacity: 1; }


/* ============================================================
   SCREEN 1 — the orb falls and turns into the Mobius strip
   ============================================================ */

#screen1 {
  background: radial-gradient(circle at 50% 38%, #1d6b38 0%, #0f4526 55%, #072d17 100%);
}

/* the stage keeps everything centred */
.stage {
  position: relative;
  width: 340px;
  height: 340px;
  perspective: 900px;
}

/* --- the fal.ai clips: they fill the screen behind everything --- */
.clip {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: 0;
}

/* --- the orange orb that falls in --- */
#orb {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 54px;
  height: 54px;
  margin: -27px 0 0 -27px;
  border-radius: 50%;
  background: radial-gradient(circle at 34% 30%, #ffe0a8 0%, #ffab4a 38%, #e07a1c 72%, #a34e0c 100%);
  box-shadow: 0 0 40px 10px rgba(255,160,60,.55);
  opacity: 0;
}

/* --- the ring the orb stretches into, before the real logo --- */
#ring {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 250px;
  height: 250px;
  margin: -125px 0 0 -125px;
  border-radius: 50%;
  border: 34px solid;
  border-color: #f0b271 #c87a34 #8a4a15 #e0a05c;
  opacity: 0;
  transform: scale(.15) rotateX(78deg) rotateZ(-200deg);
  box-shadow: 0 0 60px rgba(255,170,80,.4);
}

/* --- the real logo image --- */
#logo {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 260px;
  margin: -120px 0 0 -130px;
  opacity: 0;
  transform: scale(.7) rotateZ(-25deg);
  filter: drop-shadow(0 14px 30px rgba(0,0,0,.45));
}

/* --- RAWSON VAULT --- */
#brand {
  z-index: 5;
  position: absolute;
  left: 50%;
  top: 50%;
  margin-top: 130px;
  transform: translateX(-50%);
  white-space: nowrap;
  font-family: 'Cinzel', serif;
  font-weight: 700;
  font-size: 30px;
  letter-spacing: .34em;
  color: #f4d9b4;
}
#brand span {
  display: inline-block;
  opacity: 0;
  transform: translateY(14px);
}


/* ============================================================
   SCREEN 2 — the forest grows, then the title
   ============================================================ */

#screen2 {
  flex-direction: column;
  background: linear-gradient(#bfe9f5 0%, #dff3e0 46%, #9fd47f 74%, #6fae52 100%);
}

/* the ground */
#soil {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 22%;
  background: linear-gradient(#5b3a1e, #3a2411);
}
#soil::before {           /* grass on top of the soil */
  content: '';
  position: absolute;
  left: 0; right: 0; top: -10px;
  height: 18px;
  background: #4f9c37;
  border-radius: 50% 50% 0 0 / 100% 100% 0 0;
}

/* each tree grows upward from its base */
.tree {
  position: absolute;
  bottom: 21%;
  transform-origin: 50% 100%;
  transform: scale(0);
  transition: transform 1100ms cubic-bezier(.22,1.4,.4,1);
}
.tree.grown { transform: scale(1); }

/* the title */
#title {
  /* Size and position are worked out in JS from the video's real
     rectangle — see placeTitle(). Guessing them in percentages went
     wrong twice, because `object-fit: cover` crops the clip by an
     amount that depends on the window shape. */
  position: absolute;
  z-index: 5;
  margin: 0;
  white-space: nowrap;
  font-family: 'Fredoka', sans-serif;
  font-weight: 700;
  line-height: 1;
  letter-spacing: .02em;
  color: #1f6b2a;
  opacity: 0;
  transition: opacity 220ms ease;
}
#title.on { opacity: 1; }

/* the play button */
#play {
  z-index: 5;          /* in front of the forest clip */
  position: absolute;
  bottom: 9%;
  padding: 16px 52px;
  font-family: 'Fredoka', sans-serif;
  font-weight: 600;
  font-size: 26px;
  letter-spacing: .12em;
  color: #fff;
  background: #2e8b3d;
  border: none;
  border-bottom: 5px solid #1c5c27;
  border-radius: 14px;
  cursor: pointer;
  opacity: 0;
  transition: opacity 600ms ease, transform 120ms ease;
}
#play.on { opacity: 1; }
#play:hover { background: #35a247; }
#play:active { transform: translateY(3px); border-bottom-width: 2px; }

/* the little "click to skip" hint */
#skip {
  z-index: 9;
  position: absolute;
  right: 18px;
  bottom: 14px;
  font-size: 13px;
  letter-spacing: .14em;
  color: rgba(255,255,255,.4);
}
</style>
</head>

<body>

<!-- ============ SCREEN 1 ============ -->
<div class="screen" id="screen1">
  <video id="clip1" class="clip" src="video/intro-logo.mp4"
         muted playsinline preload="auto"></video>
  <div class="stage">
    <div id="brand"></div>
  </div>
</div>

<!-- ============ SCREEN 2 ============ -->
<div class="screen" id="screen2">
  <video id="clip2" class="clip" src="video/intro-forest.mp4"
         muted playsinline preload="auto"></video>
  <h1 id="title">SEASONALITY!</h1>
  <button id="play">PLAY</button>
</div>

<div id="skip">CLICK TO SKIP</div>


<script>
/* ============================================================
   All the timings live here, so they are easy to change.
   Every number is milliseconds from the start of the intro.
   ============================================================ */
const T = {
  screen1On:   200,    /* the logo clip starts */
  brand:      6100,    /* RAWSON VAULT comes up, drawn in code so it is sharp */
  screen1Off: 8500,
  screen2On:  9000     /* the forest clip starts */
  /* titleUp and playBtn are gone: both now fire off the clip's own
     'ended' event, so they cannot drift out of step with it. */
};

const title = document.getElementById('title');
const clip1 = document.getElementById('clip1');
const clip2 = document.getElementById('clip2');
const brand = document.getElementById('brand');
const play  = document.getElementById('play');

/* --- put each letter in its own <span> so we can animate them one by one --- */
function letters(box, text) {
  box.innerHTML = '';
  for (const ch of text) {
    const s = document.createElement('span');
    s.textContent = ch === ' ' ? ' ' : ch;
    box.appendChild(s);
  }
  return box.querySelectorAll('span');
}
const brandLetters = letters(brand, 'RAWSON VAULT');
/* The title is one solid piece of text now, not separate letters — it has
   to line up exactly with the one in the video, so it cannot animate in. */


/* ============================================================
   Build the forest — a row of trees of different sizes
   ============================================================ */
function makeTree(x, size, kind) {
  const el = document.createElement('div');
  el.className = 'tree';
  el.style.left = x + '%';
  el.style.marginLeft = (-size / 2) + 'px';

  if (kind === 'pine') {
    el.innerHTML = `
      <svg width="${size}" height="${size * 1.5}" viewBox="0 0 100 150">
        <rect x="44" y="108" width="12" height="42" fill="#6b4423"/>
        <polygon points="50,6   84,64  16,64" fill="#2f7d3b"/>
        <polygon points="50,40  92,104 8,104" fill="#358c42"/>
        <polygon points="50,72  98,136 2,136" fill="#3c9c4a"/>
      </svg>`;
  } else {
    el.innerHTML = `
      <svg width="${size}" height="${size * 1.5}" viewBox="0 0 100 150">
        <rect x="44" y="96" width="12" height="54" fill="#6b4423"/>
        <circle cx="50" cy="54" r="40" fill="#3c9c4a"/>
        <circle cx="26" cy="74" r="26" fill="#348c42"/>
        <circle cx="74" cy="74" r="26" fill="#45a955"/>
        <circle cx="50" cy="38" r="24" fill="#4fb85f"/>
      </svg>`;
  }
  document.getElementById('screen2').appendChild(el);
  return el;
}

/* The trees used to be drawn here in CSS. They are inside
   video/intro-forest.mp4 now, so this list is deliberately empty. */
const forest = [];


/* ============================================================
   The timeline
   ============================================================ */
const timers = [];
function at(ms, fn) { timers.push(setTimeout(fn, ms)); }

/* --- SCREEN 1 --- */
at(T.screen1On, () => {
  document.getElementById('screen1').classList.add('on');
  clip1.currentTime = 0;
  clip1.play();
});

at(T.brand, () => {
  brandLetters.forEach((s, i) => {
    setTimeout(() => {
      s.style.transition = 'opacity 400ms ease, transform 500ms cubic-bezier(.2,1.4,.4,1)';
      s.style.opacity   = '1';
      s.style.transform = 'translateY(0)';
    }, i * 65);
  });
});

/* --- swap the screens --- */
at(T.screen1Off, () => document.getElementById('screen1').classList.remove('on'));
at(T.screen2On,  () => document.getElementById('screen2').classList.add('on'));

/* --- SCREEN 2 --- */
at(T.screen2On + 40, () => {
  clip2.currentTime = 0;
  clip2.play();
});

/* ------------------------------------------------------------------
   Put the crisp title exactly where the blurry one is.

   frame5-title.png was drawn at 1280x720 with the text 104px tall and
   its top edge 13% down. The clip is shown with `object-fit: cover`,
   which scales it up and crops the overflow — so we work out that same
   scale here and apply it, instead of guessing percentages.
   ------------------------------------------------------------------ */
const TITLE_PX   = 104;     /* font size in the original 1280x720 frame */
const TITLE_TOP  = 0.13;    /* top edge, as a fraction of frame height  */

function placeTitle() {
  const vw = clip2.videoWidth  || 1280;
  const vh = clip2.videoHeight || 720;
  const r  = clip2.getBoundingClientRect();
  if (!r.width || !r.height) return;

  const scale = Math.max(r.width / vw, r.height / vh);   /* object-fit: cover */
  const drawnH = vh * scale;
  const topOfFrame = r.top + (r.height - drawnH) / 2;

  title.style.fontSize  = (TITLE_PX * scale) + 'px';
  title.style.top       = (topOfFrame + TITLE_TOP * vh * scale) + 'px';
  title.style.left      = '50%';
  title.style.transform = 'translateX(-50%)';
  title.style.textShadow =
    `0 ${4 * scale}px 0 #145121, 0 ${6 * scale}px ${16 * scale}px rgba(0,0,0,.28)`;
}

clip2.addEventListener('loadedmetadata', placeTitle);
window.addEventListener('resize', placeTitle);

/* The clip's own title is still growing right up to the last frame, so
   the sharp one waits for the video to actually finish. No guessed
   timestamp — the video says when. */
clip2.addEventListener('ended', () => {
  placeTitle();
  placeTitle();
  title.classList.add('on');
});

/* PLAY comes up just after the title settles. */
clip2.addEventListener('ended', () => setTimeout(() => play.classList.add('on'), 700));


/* ============================================================
   Click anywhere to skip straight to the end
   ============================================================ */
function skipIntro() {
  timers.forEach(clearTimeout);
  document.getElementById('screen1').classList.remove('on');
  document.getElementById('screen2').classList.add('on');
  clip1.pause();
  clip2.play();
  /* jump to the end so the finished forest is showing */
  clip2.addEventListener('loadedmetadata', () => {
    clip2.currentTime = Math.max(0, clip2.duration - 0.05);
  }, { once: true });
  if (clip2.readyState >= 1) clip2.currentTime = Math.max(0, clip2.duration - 0.05);
  clip2.pause();
  placeTitle();
  title.classList.add('on');
  play.classList.add('on');
  document.getElementById('skip').style.display = 'none';
}
document.body.addEventListener('click', e => {
  if (e.target.id === 'play') return;
  skipIntro();
});

play.addEventListener('click', () => {
  play.textContent = 'COMING SOON!';
});
</script>
</body>
</html>
