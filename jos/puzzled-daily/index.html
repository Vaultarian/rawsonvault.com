<!DOCTYPE html>
<html lang="en">
<head>
<script src="../swirl.js"></script>
<script src="../mods.js" data-game></script><script src="../cursors.js"></script>
<script src="../lang.js" data-game></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jos's Puzzle Daily</title>
<style>
  :root { --bg:#0d0b1f; --panel:#17143a; --line:#2a2550; --ink:#f2f0ff; --dim:#9a95c9; --green:#6bff4e; --yellow:#ffe14e; --pink:#ff4ec7; }
  * { box-sizing:border-box; }
  html, body { margin:0; min-height:100%; background:var(--bg); color:var(--ink); font-family:'Comic Sans MS','Trebuchet MS',sans-serif; }
  body { display:flex; flex-direction:column; align-items:center; padding:12px 16px 28px; }
  #back { align-self:flex-start; color:var(--dim); text-decoration:none; font-size:.95em; }
  h1 { margin:6px 0 0; font-size:1.8em; letter-spacing:.06em; text-align:center; }
  #date { margin:4px 0 18px; color:var(--yellow); font-size:1.15em; text-align:center; }
  .card { display:block; width:min(420px,100%); background:var(--panel); border:2px solid var(--line); border-radius:16px; padding:16px 18px; margin-bottom:12px; color:var(--ink); text-decoration:none; }
  .card:hover { border-color:var(--pink); box-shadow:0 0 16px #ff4ec766; }
  .card b { font-size:1.35em; } .card span { display:block; color:var(--dim); margin-top:4px; }
  .done { border-color:var(--green); }
</style>
</head>
<body>
<a id="back" href="../index.html">← Jos's home</a>
<h1>🧩 Jos's Puzzle Daily</h1>
<div id="date"></div>
<a class="card" id="scoot" href="scoot/"><b>🟥 Scoot</b><span>Slide the blocks and let the red one escape.</span></a>
<a class="card" id="neon" href="neon/"><b>💡 Neon</b><span>Join the matching dots. No crossing!</span></a>
<a class="card" id="currents" href="currents/"><b>🌊 Currents</b><span>One line through the numbers, in order.</span></a>
<div style="color:var(--dim);text-align:center;max-width:420px">One puzzle each, every day. A bot makes them fresh at midnight.</div>
<script>
  const q = new URLSearchParams(location.search).get('day'), d = new Date();
  const DAY = q && /^\d{4}-\d{2}-\d{2}$/.test(q) ? q : d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  const [y, m, dd] = DAY.split('-').map(Number);
  document.getElementById('date').textContent = 'Today is ' + new Date(y, m-1, dd).toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
  ['scoot','neon','currents'].forEach(g => {
    let done = false; try { done = !!localStorage.getItem('jos-puzzle:' + DAY + ':' + g); } catch (e) {}
    if (done) { const c = document.getElementById(g); c.classList.add('done'); c.querySelector('b').textContent += ' ✅'; }
    if (q) document.getElementById(g).href += '?day=' + q;
  });
</script>
</body>
</html>
