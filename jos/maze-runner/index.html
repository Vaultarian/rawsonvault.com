<!DOCTYPE html>
<html>
<head>
<title>Maze Runner</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; }
body {
  font-family: Arial, sans-serif;
  background: #0d0d1f;
  color: white;
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  text-align: center;
}
#hud { display:flex; gap:20px; margin-bottom:8px; font-size:13px; letter-spacing:2px; color:#aaa; }
#hud span { color:#f0c040; font-weight:bold; font-size:16px; }
#shape-label { font-size:11px; color:#555; letter-spacing:3px; margin-bottom:8px; }
canvas { display:block; }
#overlay {
  position:fixed; top:0; left:0; width:100%; height:100%;
  background:rgba(0,0,0,0.92);
  display:flex; flex-direction:column;
  align-items:center; justify-content:center; z-index:10;
}
#overlay h1 { font-size:26px; margin-bottom:8px; }
#overlay p { font-size:13px; color:#aaa; margin-bottom:22px; line-height:1.8; max-width:300px; }
#overlay .big { font-size:55px; margin-bottom:10px; }
.ob-btn {
  background:none; border:2px solid #f0c040; color:#f0c040;
  font-size:13px; font-weight:bold; letter-spacing:3px;
  padding:11px 30px; border-radius:10px; cursor:pointer; margin-top:8px;
}
.ob-btn:hover { background:#f0c040; color:#000; }
</style>
</head>
<body>
<div id="hud">
  LEVEL <span id="lv">1</span> &nbsp;|&nbsp;
  TIME <span id="tm">0s</span> &nbsp;|&nbsp;
  BEST <span id="bs">—</span>
</div>
<div id="shape-label">SQUARE MAZE</div>
<canvas id="c"></canvas>

<div id="overlay">
  <div class="big">🧩</div>
  <h1>MAZE RUNNER</h1>
  <p>Find the 🏁 exit!<br>Arrow keys or WASD to move.<br>Hold a key to keep moving!<br>Each level is a random shape!</p>
  <button class="ob-btn" onclick="startLevel()">START! 🚀</button>
</div>

<script>
var cv = document.getElementById("c");
var ctx = cv.getContext("2d");
var W = 320, H = 320;
cv.width = W; cv.height = H;

var level = 1;
var currentShape = "square";
var gameRunning = false;
var timerSec = 0, timerInt = null;
var bestTimes = {};
var vx=0,vy=0,tvx=0,tvy=0;
var rafId = null;
var heldKey=null, moveInterval=null;
var MOVE_MS = 160;

/* ============================================================
   SQUARE MAZE — recursive backtracker (perfect maze, always solvable)
   ============================================================ */
var sq = {};

function sqMake(cols, rows) {
  var g = [];
  for (var r=0;r<rows;r++) {
    g.push([]);
    for (var c=0;c<cols;c++) g[r].push({n:true,s:true,e:true,w:true,vis:false});
  }
  var stack=[[0,0]]; g[0][0].vis=true;
  while (stack.length>0) {
    var cur=stack[stack.length-1], cx=cur[0], cy=cur[1], dirs=[];
    if(cy>0      &&!g[cy-1][cx].vis) dirs.push([0,-1,"n","s"]);
    if(cy<rows-1 &&!g[cy+1][cx].vis) dirs.push([0, 1,"s","n"]);
    if(cx<cols-1 &&!g[cy][cx+1].vis) dirs.push([1, 0,"e","w"]);
    if(cx>0      &&!g[cy][cx-1].vis) dirs.push([-1,0,"w","e"]);
    if(!dirs.length){stack.pop();continue;}
    var d=dirs[Math.floor(Math.random()*dirs.length)];
    g[cy][cx][d[2]]=false; g[cy+d[1]][cx+d[0]][d[3]]=false;
    g[cy+d[1]][cx+d[0]].vis=true; stack.push([cx+d[0],cy+d[1]]);
  }
  /* seal all borders */
  for(var r=0;r<rows;r++) for(var c=0;c<cols;c++) {
    if(r===0) g[r][c].n=true; if(r===rows-1) g[r][c].s=true;
    if(c===0) g[r][c].w=true; if(c===cols-1) g[r][c].e=true;
  }
  /* open exit at right of bottom-right cell */
  g[rows-1][cols-1].e=false;
  return g;
}

function sqPx(c,r){
  return {x:(W-sq.cols*sq.cell)/2+c*sq.cell+sq.cell/2, y:(H-sq.rows*sq.cell)/2+r*sq.cell+sq.cell/2};
}

function sqInit(){
  sq.cols=5+level*2; sq.rows=5+level*2;
  sq.cell=Math.floor(Math.min(W/sq.cols,H/sq.rows));
  sq.grid=sqMake(sq.cols,sq.rows);
  sq.px=0; sq.py=0; sq.ex=sq.cols-1; sq.ey=sq.rows-1;
  var p=sqPx(0,0); vx=p.x;vy=p.y;tvx=p.x;tvy=p.y;
}

function sqDraw(){
  ctx.clearRect(0,0,W,H); ctx.fillStyle="#0d0d1f"; ctx.fillRect(0,0,W,H);
  var ox=(W-sq.cols*sq.cell)/2, oy=(H-sq.rows*sq.cell)/2;
  ctx.strokeStyle="#f0c040"; ctx.lineWidth=2; ctx.lineCap="round";
  for(var r=0;r<sq.rows;r++) for(var c=0;c<sq.cols;c++){
    var x=ox+c*sq.cell,y=oy+r*sq.cell,s=sq.cell,g=sq.grid[r][c];
    if(g.n){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+s,y);ctx.stroke();}
    if(g.s){ctx.beginPath();ctx.moveTo(x,y+s);ctx.lineTo(x+s,y+s);ctx.stroke();}
    if(g.e){ctx.beginPath();ctx.moveTo(x+s,y);ctx.lineTo(x+s,y+s);ctx.stroke();}
    if(g.w){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y+s);ctx.stroke();}
  }
  var ep=sqPx(sq.ex,sq.ey);
  ctx.font=sq.cell*0.7+"px Arial"; ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillText("🏁",ep.x+sq.cell,ep.y);
  ctx.font=sq.cell*0.75+"px Arial"; ctx.fillText("😊",vx,vy);
}

function sqMove(dx,dy){
  var g=sq.grid[sq.py][sq.px];
  if(sq.px===sq.ex&&sq.py===sq.ey&&dx===1&&!g.e){winLevel();return;}
  var nx=sq.px+dx,ny=sq.py+dy;
  if(nx<0||nx>=sq.cols||ny<0||ny>=sq.rows) return;
  if(dx===1&&g.e||dx===-1&&g.w||dy===1&&g.s||dy===-1&&g.n) return;
  sq.px=nx; sq.py=ny; var p=sqPx(nx,ny); tvx=p.x; tvy=p.y;
}

/* ============================================================
   CIRCLE MAZE
   ============================================================ */
var circ = {};

function circMake(){
  var numRings = 3+Math.min(level,5);
  circ.centerR=20;
  circ.ringW=(Math.min(W,H)/2-circ.centerR-8)/numRings;
  circ.rings=[];
  for(var ri=0;ri<numRings;ri++){
    var secs=Math.min(4+ri*3,16);
    circ.rings.push({secs:secs, radial:[], floor:[]});
    for(var s=0;s<secs;s++){circ.rings[ri].radial.push(true);circ.rings[ri].floor.push(true);}
  }
  /* DFS carve */
  var vis={};
  function key(r,s){return r+","+s;}
  function nb(r,s){
    var res=[], ring=circ.rings[r], secs2=ring.secs;
    res.push({r:r,s:(s+1)%secs2,type:"rad",wi:s});
    res.push({r:r,s:(s-1+secs2)%secs2,type:"rad",wi:(s-1+secs2)%secs2});
    if(r<numRings-1){
      var os=circ.rings[r+1].secs;
      res.push({r:r+1,s:Math.floor(s*os/secs2),type:"floorout",wi:s});
    }
    if(r>0){
      var is2=circ.rings[r-1].secs;
      var ns=Math.floor(s*is2/secs2);
      res.push({r:r-1,s:ns,type:"floorin",wi:ns});
    }
    return res;
  }
  var startR=Math.floor(numRings/2);
  var stack=[[startR,0]]; vis[key(startR,0)]=true;
  while(stack.length>0){
    var cur=stack[stack.length-1],cr=cur[0],cs=cur[1];
    var opts=nb(cr,cs).filter(function(n){return !vis[key(n.r,n.s)];});
    if(!opts.length){stack.pop();continue;}
    var next=opts[Math.floor(Math.random()*opts.length)];
    vis[key(next.r,next.s)]=true;
    if(next.type==="rad") circ.rings[cr].radial[next.wi]=false;
    else if(next.type==="floorout") circ.rings[cr].floor[next.wi]=false;
    else circ.rings[cr-1].floor[next.wi]=false;
    stack.push([next.r,next.s]);
  }
  circ.pr=startR; circ.ps=0;
  circ.er=numRings-1; circ.es=0;
  var c0=circCen(startR,0); vx=c0.x;vy=c0.y;tvx=c0.x;tvy=c0.y;
}

function circCen(r,s){
  var ring=circ.rings[r];
  if(!ring) return {x:W/2,y:H/2};
  var rad=circ.centerR+(r+0.5)*circ.ringW;
  var a=(s+0.5)/ring.secs*Math.PI*2-Math.PI/2;
  return {x:W/2+rad*Math.cos(a),y:H/2+rad*Math.sin(a)};
}

function circDraw(){
  ctx.clearRect(0,0,W,H); ctx.fillStyle="#0d0d1f"; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle="#f0c040"; ctx.lineWidth=2; ctx.lineCap="round";
  ctx.beginPath(); ctx.arc(W/2,H/2,circ.centerR,0,Math.PI*2); ctx.stroke();
  for(var ri=0;ri<circ.rings.length;ri++){
    var ring=circ.rings[ri];
    var innerR=circ.centerR+ri*circ.ringW;
    var outerR=circ.centerR+(ri+1)*circ.ringW;
    if(ri===circ.rings.length-1){ctx.beginPath();ctx.arc(W/2,H/2,outerR,0,Math.PI*2);ctx.stroke();}
    for(var si=0;si<ring.secs;si++){
      var a1=si/ring.secs*Math.PI*2-Math.PI/2;
      var a2=(si+1)/ring.secs*Math.PI*2-Math.PI/2;
      if(ring.floor[si]){ctx.beginPath();ctx.arc(W/2,H/2,outerR,a1,a2);ctx.stroke();}
      if(ring.radial[si]){
        ctx.beginPath();
        ctx.moveTo(W/2+innerR*Math.cos(a2),H/2+innerR*Math.sin(a2));
        ctx.lineTo(W/2+outerR*Math.cos(a2),H/2+outerR*Math.sin(a2));
        ctx.stroke();
      }
    }
  }
  /* exit flag */
  var ec=circCen(circ.er,circ.es);
  ctx.font="16px Arial"; ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillText("🏁",ec.x,ec.y);
  ctx.font="18px Arial"; ctx.fillText("😊",vx,vy);
}

function circMove(dir){
  var ring=circ.rings[circ.pr];
  if(!ring) return;
  var secs=ring.secs, pr=circ.pr, ps=circ.ps;
  var cur=circCen(pr,ps);
  /* gather reachable neighbours */
  var opts=[];
  var cw=(ps+1)%secs;
  if(!ring.radial[ps]){var c=circCen(pr,cw);opts.push({r:pr,s:cw,x:c.x,y:c.y});}
  var ccw=(ps-1+secs)%secs;
  if(!ring.radial[ccw]){var c=circCen(pr,ccw);opts.push({r:pr,s:ccw,x:c.x,y:c.y});}
  if(pr<circ.rings.length-1&&!ring.floor[ps]){
    var os=circ.rings[pr+1].secs;
    var ns=Math.min(Math.floor(ps*os/secs),os-1);
    var c=circCen(pr+1,ns);opts.push({r:pr+1,s:ns,x:c.x,y:c.y});
  }
  if(pr>0){
    var is2=circ.rings[pr-1].secs;
    var ns2=Math.floor(ps*is2/secs);
    if(!circ.rings[pr-1].floor[ns2]){var c=circCen(pr-1,ns2);opts.push({r:pr-1,s:ns2,x:c.x,y:c.y});}
  }
  if(!opts.length) return;
  /* pick neighbour whose screen position best matches direction */
  var best=null,bestScore=-9999;
  for(var i=0;i<opts.length;i++){
    var dx=opts[i].x-cur.x, dy=opts[i].y-cur.y;
    var score=dir==="right"?dx:dir==="left"?-dx:dir==="down"?dy:-dy;
    if(score>bestScore){bestScore=score;best=opts[i];}
  }
  if(!best||bestScore<=0) return;
  circ.pr=best.r; circ.ps=best.s;
  tvx=best.x; tvy=best.y;
  /* win check — reached exit cell */
  if(circ.pr===circ.er&&circ.ps===circ.es) winLevel();
}

/* ============================================================
   ANIMATION LOOP
   ============================================================ */
function loop(){
  vx+=(tvx-vx)*0.15; vy+=(tvy-vy)*0.15;
  if(currentShape==="square") sqDraw(); else circDraw();
  if(gameRunning) rafId=requestAnimationFrame(loop);
}

/* ============================================================
   INPUT
   ============================================================ */
function doMove(key){
  if(!gameRunning) return;
  if(currentShape==="square"){
    if(key==="ArrowRight"||key==="d"||key==="D") sqMove(1,0);
    else if(key==="ArrowLeft"||key==="a"||key==="A") sqMove(-1,0);
    else if(key==="ArrowDown"||key==="s"||key==="S") sqMove(0,1);
    else if(key==="ArrowUp"||key==="w"||key==="W") sqMove(0,-1);
  } else {
    if(key==="ArrowRight"||key==="d"||key==="D") circMove("right");
    else if(key==="ArrowLeft"||key==="a"||key==="A") circMove("left");
    else if(key==="ArrowDown"||key==="s"||key==="S") circMove("down");
    else if(key==="ArrowUp"||key==="w"||key==="W") circMove("up");
  }
}

document.addEventListener("keydown",function(e){
  var keys=["ArrowRight","ArrowLeft","ArrowDown","ArrowUp","d","D","a","A","s","S","w","W"];
  if(keys.indexOf(e.key)===-1) return;
  e.preventDefault();
  if(heldKey===e.key) return;
  heldKey=e.key; doMove(e.key);
  if(moveInterval) clearInterval(moveInterval);
  moveInterval=setInterval(function(){doMove(heldKey);},MOVE_MS);
});
document.addEventListener("keyup",function(e){
  if(e.key===heldKey){heldKey=null;if(moveInterval){clearInterval(moveInterval);moveInterval=null;}}
});

var tx0=0,ty0=0;
cv.addEventListener("touchstart",function(e){tx0=e.touches[0].clientX;ty0=e.touches[0].clientY;},{passive:true});
cv.addEventListener("touchend",function(e){
  if(!gameRunning) return;
  var dx=e.changedTouches[0].clientX-tx0,dy=e.changedTouches[0].clientY-ty0;
  if(Math.abs(dx)>Math.abs(dy)){
    if(currentShape==="square") sqMove(dx>0?1:-1,0); else circMove(dx>0?"right":"left");
  } else {
    if(currentShape==="square") sqMove(0,dy>0?1:-1); else circMove(dy>0?"down":"up");
  }
},{passive:true});

/* ============================================================
   GAME FLOW
   ============================================================ */
var SHAPE_OPTIONS=["square","circle","square","circle","square","circle"];
var SHAPE_LABELS={"square":"SQUARE MAZE","circle":"CIRCLE MAZE"};

function pickShape(){ currentShape="square"; }

function startLevel(){
  document.getElementById("overlay").style.display="none";
  document.getElementById("shape-label").textContent="MAZE "+ (5+level*2) +"x"+ (5+level*2) +" — LEVEL "+level;
  document.getElementById("lv").textContent=level;
  timerSec=0;
  if(timerInt) clearInterval(timerInt);
  timerInt=setInterval(function(){timerSec++;document.getElementById("tm").textContent=timerSec+"s";},1000);
  if(currentShape==="square") sqInit(); else circMake();
  gameRunning=true;
  if(rafId) cancelAnimationFrame(rafId);
  loop();
}

function winLevel(){
  gameRunning=false; clearInterval(timerInt);
  if(!bestTimes[level]||timerSec<bestTimes[level]) bestTimes[level]=timerSec;
  document.getElementById("bs").textContent=bestTimes[level]+"s";
  pickShape();
  var ov=document.getElementById("overlay");
  ov.innerHTML='<div class="big">🎉</div><h1>LEVEL '+level+' DONE!</h1><p>Finished in <b>'+timerSec+'s</b>!<br>Next: <b>'+(5+(level+1)*2)+'x'+(5+(level+1)*2)+' maze</b></p><button class="ob-btn" onclick="nextLevel()">NEXT LEVEL ➡️</button>';
  ov.style.display="flex";
}

function nextLevel(){level++;startLevel();}

/* start on square always */
currentShape="square";
</script>
</body>
</html>
