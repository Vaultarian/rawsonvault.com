<!DOCTYPE html>
<html lang="en">
<head>
<script src="../swirl.js"></script>
<script src="../mods.js" data-game></script><script src="../cursors.js"></script>
<script src="../lang.js" data-game></script>
<script src="../vendor/html2canvas.min.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jos Dictionary — Jos' Projects</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    /* ===== The Jos Dictionary =====
       Not a normal dictionary. Every word here is a word JOS himself has actually used,
       talking to Carl — so it starts small and grows every time he talks. No word goes in
       unless he said it.

       1. INTRO: his sentence, word by word, fading in on a dark screen.
       2. TRANSITION: a tilted photo flies in from the corner and grows to fill the screen,
          from the clip Jos recorded of Wondershare Filmora's transition gallery.
       3. THE DICTIONARY: his words, alphabetical, searchable. */
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { min-height:100%; }
    body { font-family:'Nunito',sans-serif; color:#223; background:#fdf6e3; overflow-x:hidden; }
    .back-link { position:fixed; top:12px; left:16px; z-index:50; font-family:'Fredoka One',cursive; color:#223; text-decoration:none;
                 font-size:1rem; background:#fff; padding:.35rem .9rem; border-radius:50px; box-shadow:0 3px 0 rgba(0,0,0,.15); }
    .back-link:hover { background:#223; color:#fff; }

    /* ---------- 1. the intro ---------- */
    #intro { position:fixed; inset:0; background:#0b1026; z-index:100; display:flex;
             flex-direction:column; align-items:center; justify-content:center; gap:.6rem;
             transition:opacity .8s ease; }
    #intro .line { font-family:'Fredoka One',cursive; color:#fff; font-size:clamp(1.4rem, 5vw, 2.6rem);
                   text-align:center; padding:0 20px; }
    #intro .line span { opacity:0; display:inline-block; transition:opacity .5s ease; }
    #intro .small { font-size:clamp(1rem, 3.2vw, 1.3rem); color:#b9c2e0; }
    #intro .book { font-size:4rem; opacity:0; transition:opacity .8s ease, transform .8s ease; transform:scale(.6); }

    /* ---------- 2. the transition — the camera-flash swap, from Jos's Filmora recording ----------
       1. The screen flashes white, like a camera taking a picture.
       2. What's on screen becomes a small tilted photo card, and the camera zooms OUT so you
          can see it sitting there.
       3. A new photo card appears and the camera zooms IN on it, until it fills the screen. */
    #stage { position:fixed; inset:0; z-index:90; pointer-events:none; }
    #flash { position:absolute; inset:0; background:#fff; opacity:0; }
    .card { position:absolute; left:50%; top:50%; background:#000; overflow:hidden; opacity:0;
            border:0 solid #fff; box-shadow:0 0 0 rgba(0,0,0,0);
            transition:width .7s cubic-bezier(.4,0,.2,1), height .7s cubic-bezier(.4,0,.2,1),
                       transform .7s cubic-bezier(.4,0,.2,1), border-radius .6s ease,
                       border-width .6s ease, box-shadow .6s ease, opacity .3s ease; }
    .card img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
    /* full screen: the card looks exactly like the real page underneath it */
    .card.full { width:100vw; height:100vh; border-radius:0; border-width:0; opacity:1;
                 transform:translate(-50%,-50%) rotate(0deg); }
    /* small: a tilted photo card with a white border, like a Polaroid just taken */
    .card.small-old { width:58vmin; height:36vmin; border-radius:8px; border-width:9px;
                       box-shadow:0 20px 50px rgba(0,0,0,.5); opacity:1;
                       transform:translate(-50%,-50%) rotate(-10deg); }
    .card.small-new { width:58vmin; height:36vmin; border-radius:8px; border-width:9px;
                       box-shadow:0 20px 50px rgba(0,0,0,.5); opacity:1;
                       transform:translate(-50%,-50%) rotate(9deg); }
    .card.gone { opacity:0; }

    /* ---------- 3. the dictionary itself ---------- */
    #dict { display:none; min-height:100vh; padding:60px 16px 40px; }
    h1 { font-family:'Fredoka One',cursive; font-weight:normal; text-align:center; font-size:2.6rem; }
    #tag { text-align:center; opacity:.65; margin:4px 0 20px; font-weight:800; }
    #search { display:block; margin:0 auto 24px; width:min(420px, 92vw); font-size:1.2rem;
              font-family:'Nunito',sans-serif; padding:.7rem 1.1rem; border-radius:50px; border:3px solid #e8dcc0;
              outline:none; }
    #search:focus { border-color:#e5533d; }
    #list { max-width:720px; margin:0 auto; display:flex; flex-direction:column; gap:12px; }
    .entry { background:#fff; border-radius:16px; padding:14px 20px; box-shadow:0 4px 12px rgba(0,0,0,.08);
             animation:pop .3s ease-out both; }
    @keyframes pop { from { transform:scale(.9); opacity:0; } }
    .entry .w { font-family:'Fredoka One',cursive; font-size:1.4rem; color:#e5533d; }
    .entry .d { margin-top:2px; }
    .entry .added { font-size:.75rem; opacity:.5; margin-top:4px; }
    #empty { text-align:center; opacity:.6; margin-top:40px; font-weight:800; display:none; }
    #count { text-align:center; margin-top:28px; opacity:.6; font-weight:800; }
  </style>
</head>
<body>
<a class="back-link" href="../#tools">← Back</a>

<div id="intro">
  <div class="book">📖</div>
  <div class="line" id="l1"></div>
  <div class="line small" id="l2"></div>
</div>
<div id="stage">
  <div id="flash"></div>
  <div class="card" id="cardOld"><img alt=""></div>
  <div class="card" id="cardNew"><img alt=""></div>
</div>

<div id="dict">
  <h1>📖 The Jos Dictionary</h1>
  <div id="tag">Every word here is one Jos has actually used.</div>
  <input id="search" type="text" placeholder="🔍 Search a word...">
  <div id="list"></div>
  <div id="empty">No word like that yet — maybe Jos hasn't said it!</div>
  <div id="count"></div>
</div>

<script src="words.js"></script>
<script>
const $ = id => document.getElementById(id);

/* ---------- 1. the intro: his sentence, fading in word by word ---------- */
function playWords(el, text, startDelay) {
  const words = text.split(' ');
  el.innerHTML = words.map(w => `<span>${w}</span>`).join(' ');
  const spans = el.querySelectorAll('span');
  spans.forEach((s, i) => setTimeout(() => { s.style.opacity = 1; }, startDelay + i * 160));
  return startDelay + spans.length * 160 + 500;
}

let t = 300;
setTimeout(() => { $('.book') ; document.querySelector('#intro .book').style.opacity = 1; document.querySelector('#intro .book').style.transform = 'scale(1)'; }, t);
t += 500;
t = playWords($('l1'), 'This is the Jos Dictionary.', t);
t = playWords($('l2'), 'It may not have all the words in the dictionary.', t + 200);

setTimeout(revealDictionary, t + 400);

/* ---------- 2. the transition — the camera-flash swap, from Jos's Filmora recording ----------
   1. Snapshot the intro screen (html2canvas — a real picture of the actual pixels).
   2. Flash white, like a camera. Swap in the snapshot so nothing visibly jumps.
   3. Zoom OUT: the snapshot shrinks into a small tilted photo card.
   4. Meanwhile the real dictionary gets built behind the scenes, and gets snapshotted too.
   5. The new snapshot pops in as a second small card, then zooms IN until it fills the screen —
      at which point it's hiding the real (identical) dictionary page, so the card just vanishes. */
async function revealDictionary() {
  const cardOld = $('cardOld'), cardNew = $('cardNew'), flash = $('flash'), stage = $('stage');

  // capture only what's actually on screen, not the whole scrollable page underneath —
  // and hide #stage itself first, or a snapshot would just capture the flash/cards on top
  // of whatever we're actually trying to photograph.
  const shot = opts => {
    const was = stage.style.visibility;
    stage.style.visibility = 'hidden';
    return html2canvas(document.body, {
      backgroundColor: null, x: 0, y: 0,
      width: window.innerWidth, height: window.innerHeight,
      windowWidth: window.innerWidth, windowHeight: window.innerHeight,
      ...opts,
    }).catch(() => null).finally(() => { stage.style.visibility = was; });
  };

  const before = await shot({ backgroundColor: '#0b1026' });
  if (before) cardOld.querySelector('img').src = before.toDataURL();

  flash.style.transition = 'opacity .12s ease';
  flash.style.opacity = 1;

  await wait(120);
  // the flash is covering everything right now — safe to swap the DOM underneath it
  $('intro').style.display = 'none';
  $('dict').style.display = 'block';
  buildList();

  const after = await shot({ backgroundColor: '#fdf6e3' });
  if (after) cardNew.querySelector('img').src = after.toDataURL();

  cardOld.classList.add('full');                 // looks identical to the frozen intro
  flash.style.opacity = 0;
  await wait(150);

  // zoom OUT: the old screen shrinks into a small tilted card
  cardOld.classList.remove('full');
  cardOld.classList.add('small-old');
  await wait(750);
  cardOld.classList.add('gone');

  // a new card pops in small, then zooms IN to fill the screen
  cardNew.classList.add('small-new');
  await wait(300);
  cardNew.classList.remove('small-new');
  cardNew.classList.add('full');
  await wait(750);

  $('stage').style.display = 'none';              // the real #dict underneath looks identical
}
const wait = ms => new Promise(ok => setTimeout(ok, ms));

/* ---------- 3. the dictionary ---------- */
const WORDS = DICTIONARY_WORDS.slice().sort((a, b) => a.word.localeCompare(b.word));

function buildList(filter) {
  const q = (filter || '').trim().toLowerCase();
  const show = WORDS.filter(w => !q || w.word.toLowerCase().includes(q) || w.def.toLowerCase().includes(q));
  $('list').innerHTML = show.map(w => `
    <div class="entry">
      <div class="w">${w.word}</div>
      <div class="d">${w.def}</div>
      <div class="added">added ${w.date}</div>
    </div>`).join('');
  $('empty').style.display = show.length ? 'none' : 'block';
  $('count').textContent = q ? `${show.length} word${show.length === 1 ? '' : 's'} found` : `${WORDS.length} word${WORDS.length === 1 ? '' : 's'} so far`;
}
$('search').addEventListener('input', e => buildList(e.target.value));
</script>
</body>
</html>
