<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timer & Stopwatch — Jos</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #080818;
      font-family: 'Nunito', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      overflow: hidden;
    }

    .back-link {
      position: fixed;
      top: 20px;
      left: 20px;
      font-family: 'Fredoka One', cursive;
      color: #ffffff44;
      text-decoration: none;
      font-size: 1rem;
      letter-spacing: 1px;
      transition: color 0.2s;
    }
    .back-link:hover { color: #fff; }

    .title {
      font-family: 'Fredoka One', cursive;
      font-size: 1.6rem;
      background: linear-gradient(90deg, #f72585, #7fff00, #00f5ff, #f72585);
      background-size: 300% 100%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: rainbowShift 4s linear infinite;
      letter-spacing: 4px;
      margin-bottom: 28px;
    }

    @keyframes rainbowShift {
      0% { background-position: 0% 50%; }
      100% { background-position: 300% 50%; }
    }

    /* Mode tabs */
    .tabs {
      display: flex;
      gap: 12px;
      margin-bottom: 40px;
    }

    .tab {
      font-family: 'Fredoka One', cursive;
      font-size: 1.3rem;
      padding: 10px 36px;
      border-radius: 50px;
      border: 3px solid transparent;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 1px;
      user-select: none;
    }

    .tab.sw { color: #00f5ff; border-color: #00f5ff; }
    .tab.sw.active { background: #00f5ff; color: #080818; }
    .tab.tm { color: #f72585; border-color: #f72585; }
    .tab.tm.active { background: #f72585; color: #080818; }

    /* Timer setup */
    .timer-setup {
      display: none;
      gap: 12px;
      align-items: center;
      margin-bottom: 32px;
    }
    .timer-setup.visible { display: flex; }

    .timer-setup input {
      font-family: 'Fredoka One', cursive;
      font-size: 2.5rem;
      width: 90px;
      text-align: center;
      background: #ffffff11;
      border: 3px solid #f72585;
      border-radius: 14px;
      color: #f72585;
      padding: 6px;
      outline: none;
    }
    .timer-setup input:focus { border-color: #fff; color: #fff; }
    .timer-setup span {
      font-family: 'Fredoka One', cursive;
      font-size: 2.5rem;
      color: #ffffff33;
    }

    /* Main display */
    .display {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      margin-bottom: 48px;
    }

    .unit-wrap {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: visible;
    }

    .unit-label {
      font-family: 'Fredoka One', cursive;
      font-size: 0.85rem;
      letter-spacing: 3px;
      margin-bottom: 6px;
      text-transform: uppercase;
      opacity: 0.8;
    }

    .unit-val {
      font-family: 'Fredoka One', cursive;
      font-size: 7rem;
      line-height: 1;
      min-width: 2ch;
      text-align: center;
    }

    .mm .unit-label, .mm .unit-val { color: #f72585; }
    .ss .unit-label, .ss .unit-val { color: #7fff00; }
    .cs .unit-label, .cs .unit-val { color: #00f5ff; }

    .colon {
      font-family: 'Fredoka One', cursive;
      font-size: 6rem;
      color: #ffffff22;
      padding-top: 28px;
      line-height: 1;
    }

    .colon.pulse { animation: blink 1s step-start infinite; }
    @keyframes blink { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

    /* Floating ghost numbers */
    .floater {
      position: absolute;
      font-family: 'Fredoka One', cursive;
      font-size: 7rem;
      line-height: 1;
      pointer-events: none;
      z-index: 100;
      width: 100%;
      text-align: center;
      top: 28px; /* align with unit-val */
      left: 0;
    }

    .floater.up   { animation: floatUp   0.4s ease-out forwards; }
    .floater.down { animation: floatDown 0.4s ease-out forwards; }
    .floater.fast { animation-duration: 0.15s; font-size: 5rem; }

    @keyframes slideInUp {
      from { opacity: 0; transform: translateY(50px) scale(0.5); }
      to   { opacity: 1; transform: translateY(0)    scale(1); }
    }
    @keyframes slideInDown {
      from { opacity: 0; transform: translateY(-50px) scale(0.5); }
      to   { opacity: 1; transform: translateY(0)     scale(1); }
    }
    .slide-up   { animation: slideInUp   0.25s ease-out forwards; }
    .slide-down { animation: slideInDown 0.25s ease-out forwards; }

    @keyframes floatUp {
      0%   { opacity: 0.7; transform: translateY(0) scale(1); }
      100% { opacity: 0;   transform: translateY(-90px) scale(0.6); }
    }
    @keyframes floatDown {
      0%   { opacity: 0.7; transform: translateY(0) scale(1); }
      100% { opacity: 0;   transform: translateY(90px) scale(0.6); }
    }

    /* Buttons */
    .buttons { display: flex; gap: 14px; }

    .btn {
      font-family: 'Fredoka One', cursive;
      font-size: 1.4rem;
      padding: 14px 50px;
      border-radius: 50px;
      border: none;
      cursor: pointer;
      letter-spacing: 1px;
      transition: transform 0.1s, opacity 0.1s;
    }
    .btn:active { transform: scale(0.93); }

    #start-btn { background: linear-gradient(135deg, #7fff00, #00f5ff); color: #080818; }
    #start-btn.stop-mode { background: linear-gradient(135deg, #f72585, #7209b7); color: #fff; }

    .btn-reset {
      background: transparent;
      border: 3px solid #ffffff22;
      color: #fff;
    }
    .btn-reset:hover { border-color: #ffffff55; }

    /* Done flash overlay */
    .done-flash {
      position: fixed; inset: 0;
      pointer-events: none;
      opacity: 0;
      background: radial-gradient(circle, #f7258580 0%, transparent 70%);
      animation: flashAnim 0.5s ease-out forwards;
    }
    @keyframes flashAnim {
      0%   { opacity: 1; }
      100% { opacity: 0; }
    }

    /* DONE text */
    .done-text {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Fredoka One', cursive;
      font-size: 6rem;
      color: #f72585;
      text-shadow: 0 0 40px #f72585;
      animation: doneAnim 1.2s ease-out forwards;
      pointer-events: none;
      z-index: 200;
    }
    @keyframes doneAnim {
      0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
      30%  { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
      70%  { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1.2); }
    }
  </style>
</head>
<body>

  <a class="back-link" href="../">← Back</a>

  <div class="title">⏱ JOS'S TIMER LAB ⏱</div>

  <div class="tabs">
    <div class="tab sw" onclick="switchMode('sw')">Stopwatch</div>
    <div class="tab tm" onclick="switchMode('tm')">Timer</div>
  </div>

  <div class="timer-setup" id="timer-setup">
    <input type="number" id="tm-min" value="1" min="0" max="99">
    <span>:</span>
    <input type="number" id="tm-sec" value="30" min="0" max="59">
  </div>

  <div class="display">
    <div class="unit-wrap mm" id="mm-wrap">
      <div class="unit-label">MIN</div>
      <div class="unit-val" id="mm-val">00</div>
    </div>
    <div class="colon pulse" id="colon1">:</div>
    <div class="unit-wrap ss" id="ss-wrap">
      <div class="unit-label">SEC</div>
      <div class="unit-val" id="ss-val">00</div>
    </div>
    <div class="colon pulse" id="colon2">:</div>
    <div class="unit-wrap cs" id="cs-wrap">
      <div class="unit-label">MS</div>
      <div class="unit-val" id="cs-val">00</div>
    </div>
  </div>

  <div class="buttons">
    <button class="btn" id="start-btn" onclick="toggleStartStop()">START</button>
    <button class="btn btn-reset" onclick="resetAll()">RESET</button>
  </div>

<script>
  let mode = 'sw';
  let running = false;

  // Stopwatch
  let swStart = 0, swElapsed = 0, swTick = null;
  let prev_sw_mm = -1, prev_sw_ss = -1, prev_sw_cs = -1;

  // Timer
  let tmTotal = 0, tmRemaining = 0, tmStart = 0, tmTick = null;
  let prev_tm_mm = -1, prev_tm_ss = -1;

  function switchMode(m) {
    if (running) resetAll();
    mode = m;

    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelector('.tab.' + m).classList.add('active');

    const setup = document.getElementById('timer-setup');
    const csWrap = document.getElementById('cs-wrap');
    const colon2 = document.getElementById('colon2');
    const startBtn = document.getElementById('start-btn');

    if (m === 'sw') {
      setup.classList.remove('visible');
      csWrap.style.display = '';
      colon2.style.display = '';
      startBtn.className = 'btn';
    } else {
      setup.classList.add('visible');
      csWrap.style.display = 'none';
      colon2.style.display = 'none';
      startBtn.className = 'btn stop-mode';
    }

    resetDisplay();
  }

  function resetDisplay() {
    document.getElementById('mm-val').textContent = '00';
    document.getElementById('ss-val').textContent = '00';
    document.getElementById('cs-val').textContent = '00';
    prev_sw_mm = -1; prev_sw_ss = -1; prev_sw_cs = -1;
    prev_tm_mm = -1; prev_tm_ss = -1;
  }

  function toggleStartStop() {
    running ? stop() : start();
  }

  function start() {
    running = true;
    const btn = document.getElementById('start-btn');
    btn.textContent = 'STOP';
    btn.classList.add('stop-mode');

    if (mode === 'sw') {
      swStart = Date.now() - swElapsed;
      swTick = setInterval(tickSW, 10);
    } else {
      if (tmRemaining === 0) {
        const mm = parseInt(document.getElementById('tm-min').value) || 0;
        const ss = parseInt(document.getElementById('tm-sec').value) || 0;
        tmTotal = (mm * 60 + ss) * 1000;
        tmRemaining = tmTotal;
      }
      if (tmRemaining <= 0) { stop(); return; }
      tmStart = Date.now() - (tmTotal - tmRemaining);
      tmTick = setInterval(tickTM, 50);
    }
  }

  function stop() {
    running = false;
    const btn = document.getElementById('start-btn');
    btn.textContent = 'START';
    if (mode === 'sw') btn.classList.remove('stop-mode');
    clearTicks();
    if (mode === 'sw') swElapsed = Date.now() - swStart;
  }

  function clearTicks() {
    if (swTick) { clearInterval(swTick); swTick = null; }
    if (tmTick) { clearInterval(tmTick); tmTick = null; }
  }

  function resetAll() {
    stop();
    swElapsed = 0;
    tmRemaining = 0;
    resetDisplay();
  }

  function tickSW() {
    swElapsed = Date.now() - swStart;
    const cs = Math.floor(swElapsed / 100) % 10;
    const totalSec = Math.floor(swElapsed / 1000);
    const ss = totalSec % 60;
    const mm = Math.min(Math.floor(totalSec / 60), 99);

    if (prev_sw_cs >= 0 && cs !== prev_sw_cs) {
      spawnFloater('cs-wrap', String(prev_sw_cs), 'up', '#00f5ff', true);
    }
    if (prev_sw_ss >= 0 && ss !== prev_sw_ss) {
      spawnFloater('ss-wrap', pad(prev_sw_ss), 'up', '#7fff00');
    }
    if (prev_sw_mm >= 0 && mm !== prev_sw_mm) {
      spawnFloater('mm-wrap', pad(prev_sw_mm), 'up', '#f72585');
    }

    const csChanged = prev_sw_cs >= 0 && cs !== prev_sw_cs;
    const ssChanged = prev_sw_ss >= 0 && ss !== prev_sw_ss;
    const mmChanged = prev_sw_mm >= 0 && mm !== prev_sw_mm;
    prev_sw_mm = mm; prev_sw_ss = ss; prev_sw_cs = cs;

    document.getElementById('mm-val').textContent = pad(mm);
    document.getElementById('ss-val').textContent = pad(ss);
    document.getElementById('cs-val').textContent = String(cs);
    if (csChanged) triggerSlide('cs-val', 'up');
    if (ssChanged) triggerSlide('ss-val', 'up');
    if (mmChanged) triggerSlide('mm-val', 'up');
  }

  function tickTM() {
    const elapsed = Date.now() - tmStart;
    tmRemaining = Math.max(0, tmTotal - elapsed);

    const totalSec = Math.ceil(tmRemaining / 1000);
    const ss = totalSec % 60;
    const mm = Math.min(Math.floor(totalSec / 60), 99);

    if (prev_tm_ss >= 0 && ss !== prev_tm_ss) {
      spawnFloater('ss-wrap', pad(prev_tm_ss), 'down', '#7fff00');
    }
    if (prev_tm_mm >= 0 && mm !== prev_tm_mm) {
      spawnFloater('mm-wrap', pad(prev_tm_mm), 'down', '#f72585');
    }

    const tmSsChanged = prev_tm_ss >= 0 && ss !== prev_tm_ss;
    const tmMmChanged = prev_tm_mm >= 0 && mm !== prev_tm_mm;
    prev_tm_mm = mm; prev_tm_ss = ss;

    document.getElementById('mm-val').textContent = pad(mm);
    document.getElementById('ss-val').textContent = pad(ss);
    if (tmSsChanged) triggerSlide('ss-val', 'down');
    if (tmMmChanged) triggerSlide('mm-val', 'down');

    if (tmRemaining === 0) { stop(); triggerDone(); }
  }

  function triggerSlide(elemId, dir) {
    const el = document.getElementById(elemId);
    el.classList.remove('slide-up', 'slide-down');
    void el.offsetWidth; // force reflow to restart animation
    el.classList.add(dir === 'up' ? 'slide-up' : 'slide-down');
  }

  function spawnFloater(wrapId, text, dir, color, fast = false) {
    const wrap = document.getElementById(wrapId);
    const f = document.createElement('div');
    f.className = 'floater ' + dir + (fast ? ' fast' : '');
    f.textContent = text;
    f.style.color = color;
    wrap.appendChild(f);
    setTimeout(() => f.remove(), fast ? 220 : 700);
  }

  function pad(n) { return String(n).padStart(2, '0'); }
  function pad4(n) { return String(n).padStart(4, '0'); }

  function triggerDone() {
    // Flash
    const flash = document.createElement('div');
    flash.className = 'done-flash';
    document.body.appendChild(flash);
    setTimeout(() => flash.remove(), 500);

    // DONE text
    const txt = document.createElement('div');
    txt.className = 'done-text';
    txt.textContent = '🎉 DONE!';
    document.body.appendChild(txt);
    setTimeout(() => txt.remove(), 1300);

    // Beep x3
    beep(880, 0, 0.4);
    beep(880, 600, 0.4);
    beep(1100, 1200, 0.6);
  }

  function beep(freq, delay, dur) {
    setTimeout(() => {
      try {
        const ctx = new AudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.4, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
        osc.start(); osc.stop(ctx.currentTime + dur);
      } catch(e) {}
    }, delay);
  }

  // Init
  switchMode('sw');
</script>
</body>
</html>
