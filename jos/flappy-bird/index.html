<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flappy Bird</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: #70c5ce;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  overflow: hidden;
}
canvas {
  display: block;
  border-left: 3px solid #444;
  border-right: 3px solid #444;
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');

const W = 360, H = 640;
canvas.width  = W;
canvas.height = H;

// ── constants ──
const GRAVITY   = (function(){try{return sessionStorage.getItem('jos-hard-mode')==='on'}catch(e){return false}})() ? 0.62 : 0.45;
const FLAP      = -8.5;
const PIPE_W    = 60;
const PIPE_GAP  = (function(){try{return sessionStorage.getItem('jos-hard-mode')==='on'}catch(e){return false}})() ? 102 : 160;
const PIPE_SPEED = 2.2;
const GROUND_H  = 80;

// ── state ──
let state = 'idle'; // idle | playing | dead
let bird, pipes, score, best, frame, groundX, deathReason;

function init() {
  bird   = { x: 80, y: H/2 - 20, vy: 0, rot: 0, flapTimer: 0 };
  pipes  = [];
  score  = 0;
  frame  = 0;
  groundX = 0;
  best   = parseInt(localStorage.getItem('flappyBest') || '0');
}

// ── pipe spawning ──
function spawnPipe() {
  const minTop = 80, maxTop = H - GROUND_H - PIPE_GAP - 80;
  const topH = Math.floor(Math.random() * (maxTop - minTop)) + minTop;
  pipes.push({ x: W + 10, topH, scored: false });
}

// ── flap ──
function flap() {
  if (state === 'dead') return;
  if (state === 'idle') state = 'playing';
  bird.vy = FLAP;
  bird.flapTimer = 8;
}

// ── update ──
function update() {
  if (state !== 'playing') return;
  frame++;

  // bird physics
  bird.vy  += GRAVITY;
  bird.y   += bird.vy;
  bird.rot  = Math.min(Math.max(bird.vy * 3, -25), 90);
  bird.flapTimer = Math.max(0, bird.flapTimer - 1);

  // spawn pipes
  if (frame % 90 === 0) spawnPipe();

  // move pipes
  for (let p of pipes) {
    p.x -= PIPE_SPEED;
    if (!p.scored && p.x + PIPE_W < bird.x) {
      score++;
      p.scored = true;
      if (score > best) { best = score; localStorage.setItem('flappyBest', best); }
    }
  }
  pipes = pipes.filter(p => p.x + PIPE_W > -10);

  // scroll ground
  groundX -= PIPE_SPEED;
  if (groundX <= -24) groundX += 24;

  // collisions
  const bx = bird.x - 14, by = bird.y - 12, bw = 28, bh = 24;

  // ground / ceiling
  if (bird.y + 16 >= H - GROUND_H) { die('💥 birdy hit the ground!'); return; }
  if (bird.y - 16 <= 0)            { die('😵 birdy could not breathe!'); return; }

  // pipes
  for (let p of pipes) {
    if (bx + bw > p.x + 4 && bx < p.x + PIPE_W - 4) {
      if (by < p.topH || by + bh > p.topH + PIPE_GAP) { die('🪠 birdy hit a pipe!'); return; }
    }
  }
}

function die(reason) {
  deathReason = reason;
  state = 'dead';
}

// ── drawing helpers ──
function drawSky() {
  const grad = ctx.createLinearGradient(0, 0, 0, H - GROUND_H);
  grad.addColorStop(0,   '#5ab3d0');
  grad.addColorStop(1,   '#a8d8ea');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H - GROUND_H);
}

function drawClouds() {
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  [[60,80,50],[180,50,35],[280,100,45],[100,160,30],[240,180,40]].forEach(([x,y,r]) => {
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x+r*0.6,y+5,r*0.7,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x-r*0.5,y+8,r*0.6,0,Math.PI*2); ctx.fill();
  });
}

function drawPipe(p) {
  // top pipe
  drawPipeRect(p.x, 0, PIPE_W, p.topH, false);
  // bottom pipe
  drawPipeRect(p.x, p.topH + PIPE_GAP, PIPE_W, H - GROUND_H - p.topH - PIPE_GAP, true);
}

function drawPipeRect(x, y, w, h, isBottom) {
  const CAP = 14;
  // body
  ctx.fillStyle = '#5cb85c';
  ctx.fillRect(x + 4, isBottom ? y : y, w - 8, h);
  // shade
  ctx.fillStyle = '#4cae4c';
  ctx.fillRect(x + 4, isBottom ? y : y, 10, h);
  ctx.fillStyle = '#6dc96d';
  ctx.fillRect(x + w - 14, isBottom ? y : y, 10, h);
  // cap
  ctx.fillStyle = '#5cb85c';
  ctx.fillRect(x, isBottom ? y : y + h - CAP, w, CAP);
  ctx.fillStyle = '#4cae4c';
  ctx.fillRect(x, isBottom ? y : y + h - CAP, 12, CAP);
  ctx.fillStyle = '#6dc96d';
  ctx.fillRect(x + w - 14, isBottom ? y : y + h - CAP, 14, CAP);
  // outline
  ctx.strokeStyle = '#3a7a3a';
  ctx.lineWidth = 2;
  ctx.strokeRect(x, isBottom ? y : y + h - CAP, w, CAP);
  ctx.strokeRect(x + 4, isBottom ? y : y, w - 8, h);
}

function drawBird() {
  ctx.save();
  ctx.translate(bird.x, bird.y);
  ctx.rotate(bird.rot * Math.PI / 180);

  // body
  ctx.fillStyle = '#f7c948';
  ctx.beginPath();
  ctx.ellipse(0, 0, 18, 14, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#d4a800';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // wing
  const wingUp = bird.flapTimer > 0;
  ctx.fillStyle = '#e6b800';
  ctx.beginPath();
  if (wingUp) {
    ctx.ellipse(-2, -10, 10, 5, -0.4, 0, Math.PI * 2);
  } else {
    ctx.ellipse(-2, 4, 10, 5, 0.3, 0, Math.PI * 2);
  }
  ctx.fill();

  // eye
  ctx.fillStyle = 'white';
  ctx.beginPath(); ctx.arc(8, -4, 6, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#222';
  ctx.beginPath(); ctx.arc(10, -4, 3, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'white';
  ctx.beginPath(); ctx.arc(11, -5, 1, 0, Math.PI * 2); ctx.fill();

  // beak
  ctx.fillStyle = '#f08030';
  ctx.beginPath();
  ctx.moveTo(16, -2); ctx.lineTo(24, 0); ctx.lineTo(16, 4);
  ctx.closePath(); ctx.fill();

  ctx.restore();
}

function drawGround() {
  // dirt
  ctx.fillStyle = '#d4a55a';
  ctx.fillRect(0, H - GROUND_H, W, GROUND_H);
  // grass strip
  ctx.fillStyle = '#7ec850';
  ctx.fillRect(0, H - GROUND_H, W, 18);
  // scrolling stripes
  ctx.fillStyle = '#6ab840';
  for (let x = groundX; x < W; x += 24) {
    ctx.fillRect(x, H - GROUND_H, 12, 18);
  }
  // dirt lines
  ctx.strokeStyle = '#c4954a';
  ctx.lineWidth = 1;
  for (let x = groundX; x < W; x += 24) {
    ctx.beginPath(); ctx.moveTo(x, H - GROUND_H + 25); ctx.lineTo(x + 20, H - GROUND_H + 35); ctx.stroke();
  }
}

function drawScore() {
  ctx.fillStyle = 'white';
  ctx.strokeStyle = '#555';
  ctx.lineWidth = 3;
  ctx.font = 'bold 42px Arial';
  ctx.textAlign = 'center';
  ctx.strokeText(score, W/2, 70);
  ctx.fillText(score, W/2, 70);
  ctx.textAlign = 'left';
}

function drawIdle() {
  ctx.fillStyle = 'white';
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 3;
  ctx.font = 'bold 34px Arial';
  ctx.textAlign = 'center';
  ctx.strokeText('Flappy Bird 🐦', W/2, H/2 - 80);
  ctx.fillText('Flappy Bird 🐦', W/2, H/2 - 80);
  ctx.font = '20px Arial';
  ctx.fillStyle = '#fff';
  ctx.strokeText('tap or press SPACE to flap!', W/2, H/2 - 40);
  ctx.fillText('tap or press SPACE to flap!', W/2, H/2 - 40);
  ctx.font = '16px Arial';
  ctx.fillStyle = 'rgba(255,255,255,0.8)';
  ctx.fillText('best: ' + best, W/2, H/2 - 10);
  ctx.textAlign = 'left';
}

function drawDead() {
  // dark overlay
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.fillRect(0, 0, W, H);

  // panel
  ctx.fillStyle = '#ffe066';
  roundRect(ctx, W/2 - 120, H/2 - 110, 240, 200, 18);
  ctx.fill();
  ctx.strokeStyle = '#c8a000';
  ctx.lineWidth = 3;
  ctx.stroke();

  ctx.fillStyle = '#333';
  ctx.font = 'bold 30px Arial';
  ctx.textAlign = 'center';
  ctx.fillText('Game Over!', W/2, H/2 - 65);

  ctx.font = '15px Arial';
  ctx.fillStyle = '#c0392b';
  ctx.fillText(deathReason, W/2, H/2 - 35);

  ctx.font = '20px Arial';
  ctx.fillStyle = '#333';
  ctx.fillText('score: ' + score, W/2, H/2 + 5);
  ctx.fillText('best: ' + best, W/2, H/2 + 32);

  ctx.fillStyle = '#5cb85c';
  roundRect(ctx, W/2 - 80, H/2 + 45, 160, 42, 12);
  ctx.fill();
  ctx.fillStyle = 'white';
  ctx.font = 'bold 18px Arial';
  ctx.fillText('Play Again', W/2, H/2 + 72);
  ctx.textAlign = 'left';
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

// ── idle bird bob ──
let idleT = 0;

function render() {
  drawSky();
  drawClouds();
  for (let p of pipes) drawPipe(p);
  drawGround();

  if (state === 'idle') {
    bird.y = H/2 - 20 + Math.sin(idleT) * 6;
    idleT += 0.05;
    bird.rot = 0;
  }

  drawBird();

  if (state === 'playing') drawScore();
  if (state === 'idle')    drawIdle();
  if (state === 'dead')    drawDead();
}

function loop() {
  update();
  render();
  requestAnimationFrame(loop);
}

// ── input ──
document.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); flap(); }
  if (e.code === 'Enter' && state === 'dead') { state = 'idle'; init(); }
});

canvas.addEventListener('click', e => {
  if (state === 'dead') {
    // check play again button
    const bx = W/2 - 80, by = H/2 + 45, bw = 160, bh = 42;
    const rect = canvas.getBoundingClientRect();
    const scaleX = W / rect.width, scaleY = H / rect.height;
    const cx = (e.clientX - rect.left) * scaleX;
    const cy = (e.clientY - rect.top)  * scaleY;
    if (cx > bx && cx < bx+bw && cy > by && cy < by+bh) { state='idle'; init(); return; }
  }
  flap();
});

canvas.addEventListener('touchstart', e => { e.preventDefault(); flap(); }, { passive: false });

init();
loop();
</script>

<style>
#hmHell{position:fixed;inset:0;pointer-events:none;z-index:2147482000;background:rgba(217,79,58,.30);opacity:0;transition:opacity 1s ease}
#hmHell.on{opacity:1}
#hmEmb{position:fixed;inset:0;pointer-events:none;z-index:2147482001;overflow:hidden;opacity:0;transition:opacity 1s ease}
#hmEmb.on{opacity:1}
#hmEmb i{position:absolute;bottom:-20px;border-radius:50%;background:radial-gradient(circle,#fff3b0 0%,#ffab2b 40%,rgba(255,90,20,0) 75%);box-shadow:0 0 9px 3px rgba(255,150,40,.5);animation:hmRise linear infinite}
@keyframes hmRise{0%{transform:translate(0,0) scale(1);opacity:0}8%{opacity:.95}50%{transform:translate(var(--dx),-50vh) scale(.7);opacity:.8}100%{transform:translate(calc(var(--dx) * -0.6),-104vh) scale(.2);opacity:0}}
#hmShield{position:fixed;top:12px;right:12px;z-index:2147483000;width:46px;height:54px;pointer-events:none;opacity:0;transition:opacity .6s ease;filter:drop-shadow(0 0 9px rgba(255,80,20,.95))}
#hmShield.on{opacity:1;animation:hmPulse 1.6s ease-in-out infinite alternate}
@keyframes hmPulse{from{transform:scale(1)}to{transform:scale(1.08)}}
#hmShield span{position:absolute;left:0;right:0;top:44%;transform:translateY(-50%);text-align:center;font-size:21px;line-height:1}
</style>
<script>
(function(){
  try { if (sessionStorage.getItem('jos-hard-mode') !== 'on') return; } catch(e) { return; }
  function go(){
    var hell = document.createElement('div'); hell.id = 'hmHell';
    var emb  = document.createElement('div'); emb.id  = 'hmEmb';
    for (var i = 0; i < 18; i++) {
      var e = document.createElement('i'), s = 5 + Math.random() * 9;
      e.style.left = (Math.random() * 100) + 'vw';
      e.style.width = s + 'px'; e.style.height = s + 'px';
      e.style.setProperty('--dx', (Math.random() * 120 - 60) + 'px');
      e.style.animationDuration = (4 + Math.random() * 5) + 's';
      e.style.animationDelay = (Math.random() * 5) + 's';
      emb.appendChild(e);
    }
    var sh = document.createElement('div'); sh.id = 'hmShield';
    sh.innerHTML = '<svg viewBox="0 0 46 54" width="46" height="54" xmlns="http://www.w3.org/2000/svg">' +
      '<path d="M23 1 L44 8 V27 C44 40 34 49 23 53 C12 49 2 40 2 27 V8 Z" fill="#8c1408" stroke="#ffb03a" stroke-width="3" stroke-linejoin="round"/>' +
      '</svg><span>\uD83D\uDE08</span>';
    document.body.appendChild(hell); document.body.appendChild(emb); document.body.appendChild(sh);
    void hell.offsetWidth;
    hell.className = 'on'; emb.className = 'on'; sh.className = 'on';
  }
  if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', go); } else { go(); }
})();
</script>
</body>
</html>
