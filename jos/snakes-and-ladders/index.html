<!DOCTYPE html>
<html lang="en">
<head>
<script src="../swirl.js"></script>
<script src="../mods.js" data-game></script><script src="../cursors.js"></script>
<script src="../lang.js" data-game></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snakes and Ladders — Jos' Projects</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    /* ===== Jos's Snakes and Ladders =====
       Roll the dice, climb the ladders, slide down the snakes. First to 100 wins.
       You need the exact number to land on 100. Roll too much and you bounce back. */
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { min-height:100%; }
    body { font-family:'Nunito',sans-serif; color:#223; background:#fff3d6; user-select:none; }
    .back-link { position:fixed; top:12px; left:16px; z-index:50; font-family:'Fredoka One',cursive; color:#223; text-decoration:none;
                 font-size:1rem; background:#fff; padding:.35rem .9rem; border-radius:50px; box-shadow:0 3px 0 rgba(0,0,0,.15); }
    .back-link:hover { background:#223; color:#fff; }
    h1 { font-family:'Fredoka One',cursive; font-weight:normal; }
    button { font-family:'Fredoka One',cursive; font-size:1rem; border:none; border-radius:50px; padding:.55rem 1.2rem;
             background:#223; color:#fff; cursor:pointer; box-shadow:0 3px 0 rgba(0,0,0,.25); }
    button:hover { background:#3d9595; }
    button:active { transform:translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,.25); }
    button:disabled { opacity:.35; cursor:default; transform:none; }

    #setup { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1.4rem; }
    #setup h1 { font-size:3rem; }
    #setup .q { font-size:1.6rem; font-family:'Fredoka One',cursive; }
    .picker { display:flex; align-items:center; gap:1.2rem; }
    .picker button { font-size:2rem; width:64px; height:64px; padding:0; }
    #num { font-family:'Fredoka One',cursive; font-size:4.5rem; min-width:90px; text-align:center; }

    #game { display:none; padding:60px 16px 20px; justify-content:center; gap:28px; flex-wrap:wrap; align-items:flex-start; }
    canvas { background:#fff; border-radius:14px; box-shadow:0 6px 20px rgba(0,0,0,.18); max-width:100%; }
    #side { width:280px; display:flex; flex-direction:column; gap:14px; }
    .box { background:#fff; border-radius:16px; padding:14px 16px; box-shadow:0 4px 12px rgba(0,0,0,.1); }
    #turn { font-family:'Fredoka One',cursive; font-size:1.4rem; }
    #dice { font-size:5rem; line-height:1; text-align:center; height:90px; }
    #dice.rolling { animation:shake .12s linear infinite; }
    @keyframes shake { 0% { transform:rotate(-12deg); } 50% { transform:rotate(12deg); } 100% { transform:rotate(-12deg); } }
    #roll { font-size:1.4rem; width:100%; padding:.8rem; background:#e5533d; }
    #roll:hover { background:#c23e2a; }
    #msg { min-height:2.6rem; font-weight:800; }
    .who { display:flex; align-items:center; gap:.5rem; font-weight:800; padding:3px 0; }
    .who .dot { width:20px; height:20px; border-radius:50%; border:2px solid #223; }
    .who.now { color:#e5533d; }
    #win { position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:center; justify-content:center; z-index:40; }
    #win .box { text-align:center; padding:30px 40px; }
    #win h1 { font-size:2.6rem; margin-bottom:.4rem; }
  </style>
</head>
<body>
<a class="back-link" href="../classic-games/">← Classic Games</a>

<div id="setup">
  <h1>🐍 Snakes and Ladders 🪜</h1>
  <div class="q">How many players?</div>
  <div class="picker">
    <button id="less" title="Fewer (←)">←</button>
    <div id="num">2</div>
    <button id="more" title="More (→)">→</button>
  </div>
  <button id="start" style="font-size:1.4rem;padding:.7rem 2rem;background:#e5533d">Enter</button>
  <div>Use the ← → arrow keys, then press Enter</div>
</div>

<div id="game">
  <canvas id="board" width="640" height="640"></canvas>
  <div id="side">
    <div class="box"><div id="turn"></div></div>
    <div class="box"><div id="dice">🎲</div></div>
    <button id="roll">Roll the dice</button>
    <div class="box" id="msg">Press Roll, or the Space bar.</div>
    <div class="box" id="players"></div>
    <button id="restart" style="background:#fff;color:#223">New game</button>
  </div>
</div>

<div id="win"><div class="box"><h1 id="winText"></h1><p style="margin-bottom:1rem">reached 100 first!</p><button id="again">Play again</button></div></div>

<script>
const LADDERS = { 1: 38, 4: 14, 9: 31, 21: 42, 28: 84, 36: 44, 51: 67, 71: 91, 80: 100 };
const SNAKES  = { 16: 6, 47: 26, 49: 11, 56: 53, 62: 19, 64: 60, 87: 24, 93: 73, 95: 75, 98: 78 };
const COLOURS = ['#e53935', '#1e88e5', '#43a047', '#fdd835'];
const NAMES   = ['Red', 'Blue', 'Green', 'Yellow'];
const FACES   = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];

const $ = id => document.getElementById(id);
const cv = $('board'), ctx = cv.getContext('2d');
const S = 64;                       // size of one square
let howMany = 2, players = [], now = 0, busy = false;

/* ---------- square number -> middle of that square ---------- */
// 1 is bottom-left. Rows snake: left-to-right, then right-to-left going up.
function where(n) {
  const i = n - 1, row = Math.floor(i / 10), col = row % 2 === 0 ? i % 10 : 9 - (i % 10);
  return { x: col * S + S / 2, y: (9 - row) * S + S / 2 };
}

/* ---------- drawing the board ---------- */
const TILE = ['#ffe082', '#ffcc80', '#c5e1a5', '#b3e5fc', '#f8bbd0'];
function drawLadder(a, b) {
  const p = where(a), q = where(b);
  const dx = q.x - p.x, dy = q.y - p.y, len = Math.hypot(dx, dy);
  const nx = -dy / len * 10, ny = dx / len * 10;      // sideways, for the two rails
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#8d5524'; ctx.lineWidth = 5;
  [[1], [-1]].forEach(([k]) => {
    ctx.beginPath(); ctx.moveTo(p.x + nx * k, p.y + ny * k); ctx.lineTo(q.x + nx * k, q.y + ny * k); ctx.stroke();
  });
  ctx.lineWidth = 3;
  const rungs = Math.max(2, Math.floor(len / 22));
  for (let r = 1; r < rungs; r++) {
    const t = r / rungs, x = p.x + dx * t, y = p.y + dy * t;
    ctx.beginPath(); ctx.moveTo(x + nx, y + ny); ctx.lineTo(x - nx, y - ny); ctx.stroke();
  }
}
const SNAKE_COLOURS = ['#2e7d32', '#6a1b9a', '#c62828', '#ef6c00', '#00838f'];
function drawSnake(head, tail, k) {
  const p = where(head), q = where(tail);
  const dx = q.x - p.x, dy = q.y - p.y, len = Math.hypot(dx, dy);
  const nx = -dy / len, ny = dx / len;
  const col = SNAKE_COLOURS[k % SNAKE_COLOURS.length];
  // a wiggly body: follow the line from head to tail, swinging side to side
  const pts = [];
  for (let i = 0; i <= 40; i++) {
    const t = i / 40, w = Math.sin(t * Math.PI * 3) * 14 * (1 - t * 0.4);
    pts.push([p.x + dx * t + nx * w, p.y + dy * t + ny * w]);
  }
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = 13;
  ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.stroke();
  for (let i = 0; i < pts.length - 1; i++) {      // gets thinner towards the tail
    ctx.strokeStyle = col; ctx.lineWidth = 10 - i * 0.15;
    ctx.beginPath(); ctx.moveTo(...pts[i]); ctx.lineTo(...pts[i + 1]); ctx.stroke();
  }
  // head and eyes
  ctx.fillStyle = col; ctx.beginPath(); ctx.arc(p.x, p.y, 11, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(p.x - 4, p.y - 3, 3.2, 0, Math.PI * 2); ctx.arc(p.x + 4, p.y - 3, 3.2, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(p.x - 4, p.y - 3, 1.5, 0, Math.PI * 2); ctx.arc(p.x + 4, p.y - 3, 1.5, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#e53935'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(p.x, p.y + 9); ctx.lineTo(p.x, p.y + 15); ctx.lineTo(p.x - 3, p.y + 18); ctx.moveTo(p.x, p.y + 15); ctx.lineTo(p.x + 3, p.y + 18); ctx.stroke();
}

function drawBoard() {
  for (let n = 1; n <= 100; n++) {
    const { x, y } = where(n);
    ctx.fillStyle = TILE[(n + Math.floor((n - 1) / 10)) % TILE.length];
    ctx.fillRect(x - S / 2, y - S / 2, S, S);
    ctx.strokeStyle = 'rgba(0,0,0,.08)'; ctx.strokeRect(x - S / 2, y - S / 2, S, S);
    ctx.fillStyle = '#5d4037'; ctx.font = 'bold 13px Nunito, sans-serif';
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillText(n, x - S / 2 + 4, y - S / 2 + 3);
  }
  const fin = where(100);
  ctx.font = '26px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('🏆', fin.x + 10, fin.y + 10);
  Object.entries(LADDERS).forEach(([a, b]) => drawLadder(+a, b));
  Object.entries(SNAKES).forEach(([a, b], k) => drawSnake(+a, b, k));
}

function drawCounters() {
  players.forEach((p, i) => {
    let x, y;
    if (p.pos === 0) { x = -40; y = 0; return; }       // not on the board yet
    if (p.at) ({ x, y } = p.at); else ({ x, y } = where(p.pos));
    // move counters on the same square apart so you can see them all
    const ox = (i % 2 ? 9 : -9), oy = (i < 2 ? -9 : 9);
    ctx.fillStyle = 'rgba(0,0,0,.3)';
    ctx.beginPath(); ctx.arc(x + ox + 2, y + oy + 3, 13, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = COLOURS[i]; ctx.strokeStyle = '#222'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(x + ox, y + oy, 13, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.55)';
    ctx.beginPath(); ctx.arc(x + ox - 4, y + oy - 4, 4, 0, Math.PI * 2); ctx.fill();
  });
}

function draw() {
  ctx.clearRect(0, 0, cv.width, cv.height);
  drawBoard();
  drawCounters();
  $('turn').innerHTML = `<span style="color:${COLOURS[now] === '#fdd835' ? '#c9a800' : COLOURS[now]}">●</span> ${NAMES[now]}'s turn`;
  $('players').innerHTML = players.map((p, i) =>
    `<div class="who${i === now ? ' now' : ''}"><span class="dot" style="background:${COLOURS[i]}"></span>${NAMES[i]}: ${p.pos === 0 ? 'start' : 'square ' + p.pos}</div>`).join('');
}

/* ---------- moving ---------- */
const wait = ms => new Promise(r => setTimeout(r, ms));
async function slide(p, from, to, ms) {
  const a = where(from), b = where(to), frames = Math.round(ms / 16);
  for (let f = 1; f <= frames; f++) {           // a fixed number of small steps, 16 ms apart
    const t = f / frames, e = t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    p.at = { x: a.x + (b.x - a.x) * e, y: a.y + (b.y - a.y) * e };
    draw();
    await wait(16);
  }
  p.at = null; p.pos = to; draw();
}

async function roll() {
  if (busy) return;
  busy = true; $('roll').disabled = true;
  const p = players[now], who = NAMES[now];
  // shake the dice
  $('dice').classList.add('rolling');
  for (let i = 0; i < 8; i++) { $('dice').textContent = FACES[Math.floor(Math.random() * 6)]; await wait(70); }
  $('dice').classList.remove('rolling');
  const n = 1 + Math.floor(Math.random() * 6);
  $('dice').textContent = FACES[n - 1];
  say(who + ' rolled a ' + n + '.');
  await wait(300);

  // step one square at a time; past 100 you bounce back
  let steps = n, dir = 1;
  if (p.pos === 0) { p.pos = 1; steps--; draw(); await wait(220); }
  while (steps-- > 0) {
    if (p.pos === 100) dir = -1;
    p.pos += dir; draw(); await wait(220);
  }
  if (dir === -1) say(who + ' rolled too many and bounced back to ' + p.pos + '.');

  if (LADDERS[p.pos]) {
    say('🪜 ' + who + ' climbs a ladder from ' + p.pos + ' to ' + LADDERS[p.pos] + '!');
    await wait(250); await slide(p, p.pos, LADDERS[p.pos], 700);
  } else if (SNAKES[p.pos]) {
    say('🐍 Oh no! ' + who + ' slides down a snake from ' + p.pos + ' to ' + SNAKES[p.pos] + '.');
    await wait(250); await slide(p, p.pos, SNAKES[p.pos], 900);
  }

  if (p.pos === 100) {
    $('winText').innerHTML = `<span style="color:${COLOURS[now]}">●</span> ${who} wins! 🏆`;
    $('win').style.display = 'flex';
    return;                        // stays busy until Play again
  }
  // a 6 gets another go
  if (n === 6) say($('msg').textContent + ' Rolled a 6, so ' + who + ' goes again!');
  else now = (now + 1) % players.length;
  draw();
  busy = false; $('roll').disabled = false;
}
function say(t) { $('msg').textContent = t; }

/* ---------- start ---------- */
function setNum(n) { howMany = Math.max(1, Math.min(4, n)); $('num').textContent = howMany; }
$('less').onclick = () => setNum(howMany - 1);
$('more').onclick = () => setNum(howMany + 1);
function startGame() {
  players = []; for (let i = 0; i < howMany; i++) players.push({ pos: 0, at: null });
  now = 0; busy = false;
  $('setup').style.display = 'none'; $('game').style.display = 'flex'; $('win').style.display = 'none';
  $('roll').disabled = false; $('dice').textContent = '🎲';
  say('Everyone starts off the board. Press Roll, or the Space bar.');
  draw();
}
$('start').onclick = startGame;
$('roll').onclick = roll;
$('again').onclick = startGame;
$('restart').onclick = () => { $('game').style.display = 'none'; $('setup').style.display = 'flex'; };
document.addEventListener('keydown', e => {
  if ($('setup').style.display !== 'none') {
    if (e.key === 'ArrowLeft') setNum(howMany - 1);
    if (e.key === 'ArrowRight') setNum(howMany + 1);
    if (e.key === 'Enter') startGame();
  } else if (e.key === ' ') { e.preventDefault(); roll(); }
});
</script>
</body>
</html>
