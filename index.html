<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Vault</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=IM+Fell+English:ital@0;1&family=Inter:wght@300;400&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f7f3ec;
            color: #1A1008;
            font-family: 'Inter', -apple-system, sans-serif;
            font-weight: 300;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 3rem 2rem;
            animation: fadeIn 1.2s ease both;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .container {
            max-width: 800px;
            width: 100%;
            text-align: center;
        }

        .logo-banner {
            width: 100%;
            max-width: 560px;
            height: auto;
            margin: 0 auto 2.5rem;
            display: block;
        }

        .rule {
            width: 60px;
            height: 1px;
            background: #D0A880;
            margin: 0 auto 2.5rem;
        }

        /* ── Section Cards ── */

        .nav-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.25rem;
            margin-bottom: 3rem;
        }

        @media (max-width: 620px) {
            .nav-grid {
                grid-template-columns: 1fr;
            }
        }

        .nav-card {
            display: block;
            text-decoration: none;
            border: 1px solid #D0A880;
            border-radius: 4px;
            padding: 2rem 1.5rem;
            background: #FFFFFF;
            transition: border-color 0.2s ease, background 0.2s ease;
            text-align: left;
        }

        .nav-card:hover {
            border-color: #B88040;
            background: #fdf9f4;
        }

        .nav-card:hover .card-title {
            color: #984808;
        }

        .card-eyebrow {
            font-family: 'Cinzel', Georgia, serif;
            font-size: 0.6rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: #B88040;
            margin-bottom: 0.6rem;
        }

        .card-title {
            font-family: 'Cinzel', Georgia, serif;
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            color: #1A1008;
            margin-bottom: 0.75rem;
            transition: color 0.2s ease;
        }

        .card-desc {
            font-family: 'IM Fell English', Georgia, serif;
            font-size: 0.875rem;
            font-style: italic;
            color: #505050;
            line-height: 1.6;
        }

        .card-arrow {
            display: block;
            margin-top: 1.25rem;
            font-size: 0.65rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: #B88040;
            font-family: 'Cinzel', Georgia, serif;
        }

        .footer {
            font-size: 0.65rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #c8b89a;
        }
    </style>
</head>
<body>
    <div class="container">

        <img class="logo-banner" src="images/brand/vault-banner.png" alt="The Vault">

        <div class="rule"></div>

        <nav class="nav-grid">

            <a class="nav-card" href="physics/">
                <p class="card-eyebrow">Science</p>
                <p class="card-title">Physics</p>
                <p class="card-desc">The kind that makes you see everything differently.</p>
                <span class="card-arrow">Enter →</span>
            </a>

            <a class="nav-card" href="cs/">
                <p class="card-eyebrow">Computing</p>
                <p class="card-title">Computer Science</p>
                <p class="card-desc">Code as a way of thinking. Build things that think.</p>
                <span class="card-arrow">Enter →</span>
            </a>

            <a class="nav-card" href="ai/">
                <p class="card-eyebrow">Artificial Intelligence</p>
                <p class="card-title">AI</p>
                <p class="card-desc">Understanding the tools that are changing everything.</p>
                <span class="card-arrow">Enter →</span>
            </a>

        </nav>

        <p class="footer">2026</p>

    </div>
</body>
</html>
