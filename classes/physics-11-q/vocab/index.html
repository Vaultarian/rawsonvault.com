<script>
const D = {"terms":[{"en":"energy store","unit":"P1 Energy","ex":"Energy is transferred from the chemical store to the kinetic store.","es":{"t":"el almacén de energía","e":"La energía se transfiere del almacén químico al almacén cinético.","u":"⚠ «Store» aquí no es una tienda. AQA describe la energía como almacenes (stores): kinetic, thermal, chemical, elastic, gravitational. En el examen, nombra el almacén de salida y el de llegada."},"fr":{"t":"le réservoir d'énergie","e":"L'énergie est transférée du réservoir chimique au réservoir cinétique.","u":"⚠ « Store » ne veut pas dire magasin ici. AQA parle de réservoirs d'énergie (stores) : kinetic, thermal, chemical, elastic, gravitational. Dans une réponse, nomme le réservoir de départ et celui d'arrivée."},"de":{"t":"der Energiespeicher","e":"Energie wird vom chemischen Speicher in den kinetischen Speicher übertragen.","u":"⚠ „Store“ ist hier kein Laden. AQA spricht von Energiespeichern (stores): kinetic, thermal, chemical, elastic, gravitational. Nenne in der Antwort den Speicher vorher und den Speicher nachher."},"_k":"energy store p1 energy energy is transferred from the chemical store to the kinetic store. el almacen de energia le reservoir d'energie der energiespeicher la energia se transfiere del almacen quimico al almacen cinetico. l'energie est transferee du reservoir chimique au reservoir cinetique. energie wird vom chemischen speicher in den kinetischen speicher ubertragen."},{"en":"rate","unit":"P1 Energy","ex":"Power is the rate at which energy is transferred.","es":{"t":"la tasa (el ritmo)","e":"La potencia es el ritmo al que se transfiere la energía.","u":"«Rate» significa «cuánto por segundo». Cuando leas «rate of…», piensa «por segundo»: rate of energy transfer = julios por segundo."},"fr":{"t":"le taux (la vitesse de …)","e":"La puissance est la quantité d'énergie transférée par seconde.","u":"⚠ Rien à voir avec la rate (l'organe). « Rate » veut dire « combien par seconde » : rate of energy transfer = joules par seconde."},"de":{"t":"die Rate (… pro Sekunde)","e":"Leistung gibt an, wie viel Energie pro Sekunde übertragen wird.","u":"⚠ Nicht die Rate beim Abzahlen. „Rate“ heißt „wie viel pro Sekunde“: rate of energy transfer = Joule pro Sekunde."},"_k":"rate p1 energy power is the rate at which energy is transferred. la tasa (el ritmo) le taux (la vitesse de …) die rate (… pro sekunde) la potencia es el ritmo al que se transfiere la energia. la puissance est la quantite d'energie transferee par seconde. leistung gibt an, wie viel energie pro sekunde ubertragen wird."},{"en":"power","unit":"P1 Energy","ex":"The motor has a power of 500 W.","es":{"t":"la potencia","e":"El motor tiene una potencia de 500 W.","u":"⚠ No es «poder» (mandar) ni «fuerza». Power = energía transferida por segundo, en vatios (W). Un motor más potente hace el mismo trabajo en menos tiempo."},"fr":{"t":"la puissance","e":"Le moteur a une puissance de 500 W.","u":"⚠ Ce n'est pas « le pouvoir ». Power = énergie transférée par seconde, en watts (W). Ne confonds pas avec « force » (en newtons)."},"de":{"t":"die Leistung","e":"Der Motor hat eine Leistung von 500 W.","u":"⚠ Nicht „Macht“ und nicht „Kraft“. Power = übertragene Energie pro Sekunde, in Watt (W). „Force“ ist etwas anderes und wird in Newton gemessen."},"_k":"power p1 energy the motor has a power of 500 w. la potencia la puissance die leistung el motor tiene una potencia de 500 w. le moteur a une puissance de 500 w. der motor hat eine leistung von 500 w."},{"en":"specific heat capacity","unit":"P1 Energy","ex":"Water has a high specific heat capacity.","es":{"t":"el calor específico","e":"El agua tiene un calor específico alto.","u":"⚠ «Specific» aquí quiere decir «por kilogramo», no «concreto». Es la energía (J) para subir 1 °C la temperatura de 1 kg. Símbolo c."},"fr":{"t":"la capacité thermique massique","e":"L'eau a une capacité thermique massique élevée.","u":"⚠ En anglais « specific » veut dire « par kilogramme », pas « précis ». C'est l'énergie (J) pour chauffer 1 kg de 1 °C. Symbole c."},"de":{"t":"die spezifische Wärmekapazität","e":"Wasser hat eine hohe spezifische Wärmekapazität.","u":"⚠ „Specific“ heißt hier „pro Kilogramm“, nicht „bestimmt“. Energie (J), um 1 kg um 1 °C zu erwärmen. Formelzeichen c."},"_k":"specific heat capacity p1 energy water has a high specific heat capacity. el calor especifico la capacite thermique massique die spezifische warmekapazitat el agua tiene un calor especifico alto. l'eau a une capacite thermique massique elevee. wasser hat eine hohe spezifische warmekapazitat."},{"en":"efficiency","unit":"P1 Energy","ex":"The efficiency of the motor is 0.6, or 60%.","es":{"t":"la eficiencia (el rendimiento)","e":"La eficiencia del motor es 0,6, es decir, el 60 %.","u":"efficiency = useful output ÷ total input. Siempre es menor que 1 (o 100 %). Si te sale más, la fracción está al revés."},"fr":{"t":"le rendement","e":"Le rendement du moteur est de 0,6, soit 60 %.","u":"⚠ En physique on dit « rendement », pas « efficacité ». efficiency = useful output ÷ total input, toujours inférieur à 1 (ou 100 %)."},"de":{"t":"der Wirkungsgrad","e":"Der Wirkungsgrad des Motors ist 0,6, also 60 %.","u":"⚠ Auf Deutsch heißt es „Wirkungsgrad“, nicht „Effizienz“. efficiency = useful output ÷ total input, immer kleiner als 1 (oder 100 %)."},"_k":"efficiency p1 energy the efficiency of the motor is 0.6, or 60%. la eficiencia (el rendimiento) le rendement der wirkungsgrad la eficiencia del motor es 0,6, es decir, el 60 %. le rendement du moteur est de 0,6, soit 60 %. der wirkungsgrad des motors ist 0,6, also 60 %."},{"en":"to dissipate","unit":"P1 Energy","ex":"Some energy is dissipated to the thermal store of the surroundings.","es":{"t":"disiparse","e":"Parte de la energía se disipa al almacén térmico del entorno.","u":"Energía «disipada» = energía que se reparte por el entorno y ya no sirve. No digas «lost»: la energía no se pierde ni se destruye, se disipa."},"fr":{"t":"se dissiper","e":"Une partie de l'énergie est dissipée dans le réservoir thermique de l'environnement.","u":"Énergie « dissipée » = énergie répartie dans l'environnement, devenue inutile. Évite « lost » : l'énergie ne disparaît pas, elle se dissipe."},"de":{"t":"abgegeben werden (an die Umgebung)","e":"Ein Teil der Energie wird an den thermischen Speicher der Umgebung abgegeben.","u":"„Dissipated“ = an die Umgebung verteilt und nicht mehr nutzbar. Sag nicht „lost“: Energie geht nicht verloren, sie wird nur unbrauchbar verteilt."},"_k":"to dissipate p1 energy some energy is dissipated to the thermal store of the surroundings. disiparse se dissiper abgegeben werden (an die umgebung) parte de la energia se disipa al almacen termico del entorno. une partie de l'energie est dissipee dans le reservoir thermique de l'environnement. ein teil der energie wird an den thermischen speicher der umgebung abgegeben."},{"en":"renewable","unit":"P1 Energy","ex":"Wind is a renewable energy resource.","es":{"t":"renovable","e":"El viento es un recurso energético renovable.","u":"Renewable = que se repone a medida que se usa. En el examen, AQA dice «energy resource» (recurso), no «source». Lo contrario: non-renewable."},"fr":{"t":"renouvelable","e":"Le vent est une ressource d'énergie renouvelable.","u":"Renewable = qui se reconstitue à mesure qu'on l'utilise. AQA dit « energy resource » (ressource), pas « source » : garde ce mot. Le contraire : non-renewable."},"de":{"t":"erneuerbar","e":"Wind ist eine erneuerbare Energiequelle.","u":"Renewable = wird nachgebildet, während man es nutzt. AQA sagt „energy resource“ (Ressource), nicht „source“. Gegenteil: non-renewable."},"_k":"renewable p1 energy wind is a renewable energy resource. renovable renouvelable erneuerbar el viento es un recurso energetico renovable. le vent est une ressource d'energie renouvelable. wind ist eine erneuerbare energiequelle."},{"en":"current","unit":"P2 Electricity","ex":"The current through the lamp is 0.5 A.","es":{"t":"la corriente (la intensidad)","e":"La corriente que pasa por la lámpara es de 0,5 A.","u":"⚠ No es «actual» ni «corriente» de normal. Current = flujo de carga por segundo, símbolo I, en amperios (A). Decimos «current through» (a través de) un componente."},"fr":{"t":"l'intensité du courant (f)","e":"L'intensité du courant dans la lampe est de 0,5 A.","u":"⚠ Le mot anglais désigne ce qu'on appelle « l'intensité » (I, en ampères). On dit « current through » un composant, jamais « across »."},"de":{"t":"die Stromstärke","e":"Die Stromstärke durch die Lampe beträgt 0,5 A.","u":"⚠ Meint die Stromstärke (I, in Ampere), nicht „Strom“ als Energie. Man sagt „current through“ (durch) ein Bauteil, nie „across“."},"_k":"current p2 electricity the current through the lamp is 0.5 a. la corriente (la intensidad) l'intensite du courant (f) die stromstarke la corriente que pasa por la lampara es de 0,5 a. l'intensite du courant dans la lampe est de 0,5 a. die stromstarke durch die lampe betragt 0,5 a."},{"en":"charge","unit":"P2 Electricity","ex":"Charge flow = current × time.","es":{"t":"la carga (eléctrica)","e":"Carga = corriente × tiempo.","u":"⚠ «Charge» también es «cobrar» o «cargar» (un móvil). En física es la cantidad de electricidad, símbolo Q, en culombios (C)."},"fr":{"t":"la charge (électrique)","e":"Charge = intensité × temps.","u":"⚠ « Charge » n'est pas ici un poids ni un fardeau. C'est la quantité d'électricité, symbole Q, en coulombs (C). « To charge » = recharger."},"de":{"t":"die Ladung","e":"Ladung = Stromstärke × Zeit.","u":"⚠ „Charge“ hat nichts mit Beladen zu tun. Ladung Q, in Coulomb (C). „Charged“ = geladen, positiv oder negativ."},"_k":"charge p2 electricity charge flow = current × time. la carga (electrica) la charge (electrique) die ladung carga = corriente × tiempo. charge = intensite × temps. ladung = stromstarke × zeit."},{"en":"potential difference","unit":"P2 Electricity","ex":"The potential difference across the resistor is 6 V.","es":{"t":"la diferencia de potencial (el voltaje)","e":"La diferencia de potencial en los extremos de la resistencia es de 6 V.","u":"Es lo mismo que voltage; AQA usa «potential difference» y acepta las dos. Símbolo V, en voltios. Decimos «across» (entre los extremos de) un componente."},"fr":{"t":"la tension","e":"La tension aux bornes de la résistance est de 6 V.","u":"⚠ En anglais on ne dit pas « tension » : le mot d'examen est « potential difference » (ou voltage). Symbole V, en volts. On dit « across » un composant."},"de":{"t":"die Spannung","e":"Die Spannung über dem Widerstand beträgt 6 V.","u":"⚠ Auf Englisch heißt Spannung „potential difference“ (oder voltage), nie „tension“. Symbol V, in Volt. Man sagt „across“ (über) ein Bauteil."},"_k":"potential difference p2 electricity the potential difference across the resistor is 6 v. la diferencia de potencial (el voltaje) la tension die spannung la diferencia de potencial en los extremos de la resistencia es de 6 v. la tension aux bornes de la resistance est de 6 v. die spannung uber dem widerstand betragt 6 v."},{"en":"resistance","unit":"P2 Electricity","ex":"The resistance of the wire increases with its length.","es":{"t":"la resistencia","e":"La resistencia del cable aumenta con su longitud.","u":"Símbolo R, en ohmios (Ω). Ojo: en inglés «resistance» es la propiedad y «resistor» es el componente. En español usamos «resistencia» para las dos cosas."},"fr":{"t":"la résistance","e":"La résistance du fil augmente avec sa longueur.","u":"En anglais, « resistance » est la grandeur (R, en ohms) et « resistor » le composant. En français on dit « résistance » pour les deux : fais la différence en anglais."},"de":{"t":"der Widerstand","e":"Der Widerstand des Drahtes nimmt mit seiner Länge zu.","u":"⚠ Auf Deutsch ist „Widerstand“ beides. Auf Englisch ist „resistance“ die Größe (R, in Ohm) und „resistor“ das Bauteil. Nicht vertauschen."},"_k":"resistance p2 electricity the resistance of the wire increases with its length. la resistencia la resistance der widerstand la resistencia del cable aumenta con su longitud. la resistance du fil augmente avec sa longueur. der widerstand des drahtes nimmt mit seiner lange zu."},{"en":"in series","unit":"P2 Electricity","ex":"Two lamps connected in series share the potential difference.","es":{"t":"en serie","e":"Dos lámparas conectadas en serie se reparten la diferencia de potencial.","u":"En serie = uno detrás de otro, en un solo bucle: la misma corriente en todos. Lo contrario es «in parallel»: la misma diferencia de potencial en cada rama."},"fr":{"t":"en série","e":"Deux lampes montées en série se partagent la tension.","u":"⚠ En français on dit souvent « en dérivation » pour le contraire ; en anglais c'est toujours « in parallel ». En série = une seule boucle, même intensité partout."},"de":{"t":"in Reihe (in Serie)","e":"Zwei in Reihe geschaltete Lampen teilen sich die Spannung.","u":"In Reihe = hintereinander in einer Schleife: überall die gleiche Stromstärke. Das Gegenteil ist „in parallel“: gleiche Spannung an jedem Zweig."},"_k":"in series p2 electricity two lamps connected in series share the potential difference. en serie en serie in reihe (in serie) dos lamparas conectadas en serie se reparten la diferencia de potencial. deux lampes montees en serie se partagent la tension. zwei in reihe geschaltete lampen teilen sich die spannung."},{"en":"live wire","unit":"P2 Electricity","ex":"The live wire is brown and carries 230 V.","es":{"t":"el cable de fase","e":"El cable de fase es marrón y lleva 230 V.","u":"⚠ «Live» aquí no es «en directo» ni «vivo». Es el cable que lleva la tensión. Los otros dos son «neutral» (azul) y «earth» (verde y amarillo)."},"fr":{"t":"le fil de phase","e":"Le fil de phase est marron et porte 230 V.","u":"⚠ « Live » ne veut pas dire « en direct » ici, mais « sous tension ». Les deux autres fils sont « neutral » (bleu) et « earth » (vert et jaune)."},"de":{"t":"der Außenleiter (die Phase)","e":"Der Außenleiter ist braun und führt 230 V.","u":"⚠ „Live“ heißt hier nicht „live“ wie im Fernsehen, sondern „unter Spannung“. Die anderen Adern heißen „neutral“ (blau) und „earth“ (grün-gelb)."},"_k":"live wire p2 electricity the live wire is brown and carries 230 v. el cable de fase le fil de phase der außenleiter (die phase) el cable de fase es marron y lleva 230 v. le fil de phase est marron et porte 230 v. der außenleiter ist braun und fuhrt 230 v."},{"en":"cell","unit":"P2 Electricity","ex":"The circuit is powered by a single cell.","es":{"t":"la pila","e":"El circuito funciona con una sola pila.","u":"⚠ No es una célula (biología) ni un móvil. Es una pila. Varias pilas juntas forman una «battery»."},"fr":{"t":"la pile","e":"Le circuit est alimenté par une seule pile.","u":"⚠ Ce n'est pas une cellule (en biologie). C'est une pile. Plusieurs piles ensemble forment une « battery »."},"de":{"t":"die Zelle (die Batteriezelle)","e":"Der Stromkreis wird von einer einzigen Zelle versorgt.","u":"⚠ Keine Zelle wie in Biologie. Eine einzelne Batteriezelle. Mehrere „cells“ zusammen sind eine „battery“."},"_k":"cell p2 electricity the circuit is powered by a single cell. la pila la pile die zelle (die batteriezelle) el circuito funciona con una sola pila. le circuit est alimente par une seule pile. der stromkreis wird von einer einzigen zelle versorgt."},{"en":"density","unit":"P3 Particle Model","ex":"Density = mass ÷ volume, in kg/m³.","es":{"t":"la densidad","e":"Densidad = masa ÷ volumen, en kg/m³.","u":"Símbolo ρ (rho). Adjetivo: «dense» (denso). Un objeto flota si su density es menor que la del líquido."},"fr":{"t":"la masse volumique","e":"Masse volumique = masse ÷ volume, en kg/m³.","u":"⚠ Le mot d'examen est « density », qui correspond à la masse volumique (en kg/m³), pas à la « densité » sans unité du cours français. Symbole ρ (rhô)."},"de":{"t":"die Dichte","e":"Dichte = Masse ÷ Volumen, in kg/m³.","u":"Symbol ρ (rho). Adjektiv: „dense“ (dicht). Ein Körper schwimmt, wenn seine density kleiner ist als die der Flüssigkeit."},"_k":"density p3 particle model density = mass ÷ volume, in kg/m³. la densidad la masse volumique die dichte densidad = masa ÷ volumen, en kg/m³. masse volumique = masse ÷ volume, en kg/m³. dichte = masse ÷ volumen, in kg/m³."},{"en":"state (of matter)","unit":"P3 Particle Model","ex":"Mass is conserved when a substance changes state.","es":{"t":"el estado (de la materia)","e":"La masa se conserva cuando una sustancia cambia de estado.","u":"⚠ Cuidado: «state» es también la palabra de examen que significa «indica». Aquí es sólido, líquido o gas. «Change of state» = cambio de estado."},"fr":{"t":"l'état (de la matière) (m)","e":"La masse se conserve quand une substance change d'état.","u":"⚠ Attention : « state » est aussi le mot de consigne « indique ». Ici, c'est solide, liquide ou gaz. « Change of state » = changement d'état."},"de":{"t":"der Aggregatzustand","e":"Die Masse bleibt erhalten, wenn ein Stoff seinen Aggregatzustand ändert.","u":"⚠ „State“ ist auch das Aufgabenwort „nenne“. Hier heißt es fest, flüssig oder gasförmig. Auf Englisch sagt man einfach „state“, ohne „Aggregat-“."},"_k":"state (of matter) p3 particle model mass is conserved when a substance changes state. el estado (de la materia) l'etat (de la matiere) (m) der aggregatzustand la masa se conserva cuando una sustancia cambia de estado. la masse se conserve quand une substance change d'etat. die masse bleibt erhalten, wenn ein stoff seinen aggregatzustand andert."},{"en":"internal energy","unit":"P3 Particle Model","ex":"Heating increases the internal energy of the system.","es":{"t":"la energía interna","e":"Al calentar, aumenta la energía interna del sistema.","u":"Suma de la energía cinética y potencial de TODAS las partículas. No es lo mismo que «temperature»: durante un cambio de estado la energía interna sube y la temperatura no."},"fr":{"t":"l'énergie interne (f)","e":"Le chauffage augmente l'énergie interne du système.","u":"Somme des énergies cinétique et potentielle de TOUTES les particules. Différent de « temperature » : pendant un changement d'état, l'énergie interne monte, la température non."},"de":{"t":"die innere Energie","e":"Erwärmen erhöht die innere Energie des Systems.","u":"Summe der kinetischen und potenziellen Energie ALLER Teilchen. Nicht dasselbe wie „temperature“: Beim Schmelzen steigt die innere Energie, die Temperatur nicht."},"_k":"internal energy p3 particle model heating increases the internal energy of the system. la energia interna l'energie interne (f) die innere energie al calentar, aumenta la energia interna del sistema. le chauffage augmente l'energie interne du systeme. erwarmen erhoht die innere energie des systems."},{"en":"specific latent heat","unit":"P3 Particle Model","ex":"The specific latent heat of fusion of ice is 334 000 J/kg.","es":{"t":"el calor latente específico","e":"El calor latente específico de fusión del hielo es de 334 000 J/kg.","u":"⚠ «Fusion» aquí es fundir (sólido → líquido), no fusión nuclear. «Latent» = escondido: energía que cambia el estado SIN cambiar la temperatura. Símbolo L, en J/kg."},"fr":{"t":"la chaleur latente massique","e":"La chaleur latente massique de fusion de la glace est de 334 000 J/kg.","u":"⚠ « Fusion » = passage solide → liquide, pas la fusion nucléaire. Énergie qui change l'état SANS changer la température. Symbole L, en J/kg."},"de":{"t":"die spezifische Schmelzwärme / Verdampfungswärme","e":"Die spezifische Schmelzwärme von Eis beträgt 334 000 J/kg.","u":"⚠ „Fusion“ heißt hier Schmelzen, nicht Kernfusion. Energie, die den Aggregatzustand ändert, OHNE die Temperatur zu ändern. Symbol L, in J/kg."},"_k":"specific latent heat p3 particle model the specific latent heat of fusion of ice is 334 000 j/kg. el calor latente especifico la chaleur latente massique die spezifische schmelzwarme / verdampfungswarme el calor latente especifico de fusion del hielo es de 334 000 j/kg. la chaleur latente massique de fusion de la glace est de 334 000 j/kg. die spezifische schmelzwarme von eis betragt 334 000 j/kg."},{"en":"to condense","unit":"P3 Particle Model","ex":"Steam condenses on the cold window.","es":{"t":"condensarse","e":"El vapor se condensa en la ventana fría.","u":"⚠ En español es reflexivo (se condensa); en inglés no: «it condenses». Gas → líquido. Lo contrario es «evaporate» o «boil»."},"fr":{"t":"se condenser","e":"La vapeur se condense sur la vitre froide.","u":"⚠ En français c'est un verbe pronominal (se condense) ; en anglais non : « it condenses ». Gaz → liquide. Le contraire : « evaporate » ou « boil »."},"de":{"t":"kondensieren","e":"Der Wasserdampf kondensiert an der kalten Scheibe.","u":"Gas → Flüssigkeit. Die anderen Übergänge heißen „melt“ (schmelzen), „freeze“ (erstarren), „boil“ (sieden), „evaporate“ (verdunsten) und „sublimate“."},"_k":"to condense p3 particle model steam condenses on the cold window. condensarse se condenser kondensieren el vapor se condensa en la ventana fria. la vapeur se condense sur la vitre froide. der wasserdampf kondensiert an der kalten scheibe."},{"en":"pressure","unit":"P3 Particle Model","ex":"Heating a gas at constant volume increases its pressure.","es":{"t":"la presión","e":"Al calentar un gas a volumen constante, aumenta su presión.","u":"Fuerza por unidad de área, en pascales (Pa). En un gas viene de los choques de las partículas contra las paredes: más rápido = más presión."},"fr":{"t":"la pression","e":"Chauffer un gaz à volume constant augmente sa pression.","u":"Force par unité de surface, en pascals (Pa). Dans un gaz, elle vient des chocs des particules sur les parois : plus vite = plus de pression."},"de":{"t":"der Druck","e":"Erwärmt man ein Gas bei konstantem Volumen, steigt sein Druck.","u":"⚠ Nicht „Druck“ wie beim Drucken. Kraft pro Fläche, in Pascal (Pa). Bei Gasen kommt er von den Stößen der Teilchen an die Wand: schneller = mehr Druck."},"_k":"pressure p3 particle model heating a gas at constant volume increases its pressure. la presion la pression der druck al calentar un gas a volumen constante, aumenta su presion. chauffer un gaz a volume constant augmente sa pression. erwarmt man ein gas bei konstantem volumen, steigt sein druck."},{"en":"nucleus","unit":"P4 Atomic Structure","ex":"Most of the mass of an atom is in the nucleus.","es":{"t":"el núcleo","e":"Casi toda la masa del átomo está en el núcleo.","u":"Plural en inglés: «nuclei». Adjetivo: «nuclear». Contiene protones y neutrones; los electrones están fuera."},"fr":{"t":"le noyau","e":"Presque toute la masse de l'atome est dans le noyau.","u":"⚠ Pluriel anglais : « nuclei ». Ce n'est pas le noyau d'un fruit. Il contient protons et neutrons ; les électrons sont autour."},"de":{"t":"der Atomkern","e":"Fast die gesamte Masse des Atoms steckt im Kern.","u":"⚠ Plural: „nuclei“. Nicht der Kern einer Frucht. Enthält Protonen und Neutronen; die Elektronen sind außen."},"_k":"nucleus p4 atomic structure most of the mass of an atom is in the nucleus. el nucleo le noyau der atomkern casi toda la masa del atomo esta en el nucleo. presque toute la masse de l'atome est dans le noyau. fast die gesamte masse des atoms steckt im kern."},{"en":"isotope","unit":"P4 Atomic Structure","ex":"Carbon-14 is a radioactive isotope of carbon.","es":{"t":"el isótopo","e":"El carbono-14 es un isótopo radiactivo del carbono.","u":"Mismo número de protones, distinto número de neutrones. En inglés el acento cae en la primera sílaba: «I-so-tope»."},"fr":{"t":"l'isotope (m)","e":"Le carbone 14 est un isotope radioactif du carbone.","u":"Même nombre de protons, nombre de neutrons différent. En anglais, prononcé « aï-so-tope », accent au début."},"de":{"t":"das Isotop","e":"Kohlenstoff-14 ist ein radioaktives Isotop des Kohlenstoffs.","u":"Gleiche Protonenzahl, andere Neutronenzahl. Auf Englisch „ei-so-toup“ ausgesprochen, Betonung vorn."},"_k":"isotope p4 atomic structure carbon-14 is a radioactive isotope of carbon. el isotopo l'isotope (m) das isotop el carbono-14 es un isotopo radiactivo del carbono. le carbone 14 est un isotope radioactif du carbone. kohlenstoff-14 ist ein radioaktives isotop des kohlenstoffs."},{"en":"radiation","unit":"P4 Atomic Structure","ex":"Alpha radiation is stopped by a sheet of paper.","es":{"t":"la radiación","e":"La radiación alfa se detiene con una hoja de papel.","u":"Lo que sale del núcleo: alpha, beta, gamma. Ojo: en inglés «radiation» también se usa para las ondas electromagnéticas (infrared radiation), no solo para lo nuclear."},"fr":{"t":"le rayonnement","e":"Le rayonnement alpha est arrêté par une feuille de papier.","u":"⚠ Le mot anglais couvre ce qu'on appelle « rayonnement » (alpha, bêta, gamma, infrarouge…). « Radiation » en français est surtout un mot médical."},"de":{"t":"die Strahlung","e":"Alphastrahlung wird von einem Blatt Papier gestoppt.","u":"Alles, was der Kern aussendet: alpha, beta, gamma. Achtung: „radiation“ heißt auf Englisch auch Wärmestrahlung (infrared radiation), nicht nur Radioaktivität."},"_k":"radiation p4 atomic structure alpha radiation is stopped by a sheet of paper. la radiacion le rayonnement die strahlung la radiacion alfa se detiene con una hoja de papel. le rayonnement alpha est arrete par une feuille de papier. alphastrahlung wird von einem blatt papier gestoppt."},{"en":"decay","unit":"P4 Atomic Structure","ex":"Radioactive decay is a random process.","es":{"t":"la desintegración","e":"La desintegración radiactiva es un proceso aleatorio.","u":"⚠ En inglés «decay» también significa pudrirse. En física: un núcleo inestable emite radiación y cambia. Verbo: «to decay»."},"fr":{"t":"la désintégration","e":"La désintégration radioactive est un processus aléatoire.","u":"⚠ « Decay » veut aussi dire « pourrir » en anglais. En physique : un noyau instable émet un rayonnement et se transforme. Verbe : « to decay »."},"de":{"t":"der Zerfall","e":"Der radioaktive Zerfall ist ein zufälliger Prozess.","u":"⚠ „Decay“ heißt auch „verfaulen“. In der Physik: Ein instabiler Kern sendet Strahlung aus und wandelt sich um. Verb: „to decay“."},"_k":"decay p4 atomic structure radioactive decay is a random process. la desintegracion la desintegration der zerfall la desintegracion radiactiva es un proceso aleatorio. la desintegration radioactive est un processus aleatoire. der radioaktive zerfall ist ein zufalliger prozess."},{"en":"half-life","unit":"P4 Atomic Structure","ex":"The half-life of the isotope is 8 days.","es":{"t":"el período de semidesintegración (la semivida)","e":"El período de semidesintegración del isótopo es de 8 días.","u":"⚠ No es «la mitad de la vida» de nada. Es el tiempo que tarda en reducirse a la mitad el número de núcleos, o la actividad."},"fr":{"t":"la demi-vie","e":"La demi-vie de l'isotope est de 8 jours.","u":"Temps pour que le nombre de noyaux (ou l'activité) soit divisé par deux. Ce n'est pas « la moitié de la vie » de l'atome."},"de":{"t":"die Halbwertszeit","e":"Die Halbwertszeit des Isotops beträgt 8 Tage.","u":"⚠ Nicht „halbes Leben“. Zeit, bis sich die Zahl der Kerne (oder die Aktivität) halbiert hat."},"_k":"half-life p4 atomic structure the half-life of the isotope is 8 days. el periodo de semidesintegracion (la semivida) la demi-vie die halbwertszeit el periodo de semidesintegracion del isotopo es de 8 dias. la demi-vie de l'isotope est de 8 jours. die halbwertszeit des isotops betragt 8 tage."},{"en":"activity","unit":"P4 Atomic Structure","ex":"The activity of the source is 200 Bq.","es":{"t":"la actividad","e":"La actividad de la fuente es de 200 Bq.","u":"⚠ No es «hacer cosas». Es cuántos núcleos se desintegran por segundo, en becquerels (Bq). Lo que mide el detector se llama «count rate»."},"fr":{"t":"l'activité (f)","e":"L'activité de la source est de 200 Bq.","u":"⚠ Rien à voir avec une activité sportive. C'est le nombre de désintégrations par seconde, en becquerels (Bq). Ce que mesure le détecteur s'appelle « count rate »."},"de":{"t":"die Aktivität","e":"Die Aktivität der Quelle beträgt 200 Bq.","u":"⚠ Keine Freizeitaktivität. Zahl der Zerfälle pro Sekunde, in Becquerel (Bq). Was der Zähler misst, heißt „count rate“."},"_k":"activity p4 atomic structure the activity of the source is 200 bq. la actividad l'activite (f) die aktivitat la actividad de la fuente es de 200 bq. l'activite de la source est de 200 bq. die aktivitat der quelle betragt 200 bq."},{"en":"irradiation","unit":"P4 Atomic Structure","ex":"Irradiation does not make the object radioactive.","es":{"t":"la irradiación","e":"La irradiación no vuelve radiactivo al objeto.","u":"Exponer algo a la radiación. Compáralo con «contamination»: tener átomos radiactivos encima. AQA pregunta la diferencia casi cada año."},"fr":{"t":"l'irradiation (f)","e":"L'irradiation ne rend pas l'objet radioactif.","u":"Exposer un objet au rayonnement. À comparer avec « contamination » : avoir des atomes radioactifs sur soi. AQA demande la différence presque chaque année."},"de":{"t":"die Bestrahlung","e":"Bestrahlung macht den Gegenstand nicht radioaktiv.","u":"Etwas der Strahlung aussetzen. Vergleich mit „contamination“: radioaktive Atome auf oder in etwas. AQA fragt den Unterschied fast jedes Jahr."},"_k":"irradiation p4 atomic structure irradiation does not make the object radioactive. la irradiacion l'irradiation (f) die bestrahlung la irradiacion no vuelve radiactivo al objeto. l'irradiation ne rend pas l'objet radioactif. bestrahlung macht den gegenstand nicht radioaktiv."},{"en":"resultant force","unit":"P5 Forces","ex":"If the resultant force is zero, the velocity does not change.","es":{"t":"la fuerza resultante","e":"Si la fuerza resultante es cero, la velocidad no cambia.","u":"Una sola fuerza que sustituye a todas las demás. Fuerzas en la misma línea: suma o resta. Si vale cero, las fuerzas están «balanced»."},"fr":{"t":"la force résultante","e":"Si la force résultante est nulle, la vitesse ne change pas.","u":"Une seule force qui remplace toutes les autres. Sur une même ligne : on additionne ou on soustrait. Si elle est nulle, les forces sont « balanced »."},"de":{"t":"die resultierende Kraft","e":"Ist die resultierende Kraft null, ändert sich die Geschwindigkeit nicht.","u":"Eine einzige Kraft, die alle anderen ersetzt. Auf einer Linie: addieren oder subtrahieren. Ist sie null, sind die Kräfte „balanced“."},"_k":"resultant force p5 forces if the resultant force is zero, the velocity does not change. la fuerza resultante la force resultante die resultierende kraft si la fuerza resultante es cero, la velocidad no cambia. si la force resultante est nulle, la vitesse ne change pas. ist die resultierende kraft null, andert sich die geschwindigkeit nicht."},{"en":"work done","unit":"P5 Forces","ex":"Work done = force × distance.","es":{"t":"el trabajo (realizado)","e":"Trabajo = fuerza × distancia.","u":"⚠ No es un empleo ni deberes. Se hace «work» cuando una fuerza mueve algo. En julios (J): 1 J = 1 N·m. Es exactamente la energía transferida."},"fr":{"t":"le travail (effectué)","e":"Travail = force × distance.","u":"⚠ Ce n'est pas un emploi ni un devoir. Il y a « work » quand une force déplace un objet. En joules (J) : 1 J = 1 N·m. C'est l'énergie transférée."},"de":{"t":"die (verrichtete) Arbeit","e":"Arbeit = Kraft × Weg.","u":"⚠ Kein Job und keine Hausaufgabe. „Work“ wird verrichtet, wenn eine Kraft etwas bewegt. In Joule (J): 1 J = 1 N·m. Es ist die übertragene Energie."},"_k":"work done p5 forces work done = force × distance. el trabajo (realizado) le travail (effectue) die (verrichtete) arbeit trabajo = fuerza × distancia. travail = force × distance. arbeit = kraft × weg."},{"en":"extension","unit":"P5 Forces","ex":"The extension of the spring is 4 cm.","es":{"t":"el alargamiento","e":"El alargamiento del muelle es de 4 cm.","u":"⚠ No es una extensión de pelo ni un plazo extra. Es cuánto se ha alargado el muelle: longitud final − longitud original. Símbolo e, en metros."},"fr":{"t":"l'allongement (m)","e":"L'allongement du ressort est de 4 cm.","u":"⚠ Pas une extension de cheveux ni un délai. C'est de combien le ressort s'est allongé : longueur finale − longueur initiale. Symbole e, en mètres."},"de":{"t":"die Verlängerung (die Dehnung)","e":"Die Verlängerung der Feder beträgt 4 cm.","u":"⚠ Keine Verlängerung wie beim Fußball. Wie viel länger die Feder geworden ist: Endlänge − Anfangslänge. Symbol e, in Metern. Nie die ganze Länge einsetzen."},"_k":"extension p5 forces the extension of the spring is 4 cm. el alargamiento l'allongement (m) die verlangerung (die dehnung) el alargamiento del muelle es de 4 cm. l'allongement du ressort est de 4 cm. die verlangerung der feder betragt 4 cm."},{"en":"velocity","unit":"P5 Forces","ex":"Velocity is speed in a given direction.","es":{"t":"la velocidad (con dirección)","e":"La velocidad (velocity) es la rapidez en una dirección determinada.","u":"⚠ El inglés tiene dos palabras y el español una. «Speed» = solo el número (escalar); «velocity» = número y dirección (vector). En una rotonda la speed no cambia, pero la velocity sí."},"fr":{"t":"la vitesse (vectorielle)","e":"La velocity, c'est la vitesse dans une direction donnée.","u":"⚠ L'anglais a deux mots, le français un seul. « Speed » = le nombre seul (scalaire) ; « velocity » = nombre + direction (vecteur). Sur un rond-point, même speed, mais la velocity change."},"de":{"t":"die Geschwindigkeit (mit Richtung)","e":"Velocity ist die Geschwindigkeit in einer bestimmten Richtung.","u":"⚠ Englisch hat zwei Wörter, Deutsch eins. „Speed“ = nur die Zahl (Skalar); „velocity“ = Zahl plus Richtung (Vektor). Im Kreisverkehr bleibt speed gleich, velocity ändert sich."},"_k":"velocity p5 forces velocity is speed in a given direction. la velocidad (con direccion) la vitesse (vectorielle) die geschwindigkeit (mit richtung) la velocidad (velocity) es la rapidez en una direccion determinada. la velocity, c'est la vitesse dans une direction donnee. velocity ist die geschwindigkeit in einer bestimmten richtung."},{"en":"momentum","unit":"P5 Forces","ex":"Momentum = mass × velocity.","es":{"t":"la cantidad de movimiento (el momento lineal)","e":"Cantidad de movimiento = masa × velocidad.","u":"⚠ No es «un momento» (un instante). Símbolo p, en kg m/s. En un choque, la cantidad de movimiento total se conserva. Solo Higher Tier."},"fr":{"t":"la quantité de mouvement","e":"Quantité de mouvement = masse × vitesse.","u":"⚠ Rien à voir avec « un moment ». Symbole p, en kg m/s. Dans une collision, la quantité de mouvement totale se conserve. Higher Tier seulement."},"de":{"t":"der Impuls","e":"Impuls = Masse × Geschwindigkeit.","u":"⚠ Nicht „Moment“ und nicht „Momentum“ wie im Sport. Auf Deutsch: Impuls. Symbol p, in kg m/s. Beim Stoß bleibt der Gesamtimpuls erhalten. Nur Higher Tier."},"_k":"momentum p5 forces momentum = mass × velocity. la cantidad de movimiento (el momento lineal) la quantite de mouvement der impuls cantidad de movimiento = masa × velocidad. quantite de mouvement = masse × vitesse. impuls = masse × geschwindigkeit."},{"en":"terminal velocity","unit":"P5 Forces","ex":"The skydiver reaches terminal velocity when the resultant force is zero.","es":{"t":"la velocidad límite (terminal)","e":"El paracaidista alcanza la velocidad límite cuando la fuerza resultante es cero.","u":"«Terminal» = final, máxima. Se alcanza cuando la resistencia del aire iguala al peso: fuerzas «balanced», velocidad constante."},"fr":{"t":"la vitesse limite","e":"Le parachutiste atteint sa vitesse limite quand la force résultante est nulle.","u":"⚠ « Terminal » ne veut pas dire « aéroport » : c'est « finale, maximale ». Atteinte quand la résistance de l'air égale le poids : forces « balanced », vitesse constante."},"de":{"t":"die Endgeschwindigkeit","e":"Der Fallschirmspringer erreicht seine Endgeschwindigkeit, wenn die resultierende Kraft null ist.","u":"⚠ „Terminal“ heißt hier „endgültig“, nicht Flughafen. Erreicht, wenn der Luftwiderstand gleich dem Gewicht ist: Kräfte „balanced“, Geschwindigkeit konstant."},"_k":"terminal velocity p5 forces the skydiver reaches terminal velocity when the resultant force is zero. la velocidad limite (terminal) la vitesse limite die endgeschwindigkeit el paracaidista alcanza la velocidad limite cuando la fuerza resultante es cero. le parachutiste atteint sa vitesse limite quand la force resultante est nulle. der fallschirmspringer erreicht seine endgeschwindigkeit, wenn die resultierende kraft null ist."},{"en":"thinking distance","unit":"P5 Forces","ex":"Stopping distance = thinking distance + braking distance.","es":{"t":"la distancia de reacción","e":"Distancia de parada = distancia de reacción + distancia de frenado.","u":"Lo que recorre el coche MIENTRAS el conductor reacciona, antes de frenar. El cansancio, el alcohol y las distracciones la alargan; la lluvia afecta a la «braking distance», no a esta."},"fr":{"t":"la distance de réaction","e":"Distance d'arrêt = distance de réaction + distance de freinage.","u":"Distance parcourue PENDANT que le conducteur réagit, avant de freiner. Fatigue, alcool, distractions l'allongent ; la pluie agit sur la « braking distance », pas sur celle-ci."},"de":{"t":"der Reaktionsweg","e":"Anhalteweg = Reaktionsweg + Bremsweg.","u":"Der Weg, den das Auto zurücklegt, WÄHREND der Fahrer reagiert, vor dem Bremsen. Müdigkeit, Alkohol und Ablenkung verlängern ihn; Regen wirkt auf die „braking distance“, nicht hierauf."},"_k":"thinking distance p5 forces stopping distance = thinking distance + braking distance. la distancia de reaccion la distance de reaction der reaktionsweg distancia de parada = distancia de reaccion + distancia de frenado. distance d'arret = distance de reaction + distance de freinage. anhalteweg = reaktionsweg + bremsweg."},{"en":"gradient","unit":"P5 Forces","ex":"The gradient of a distance–time graph gives the speed.","es":{"t":"la pendiente","e":"La pendiente de una gráfica distancia-tiempo da la rapidez.","u":"⚠ No es un degradado de color. Es la pendiente: cambio en y ÷ cambio en x. En una gráfica velocidad-tiempo da la aceleración. AQA dice «gradient», no «slope»."},"fr":{"t":"la pente","e":"La pente d'un graphique distance–temps donne la vitesse.","u":"⚠ Pas « gradient » au sens de « dégradé ». C'est la pente : variation de y ÷ variation de x. Sur un graphique vitesse–temps, elle donne l'accélération."},"de":{"t":"die Steigung","e":"Die Steigung eines Weg-Zeit-Diagramms gibt die Geschwindigkeit an.","u":"⚠ Nicht „Gradient“ wie beim Farbverlauf. Steigung = Δy ÷ Δx. Im Geschwindigkeit-Zeit-Diagramm ergibt sie die Beschleunigung."},"_k":"gradient p5 forces the gradient of a distance–time graph gives the speed. la pendiente la pente die steigung la pendiente de una grafica distancia-tiempo da la rapidez. la pente d'un graphique distance–temps donne la vitesse. die steigung eines weg-zeit-diagramms gibt die geschwindigkeit an."},{"en":"wave","unit":"P6 Waves","ex":"Sound is a longitudinal wave.","es":{"t":"la onda","e":"El sonido es una onda longitudinal.","u":"⚠ No es una «ola» del mar (aunque las olas sean ondas). Una wave transfiere energía sin transferir materia: el agua sube y baja, no viaja."},"fr":{"t":"l'onde (f)","e":"Le son est une onde longitudinale.","u":"⚠ Pas « une vague » (même si les vagues sont des ondes). Une wave transporte de l'énergie, pas de matière : l'eau monte et descend, elle ne voyage pas."},"de":{"t":"die Welle","e":"Schall ist eine Longitudinalwelle.","u":"Eine wave überträgt Energie, aber keine Materie: Das Wasser hebt und senkt sich, es wandert nicht. „To wave“ heißt außerdem winken."},"_k":"wave p6 waves sound is a longitudinal wave. la onda l'onde (f) die welle el sonido es una onda longitudinal. le son est une onde longitudinale. schall ist eine longitudinalwelle."},{"en":"transverse","unit":"P6 Waves","ex":"Light is a transverse wave.","es":{"t":"transversal","e":"La luz es una onda transversal.","u":"Las partículas vibran PERPENDICULARES a la dirección de la onda. Lo contrario es «longitudinal»: vibran en la misma dirección (el sonido)."},"fr":{"t":"transversale","e":"La lumière est une onde transversale.","u":"Les vibrations sont PERPENDICULAIRES à la direction de l'onde. Le contraire : « longitudinal », vibrations dans la même direction (le son)."},"de":{"t":"transversal (die Querwelle)","e":"Licht ist eine Transversalwelle.","u":"Die Schwingung steht SENKRECHT zur Ausbreitungsrichtung (Querwelle). Das Gegenteil ist „longitudinal“: Schwingung in Ausbreitungsrichtung (Schall)."},"_k":"transverse p6 waves light is a transverse wave. transversal transversale transversal (die querwelle) la luz es una onda transversal. la lumiere est une onde transversale. licht ist eine transversalwelle."},{"en":"amplitude","unit":"P6 Waves","ex":"The amplitude is the maximum displacement from the rest position.","es":{"t":"la amplitud","e":"La amplitud es el desplazamiento máximo respecto a la posición de reposo.","u":"⚠ Se mide desde el CENTRO hasta la cresta, no de cresta a valle. Más amplitud = más energía (sonido más fuerte)."},"fr":{"t":"l'amplitude (f)","e":"L'amplitude est l'écart maximal par rapport à la position de repos.","u":"⚠ Elle se mesure du CENTRE jusqu'à la crête, pas de la crête au creux. Plus d'amplitude = plus d'énergie (son plus fort)."},"de":{"t":"die Amplitude","e":"Die Amplitude ist die maximale Auslenkung aus der Ruhelage.","u":"⚠ Von der MITTE bis zum Wellenberg gemessen, nicht von Berg zu Tal. Größere Amplitude = mehr Energie (lauterer Ton)."},"_k":"amplitude p6 waves the amplitude is the maximum displacement from the rest position. la amplitud l'amplitude (f) die amplitude la amplitud es el desplazamiento maximo respecto a la posicion de reposo. l'amplitude est l'ecart maximal par rapport a la position de repos. die amplitude ist die maximale auslenkung aus der ruhelage."},{"en":"wavelength","unit":"P6 Waves","ex":"Wave speed = frequency × wavelength.","es":{"t":"la longitud de onda","e":"Velocidad de la onda = frecuencia × longitud de onda.","u":"Distancia de una cresta a la siguiente, símbolo λ (lambda), en metros. En inglés es una sola palabra: «wavelength»."},"fr":{"t":"la longueur d'onde","e":"Vitesse de l'onde = fréquence × longueur d'onde.","u":"Distance d'une crête à la suivante, symbole λ (lambda), en mètres. Un seul mot en anglais : « wavelength »."},"de":{"t":"die Wellenlänge","e":"Wellengeschwindigkeit = Frequenz × Wellenlänge.","u":"Abstand von einem Wellenberg zum nächsten, Symbol λ (Lambda), in Metern. Auf Englisch ein Wort: „wavelength“."},"_k":"wavelength p6 waves wave speed = frequency × wavelength. la longitud de onda la longueur d'onde die wellenlange velocidad de la onda = frecuencia × longitud de onda. vitesse de l'onde = frequence × longueur d'onde. wellengeschwindigkeit = frequenz × wellenlange."},{"en":"period","unit":"P6 Waves","ex":"The period of the wave is 0.02 s.","es":{"t":"el período","e":"El período de la onda es de 0,02 s.","u":"⚠ En el colegio «period» es una clase; aquí es el tiempo de UNA onda completa, símbolo T, en segundos. T = 1 ÷ frequency."},"fr":{"t":"la période","e":"La période de l'onde est de 0,02 s.","u":"⚠ Pas une période de l'histoire ni une heure de cours. C'est le temps d'UNE onde complète, symbole T, en secondes. T = 1 ÷ frequency."},"de":{"t":"die Periodendauer (die Schwingungsdauer)","e":"Die Periodendauer der Welle beträgt 0,02 s.","u":"⚠ Nicht die Schulstunde. Die Zeit für EINE ganze Welle, Symbol T, in Sekunden. T = 1 ÷ frequency."},"_k":"period p6 waves the period of the wave is 0.02 s. el periodo la periode die periodendauer (die schwingungsdauer) el periodo de la onda es de 0,02 s. la periode de l'onde est de 0,02 s. die periodendauer der welle betragt 0,02 s."},{"en":"medium","unit":"P6 Waves","ex":"Light slows down when it enters a denser medium.","es":{"t":"el medio","e":"La luz se frena al entrar en un medio más denso.","u":"⚠ No es «mediano» (talla M). Es la sustancia por la que viaja la onda: aire, agua, vidrio. Plural en inglés: «media»."},"fr":{"t":"le milieu","e":"La lumière ralentit en entrant dans un milieu plus dense.","u":"⚠ Pas la taille M. C'est la substance dans laquelle l'onde se propage : air, eau, verre. Pluriel : « media »."},"de":{"t":"das Medium","e":"Licht wird langsamer, wenn es in ein dichteres Medium eintritt.","u":"⚠ Nicht die Größe M. Der Stoff, durch den die Welle läuft: Luft, Wasser, Glas. Plural: „media“."},"_k":"medium p6 waves light slows down when it enters a denser medium. el medio le milieu das medium la luz se frena al entrar en un medio mas denso. la lumiere ralentit en entrant dans un milieu plus dense. licht wird langsamer, wenn es in ein dichteres medium eintritt."},{"en":"refraction","unit":"P6 Waves","ex":"Refraction happens because the wave changes speed at the boundary.","es":{"t":"la refracción","e":"La refracción ocurre porque la onda cambia de velocidad en la frontera.","u":"No lo confundas con «reflection» (rebotar). Refraction = cambio de dirección al cambiar de medio. Verbo: «to refract»."},"fr":{"t":"la réfraction","e":"La réfraction se produit parce que l'onde change de vitesse à la frontière.","u":"Ne confonds pas avec « reflection » (rebondir). Refraction = changement de direction en changeant de milieu. Verbe : « to refract »."},"de":{"t":"die Brechung","e":"Brechung entsteht, weil die Welle an der Grenzfläche ihre Geschwindigkeit ändert.","u":"⚠ Auf Deutsch „Brechung“, nicht „Refraktion“. Nicht mit „reflection“ (Zurückwerfen) verwechseln. Verb: „to refract“."},"_k":"refraction p6 waves refraction happens because the wave changes speed at the boundary. la refraccion la refraction die brechung la refraccion ocurre porque la onda cambia de velocidad en la frontera. la refraction se produit parce que l'onde change de vitesse a la frontiere. brechung entsteht, weil die welle an der grenzflache ihre geschwindigkeit andert."},{"en":"field","unit":"P7 Magnetism","ex":"The magnetic field is strongest at the poles.","es":{"t":"el campo","e":"El campo magnético es más intenso en los polos.","u":"⚠ No es un campo de fútbol. Es la región donde actúa una fuerza sin contacto: magnetic field, gravitational field. Las líneas van de N a S."},"fr":{"t":"le champ","e":"Le champ magnétique est le plus intense aux pôles.","u":"⚠ Pas un champ de blé. C'est la région où une force à distance agit : magnetic field, gravitational field. Les lignes vont du pôle N vers le pôle S."},"de":{"t":"das Feld","e":"Das Magnetfeld ist an den Polen am stärksten.","u":"⚠ Kein Acker. Der Bereich, in dem eine Kraft ohne Berührung wirkt: magnetic field, gravitational field. Die Feldlinien laufen von N nach S."},"_k":"field p7 magnetism the magnetic field is strongest at the poles. el campo le champ das feld el campo magnetico es mas intenso en los polos. le champ magnetique est le plus intense aux poles. das magnetfeld ist an den polen am starksten."},{"en":"pole","unit":"P7 Magnetism","ex":"Like poles repel; unlike poles attract.","es":{"t":"el polo","e":"Los polos iguales se repelen; los polos distintos se atraen.","u":"⚠ En inglés «pole» también es un poste o palo. En magnetismo: los extremos del imán. «Like poles» = polos iguales, no polos que «gustan»."},"fr":{"t":"le pôle","e":"Les pôles de même nom se repoussent ; les pôles différents s'attirent.","u":"⚠ « Pole » en anglais, c'est aussi un poteau. En magnétisme : les extrémités de l'aimant. « Like poles » = pôles de même nom, rien à voir avec « aimer »."},"de":{"t":"der Pol","e":"Gleiche Pole stoßen sich ab, ungleiche Pole ziehen sich an.","u":"⚠ „Pole“ heißt auf Englisch auch Stange. Beim Magneten: die Enden. „Like poles“ = gleiche Pole, nichts mit „mögen“."},"_k":"pole p7 magnetism like poles repel; unlike poles attract. el polo le pole der pol los polos iguales se repelen; los polos distintos se atraen. les poles de meme nom se repoussent ; les poles differents s'attirent. gleiche pole stoßen sich ab, ungleiche pole ziehen sich an."},{"en":"induced magnet","unit":"P7 Magnetism","ex":"An iron nail becomes an induced magnet near a permanent magnet.","es":{"t":"el imán inducido","e":"Un clavo de hierro se convierte en un imán inducido cerca de un imán permanente.","u":"«Induced» = provocado por otra cosa; no es «deducido». Solo se imanta dentro de un campo y siempre atrae. Lo contrario: «permanent magnet»."},"fr":{"t":"l'aimant induit (m)","e":"Un clou en fer devient un aimant induit près d'un aimant permanent.","u":"« Induced » = provoqué par autre chose. Il n'est aimanté que dans un champ et attire toujours. Le contraire : « permanent magnet »."},"de":{"t":"der induzierte Magnet","e":"Ein Eisennagel wird in der Nähe eines Dauermagneten zum induzierten Magneten.","u":"„Induced“ = von etwas anderem hervorgerufen. Nur im Magnetfeld magnetisch, und immer anziehend. Gegenteil: „permanent magnet“ (Dauermagnet)."},"_k":"induced magnet p7 magnetism an iron nail becomes an induced magnet near a permanent magnet. el iman inducido l'aimant induit (m) der induzierte magnet un clavo de hierro se convierte en un iman inducido cerca de un iman permanente. un clou en fer devient un aimant induit pres d'un aimant permanent. ein eisennagel wird in der nahe eines dauermagneten zum induzierten magneten."},{"en":"solenoid","unit":"P7 Magnetism","ex":"Adding an iron core makes the solenoid's field stronger.","es":{"t":"el solenoide","e":"Añadir un núcleo de hierro hace más intenso el campo del solenoide.","u":"Un cable enrollado en forma de muelle. En inglés a veces se dice también «coil» (bobina). Con núcleo de hierro se llama «electromagnet»."},"fr":{"t":"le solénoïde","e":"Ajouter un noyau de fer renforce le champ du solénoïde.","u":"Un fil enroulé en forme de ressort. On dit aussi « coil » (bobine). Avec un noyau de fer, ça s'appelle « electromagnet »."},"de":{"t":"die Spule (das Solenoid)","e":"Ein Eisenkern macht das Feld der Spule stärker.","u":"⚠ Auf Deutsch sagt man meist einfach „Spule“. Ein spiralförmig gewickelter Draht; auf Englisch auch „coil“. Mit Eisenkern heißt es „electromagnet“."},"_k":"solenoid p7 magnetism adding an iron core makes the solenoid's field stronger. el solenoide le solenoide die spule (das solenoid) anadir un nucleo de hierro hace mas intenso el campo del solenoide. ajouter un noyau de fer renforce le champ du solenoide. ein eisenkern macht das feld der spule starker."},{"en":"conductor","unit":"P7 Magnetism","ex":"A conductor carrying a current in a magnetic field experiences a force.","es":{"t":"el conductor","e":"Un conductor por el que circula corriente dentro de un campo magnético experimenta una fuerza.","u":"⚠ En física no conduce un coche. Es un material (o un cable) por el que puede pasar la corriente. Lo contrario: «insulator»."},"fr":{"t":"le conducteur","e":"Un conducteur parcouru par un courant dans un champ magnétique subit une force.","u":"⚠ Ce n'est pas celui qui conduit la voiture. C'est un matériau (ou un fil) qui laisse passer le courant. Le contraire : « insulator »."},"de":{"t":"der Leiter","e":"Auf einen stromdurchflossenen Leiter im Magnetfeld wirkt eine Kraft.","u":"⚠ Keine Leiter zum Klettern und kein Anführer. Ein Material (oder Draht), durch das Strom fließen kann. Gegenteil: „insulator“."},"_k":"conductor p7 magnetism a conductor carrying a current in a magnetic field experiences a force. el conductor le conducteur der leiter un conductor por el que circula corriente dentro de un campo magnetico experimenta una fuerza. un conducteur parcouru par un courant dans un champ magnetique subit une force. auf einen stromdurchflossenen leiter im magnetfeld wirkt eine kraft."},{"en":"motor effect","unit":"P7 Magnetism","ex":"The motor effect is the force on a current-carrying wire in a magnetic field.","es":{"t":"el efecto motor","e":"El efecto motor es la fuerza sobre un cable con corriente dentro de un campo magnético.","u":"Nombre de examen para la fuerza que hace girar un motor. Fórmula: F = BIl. Dirección: «Fleming's left-hand rule». Solo Higher Tier."},"fr":{"t":"l'effet moteur (m)","e":"L'effet moteur est la force exercée sur un fil parcouru par un courant dans un champ magnétique.","u":"Le nom d'examen de la force qui fait tourner un moteur. Formule : F = BIl. Direction : « Fleming's left-hand rule ». Higher Tier seulement."},"de":{"t":"der Motoreffekt (die Lorentzkraft)","e":"Der Motoreffekt ist die Kraft auf einen stromdurchflossenen Draht im Magnetfeld.","u":"⚠ In Deutschland heißt diese Kraft „Lorentzkraft“; AQA nennt sie „motor effect“. Formel: F = BIl. Richtung: „Fleming's left-hand rule“. Nur Higher Tier."},"_k":"motor effect p7 magnetism the motor effect is the force on a current-carrying wire in a magnetic field. el efecto motor l'effet moteur (m) der motoreffekt (die lorentzkraft) el efecto motor es la fuerza sobre un cable con corriente dentro de un campo magnetico. l'effet moteur est la force exercee sur un fil parcouru par un courant dans un champ magnetique. der motoreffekt ist die kraft auf einen stromdurchflossenen draht im magnetfeld."},{"en":"state","unit":"Exam command words","ex":"State the unit of power.","es":{"t":"indicar / escribir","e":"Indica la unidad de la potencia.","u":"⚠ Palabra de examen. Respuesta corta, sin explicar: una palabra, un número o una frase. Normalmente vale 1 punto: no gastes tiempo en razones."},"fr":{"t":"indiquer / donner","e":"Indique l'unité de la puissance.","u":"⚠ Mot de consigne. Réponse courte, sans explication : un mot, un nombre ou une phrase. Un point en général : ne perds pas de temps à justifier."},"de":{"t":"nennen / angeben","e":"Nenne die Einheit der Leistung.","u":"⚠ Aufgabenwort. Kurze Antwort ohne Erklärung: ein Wort, eine Zahl oder ein Satz. Meist 1 Punkt: keine Zeit für Begründungen."},"_k":"state exam command words state the unit of power. indicar / escribir indiquer / donner nennen / angeben indica la unidad de la potencia. indique l'unite de la puissance. nenne die einheit der leistung."},{"en":"describe","unit":"Exam command words","ex":"Describe the pattern shown in the graph.","es":{"t":"describir","e":"Describe la tendencia que muestra la gráfica.","u":"Di QUÉ pasa, no por qué. Para una gráfica: «as x increases, y increases», y cita valores. Si das razones, no te las puntúan aquí."},"fr":{"t":"décrire","e":"Décris la tendance que montre le graphique.","u":"Dis CE QUI se passe, pas pourquoi. Pour un graphique : « as x increases, y increases », avec des valeurs. Les raisons ne rapportent rien ici."},"de":{"t":"beschreiben","e":"Beschreibe den Verlauf, den das Diagramm zeigt.","u":"Sag, WAS passiert, nicht warum. Bei einem Diagramm: „as x increases, y increases“, mit Werten. Gründe geben hier keine Punkte."},"_k":"describe exam command words describe the pattern shown in the graph. describir decrire beschreiben describe la tendencia que muestra la grafica. decris la tendance que montre le graphique. beschreibe den verlauf, den das diagramm zeigt."},{"en":"explain","unit":"Exam command words","ex":"Explain why the resistance of the wire increases.","es":{"t":"explicar","e":"Explica por qué aumenta la resistencia del cable.","u":"Di qué pasa Y por qué. Necesitas «because», «so» o «therefore». Cada punto suele ser un paso de la cadena de razones."},"fr":{"t":"expliquer","e":"Explique pourquoi la résistance du fil augmente.","u":"Dis ce qui se passe ET pourquoi. Il te faut « because », « so » ou « therefore ». Chaque point est en général un maillon du raisonnement."},"de":{"t":"erklären","e":"Erkläre, warum der Widerstand des Drahtes zunimmt.","u":"Sag, was passiert, UND warum. Du brauchst „because“, „so“ oder „therefore“. Jeder Punkt ist meist ein Schritt in der Begründungskette."},"_k":"explain exam command words explain why the resistance of the wire increases. explicar expliquer erklaren explica por que aumenta la resistencia del cable. explique pourquoi la resistance du fil augmente. erklare, warum der widerstand des drahtes zunimmt."},{"en":"compare","unit":"Exam command words","ex":"Compare the properties of alpha and beta radiation.","es":{"t":"comparar","e":"Compara las propiedades de la radiación alfa y beta.","u":"⚠ Tienes que hablar de LAS DOS cosas en la misma frase: «alpha is more ionising than beta». Describir solo una no puntúa. Incluye parecidos y diferencias."},"fr":{"t":"comparer","e":"Compare les propriétés des rayonnements alpha et bêta.","u":"⚠ Il faut parler des DEUX dans la même phrase : « alpha is more ionising than beta ». Décrire une seule ne rapporte rien. Donne ressemblances et différences."},"de":{"t":"vergleichen","e":"Vergleiche die Eigenschaften von Alpha- und Betastrahlung.","u":"⚠ BEIDE müssen im selben Satz vorkommen: „alpha is more ionising than beta“. Nur eins zu beschreiben gibt keine Punkte. Gemeinsamkeiten und Unterschiede nennen."},"_k":"compare exam command words compare the properties of alpha and beta radiation. comparar comparer vergleichen compara las propiedades de la radiacion alfa y beta. compare les proprietes des rayonnements alpha et beta. vergleiche die eigenschaften von alpha- und betastrahlung."},{"en":"calculate","unit":"Exam command words","ex":"Calculate the kinetic energy of the car.","es":{"t":"calcular","e":"Calcula la energía cinética del coche.","u":"Escribe la ecuación, sustituye los números, da el resultado CON unidad. Cada paso puede valer un punto aunque el resultado final esté mal."},"fr":{"t":"calculer","e":"Calcule l'énergie cinétique de la voiture.","u":"Écris l'équation, remplace par les nombres, donne le résultat AVEC l'unité. Chaque étape peut rapporter un point même si le résultat final est faux."},"de":{"t":"berechnen","e":"Berechne die kinetische Energie des Autos.","u":"Gleichung hinschreiben, Zahlen einsetzen, Ergebnis MIT Einheit. Jeder Schritt kann einen Punkt bringen, auch wenn das Endergebnis falsch ist."},"_k":"calculate exam command words calculate the kinetic energy of the car. calcular calculer berechnen calcula la energia cinetica del coche. calcule l'energie cinetique de la voiture. berechne die kinetische energie des autos."},{"en":"evaluate","unit":"Exam command words","ex":"Evaluate the use of nuclear fuel for generating electricity.","es":{"t":"valorar / evaluar","e":"Valora el uso del combustible nuclear para generar electricidad.","u":"⚠ No es «calcular un valor». Da ventajas Y desventajas usando la información de la pregunta, y termina con una conclusión: «overall…». Suele valer 4–6 puntos."},"fr":{"t":"évaluer","e":"Évalue l'utilisation du combustible nucléaire pour produire de l'électricité.","u":"⚠ Pas « calculer une valeur ». Donne avantages ET inconvénients à partir des données, puis conclus : « overall… ». Souvent 4 à 6 points."},"de":{"t":"bewerten / beurteilen","e":"Bewerte den Einsatz von Kernbrennstoff zur Stromerzeugung.","u":"⚠ Nicht „einen Wert ausrechnen“. Vor- UND Nachteile aus den Angaben nennen, dann ein Fazit: „overall…“. Oft 4–6 Punkte."},"_k":"evaluate exam command words evaluate the use of nuclear fuel for generating electricity. valorar / evaluar evaluer bewerten / beurteilen valora el uso del combustible nuclear para generar electricidad. evalue l'utilisation du combustible nucleaire pour produire de l'electricite. bewerte den einsatz von kernbrennstoff zur stromerzeugung."},{"en":"justify","unit":"Exam command words","ex":"Justify your choice of radioactive source.","es":{"t":"justificar","e":"Justifica tu elección de fuente radiactiva.","u":"Da razones que apoyen una respuesta o una decisión, con datos de la pregunta. Parecido a «explain», pero defendiendo una elección."},"fr":{"t":"justifier","e":"Justifie ton choix de source radioactive.","u":"Donne des raisons qui soutiennent une réponse ou un choix, avec les données de la question. Proche de « explain », mais pour défendre une décision."},"de":{"t":"begründen","e":"Begründe deine Wahl der radioaktiven Quelle.","u":"⚠ Nicht „rechtfertigen“ wie beim Entschuldigen. Gründe angeben, die eine Antwort oder Entscheidung stützen, mit Daten aus der Aufgabe."},"_k":"justify exam command words justify your choice of radioactive source. justificar justifier begrunden justifica tu eleccion de fuente radiactiva. justifie ton choix de source radioactive. begrunde deine wahl der radioaktiven quelle."}],"langs":["es","fr","de"],"units":["Exam command words","P1 Energy","P2 Electricity","P3 Particle Model","P4 Atomic Structure","P5 Forces","P6 Waves","P7 Magnetism"],"ui":{"es":{"ph":"Escribe una palabra — en español o en inglés","all":"Todos los temas","none":"No se ha encontrado nada.","sort_en":"Orden: inglés","sort_xx":"Orden: español","count":"términos"},"fr":{"ph":"Tape un mot — en français ou en anglais","all":"Tous les thèmes","none":"Aucun résultat.","sort_en":"Tri : anglais","sort_xx":"Tri : français","count":"termes"},"de":{"ph":"Gib ein Wort ein — auf Deutsch oder Englisch","all":"Alle Themen","none":"Nichts gefunden.","sort_en":"Sortierung: Englisch","sort_xx":"Sortierung: Deutsch","count":"Begriffe"}},"beta":{"es":"Esta página la ha escrito <strong>Alfred</strong>, el sistema de IA del Sr. Rawson, para ayudarte a estudiar en inglés. <strong>Es nueva, y Alfred todavía está aprendiendo tu idioma, así que algunas cosas estarán mal.</strong> Si una palabra te parece incorrecta, seguramente tengas razón: díselo al Sr. Rawson y la corregimos. Si falta una palabra que necesitas, o se te ocurre cómo mejorar esta página, díselo también. Cambia siempre que lo pidas.","fr":"Cette page a été écrite par <strong>Alfred</strong>, le système d'IA de M. Rawson, pour t'aider à étudier en anglais. <strong>Elle est toute nouvelle, et Alfred apprend encore ta langue : certaines choses seront donc fausses.</strong> Si un mot te semble incorrect, tu as sans doute raison : dis-le à M. Rawson et nous le corrigerons. S'il manque un mot dont tu as besoin, ou si tu as une idée pour améliorer cette page, dis-le-lui aussi. Elle change dès que tu le demandes.","de":"Diese Seite hat <strong>Alfred</strong> geschrieben, das KI-System von Mr Rawson, damit du auf Englisch lernen kannst. <strong>Sie ist ganz neu, und Alfred lernt deine Sprache noch — manches wird also falsch sein.</strong> Wenn dir ein Wort falsch vorkommt, hast du wahrscheinlich recht: Sag Mr Rawson Bescheid, dann korrigieren wir es. Wenn ein Wort fehlt, das du brauchst, oder dir einfällt, wie diese Seite besser wird, sag ihm das auch. Sie ändert sich, sobald du es sagst."},"name":{"es":"Español","fr":"Français","de":"Deutsch"}};
const KEY = "vocab-lang";
const fold = s => (s||"").toString().toLowerCase()
  .normalize("NFD").replace(/[\u0300-\u036f]/g, "");

function pick() {
  const q = new URLSearchParams(location.search).get("lang");
  if (q && D.langs.includes(q)) { try { localStorage.setItem(KEY, q); } catch (e) {} return q; }
  let s = null; try { s = localStorage.getItem(KEY); } catch (e) {}
  if (s && D.langs.includes(s)) return s;
  return D.langs[0];
}
let L = pick();

function setLang(v) {
  L = v; try { localStorage.setItem(KEY, v); } catch (e) {}
  chrome(); render();
}

function chrome() {
  document.getElementById("langbar").innerHTML = D.langs.map(x =>
    `<button data-l="${x}" aria-pressed="${x === L}">${D.name[x]}</button>`).join("");
  document.querySelectorAll("#langbar button").forEach(b =>
    b.onclick = () => setLang(b.dataset.l));
  document.getElementById("beta").innerHTML = D.beta[L];
  const u = D.ui[L];
  document.getElementById("q").placeholder = u.ph;
  const sel = document.getElementById("unit"), keep = sel.value;
  sel.innerHTML = `<option value="">${u.all}</option>` +
    D.units.map(x => `<option>${x}</option>`).join("");
  sel.value = keep;
  const so = document.getElementById("sort"), ks = so.value;
  so.innerHTML = `<option value="en">${u.sort_en}</option><option value="xx">${u.sort_xx}</option>`;
  so.value = ks || "en";
}

function render() {
  const u = D.ui[L];
  const q = fold(document.getElementById("q").value.trim());
  const unit = document.getElementById("unit").value;
  const sort = document.getElementById("sort").value || "en";
  let rows = D.terms.filter(t => t[L]);
  if (unit) rows = rows.filter(t => t.unit === unit);
  if (q) rows = rows.filter(t => t._k.includes(q));
  rows.sort((a, b) => (sort === "xx" ? fold(a[L].t).localeCompare(fold(b[L].t))
                                     : fold(a.en).localeCompare(fold(b.en))));
  document.getElementById("n").textContent = rows.length + " " + u.count;
  document.getElementById("list").innerHTML = rows.length ? rows.map(t => {
    const w = t[L].u.indexOf("\u26a0") === 0 ? " warn" : "";
    return `<div class="row">
      <div><h3>${esc(t.en)}</h3><p class="xx">${esc(t[L].t)}</p>
        ${t.unit ? `<p class="unit">${esc(t.unit)}</p>` : ""}</div>
      <div>${t.ex ? `<p class="ex">${esc(t.ex)}</p>` : ""}
        <p class="ex tr">${esc(t[L].e)}</p>
        <p class="use${w}">${esc(t[L].u)}</p></div>
    </div>`;
  }).join("") : `<p class="n">${u.none}</p>`;
}

function esc(s) {
  return (s || "").replace(/[&<>"']/g, c =>
    ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"})[c]);
}

document.getElementById("q").addEventListener("input", render);
document.getElementById("unit").addEventListener("change", render);
document.getElementById("sort").addEventListener("change", render);
// A laptop is the only device these students may have in class (spec §2), so the
// keyboard is the fast path: "/" jumps to the box from anywhere on the page.
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement.id !== "q") {
    e.preventDefault(); document.getElementById("q").focus();
  }
});
chrome(); render();
</script>
</body>
