<script>
const D = {"terms":[{"en":"fetch-execute cycle","unit":"1.1 Systems Architecture","ex":"Describe what happens during the fetch-execute cycle.","es":{"t":"el ciclo de instrucción (fetch-execute)","e":"Describe qué ocurre durante el ciclo de instrucción (fetch-execute).","u":"En español se dice «ciclo de instrucción» o «ciclo fetch-decode-execute», pero en el examen escribe siempre «fetch-execute cycle». Los tres pasos: fetch (buscar la instrucción en memoria), decode (descodificarla), execute (ejecutarla)."},"fr":{"t":"le cycle d'exécution (fetch-execute)","e":"Décris ce qui se passe pendant le cycle fetch-execute.","u":"En français on parle du « cycle d'instruction » ou « cycle fetch-decode-execute », mais à l'examen utilise toujours « fetch-execute cycle ». Fetch = aller chercher l'instruction en mémoire, decode = la décoder, execute = l'exécuter."},"de":{"t":"der Fetch-Execute-Zyklus (Befehlszyklus)","e":"Beschreibe, was während des Fetch-Execute-Zyklus passiert.","u":"Im Deutschen heißt er auch „Befehlszyklus“ oder „Von-Neumann-Zyklus“, aber in der Prüfung schreibst du immer „fetch-execute cycle“. Fetch = Befehl aus dem Speicher holen, decode = entschlüsseln, execute = ausführen."},"_k":"fetch-execute cycle 1.1 systems architecture describe what happens during the fetch-execute cycle. el ciclo de instruccion (fetch-execute) le cycle d'execution (fetch-execute) der fetch-execute-zyklus (befehlszyklus) describe que ocurre durante el ciclo de instruccion (fetch-execute). decris ce qui se passe pendant le cycle fetch-execute. beschreibe, was wahrend des fetch-execute-zyklus passiert."},{"en":"register","unit":"1.1 Systems Architecture","ex":"The Program Counter is a register that holds the address of the next instruction.","es":{"t":"el registro","e":"El Program Counter es un registro que guarda la dirección de la siguiente instrucción.","u":"⚠ No es el registro de un colegio ni una lista de asistencia. En la CPU un register es una memoria diminuta y rapidísima dentro del procesador. Nombres que debes saber: MAR, MDR, Program Counter, Accumulator."},"fr":{"t":"le registre","e":"Le Program Counter est un registre qui contient l'adresse de l'instruction suivante.","u":"⚠ Rien à voir avec le registre d'une école ou d'un magasin. Dans le CPU, un register est une minuscule mémoire ultra-rapide à l'intérieur du processeur. À connaître : MAR, MDR, Program Counter, Accumulator."},"de":{"t":"das Register","e":"Der Program Counter ist ein Register, das die Adresse des nächsten Befehls enthält.","u":"Gleiches Wort wie im Deutschen. Ein Register ist ein winziger, sehr schneller Speicher direkt im Prozessor. Die vier Namen aus dem Lehrplan (MAR, MDR, Program Counter, Accumulator) bleiben auf Englisch."},"_k":"register 1.1 systems architecture the program counter is a register that holds the address of the next instruction. el registro le registre das register el program counter es un registro que guarda la direccion de la siguiente instruccion. le program counter est un registre qui contient l'adresse de l'instruction suivante. der program counter ist ein register, das die adresse des nachsten befehls enthalt."},{"en":"cache","unit":"1.1 Systems Architecture","ex":"A larger cache means the CPU waits less often for data from RAM.","es":{"t":"la caché","e":"Una caché más grande hace que la CPU espere menos veces a los datos de la RAM.","u":"⚠ En español se escribe «caché» con tilde, pero en inglés es «cache» y se pronuncia igual que «cash» (dinero), no «cachet». Es una memoria pequeña y muy rápida pegada a la CPU."},"fr":{"t":"le cache (la mémoire cache)","e":"Un cache plus grand signifie que le CPU attend moins souvent les données de la RAM.","u":"⚠ Le mot vient du français, mais en anglais il se prononce comme « cash » (l'argent), pas comme « caché ». C'est une petite mémoire très rapide collée au processeur."},"de":{"t":"der Cache","e":"Ein größerer Cache bedeutet, dass die CPU seltener auf Daten aus dem RAM warten muss.","u":"Wird im Deutschen genauso genannt. Aussprache wie „cash“ (Bargeld). Ein kleiner, sehr schneller Zwischenspeicher direkt an der CPU."},"_k":"cache 1.1 systems architecture a larger cache means the cpu waits less often for data from ram. la cache le cache (la memoire cache) der cache una cache mas grande hace que la cpu espere menos veces a los datos de la ram. un cache plus grand signifie que le cpu attend moins souvent les donnees de la ram. ein großerer cache bedeutet, dass die cpu seltener auf daten aus dem ram warten muss."},{"en":"bus","unit":"1.1 Systems Architecture","ex":"The address bus carries the address of the memory location to be read.","es":{"t":"el bus","e":"El bus de direcciones lleva la dirección de la posición de memoria que se va a leer.","u":"⚠ Nada que ver con el autobús. Un bus es el conjunto de cables que transporta datos o direcciones entre la CPU y la memoria. En informática en español también se dice «bus» (bus de datos, bus de direcciones)."},"fr":{"t":"le bus","e":"Le bus d'adresses transporte l'adresse de l'emplacement mémoire à lire.","u":"⚠ Pas l'autobus ! Un bus est un ensemble de fils qui transportent des données ou des adresses entre le CPU et la mémoire. Le mot est le même en français informatique (bus de données, bus d'adresses)."},"de":{"t":"der Bus","e":"Der Adressbus überträgt die Adresse der Speicherstelle, die gelesen werden soll.","u":"⚠ Nicht der Linienbus. Ein Bus ist ein Bündel Leitungen, das Daten oder Adressen zwischen CPU und Speicher transportiert. Auch im Deutschen sagt man „Bus“ (Datenbus, Adressbus)."},"_k":"bus 1.1 systems architecture the address bus carries the address of the memory location to be read. el bus le bus der bus el bus de direcciones lleva la direccion de la posicion de memoria que se va a leer. le bus d'adresses transporte l'adresse de l'emplacement memoire a lire. der adressbus ubertragt die adresse der speicherstelle, die gelesen werden soll."},{"en":"memory","unit":"1.2 Memory and Storage","ex":"RAM is the main memory of the computer.","es":{"t":"la memoria","e":"La RAM es la memoria principal del ordenador.","u":"⚠ En inglés, memory (RAM, ROM) y storage (disco duro, SSD) son cosas distintas y el examen las separa. Si escribes «memory» para un disco duro, pierdes el punto. Memory = primary storage."},"fr":{"t":"la mémoire","e":"La RAM est la mémoire principale de l'ordinateur.","u":"⚠ En anglais, memory (RAM, ROM) et storage (disque dur, SSD) sont deux choses différentes, et l'examen les sépare. Écrire « memory » pour un disque dur fait perdre le point. Memory = primary storage."},"de":{"t":"der Speicher (Arbeitsspeicher)","e":"RAM ist der Arbeitsspeicher des Computers.","u":"⚠ Im Deutschen ist „Speicher“ alles, auch die Festplatte. Im Englischen ist memory nur RAM und ROM (primary storage); Festplatte oder SSD heißen storage. Wer „memory“ für eine Festplatte schreibt, verliert den Punkt."},"_k":"memory 1.2 memory and storage ram is the main memory of the computer. la memoria la memoire der speicher (arbeitsspeicher) la ram es la memoria principal del ordenador. la ram est la memoire principale de l'ordinateur. ram ist der arbeitsspeicher des computers."},{"en":"volatile","unit":"1.2 Memory and Storage","ex":"RAM is volatile, so its contents are lost when the power is turned off.","es":{"t":"volátil","e":"La RAM es volátil, así que su contenido se pierde al apagar el equipo.","u":"Significa que los datos desaparecen sin electricidad. RAM es volatile; ROM y el disco son non-volatile. El prefijo «non-» significa «no»."},"fr":{"t":"volatile","e":"La RAM est volatile : son contenu est perdu quand on coupe l'alimentation.","u":"Même mot qu'en français. Volatile = les données disparaissent sans courant. La RAM est volatile ; la ROM et le disque sont non-volatile (le préfixe « non- » veut dire « pas »)."},"de":{"t":"flüchtig","e":"RAM ist flüchtig, der Inhalt geht beim Ausschalten verloren.","u":"Flüchtig heißt: ohne Strom sind die Daten weg. RAM ist volatile, ROM und Festplatte sind non-volatile (nicht flüchtig). Das Prüfungswort ist immer „volatile“, nicht „temporary“."},"_k":"volatile 1.2 memory and storage ram is volatile, so its contents are lost when the power is turned off. volatil volatile fluchtig la ram es volatil, asi que su contenido se pierde al apagar el equipo. la ram est volatile : son contenu est perdu quand on coupe l'alimentation. ram ist fluchtig, der inhalt geht beim ausschalten verloren."},{"en":"character","unit":"1.2 Memory and Storage","ex":"Each character is stored as a binary number using a character set such as ASCII.","es":{"t":"el carácter","e":"Cada carácter se guarda como un número binario mediante un conjunto de caracteres como ASCII.","u":"⚠ Aquí no es la personalidad de alguien ni un personaje de una película. Un character es una sola letra, cifra o símbolo (A, 7, ?, o un espacio). «Character set» = conjunto de caracteres, como ASCII o Unicode."},"fr":{"t":"le caractère","e":"Chaque caractère est stocké sous forme de nombre binaire grâce à un jeu de caractères comme l'ASCII.","u":"⚠ Pas le caractère d'une personne ni un personnage de film. Un character est une seule lettre, un chiffre ou un symbole (A, 7, ?, ou une espace). « Character set » = jeu de caractères, comme ASCII ou Unicode."},"de":{"t":"das Zeichen","e":"Jedes Zeichen wird mit einem Zeichensatz wie ASCII als Binärzahl gespeichert.","u":"⚠ Nicht „Charakter“ im Sinne von Persönlichkeit. Ein character ist ein einzelnes Zeichen: ein Buchstabe, eine Ziffer, ein Symbol oder ein Leerzeichen. „Character set“ = Zeichensatz (ASCII, Unicode)."},"_k":"character 1.2 memory and storage each character is stored as a binary number using a character set such as ascii. el caracter le caractere das zeichen cada caracter se guarda como un numero binario mediante un conjunto de caracteres como ascii. chaque caractere est stocke sous forme de nombre binaire grace a un jeu de caracteres comme l'ascii. jedes zeichen wird mit einem zeichensatz wie ascii als binarzahl gespeichert."},{"en":"lossy compression","unit":"1.2 Memory and Storage","ex":"JPEG uses lossy compression, so some image data is permanently removed.","es":{"t":"la compresión con pérdida","e":"JPEG usa compresión con pérdida, así que parte de los datos de la imagen se elimina para siempre.","u":"Lossy = con pérdida (se borran datos y no vuelven). Lossless = sin pérdida (el archivo vuelve a ser exactamente el original). En el examen escribe siempre la palabra completa: «lossy» o «lossless»."},"fr":{"t":"la compression avec perte","e":"Le JPEG utilise une compression avec perte : une partie des données de l'image est supprimée définitivement.","u":"Lossy = avec perte (des données sont effacées pour de bon). Lossless = sans perte (le fichier redevient exactement l'original). À l'examen, écris toujours « lossy » ou « lossless » en toutes lettres."},"de":{"t":"die verlustbehaftete Kompression","e":"JPEG nutzt verlustbehaftete Kompression, deshalb werden manche Bilddaten dauerhaft entfernt.","u":"Lossy = verlustbehaftet (Daten werden endgültig gelöscht). Lossless = verlustfrei (die Datei wird wieder genau das Original). In der Prüfung immer das ganze Wort schreiben: „lossy“ oder „lossless“."},"_k":"lossy compression 1.2 memory and storage jpeg uses lossy compression, so some image data is permanently removed. la compresion con perdida la compression avec perte die verlustbehaftete kompression jpeg usa compresion con perdida, asi que parte de los datos de la imagen se elimina para siempre. le jpeg utilise une compression avec perte : une partie des donnees de l'image est supprimee definitivement. jpeg nutzt verlustbehaftete kompression, deshalb werden manche bilddaten dauerhaft entfernt."},{"en":"overflow","unit":"1.2 Memory and Storage","ex":"Adding 1 to 11111111 in 8 bits causes an overflow error.","es":{"t":"el desbordamiento (overflow)","e":"Sumar 1 a 11111111 en 8 bits produce un error de desbordamiento (overflow).","u":"Ocurre cuando el resultado necesita más bits de los que hay. En clase de informática en español a menudo se dice directamente «overflow». En el examen: «overflow error»."},"fr":{"t":"le dépassement de capacité (overflow)","e":"Ajouter 1 à 11111111 sur 8 bits provoque un dépassement de capacité (overflow).","u":"Se produit quand le résultat a besoin de plus de bits qu'il n'y en a. En cours d'info en français on dit souvent « overflow » directement. À l'examen : « overflow error »."},"de":{"t":"der Überlauf (Overflow)","e":"Wenn man in 8 Bit 1 zu 11111111 addiert, entsteht ein Überlauf (overflow).","u":"Passiert, wenn das Ergebnis mehr Bits braucht, als vorhanden sind. Im Deutschen sagt man auch oft einfach „Overflow“. Prüfungswort: „overflow error“."},"_k":"overflow 1.2 memory and storage adding 1 to 11111111 in 8 bits causes an overflow error. el desbordamiento (overflow) le depassement de capacite (overflow) der uberlauf (overflow) sumar 1 a 11111111 en 8 bits produce un error de desbordamiento (overflow). ajouter 1 a 11111111 sur 8 bits provoque un depassement de capacite (overflow). wenn man in 8 bit 1 zu 11111111 addiert, entsteht ein uberlauf (overflow)."},{"en":"protocol","unit":"1.3 Computer Networks, Connections and Protocols","ex":"HTTPS is the protocol used for secure web pages.","es":{"t":"el protocolo","e":"HTTPS es el protocolo que se usa para páginas web seguras.","u":"Un protocol es un conjunto de reglas para que dos ordenadores se comuniquen. Los nombres (TCP/IP, HTTP, HTTPS, FTP, SMTP, POP, IMAP) son iguales en todos los idiomas. Aprende qué hace cada uno."},"fr":{"t":"le protocole","e":"HTTPS est le protocole utilisé pour les pages web sécurisées.","u":"Un protocol est un ensemble de règles pour que deux ordinateurs se comprennent. Les noms (TCP/IP, HTTP, HTTPS, FTP, SMTP, POP, IMAP) sont les mêmes dans toutes les langues. Apprends ce que fait chacun."},"de":{"t":"das Protokoll","e":"HTTPS ist das Protokoll für sichere Webseiten.","u":"⚠ Nicht das Protokoll einer Sitzung (die Mitschrift). Ein protocol ist ein Satz Regeln, damit zwei Computer sich verstehen. Die Namen (TCP/IP, HTTP, HTTPS, FTP, SMTP, POP, IMAP) sind in jeder Sprache gleich."},"_k":"protocol 1.3 computer networks, connections and protocols https is the protocol used for secure web pages. el protocolo le protocole das protokoll https es el protocolo que se usa para paginas web seguras. https est le protocole utilise pour les pages web securisees. https ist das protokoll fur sichere webseiten."},{"en":"packet","unit":"1.3 Computer Networks, Connections and Protocols","ex":"The file is split into packets, which may take different routes across the network.","es":{"t":"el paquete","e":"El archivo se divide en paquetes, que pueden seguir rutas distintas por la red.","u":"Un packet es un trozo pequeño de datos con una etiqueta (dirección de origen, de destino, número de orden). Enviar datos así se llama «packet switching». En español también se dice «paquete»."},"fr":{"t":"le paquet","e":"Le fichier est découpé en paquets, qui peuvent prendre des routes différentes sur le réseau.","u":"Un packet est un petit morceau de données avec une étiquette (adresse de départ, d'arrivée, numéro d'ordre). Envoyer les données ainsi s'appelle « packet switching ». Même mot en français : paquet."},"de":{"t":"das Paket (Datenpaket)","e":"Die Datei wird in Pakete zerlegt, die verschiedene Wege durch das Netzwerk nehmen können.","u":"Ein packet ist ein kleines Stück Daten mit Etikett (Absender, Ziel, Nummer in der Reihenfolge). Das Verfahren heißt „packet switching“ (Paketvermittlung). Im Deutschen: Datenpaket."},"_k":"packet 1.3 computer networks, connections and protocols the file is split into packets, which may take different routes across the network. el paquete le paquet das paket (datenpaket) el archivo se divide en paquetes, que pueden seguir rutas distintas por la red. le fichier est decoupe en paquets, qui peuvent prendre des routes differentes sur le reseau. die datei wird in pakete zerlegt, die verschiedene wege durch das netzwerk nehmen konnen."},{"en":"host","unit":"1.3 Computer Networks, Connections and Protocols","ex":"A web server hosts the website so that clients can request pages from it.","es":{"t":"alojar (el host)","e":"Un servidor web aloja el sitio para que los clientes puedan pedirle páginas.","u":"⚠ No es el anfitrión de una fiesta. En redes, «to host» es guardar y servir un sitio o un servicio, y «a host» es cualquier ordenador conectado a la red. En español se dice «alojar» y, en informal, «hostear»."},"fr":{"t":"héberger (l'hôte)","e":"Un serveur web héberge le site pour que les clients puissent lui demander des pages.","u":"⚠ Pas l'hôte qui reçoit des invités. En réseau, « to host » = héberger un site ou un service, et « a host » = n'importe quel ordinateur relié au réseau. En français on dit héberger / hébergeur."},"de":{"t":"hosten (der Host)","e":"Ein Webserver hostet die Website, damit Clients Seiten von ihm anfordern können.","u":"⚠ Nicht der Gastgeber. Im Netzwerk heißt „to host“, eine Website oder einen Dienst bereitstellen, und „a host“ ist jeder Computer im Netz. Im Deutschen sagt man auch „hosten“ und „Hoster“."},"_k":"host 1.3 computer networks, connections and protocols a web server hosts the website so that clients can request pages from it. alojar (el host) heberger (l'hote) hosten (der host) un servidor web aloja el sitio para que los clientes puedan pedirle paginas. un serveur web heberge le site pour que les clients puissent lui demander des pages. ein webserver hostet die website, damit clients seiten von ihm anfordern konnen."},{"en":"firewall","unit":"1.4 Network Security","ex":"A firewall blocks unwanted traffic between the network and the internet.","es":{"t":"el cortafuegos (el firewall)","e":"Un cortafuegos bloquea el tráfico no deseado entre la red e internet.","u":"En español se dice «cortafuegos», pero casi todo el mundo dice «firewall». Es software o hardware que examina el tráfico de red y deja pasar solo lo permitido."},"fr":{"t":"le pare-feu (le firewall)","e":"Un pare-feu bloque le trafic indésirable entre le réseau et Internet.","u":"En français on dit « pare-feu », mais « firewall » est aussi courant. C'est un logiciel ou un matériel qui examine le trafic réseau et ne laisse passer que ce qui est autorisé."},"de":{"t":"die Firewall","e":"Eine Firewall blockiert unerwünschten Datenverkehr zwischen dem Netzwerk und dem Internet.","u":"Wird im Deutschen genauso genannt (die Firewall). Software oder Hardware, die den Netzwerkverkehr prüft und nur Erlaubtes durchlässt."},"_k":"firewall 1.4 network security a firewall blocks unwanted traffic between the network and the internet. el cortafuegos (el firewall) le pare-feu (le firewall) die firewall un cortafuegos bloquea el trafico no deseado entre la red e internet. un pare-feu bloque le trafic indesirable entre le reseau et internet. eine firewall blockiert unerwunschten datenverkehr zwischen dem netzwerk und dem internet."},{"en":"phishing","unit":"1.4 Network Security","ex":"Phishing emails trick users into giving away their passwords.","es":{"t":"el phishing","e":"Los correos de phishing engañan al usuario para que dé su contraseña.","u":"Se usa en inglés en todos los idiomas. Es un tipo de «social engineering» (ingeniería social): engaña a la persona, no al ordenador. Se escribe con «ph», no con «f»."},"fr":{"t":"le phishing (l'hameçonnage)","e":"Les e-mails de phishing piègent les utilisateurs pour leur soutirer leur mot de passe.","u":"On dit « phishing » en français aussi (le mot officiel « hameçonnage » est rare). C'est une forme de « social engineering » : on trompe la personne, pas l'ordinateur. Attention à l'orthographe : « ph », pas « f »."},"de":{"t":"das Phishing","e":"Phishing-Mails bringen Nutzer dazu, ihre Passwörter zu verraten.","u":"Wird im Deutschen genauso verwendet. Eine Form von „social engineering“: der Mensch wird getäuscht, nicht der Computer. Schreibweise mit „ph“, nicht mit „f“."},"_k":"phishing 1.4 network security phishing emails trick users into giving away their passwords. el phishing le phishing (l'hameconnage) das phishing los correos de phishing enganan al usuario para que de su contrasena. les e-mails de phishing piegent les utilisateurs pour leur soutirer leur mot de passe. phishing-mails bringen nutzer dazu, ihre passworter zu verraten."},{"en":"encryption","unit":"1.4 Network Security","ex":"Encryption scrambles the data so that only someone with the key can read it.","es":{"t":"el cifrado (la encriptación)","e":"El cifrado transforma los datos para que solo quien tenga la clave pueda leerlos.","u":"⚠ En español correcto es «cifrar», aunque «encriptar» se oye mucho. En inglés el verbo es «to encrypt» y lo contrario es «to decrypt». Ojo: encryption no impide que roben los datos, solo que los entiendan."},"fr":{"t":"le chiffrement (le cryptage)","e":"Le chiffrement brouille les données pour que seule la personne qui a la clé puisse les lire.","u":"⚠ Le mot correct est « chiffrer » ; « crypter » est courant mais critiqué. En anglais : « to encrypt », et le contraire est « to decrypt ». Attention : encryption n'empêche pas le vol des données, seulement leur lecture."},"de":{"t":"die Verschlüsselung","e":"Verschlüsselung macht die Daten unlesbar, sodass nur jemand mit dem Schlüssel sie lesen kann.","u":"Verb: „to encrypt“ = verschlüsseln, „to decrypt“ = entschlüsseln. Der „key“ ist der Schlüssel. Achtung: encryption verhindert nicht den Diebstahl der Daten, nur dass man sie versteht."},"_k":"encryption 1.4 network security encryption scrambles the data so that only someone with the key can read it. el cifrado (la encriptacion) le chiffrement (le cryptage) die verschlusselung el cifrado transforma los datos para que solo quien tenga la clave pueda leerlos. le chiffrement brouille les donnees pour que seule la personne qui a la cle puisse les lire. verschlusselung macht die daten unlesbar, sodass nur jemand mit dem schlussel sie lesen kann."},{"en":"driver","unit":"1.5 Systems Software","ex":"The operating system needs a driver to communicate with the printer.","es":{"t":"el controlador (el driver)","e":"El sistema operativo necesita un controlador para comunicarse con la impresora.","u":"⚠ No es un conductor ni un chófer. Un driver es un programa pequeño que permite al sistema operativo hablar con un dispositivo (impresora, tarjeta gráfica). En español se dice «controlador», pero «driver» es muy común. En el examen: «device driver»."},"fr":{"t":"le pilote (le driver)","e":"Le système d'exploitation a besoin d'un pilote pour communiquer avec l'imprimante.","u":"⚠ Pas un chauffeur ! Un driver est un petit programme qui permet au système d'exploitation de parler à un périphérique (imprimante, carte graphique). En français : « pilote », mais « driver » est très courant. À l'examen : « device driver »."},"de":{"t":"der Treiber","e":"Das Betriebssystem braucht einen Treiber, um mit dem Drucker zu kommunizieren.","u":"⚠ Kein Fahrer. Ein driver ist ein kleines Programm, mit dem das Betriebssystem ein Gerät (Drucker, Grafikkarte) ansteuert. Im Deutschen sagt man „Treiber“; in der Prüfung: „device driver“."},"_k":"driver 1.5 systems software the operating system needs a driver to communicate with the printer. el controlador (el driver) le pilote (le driver) der treiber el sistema operativo necesita un controlador para comunicarse con la impresora. le systeme d'exploitation a besoin d'un pilote pour communiquer avec l'imprimante. das betriebssystem braucht einen treiber, um mit dem drucker zu kommunizieren."},{"en":"utility software","unit":"1.5 Systems Software","ex":"Defragmentation software is an example of utility software.","es":{"t":"el software de utilidad (las utilidades del sistema)","e":"Un desfragmentador es un ejemplo de software de utilidad.","u":"⚠ «Utility» aquí no significa «utilidad» (lo útil que es algo). Es una categoría de programas que mantienen el ordenador: encryption, defragmentation, compression, backup. «Software» se dice igual en español."},"fr":{"t":"les utilitaires (logiciels utilitaires)","e":"Un logiciel de défragmentation est un exemple d'utilitaire.","u":"⚠ « Utility » ne veut pas dire « utilité ». C'est une catégorie de programmes qui entretiennent l'ordinateur : encryption, defragmentation, compression, backup. « Software » se dit aussi en français (ou « logiciel »)."},"de":{"t":"die Dienstprogramme (Utility-Software)","e":"Ein Defragmentierungsprogramm ist ein Beispiel für ein Dienstprogramm.","u":"Utility software sind Hilfsprogramme, die den Computer pflegen: encryption, defragmentation, compression, backup. Im Deutschen: Dienstprogramme. „Software“ ist in beiden Sprachen gleich."},"_k":"utility software 1.5 systems software defragmentation software is an example of utility software. el software de utilidad (las utilidades del sistema) les utilitaires (logiciels utilitaires) die dienstprogramme (utility-software) un desfragmentador es un ejemplo de software de utilidad. un logiciel de defragmentation est un exemple d'utilitaire. ein defragmentierungsprogramm ist ein beispiel fur ein dienstprogramm."},{"en":"open source","unit":"1.6 Ethical, Legal, Cultural and Environmental Impacts","ex":"Open source software lets anyone view and modify the source code.","es":{"t":"de código abierto (open source)","e":"El software de código abierto permite a cualquiera ver y modificar el código fuente.","u":"«Open source» se usa en inglés también en español. Lo contrario es «proprietary» (propietario: de pago y con el código cerrado). «Source code» = código fuente, el programa tal como lo escribió el programador."},"fr":{"t":"open source (à code source ouvert)","e":"Un logiciel open source permet à n'importe qui de voir et de modifier le code source.","u":"On dit « open source » en français aussi. Le contraire est « proprietary » (propriétaire : payant, code fermé). « Source code » = code source, le programme tel que l'a écrit le programmeur."},"de":{"t":"quelloffen (Open Source)","e":"Open-Source-Software erlaubt jedem, den Quellcode anzusehen und zu verändern.","u":"Im Deutschen sagt man auch „Open Source“. Das Gegenteil ist „proprietary“ (proprietär: kostenpflichtig, Code geschlossen). „Source code“ = Quellcode, das Programm, wie es der Programmierer geschrieben hat."},"_k":"open source 1.6 ethical, legal, cultural and environmental impacts open source software lets anyone view and modify the source code. de codigo abierto (open source) open source (a code source ouvert) quelloffen (open source) el software de codigo abierto permite a cualquiera ver y modificar el codigo fuente. un logiciel open source permet a n'importe qui de voir et de modifier le code source. open-source-software erlaubt jedem, den quellcode anzusehen und zu verandern."},{"en":"abstraction","unit":"2.1 Algorithms","ex":"Abstraction means removing unnecessary detail from a problem.","es":{"t":"la abstracción","e":"La abstracción consiste en quitar los detalles innecesarios de un problema.","u":"⚠ No es «arte abstracto» ni «estar distraído». En informática es quedarse solo con lo importante: un plano del metro es una abstraction de la ciudad. Va casi siempre en pareja con «decomposition»."},"fr":{"t":"l'abstraction","e":"L'abstraction consiste à retirer les détails inutiles d'un problème.","u":"⚠ Rien à voir avec l'art abstrait. En informatique, c'est garder seulement l'essentiel : un plan de métro est une abstraction de la ville. Va presque toujours avec « decomposition »."},"de":{"t":"die Abstraktion","e":"Abstraktion bedeutet, unnötige Details aus einem Problem zu entfernen.","u":"Gleiches Wort wie im Deutschen. Nur das Wichtige behalten: Ein U-Bahn-Plan ist eine abstraction der Stadt. Kommt fast immer zusammen mit „decomposition“ vor."},"_k":"abstraction 2.1 algorithms abstraction means removing unnecessary detail from a problem. la abstraccion l'abstraction die abstraktion la abstraccion consiste en quitar los detalles innecesarios de un problema. l'abstraction consiste a retirer les details inutiles d'un probleme. abstraktion bedeutet, unnotige details aus einem problem zu entfernen."},{"en":"decomposition","unit":"2.1 Algorithms","ex":"Decomposition means breaking a problem down into smaller sub-problems.","es":{"t":"la descomposición","e":"La descomposición consiste en dividir un problema en subproblemas más pequeños.","u":"⚠ No tiene nada que ver con algo que se pudre. Es partir un problema grande en trozos que se resuelven uno a uno. Es una de las tres partes del «computational thinking», junto con abstraction y algorithmic thinking."},"fr":{"t":"la décomposition","e":"La décomposition consiste à diviser un problème en sous-problèmes plus petits.","u":"⚠ Rien à voir avec quelque chose qui pourrit. C'est découper un gros problème en morceaux qu'on résout un par un. Une des trois parties du « computational thinking », avec abstraction et algorithmic thinking."},"de":{"t":"die Zerlegung (Dekomposition)","e":"Zerlegung bedeutet, ein Problem in kleinere Teilprobleme aufzuteilen.","u":"⚠ Nicht „Verwesung“. Ein großes Problem in Teile zerlegen, die man einzeln löst. Einer der drei Teile von „computational thinking“, neben abstraction und algorithmic thinking. Prüfungswort: „decomposition“."},"_k":"decomposition 2.1 algorithms decomposition means breaking a problem down into smaller sub-problems. la descomposicion la decomposition die zerlegung (dekomposition) la descomposicion consiste en dividir un problema en subproblemas mas pequenos. la decomposition consiste a diviser un probleme en sous-problemes plus petits. zerlegung bedeutet, ein problem in kleinere teilprobleme aufzuteilen."},{"en":"trace table","unit":"2.1 Algorithms","ex":"Complete the trace table to show the value of total after each iteration.","es":{"t":"la tabla de traza (tabla de seguimiento)","e":"Completa la tabla de traza para mostrar el valor de total después de cada iteración.","u":"Una tabla donde apuntas el valor de cada variable línea a línea, como si fueras el ordenador. En el examen te dan la tabla y la rellenas: una columna por variable, una fila por cambio."},"fr":{"t":"la table de trace (tableau de suivi)","e":"Complète la table de trace pour montrer la valeur de total après chaque itération.","u":"Un tableau où tu notes la valeur de chaque variable ligne par ligne, comme si tu étais l'ordinateur. À l'examen on te donne le tableau et tu le remplis : une colonne par variable, une ligne par changement."},"de":{"t":"die Trace-Tabelle (Ablaufprotokoll)","e":"Vervollständige die Trace-Tabelle, um den Wert von total nach jeder Iteration zu zeigen.","u":"Eine Tabelle, in der du den Wert jeder Variablen Zeile für Zeile notierst, als wärst du der Computer. In der Prüfung bekommst du die Tabelle und füllst sie aus: eine Spalte pro Variable, eine Zeile pro Änderung."},"_k":"trace table 2.1 algorithms complete the trace table to show the value of total after each iteration. la tabla de traza (tabla de seguimiento) la table de trace (tableau de suivi) die trace-tabelle (ablaufprotokoll) completa la tabla de traza para mostrar el valor de total despues de cada iteracion. complete la table de trace pour montrer la valeur de total apres chaque iteration. vervollstandige die trace-tabelle, um den wert von total nach jeder iteration zu zeigen."},{"en":"pseudocode","unit":"2.1 Algorithms","ex":"Write an algorithm in pseudocode to find the largest number in the list.","es":{"t":"el pseudocódigo","e":"Escribe un algoritmo en pseudocódigo que encuentre el número mayor de la lista.","u":"Código «de mentira»: se parece a un programa pero no se ejecuta; sirve para planear. En OCR el pseudocode oficial se llama «Exam Reference Language» (ERL). Puedes responder en ERL o en Python."},"fr":{"t":"le pseudo-code","e":"Écris un algorithme en pseudo-code pour trouver le plus grand nombre de la liste.","u":"Du « faux code » : ça ressemble à un programme mais ça ne s'exécute pas ; c'est pour planifier. Chez OCR, le pseudocode officiel s'appelle « Exam Reference Language » (ERL). Tu peux répondre en ERL ou en Python."},"de":{"t":"der Pseudocode","e":"Schreibe einen Algorithmus in Pseudocode, der die größte Zahl in der Liste findet.","u":"„Unechter“ Code: sieht aus wie ein Programm, läuft aber nicht; er dient zum Planen. Bei OCR heißt der offizielle Pseudocode „Exam Reference Language“ (ERL). Du darfst in ERL oder in Python antworten."},"_k":"pseudocode 2.1 algorithms write an algorithm in pseudocode to find the largest number in the list. el pseudocodigo le pseudo-code der pseudocode escribe un algoritmo en pseudocodigo que encuentre el numero mayor de la lista. ecris un algorithme en pseudo-code pour trouver le plus grand nombre de la liste. schreibe einen algorithmus in pseudocode, der die großte zahl in der liste findet."},{"en":"variable","unit":"2.2 Programming Fundamentals","ex":"Declare a variable called score and assign it the value 0.","es":{"t":"la variable","e":"Declara una variable llamada score y asígnale el valor 0.","u":"Una caja con nombre donde el programa guarda un dato que puede cambiar. Verbos que verás: «declare» (crear), «assign» (dar un valor con =), «initialise» (dar el primer valor). Lo contrario es «constant»."},"fr":{"t":"la variable","e":"Déclare une variable appelée score et affecte-lui la valeur 0.","u":"Une boîte avec un nom où le programme garde une donnée qui peut changer. Verbes à connaître : « declare » (créer), « assign » (donner une valeur avec =, en français « affecter »), « initialise » (donner la première valeur). Le contraire est « constant »."},"de":{"t":"die Variable","e":"Deklariere eine Variable namens score und weise ihr den Wert 0 zu.","u":"Eine benannte Schachtel, in der das Programm einen Wert speichert, der sich ändern darf. Verben, die du siehst: „declare“ (anlegen), „assign“ (zuweisen, mit =), „initialise“ (den ersten Wert geben). Das Gegenteil ist „constant“."},"_k":"variable 2.2 programming fundamentals declare a variable called score and assign it the value 0. la variable la variable die variable declara una variable llamada score y asignale el valor 0. declare une variable appelee score et affecte-lui la valeur 0. deklariere eine variable namens score und weise ihr den wert 0 zu."},{"en":"string","unit":"2.2 Programming Fundamentals","ex":"The variable name holds a string, so you cannot add 1 to it.","es":{"t":"la cadena (de caracteres) / el string","e":"La variable name contiene una cadena de texto, así que no se le puede sumar 1.","u":"⚠ No es una cuerda ni un hilo. Un string es texto: una secuencia de caracteres entre comillas, como \"hello\". En clase en español se dice «string» o «cadena». El número 7 y el string \"7\" son cosas distintas."},"fr":{"t":"la chaîne de caractères (le string)","e":"La variable name contient une chaîne de caractères, donc on ne peut pas lui ajouter 1.","u":"⚠ Pas une ficelle. Un string, c'est du texte : une suite de caractères entre guillemets, comme \"hello\". En français on dit « chaîne » ou « string ». Le nombre 7 et le string \"7\" sont deux choses différentes."},"de":{"t":"die Zeichenkette (der String)","e":"Die Variable name enthält einen String, deshalb kann man nicht 1 dazu addieren.","u":"⚠ Keine Schnur. Ein string ist Text: eine Folge von Zeichen in Anführungszeichen, z. B. \"hello\". Im Deutschen sagt man meist „String“. Die Zahl 7 und der String \"7\" sind nicht dasselbe."},"_k":"string 2.2 programming fundamentals the variable name holds a string, so you cannot add 1 to it. la cadena (de caracteres) / el string la chaine de caracteres (le string) die zeichenkette (der string) la variable name contiene una cadena de texto, asi que no se le puede sumar 1. la variable name contient une chaine de caracteres, donc on ne peut pas lui ajouter 1. die variable name enthalt einen string, deshalb kann man nicht 1 dazu addieren."},{"en":"casting","unit":"2.2 Programming Fundamentals","ex":"Use casting to convert the input from a string to an integer.","es":{"t":"la conversión de tipo (casting)","e":"Usa la conversión de tipo (casting) para pasar la entrada de string a integer.","u":"⚠ No es un casting de actores. Es cambiar el tipo de un dato: int(\"7\") convierte el string \"7\" en el número 7. Lo necesitas siempre que lees un número con input(), porque input() devuelve un string."},"fr":{"t":"la conversion de type (le casting)","e":"Utilise le casting pour convertir l'entrée de string en integer.","u":"⚠ Rien à voir avec un casting d'acteurs. C'est changer le type d'une donnée : int(\"7\") transforme le string \"7\" en nombre 7. Indispensable dès que tu lis un nombre avec input(), car input() renvoie un string."},"de":{"t":"die Typumwandlung (Casting)","e":"Verwende Casting, um die Eingabe von einem String in einen Integer umzuwandeln.","u":"⚠ Kein Schauspieler-Casting. Es bedeutet, den Datentyp zu ändern: int(\"7\") macht aus dem String \"7\" die Zahl 7. Brauchst du immer, wenn du mit input() eine Zahl liest, denn input() liefert einen String."},"_k":"casting 2.2 programming fundamentals use casting to convert the input from a string to an integer. la conversion de tipo (casting) la conversion de type (le casting) die typumwandlung (casting) usa la conversion de tipo (casting) para pasar la entrada de string a integer. utilise le casting pour convertir l'entree de string en integer. verwende casting, um die eingabe von einem string in einen integer umzuwandeln."},{"en":"selection","unit":"2.2 Programming Fundamentals","ex":"Selection lets the program choose a path, using if, elif and else.","es":{"t":"la selección","e":"La selección permite al programa elegir un camino con if, elif y else.","u":"⚠ Aquí no es «la selección» de fútbol. Es una de las tres estructuras básicas: sequence (una orden tras otra), selection (if / else) e iteration (bucles). Selection = el programa toma una decisión."},"fr":{"t":"la sélection","e":"La sélection permet au programme de choisir un chemin avec if, elif et else.","u":"⚠ Pas la sélection nationale de foot ! C'est une des trois structures de base : sequence (une instruction après l'autre), selection (if / else) et iteration (boucles). Selection = le programme prend une décision."},"de":{"t":"die Auswahl (Selektion)","e":"Selection lässt das Programm mit if, elif und else einen Weg wählen.","u":"Eine der drei Grundstrukturen: sequence (ein Befehl nach dem anderen), selection (if / else) und iteration (Schleifen). Selection = das Programm trifft eine Entscheidung. Prüfungswort: „selection“, nicht „if statement“."},"_k":"selection 2.2 programming fundamentals selection lets the program choose a path, using if, elif and else. la seleccion la selection die auswahl (selektion) la seleccion permite al programa elegir un camino con if, elif y else. la selection permet au programme de choisir un chemin avec if, elif et else. selection lasst das programm mit if, elif und else einen weg wahlen."},{"en":"iteration","unit":"2.2 Programming Fundamentals","ex":"Iteration repeats a block of code, either a fixed number of times or until a condition is met.","es":{"t":"la iteración","e":"La iteración repite un bloque de código, un número fijo de veces o hasta que se cumple una condición.","u":"Iteration = repetir. «Count-controlled» (for: sabes cuántas veces) y «condition-controlled» (while: hasta que algo cambie). Cada vuelta del bucle es «one iteration». El verbo es «to iterate»."},"fr":{"t":"l'itération","e":"L'itération répète un bloc de code, un nombre fixe de fois ou jusqu'à ce qu'une condition soit remplie.","u":"Iteration = répéter. « Count-controlled » (for : tu sais combien de fois) et « condition-controlled » (while : jusqu'à ce que quelque chose change). Chaque tour de boucle est « one iteration ». Le verbe est « to iterate »."},"de":{"t":"die Iteration (Wiederholung)","e":"Iteration wiederholt einen Codeblock, entweder eine feste Anzahl von Malen oder bis eine Bedingung erfüllt ist.","u":"Iteration = Wiederholung. „Count-controlled“ (for: du weißt, wie oft) und „condition-controlled“ (while: bis sich etwas ändert). Jeder Durchlauf ist „one iteration“. Das Verb ist „to iterate“."},"_k":"iteration 2.2 programming fundamentals iteration repeats a block of code, either a fixed number of times or until a condition is met. la iteracion l'iteration die iteration (wiederholung) la iteracion repite un bloque de codigo, un numero fijo de veces o hasta que se cumple una condicion. l'iteration repete un bloc de code, un nombre fixe de fois ou jusqu'a ce qu'une condition soit remplie. iteration wiederholt einen codeblock, entweder eine feste anzahl von malen oder bis eine bedingung erfullt ist."},{"en":"loop","unit":"2.2 Programming Fundamentals","ex":"The while loop keeps running until the user types 'quit'.","es":{"t":"el bucle","e":"El bucle while sigue ejecutándose hasta que el usuario escribe 'quit'.","u":"⚠ No es un lazo ni un rizo. Un loop es un trozo de código que se repite. «for loop», «while loop», «infinite loop» (el que nunca termina: un error clásico). En clase se dice «bucle»."},"fr":{"t":"la boucle","e":"La boucle while continue jusqu'à ce que l'utilisateur tape 'quit'.","u":"Un loop est un morceau de code qui se répète. « for loop », « while loop », « infinite loop » (celle qui ne s'arrête jamais : une erreur classique). En français : boucle."},"de":{"t":"die Schleife","e":"Die while-Schleife läuft weiter, bis der Nutzer 'quit' eingibt.","u":"Ein loop ist ein Codestück, das sich wiederholt. „for loop“, „while loop“, „infinite loop“ (die nie aufhört: ein klassischer Fehler). Im Deutschen: Schleife."},"_k":"loop 2.2 programming fundamentals the while loop keeps running until the user types 'quit'. el bucle la boucle die schleife el bucle while sigue ejecutandose hasta que el usuario escribe 'quit'. la boucle while continue jusqu'a ce que l'utilisateur tape 'quit'. die while-schleife lauft weiter, bis der nutzer 'quit' eingibt."},{"en":"nested","unit":"2.2 Programming Fundamentals","ex":"A nested loop is a loop inside another loop.","es":{"t":"anidado / anidada","e":"Un bucle anidado es un bucle dentro de otro bucle.","u":"Viene de «nest» (nido): una cosa metida dentro de otra. «Nested loop», «nested if», «nested sub program». Un 2D array se recorre con dos bucles anidados."},"fr":{"t":"imbriqué / imbriquée","e":"Une boucle imbriquée est une boucle à l'intérieur d'une autre boucle.","u":"Vient de « nest » (le nid) : une chose placée dans une autre. « Nested loop », « nested if », « nested sub program ». On parcourt un 2D array avec deux boucles imbriquées."},"de":{"t":"verschachtelt","e":"Eine verschachtelte Schleife ist eine Schleife innerhalb einer anderen Schleife.","u":"Kommt von „nest“ (das Nest): eine Sache steckt in einer anderen. „Nested loop“, „nested if“, „nested sub program“. Ein 2D array durchläuft man mit zwei verschachtelten Schleifen."},"_k":"nested 2.2 programming fundamentals a nested loop is a loop inside another loop. anidado / anidada imbrique / imbriquee verschachtelt un bucle anidado es un bucle dentro de otro bucle. une boucle imbriquee est une boucle a l'interieur d'une autre boucle. eine verschachtelte schleife ist eine schleife innerhalb einer anderen schleife."},{"en":"concatenate","unit":"2.2 Programming Fundamentals","ex":"Concatenate the first name and the surname with a space between them.","es":{"t":"concatenar","e":"Concatena el nombre y el apellido con un espacio entre ellos.","u":"Unir dos strings uno detrás de otro; en Python se hace con +. \"Ana\" + \" \" + \"Ruiz\" da \"Ana Ruiz\". El sustantivo es «concatenation». Ojo: con números el + suma, con strings el + concatena."},"fr":{"t":"concaténer","e":"Concatène le prénom et le nom avec une espace entre les deux.","u":"Coller deux strings l'un après l'autre ; en Python avec +. \"Ana\" + \" \" + \"Ruiz\" donne \"Ana Ruiz\". Le nom est « concatenation ». Attention : avec des nombres + additionne, avec des strings + concatène."},"de":{"t":"verketten (konkatenieren)","e":"Verkette den Vornamen und den Nachnamen mit einem Leerzeichen dazwischen.","u":"Zwei Strings hintereinanderhängen; in Python mit +. \"Ana\" + \" \" + \"Ruiz\" ergibt \"Ana Ruiz\". Das Substantiv ist „concatenation“. Achtung: Bei Zahlen addiert +, bei Strings verkettet es."},"_k":"concatenate 2.2 programming fundamentals concatenate the first name and the surname with a space between them. concatenar concatener verketten (konkatenieren) concatena el nombre y el apellido con un espacio entre ellos. concatene le prenom et le nom avec une espace entre les deux. verkette den vornamen und den nachnamen mit einem leerzeichen dazwischen."},{"en":"array","unit":"2.2 Programming Fundamentals","ex":"Store the ten scores in a one-dimensional array.","es":{"t":"el array (el vector)","e":"Guarda las diez puntuaciones en un array de una dimensión.","u":"Se dice «array» en inglés también en español. Una lista de tamaño fijo donde todos los datos son del mismo tipo, con posiciones numeradas desde 0 («index»). Un 2D array es una tabla: filas y columnas."},"fr":{"t":"le tableau (l'array)","e":"Stocke les dix scores dans un tableau à une dimension.","u":"⚠ En français on dit « tableau », mais ce n'est ni un tableau de classe ni une table de données. Un array est une liste de taille fixe où tous les éléments sont du même type, numérotés à partir de 0 (« index »). Un 2D array a des lignes et des colonnes."},"de":{"t":"das Array (Feld)","e":"Speichere die zehn Punktzahlen in einem eindimensionalen Array.","u":"Wird im Deutschen auch „Array“ genannt. Eine Liste fester Größe, alle Elemente vom selben Typ, nummeriert ab 0 („index“). Ein 2D array ist eine Tabelle mit Zeilen und Spalten."},"_k":"array 2.2 programming fundamentals store the ten scores in a one-dimensional array. el array (el vector) le tableau (l'array) das array (feld) guarda las diez puntuaciones en un array de una dimension. stocke les dix scores dans un tableau a une dimension. speichere die zehn punktzahlen in einem eindimensionalen array."},{"en":"record","unit":"2.2 Programming Fundamentals","ex":"Each record in the file holds one student's name, age and class.","es":{"t":"el registro","e":"Cada registro del archivo contiene el nombre, la edad y la clase de un alumno.","u":"⚠ No es un récord deportivo ni un disco de música. Un record es una fila de datos sobre una sola cosa (un alumno, un producto), formada por varios «fields». Ojo: «register» (en la CPU) también se traduce «registro», pero son cosas distintas."},"fr":{"t":"l'enregistrement","e":"Chaque enregistrement du fichier contient le nom, l'âge et la classe d'un élève.","u":"⚠ Pas un record sportif ni un disque. Un record est une ligne de données sur une seule chose (un élève, un produit), composée de plusieurs « fields ». En français : enregistrement."},"de":{"t":"der Datensatz","e":"Jeder Datensatz in der Datei enthält Name, Alter und Klasse eines Schülers.","u":"⚠ Kein Sportrekord und keine Schallplatte. Ein record ist eine Zeile Daten über eine einzelne Sache (ein Schüler, ein Produkt), zusammengesetzt aus mehreren „fields“. Im Deutschen: Datensatz."},"_k":"record 2.2 programming fundamentals each record in the file holds one student's name, age and class. el registro l'enregistrement der datensatz cada registro del archivo contiene el nombre, la edad y la clase de un alumno. chaque enregistrement du fichier contient le nom, l'age et la classe d'un eleve. jeder datensatz in der datei enthalt name, alter und klasse eines schulers."},{"en":"field","unit":"2.2 Programming Fundamentals","ex":"The Age field stores an integer.","es":{"t":"el campo","e":"El campo Age guarda un número entero.","u":"⚠ No es un campo de fútbol ni el campo (la naturaleza). Un field es una columna de una tabla: un dato concreto dentro de un record (nombre, edad…). En SQL: SELECT campo FROM tabla WHERE condición."},"fr":{"t":"le champ","e":"Le champ Age stocke un entier.","u":"⚠ Pas un champ de blé ni un terrain de foot. Un field est une colonne d'une table : une information précise dans un record (nom, âge…). En SQL : SELECT champ FROM table WHERE condition."},"de":{"t":"das Feld (Datenfeld)","e":"Das Feld Age speichert einen Integer.","u":"⚠ Kein Acker und kein Spielfeld. Ein field ist eine Spalte einer Tabelle: eine einzelne Angabe innerhalb eines record (Name, Alter …). In SQL: SELECT Feld FROM Tabelle WHERE Bedingung."},"_k":"field 2.2 programming fundamentals the age field stores an integer. el campo le champ das feld (datenfeld) el campo age guarda un numero entero. le champ age stocke un entier. das feld age speichert einen integer."},{"en":"function","unit":"2.2 Programming Fundamentals","ex":"A function is a sub program that returns a value; a procedure does not.","es":{"t":"la función","e":"Una función es un subprograma que devuelve un valor; un procedimiento no.","u":"⚠ En el examen OCR, function y procedure NO son sinónimos: la function devuelve un valor («return»), la procedure no. Las dos son «sub programs». Si te preguntan la diferencia, esa es la respuesta."},"fr":{"t":"la fonction","e":"Une fonction est un sous-programme qui renvoie une valeur ; une procédure n'en renvoie pas.","u":"⚠ À l'examen OCR, function et procedure ne sont PAS synonymes : la function renvoie une valeur (« return »), la procedure non. Les deux sont des « sub programs ». Si on te demande la différence, c'est ça la réponse."},"de":{"t":"die Funktion","e":"Eine Funktion ist ein Unterprogramm, das einen Wert zurückgibt; eine Prozedur nicht.","u":"⚠ In der OCR-Prüfung sind function und procedure NICHT dasselbe: Die function gibt einen Wert zurück („return“), die procedure nicht. Beide sind „sub programs“. Wenn nach dem Unterschied gefragt wird, ist das die Antwort."},"_k":"function 2.2 programming fundamentals a function is a sub program that returns a value; a procedure does not. la funcion la fonction die funktion una funcion es un subprograma que devuelve un valor; un procedimiento no. une fonction est un sous-programme qui renvoie une valeur ; une procedure n'en renvoie pas. eine funktion ist ein unterprogramm, das einen wert zuruckgibt; eine prozedur nicht."},{"en":"validation","unit":"2.3 Producing Robust Programs","ex":"Input validation checks that the age entered is a whole number between 11 and 18.","es":{"t":"la validación","e":"La validación de la entrada comprueba que la edad introducida sea un número entero entre 11 y 18.","u":"Comprobar que un dato es «sensato» antes de usarlo: tipo correcto, dentro del rango, no vacío. Tipos: range check, type check, length check, presence check. ⚠ No la confundas con «verification», que es comprobar que el dato es el que el usuario quería (por ejemplo, escribirlo dos veces)."},"fr":{"t":"la validation","e":"La validation des entrées vérifie que l'âge saisi est un nombre entier entre 11 et 18.","u":"Vérifier qu'une donnée est « raisonnable » avant de l'utiliser : bon type, dans la plage, pas vide. Types : range check, type check, length check, presence check. ⚠ Ne confonds pas avec « verification » : vérifier que la donnée est bien celle voulue (la saisir deux fois, par exemple)."},"de":{"t":"die Validierung (Eingabeprüfung)","e":"Die Eingabevalidierung prüft, ob das eingegebene Alter eine ganze Zahl zwischen 11 und 18 ist.","u":"Prüfen, ob eine Eingabe „sinnvoll“ ist, bevor man sie benutzt: richtiger Typ, im Bereich, nicht leer. Arten: range check, type check, length check, presence check. ⚠ Nicht verwechseln mit „verification“: prüfen, ob die Eingabe die gewollte ist (z. B. zweimal eingeben)."},"_k":"validation 2.3 producing robust programs input validation checks that the age entered is a whole number between 11 and 18. la validacion la validation die validierung (eingabeprufung) la validacion de la entrada comprueba que la edad introducida sea un numero entero entre 11 y 18. la validation des entrees verifie que l'age saisi est un nombre entier entre 11 et 18. die eingabevalidierung pruft, ob das eingegebene alter eine ganze zahl zwischen 11 und 18 ist."},{"en":"authentication","unit":"2.3 Producing Robust Programs","ex":"Authentication confirms the identity of the user, for example with a username and password.","es":{"t":"la autenticación","e":"La autenticación confirma la identidad del usuario, por ejemplo con nombre de usuario y contraseña.","u":"Responde a la pregunta «¿eres quien dices ser?». Contraseña, huella, código por SMS (two-factor authentication). En español también se dice «autentificación»; en inglés solo «authentication»."},"fr":{"t":"l'authentification","e":"L'authentification confirme l'identité de l'utilisateur, par exemple avec un nom d'utilisateur et un mot de passe.","u":"⚠ Attention à l'orthographe : en français authentiFication, en anglais authentiCation (sans « fi »). Répond à la question « es-tu bien qui tu dis être ? » : mot de passe, empreinte, code par SMS (two-factor authentication)."},"de":{"t":"die Authentifizierung","e":"Authentifizierung bestätigt die Identität des Nutzers, zum Beispiel mit Benutzername und Passwort.","u":"Beantwortet die Frage „Bist du wirklich der, für den du dich ausgibst?“: Passwort, Fingerabdruck, Code per SMS (two-factor authentication). Englische Schreibweise: authentication, kürzer als das deutsche Wort."},"_k":"authentication 2.3 producing robust programs authentication confirms the identity of the user, for example with a username and password. la autenticacion l'authentification die authentifizierung la autenticacion confirma la identidad del usuario, por ejemplo con nombre de usuario y contrasena. l'authentification confirme l'identite de l'utilisateur, par exemple avec un nom d'utilisateur et un mot de passe. authentifizierung bestatigt die identitat des nutzers, zum beispiel mit benutzername und passwort."},{"en":"syntax error","unit":"2.3 Producing Robust Programs","ex":"A missing bracket causes a syntax error, so the program will not run at all.","es":{"t":"el error de sintaxis","e":"Un paréntesis que falta provoca un error de sintaxis, así que el programa no se ejecuta.","u":"Una falta contra las «reglas gramaticales» del lenguaje: paréntesis sin cerrar, palabra mal escrita, dos puntos que faltan. El programa ni arranca. Compáralo con «logic error»: el programa funciona pero da un resultado equivocado."},"fr":{"t":"l'erreur de syntaxe","e":"Une parenthèse manquante provoque une erreur de syntaxe : le programme ne se lance pas du tout.","u":"Une faute contre les « règles de grammaire » du langage : parenthèse non fermée, mot mal orthographié, deux-points oubliés. Le programme ne démarre même pas. À comparer avec « logic error » : le programme tourne mais donne un mauvais résultat."},"de":{"t":"der Syntaxfehler","e":"Eine fehlende Klammer verursacht einen Syntaxfehler, deshalb läuft das Programm gar nicht.","u":"Ein Verstoß gegen die „Grammatikregeln“ der Sprache: Klammer nicht geschlossen, Wort falsch geschrieben, Doppelpunkt vergessen. Das Programm startet gar nicht erst. Vergleiche „logic error“: Das Programm läuft, liefert aber ein falsches Ergebnis."},"_k":"syntax error 2.3 producing robust programs a missing bracket causes a syntax error, so the program will not run at all. el error de sintaxis l'erreur de syntaxe der syntaxfehler un parentesis que falta provoca un error de sintaxis, asi que el programa no se ejecuta. une parenthese manquante provoque une erreur de syntaxe : le programme ne se lance pas du tout. eine fehlende klammer verursacht einen syntaxfehler, deshalb lauft das programm gar nicht."},{"en":"logic error","unit":"2.3 Producing Robust Programs","ex":"Using < instead of <= is a logic error: the program runs, but the output is wrong.","es":{"t":"el error lógico (error de lógica)","e":"Usar < en vez de <= es un error lógico: el programa funciona, pero el resultado es incorrecto.","u":"El programa se ejecuta sin quejarse, pero hace lo que NO querías. Son los más difíciles de encontrar: hay que probar con test data y seguir el código con una trace table. Definición de examen: «an error that produces unexpected output»."},"fr":{"t":"l'erreur de logique","e":"Utiliser < au lieu de <= est une erreur de logique : le programme tourne, mais la sortie est fausse.","u":"Le programme s'exécute sans se plaindre, mais fait ce que tu ne voulais PAS. Ce sont les plus dures à trouver : il faut tester avec des test data et suivre le code dans une trace table. Définition d'examen : « an error that produces unexpected output »."},"de":{"t":"der Logikfehler","e":"Ein < statt <= ist ein Logikfehler: Das Programm läuft, aber die Ausgabe ist falsch.","u":"Das Programm läuft ohne Beschwerde, tut aber NICHT das, was du wolltest. Die sind am schwersten zu finden: mit test data testen und den Code in einer trace table verfolgen. Prüfungsdefinition: „an error that produces unexpected output“."},"_k":"logic error 2.3 producing robust programs using < instead of <= is a logic error: the program runs, but the output is wrong. el error logico (error de logica) l'erreur de logique der logikfehler usar < en vez de <= es un error logico: el programa funciona, pero el resultado es incorrecto. utiliser < au lieu de <= est une erreur de logique : le programme tourne, mais la sortie est fausse. ein < statt <= ist ein logikfehler: das programm lauft, aber die ausgabe ist falsch."},{"en":"truth table","unit":"2.4 Boolean Logic","ex":"Complete the truth table for A AND NOT B.","es":{"t":"la tabla de verdad","e":"Completa la tabla de verdad de A AND NOT B.","u":"Una tabla con todas las combinaciones posibles de entradas (0/1 o False/True) y la salida de cada una. Con dos entradas hay 4 filas; con tres, 8. Las puertas lógicas se escriben en inglés en el examen: AND, OR, NOT."},"fr":{"t":"la table de vérité","e":"Complète la table de vérité de A AND NOT B.","u":"Un tableau avec toutes les combinaisons possibles d'entrées (0/1 ou False/True) et la sortie de chacune. Avec deux entrées, 4 lignes ; avec trois, 8. Les portes logiques gardent leur nom anglais à l'examen : AND, OR, NOT (ET, OU, NON)."},"de":{"t":"die Wahrheitstabelle","e":"Vervollständige die Wahrheitstabelle für A AND NOT B.","u":"Eine Tabelle mit allen möglichen Eingangskombinationen (0/1 oder False/True) und der Ausgabe für jede. Bei zwei Eingängen 4 Zeilen, bei drei 8. Die Gatter heißen in der Prüfung AND, OR, NOT (UND, ODER, NICHT)."},"_k":"truth table 2.4 boolean logic complete the truth table for a and not b. la tabla de verdad la table de verite die wahrheitstabelle completa la tabla de verdad de a and not b. complete la table de verite de a and not b. vervollstandige die wahrheitstabelle fur a and not b."},{"en":"compiler","unit":"2.5 Programming Languages and IDEs","ex":"A compiler translates the whole program into machine code before it runs.","es":{"t":"el compilador","e":"Un compilador traduce el programa completo a código máquina antes de ejecutarlo.","u":"Traduce TODO el programa de golpe y crea un archivo ejecutable. Compáralo con «interpreter», que traduce línea a línea mientras se ejecuta. Los dos son «translators». En el examen te piden las diferencias."},"fr":{"t":"le compilateur","e":"Un compilateur traduit tout le programme en code machine avant de l'exécuter.","u":"Traduit TOUT le programme d'un coup et produit un fichier exécutable. À comparer avec « interpreter », qui traduit ligne par ligne pendant l'exécution. Les deux sont des « translators ». À l'examen on te demande les différences."},"de":{"t":"der Compiler","e":"Ein Compiler übersetzt das ganze Programm in Maschinencode, bevor es läuft.","u":"Gleiches Wort im Deutschen. Übersetzt das GANZE Programm auf einmal und erzeugt eine ausführbare Datei. Vergleiche „interpreter“, der Zeile für Zeile während der Ausführung übersetzt. Beide sind „translators“. In der Prüfung werden die Unterschiede gefragt."},"_k":"compiler 2.5 programming languages and ides a compiler translates the whole program into machine code before it runs. el compilador le compilateur der compiler un compilador traduce el programa completo a codigo maquina antes de ejecutarlo. un compilateur traduit tout le programme en code machine avant de l'executer. ein compiler ubersetzt das ganze programm in maschinencode, bevor es lauft."},{"en":"interpreter","unit":"2.5 Programming Languages and IDEs","ex":"Python uses an interpreter, which translates and runs the code one line at a time.","es":{"t":"el intérprete","e":"Python usa un intérprete, que traduce y ejecuta el código línea a línea.","u":"⚠ No es una persona que traduce idiomas, aunque la idea es parecida. Traduce una línea, la ejecuta y pasa a la siguiente; por eso se para en el primer error. No crea archivo ejecutable."},"fr":{"t":"l'interpréteur","e":"Python utilise un interpréteur, qui traduit et exécute le code ligne par ligne.","u":"⚠ En français on dit « interpréteur » (le programme), pas « interprète » (la personne), même si l'idée est la même. Il traduit une ligne, l'exécute, passe à la suivante ; donc il s'arrête à la première erreur. Pas de fichier exécutable."},"de":{"t":"der Interpreter","e":"Python nutzt einen Interpreter, der den Code Zeile für Zeile übersetzt und ausführt.","u":"Gleiches Wort im Deutschen. Übersetzt eine Zeile, führt sie aus, geht zur nächsten; deshalb bleibt er beim ersten Fehler stehen. Erzeugt keine ausführbare Datei."},"_k":"interpreter 2.5 programming languages and ides python uses an interpreter, which translates and runs the code one line at a time. el interprete l'interpreteur der interpreter python usa un interprete, que traduce y ejecuta el codigo linea a linea. python utilise un interpreteur, qui traduit et execute le code ligne par ligne. python nutzt einen interpreter, der den code zeile fur zeile ubersetzt und ausfuhrt."},{"en":"runtime","unit":"2.5 Programming Languages and IDEs","ex":"The IDE's run-time environment lets you run the program and see the output.","es":{"t":"el tiempo de ejecución (runtime)","e":"El entorno de ejecución del IDE te permite ejecutar el programa y ver la salida.","u":"«At runtime» = mientras el programa se está ejecutando. «Run-time environment» = la parte del IDE donde corre el programa. Un «runtime error» ocurre mientras el programa funciona (por ejemplo, dividir entre cero). En español se suele decir «runtime» tal cual."},"fr":{"t":"l'exécution (le runtime)","e":"L'environnement d'exécution de l'IDE te permet de lancer le programme et de voir la sortie.","u":"« At runtime » = pendant que le programme tourne. « Run-time environment » = la partie de l'IDE où le programme s'exécute. Un « runtime error » survient pendant l'exécution (diviser par zéro, par exemple). En français on dit souvent « runtime » tel quel."},"de":{"t":"die Laufzeit (Runtime)","e":"Die Laufzeitumgebung der IDE lässt dich das Programm ausführen und die Ausgabe sehen.","u":"„At runtime“ = während das Programm läuft. „Run-time environment“ = der Teil der IDE, in dem das Programm läuft. Ein „runtime error“ tritt während der Ausführung auf (z. B. Division durch null). Im Deutschen sagt man auch oft „Runtime“."},"_k":"runtime 2.5 programming languages and ides the ide's run-time environment lets you run the program and see the output. el tiempo de ejecucion (runtime) l'execution (le runtime) die laufzeit (runtime) el entorno de ejecucion del ide te permite ejecutar el programa y ver la salida. l'environnement d'execution de l'ide te permet de lancer le programme et de voir la sortie. die laufzeitumgebung der ide lasst dich das programm ausfuhren und die ausgabe sehen."},{"en":"library","unit":"2.5 Programming Languages and IDEs","ex":"Import the random library to generate a random number.","es":{"t":"la biblioteca","e":"Importa la biblioteca random para generar un número aleatorio.","u":"⚠ No es un edificio con libros. Una library es una colección de código ya escrito que puedes usar con «import» (random, math). ⚠ En español se dice mucho «librería», pero una librería es una tienda de libros; lo correcto es «biblioteca»."},"fr":{"t":"la bibliothèque","e":"Importe la bibliothèque random pour générer un nombre aléatoire.","u":"⚠ Pas le bâtiment avec des livres. Une library est un ensemble de code déjà écrit que tu peux utiliser avec « import » (random, math). ⚠ Ne dis pas « librairie » : en français c'est un magasin de livres ; on dit « bibliothèque »."},"de":{"t":"die Bibliothek","e":"Importiere die Bibliothek random, um eine Zufallszahl zu erzeugen.","u":"⚠ Nicht das Gebäude mit Büchern. Eine library ist eine Sammlung fertigen Codes, den du mit „import“ nutzen kannst (random, math). Im Deutschen: Bibliothek, oft auch einfach „Library“."},"_k":"library 2.5 programming languages and ides import the random library to generate a random number. la biblioteca la bibliotheque die bibliothek importa la biblioteca random para generar un numero aleatorio. importe la bibliotheque random pour generer un nombre aleatoire. importiere die bibliothek random, um eine zufallszahl zu erzeugen."},{"en":"state","unit":"Exam command words","ex":"State the purpose of the Program Counter.","es":{"t":"indicar / escribir","e":"Indica la función del Program Counter.","u":"⚠ Palabra de examen. «State» significa escribe la respuesta corta, sin explicar. Normalmente vale 1 punto: una palabra o una frase. No pierdas tiempo dando razones."},"fr":{"t":"indiquer / donner","e":"Indique le rôle du Program Counter.","u":"⚠ Mot d'examen. « State » = écris la réponse courte, sans expliquer. Vaut en général 1 point : un mot ou une phrase. Ne perds pas de temps à justifier."},"de":{"t":"nennen / angeben","e":"Nenne die Aufgabe des Program Counter.","u":"⚠ Prüfungswort. „State“ = die kurze Antwort hinschreiben, ohne Erklärung. Meist 1 Punkt: ein Wort oder ein Satz. Keine Zeit mit Begründungen verlieren."},"_k":"state exam command words state the purpose of the program counter. indicar / escribir indiquer / donner nennen / angeben indica la funcion del program counter. indique le role du program counter. nenne die aufgabe des program counter."},{"en":"describe","unit":"Exam command words","ex":"Describe how a bubble sort works.","es":{"t":"describir","e":"Describe cómo funciona un bubble sort.","u":"⚠ Palabra de examen. «Describe» = di QUÉ pasa, paso a paso, pero sin decir por qué. Normalmente 2–3 puntos: un punto por cada detalle correcto. Para el «por qué» usan «explain»."},"fr":{"t":"décrire","e":"Décris comment fonctionne un bubble sort.","u":"⚠ Mot d'examen. « Describe » = dis CE QUI se passe, étape par étape, sans dire pourquoi. En général 2–3 points : un point par détail correct. Pour le « pourquoi », ils utilisent « explain »."},"de":{"t":"beschreiben","e":"Beschreibe, wie ein Bubble Sort funktioniert.","u":"⚠ Prüfungswort. „Describe“ = sag, WAS passiert, Schritt für Schritt, aber nicht warum. Meist 2–3 Punkte: ein Punkt pro richtiges Detail. Für das „Warum“ heißt es „explain“."},"_k":"describe exam command words describe how a bubble sort works. describir decrire beschreiben describe como funciona un bubble sort. decris comment fonctionne un bubble sort. beschreibe, wie ein bubble sort funktioniert."},{"en":"explain","unit":"Exam command words","ex":"Explain why a larger cache improves CPU performance.","es":{"t":"explicar","e":"Explica por qué una caché más grande mejora el rendimiento de la CPU.","u":"⚠ Palabra de examen. «Explain» = di qué pasa Y por qué. Casi siempre necesitas «because» o «so that» en la respuesta. Un hecho sin razón se queda a mitad de puntos."},"fr":{"t":"expliquer","e":"Explique pourquoi un cache plus grand améliore les performances du CPU.","u":"⚠ Mot d'examen. « Explain » = dis ce qui se passe ET pourquoi. Il te faut presque toujours « because » ou « so that » dans la réponse. Un fait sans raison ne rapporte que la moitié des points."},"de":{"t":"erklären","e":"Erkläre, warum ein größerer Cache die CPU-Leistung verbessert.","u":"⚠ Prüfungswort. „Explain“ = sag, was passiert UND warum. Fast immer brauchst du „because“ oder „so that“ in der Antwort. Eine Tatsache ohne Grund bringt nur die halben Punkte."},"_k":"explain exam command words explain why a larger cache improves cpu performance. explicar expliquer erklaren explica por que una cache mas grande mejora el rendimiento de la cpu. explique pourquoi un cache plus grand ameliore les performances du cpu. erklare, warum ein großerer cache die cpu-leistung verbessert."},{"en":"compare","unit":"Exam command words","ex":"Compare a compiler and an interpreter.","es":{"t":"comparar","e":"Compara un compilador y un intérprete.","u":"⚠ Palabra de examen. «Compare» = semejanzas Y diferencias, hablando de los DOS en cada frase («A compiler…, whereas an interpreter…»). Describir solo uno de los dos no puntúa."},"fr":{"t":"comparer","e":"Compare un compilateur et un interpréteur.","u":"⚠ Mot d'examen. « Compare » = ressemblances ET différences, en parlant des DEUX dans chaque phrase (« A compiler…, whereas an interpreter… »). Décrire un seul des deux ne rapporte rien."},"de":{"t":"vergleichen","e":"Vergleiche einen Compiler und einen Interpreter.","u":"⚠ Prüfungswort. „Compare“ = Gemeinsamkeiten UND Unterschiede, und in jedem Satz über BEIDE reden („A compiler …, whereas an interpreter …“). Nur einen von beiden zu beschreiben bringt keine Punkte."},"_k":"compare exam command words compare a compiler and an interpreter. comparar comparer vergleichen compara un compilador y un interprete. compare un compilateur et un interpreteur. vergleiche einen compiler und einen interpreter."},{"en":"identify","unit":"Exam command words","ex":"Identify the syntax error in the code below.","es":{"t":"identificar / señalar","e":"Identifica el error de sintaxis en el código siguiente.","u":"⚠ Palabra de examen. «Identify» = elige o señala la respuesta entre varias posibles; a menudo hay que buscarla en un código o en una tabla que te dan. Respuesta corta, sin explicación."},"fr":{"t":"identifier / repérer","e":"Identifie l'erreur de syntaxe dans le code ci-dessous.","u":"⚠ Mot d'examen. « Identify » = choisis ou repère la réponse parmi plusieurs possibilités ; souvent il faut la trouver dans un code ou un tableau donné. Réponse courte, sans explication."},"de":{"t":"identifizieren / benennen","e":"Identifiziere den Syntaxfehler im folgenden Code.","u":"⚠ Prüfungswort. „Identify“ = wähle oder finde die Antwort aus mehreren Möglichkeiten; oft musst du sie in einem gegebenen Code oder einer Tabelle suchen. Kurze Antwort, keine Erklärung."},"_k":"identify exam command words identify the syntax error in the code below. identificar / senalar identifier / reperer identifizieren / benennen identifica el error de sintaxis en el codigo siguiente. identifie l'erreur de syntaxe dans le code ci-dessous. identifiziere den syntaxfehler im folgenden code."},{"en":"complete","unit":"Exam command words","ex":"Complete the trace table for the algorithm.","es":{"t":"completar / rellenar","e":"Completa la tabla de traza del algoritmo.","u":"⚠ Palabra de examen. «Complete» = rellena los huecos que faltan en algo que te dan (una tabla, un código, un diagrama). No escribas fuera de los huecos: solo se puntúa lo que falta."},"fr":{"t":"compléter","e":"Complète la table de trace de l'algorithme.","u":"⚠ Mot d'examen. « Complete » = remplis les trous dans ce qu'on te donne (un tableau, un code, un schéma). N'écris pas ailleurs : seuls les trous comptent."},"de":{"t":"vervollständigen / ausfüllen","e":"Vervollständige die Trace-Tabelle für den Algorithmus.","u":"⚠ Prüfungswort. „Complete“ = fülle die Lücken in etwas Gegebenem aus (Tabelle, Code, Diagramm). Nicht außerhalb der Lücken schreiben: Nur die Lücken werden bewertet."},"_k":"complete exam command words complete the trace table for the algorithm. completar / rellenar completer vervollstandigen / ausfullen completa la tabla de traza del algoritmo. complete la table de trace de l'algorithme. vervollstandige die trace-tabelle fur den algorithmus."},{"en":"refine","unit":"Exam command words","ex":"Refine the algorithm so that it rejects negative numbers.","es":{"t":"mejorar / perfeccionar","e":"Mejora el algoritmo para que rechace los números negativos.","u":"⚠ Palabra de examen. «Refine» no es «refinar» petróleo: significa mejorar o modificar un programa que ya funciona, por ejemplo añadiendo validación. Normalmente hay que escribir el código cambiado, no describirlo."},"fr":{"t":"améliorer / affiner","e":"Améliore l'algorithme pour qu'il rejette les nombres négatifs.","u":"⚠ Mot d'examen. « Refine » ne veut pas dire « raffiner » : c'est améliorer ou modifier un programme qui marche déjà, par exemple en ajoutant de la validation. En général il faut écrire le code modifié, pas le décrire."},"de":{"t":"verbessern / verfeinern","e":"Verbessere den Algorithmus so, dass er negative Zahlen zurückweist.","u":"⚠ Prüfungswort. „Refine“ = ein Programm, das schon funktioniert, verbessern oder ändern, z. B. eine Validierung ergänzen. Meist musst du den geänderten Code schreiben, nicht beschreiben."},"_k":"refine exam command words refine the algorithm so that it rejects negative numbers. mejorar / perfeccionar ameliorer / affiner verbessern / verfeinern mejora el algoritmo para que rechace los numeros negativos. ameliore l'algorithme pour qu'il rejette les nombres negatifs. verbessere den algorithmus so, dass er negative zahlen zuruckweist."},{"en":"justify","unit":"Exam command words","ex":"Justify your choice of data type.","es":{"t":"justificar","e":"Justifica tu elección de tipo de dato.","u":"⚠ Palabra de examen. «Justify» = da razones válidas para una decisión. No basta con decir cuál eliges: hay que decir por qué es la mejor opción para ESE caso."},"fr":{"t":"justifier","e":"Justifie ton choix de type de données.","u":"⚠ Mot d'examen. « Justify » = donne des raisons valables pour une décision. Il ne suffit pas de dire ce que tu choisis : il faut dire pourquoi c'est le meilleur choix pour CE cas."},"de":{"t":"begründen","e":"Begründe deine Wahl des Datentyps.","u":"⚠ Prüfungswort. „Justify“ = gültige Gründe für eine Entscheidung angeben. Es reicht nicht zu sagen, was du wählst: Du musst sagen, warum es für DIESEN Fall die beste Wahl ist."},"_k":"justify exam command words justify your choice of data type. justificar justifier begrunden justifica tu eleccion de tipo de dato. justifie ton choix de type de donnees. begrunde deine wahl des datentyps."},{"en":"evaluate","unit":"Exam command words","ex":"Evaluate the impact of the school moving its files to the cloud.","es":{"t":"evaluar / valorar","e":"Evalúa el impacto de que el colegio traslade sus archivos a la nube.","u":"⚠ Palabra de examen. «Evaluate» = ventajas Y desventajas Y una conclusión propia. Es la pregunta larga de 8 puntos: las dos caras de la moneda y al final tu opinión razonada."},"fr":{"t":"évaluer","e":"Évalue l'impact du passage des fichiers de l'école dans le cloud.","u":"⚠ Mot d'examen. « Evaluate » = avantages ET inconvénients ET une conclusion personnelle. C'est la longue question à 8 points : les deux faces de la médaille, puis ton avis argumenté."},"de":{"t":"bewerten / beurteilen","e":"Bewerte die Auswirkungen, wenn die Schule ihre Dateien in die Cloud verlegt.","u":"⚠ Prüfungswort. „Evaluate“ = Vorteile UND Nachteile UND ein eigenes Fazit. Das ist die lange 8-Punkte-Frage: beide Seiten, dann deine begründete Meinung."},"_k":"evaluate exam command words evaluate the impact of the school moving its files to the cloud. evaluar / valorar evaluer bewerten / beurteilen evalua el impacto de que el colegio traslade sus archivos a la nube. evalue l'impact du passage des fichiers de l'ecole dans le cloud. bewerte die auswirkungen, wenn die schule ihre dateien in die cloud verlegt."}],"langs":["es","fr","de"],"units":["1.1 Systems Architecture","1.2 Memory and Storage","1.3 Computer Networks, Connections and Protocols","1.4 Network Security","1.5 Systems Software","1.6 Ethical, Legal, Cultural and Environmental Impacts","2.1 Algorithms","2.2 Programming Fundamentals","2.3 Producing Robust Programs","2.4 Boolean Logic","2.5 Programming Languages and IDEs","Exam command words"],"ui":{"es":{"ph":"Escribe una palabra — en español o en inglés","all":"Todos los temas","none":"No se ha encontrado nada.","sort_en":"Orden: inglés","sort_xx":"Orden: español","count":"términos"},"fr":{"ph":"Tape un mot — en français ou en anglais","all":"Tous les thèmes","none":"Aucun résultat.","sort_en":"Tri : anglais","sort_xx":"Tri : français","count":"termes"},"de":{"ph":"Gib ein Wort ein — auf Deutsch oder Englisch","all":"Alle Themen","none":"Nichts gefunden.","sort_en":"Sortierung: Englisch","sort_xx":"Sortierung: Deutsch","count":"Begriffe"}},"beta":{"es":"Esta página la ha escrito <strong>Alfred</strong>, el sistema de IA del Sr. Rawson, para ayudarte a estudiar en inglés. <strong>Es nueva, y Alfred todavía está aprendiendo tu idioma, así que algunas cosas estarán mal.</strong> Si una palabra te parece incorrecta, seguramente tengas razón: díselo al Sr. Rawson y la corregimos. Si falta una palabra que necesitas, o se te ocurre cómo mejorar esta página, díselo también. Cambia siempre que lo pidas.","fr":"Cette page a été écrite par <strong>Alfred</strong>, le système d'IA de M. Rawson, pour t'aider à étudier en anglais. <strong>Elle est toute nouvelle, et Alfred apprend encore ta langue : certaines choses seront donc fausses.</strong> Si un mot te semble incorrect, tu as sans doute raison : dis-le à M. Rawson et nous le corrigerons. S'il manque un mot dont tu as besoin, ou si tu as une idée pour améliorer cette page, dis-le-lui aussi. Elle change dès que tu le demandes.","de":"Diese Seite hat <strong>Alfred</strong> geschrieben, das KI-System von Mr Rawson, damit du auf Englisch lernen kannst. <strong>Sie ist ganz neu, und Alfred lernt deine Sprache noch — manches wird also falsch sein.</strong> Wenn dir ein Wort falsch vorkommt, hast du wahrscheinlich recht: Sag Mr Rawson Bescheid, dann korrigieren wir es. Wenn ein Wort fehlt, das du brauchst, oder dir einfällt, wie diese Seite besser wird, sag ihm das auch. Sie ändert sich, sobald du es sagst."},"name":{"es":"Español","fr":"Français","de":"Deutsch"}};
const KEY = "vocab-lang";
const fold = s => (s||"").toString().toLowerCase()
  .normalize("NFD").replace(/[\u0300-\u036f]/g, "");

function pick() {
  const q = new URLSearchParams(location.search).get("lang");
  if (q && D.langs.includes(q)) { try { localStorage.setItem(KEY, q); } catch (e) {} return q; }
  let s = null; try { s = localStorage.getItem(KEY); } catch (e) {}
  if (s && D.langs.includes(s)) return s;
  return D.langs[0];
}
let L = pick();

function setLang(v) {
  L = v; try { localStorage.setItem(KEY, v); } catch (e) {}
  chrome(); render();
}

function chrome() {
  document.getElementById("langbar").innerHTML = D.langs.map(x =>
    `<button data-l="${x}" aria-pressed="${x === L}">${D.name[x]}</button>`).join("");
  document.querySelectorAll("#langbar button").forEach(b =>
    b.onclick = () => setLang(b.dataset.l));
  document.getElementById("beta").innerHTML = D.beta[L];
  const u = D.ui[L];
  document.getElementById("q").placeholder = u.ph;
  const sel = document.getElementById("unit"), keep = sel.value;
  sel.innerHTML = `<option value="">${u.all}</option>` +
    D.units.map(x => `<option>${x}</option>`).join("");
  sel.value = keep;
  const so = document.getElementById("sort"), ks = so.value;
  so.innerHTML = `<option value="en">${u.sort_en}</option><option value="xx">${u.sort_xx}</option>`;
  so.value = ks || "en";
}

function render() {
  const u = D.ui[L];
  const q = fold(document.getElementById("q").value.trim());
  const unit = document.getElementById("unit").value;
  const sort = document.getElementById("sort").value || "en";
  let rows = D.terms.filter(t => t[L]);
  if (unit) rows = rows.filter(t => t.unit === unit);
  if (q) rows = rows.filter(t => t._k.includes(q));
  rows.sort((a, b) => (sort === "xx" ? fold(a[L].t).localeCompare(fold(b[L].t))
                                     : fold(a.en).localeCompare(fold(b.en))));
  document.getElementById("n").textContent = rows.length + " " + u.count;
  document.getElementById("list").innerHTML = rows.length ? rows.map(t => {
    const w = t[L].u.indexOf("\u26a0") === 0 ? " warn" : "";
    return `<div class="row">
      <div><h3>${esc(t.en)}</h3><p class="xx">${esc(t[L].t)}</p>
        ${t.unit ? `<p class="unit">${esc(t.unit)}</p>` : ""}</div>
      <div>${t.ex ? `<p class="ex">${esc(t.ex)}</p>` : ""}
        <p class="ex tr">${esc(t[L].e)}</p>
        <p class="use${w}">${esc(t[L].u)}</p></div>
    </div>`;
  }).join("") : `<p class="n">${u.none}</p>`;
}

function esc(s) {
  return (s || "").replace(/[&<>"']/g, c =>
    ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"})[c]);
}

document.getElementById("q").addEventListener("input", render);
document.getElementById("unit").addEventListener("change", render);
document.getElementById("sort").addEventListener("change", render);
// A laptop is the only device these students may have in class (spec §2), so the
// keyboard is the fast path: "/" jumps to the box from anywhere on the page.
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement.id !== "q") {
    e.preventDefault(); document.getElementById("q").focus();
  }
});
chrome(); render();
</script>
