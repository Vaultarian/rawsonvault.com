<script>
const D = {"terms":[{"en":"input","unit":"Robotics & Control","ex":"Pressing button A is the input; the LEDs are the output.","es":{"t":"la entrada (input)","e":"Pulsar el botón A es el input; los LED son el output.","u":"Un input es lo que entra en el micro:bit: pulsar un botón, agitarlo, la luz. En informática en español también se dice «input». Lo contrario es «output»."},"fr":{"t":"l'entrée (input)","e":"Appuyer sur le bouton A, c'est l'input ; les LED sont l'output.","u":"Un input, c'est ce qui entre dans le micro:bit : appuyer sur un bouton, le secouer, la lumière. On dit souvent « input » aussi en français. Le contraire est « output »."},"de":{"t":"die Eingabe (der Input)","e":"Knopf A drücken ist der Input; die LEDs sind der Output.","u":"Ein input ist alles, was in den micro:bit hineingeht: Knopf drücken, schütteln, Licht. Auf Deutsch sagt man auch einfach „Input“. Das Gegenteil ist „output“."},"_k":"input robotics & control pressing button a is the input; the leds are the output. la entrada (input) l'entree (input) die eingabe (der input) pulsar el boton a es el input; los led son el output. appuyer sur le bouton a, c'est l'input ; les led sont l'output. knopf a drucken ist der input; die leds sind der output."},{"en":"output","unit":"Robotics & Control","ex":"The LEDs are the output of your program.","es":{"t":"la salida (output)","e":"Los LED son el output de tu programa.","u":"⚠ No es la salida de un edificio. En informática el output es lo que el micro:bit hace o muestra: los LED, un sonido, mover el robot. Recuerda: input → process → output."},"fr":{"t":"la sortie (output)","e":"Les LED sont l'output de ton programme.","u":"⚠ Ce n'est pas la sortie d'un bâtiment. En informatique, l'output, c'est ce que le micro:bit fait ou montre : les LED, un son, faire avancer le robot. Retiens : input → process → output."},"de":{"t":"die Ausgabe (der Output)","e":"Die LEDs sind der Output deines Programms.","u":"Nicht der Ausgang eines Gebäudes. Der output ist das, was der micro:bit macht oder zeigt: LEDs, ein Ton, der Roboter fährt. Merk dir: input → process → output."},"_k":"output robotics & control the leds are the output of your program. la salida (output) la sortie (output) die ausgabe (der output) los led son el output de tu programa. les led sont l'output de ton programme. die leds sind der output deines programms."},{"en":"sensor","unit":"Robotics & Control","ex":"The light sensor tells the robot when it is dark.","es":{"t":"el sensor","e":"El sensor de luz le dice al robot cuándo está oscuro.","u":"Misma palabra. Un sensor mide algo del mundo real: luz, temperatura, movimiento. El «accelerometer» del micro:bit es un sensor que nota cuándo lo agitas."},"fr":{"t":"le capteur","e":"Le capteur de lumière dit au robot quand il fait sombre.","u":"⚠ En français on dit « capteur », pas « senseur ». Un sensor mesure quelque chose du monde réel : la lumière, la température, le mouvement. L'« accelerometer » du micro:bit est un capteur qui sent quand tu le secoues."},"de":{"t":"der Sensor","e":"Der Lichtsensor sagt dem Roboter, wann es dunkel ist.","u":"Gleiches Wort. Ein Sensor misst etwas aus der echten Welt: Licht, Temperatur, Bewegung. Der „accelerometer“ im micro:bit ist ein Sensor, der merkt, wenn du ihn schüttelst."},"_k":"sensor robotics & control the light sensor tells the robot when it is dark. el sensor le capteur der sensor el sensor de luz le dice al robot cuando esta oscuro. le capteur de lumiere dit au robot quand il fait sombre. der lichtsensor sagt dem roboter, wann es dunkel ist."},{"en":"algorithm","unit":"Robotics & Control","ex":"Write the algorithm in steps before you build it in blocks.","es":{"t":"el algoritmo","e":"Escribe el algoritmo en pasos antes de construirlo con bloques.","u":"Una lista de pasos, en orden, para resolver un problema. Como una receta. Se puede escribir en papel antes de abrir MakeCode."},"fr":{"t":"l'algorithme","e":"Écris l'algorithme en étapes avant de le construire avec des blocs.","u":"Une liste d'étapes, dans l'ordre, pour résoudre un problème. Comme une recette. Tu peux l'écrire sur papier avant d'ouvrir MakeCode."},"de":{"t":"der Algorithmus","e":"Schreibe den Algorithmus in Schritten auf, bevor du ihn mit Blöcken baust.","u":"Eine Liste von Schritten, in der richtigen Reihenfolge, um ein Problem zu lösen. Wie ein Rezept. Du kannst ihn auf Papier schreiben, bevor du MakeCode öffnest."},"_k":"algorithm robotics & control write the algorithm in steps before you build it in blocks. el algoritmo l'algorithme der algorithmus escribe el algoritmo en pasos antes de construirlo con bloques. ecris l'algorithme en etapes avant de le construire avec des blocs. schreibe den algorithmus in schritten auf, bevor du ihn mit blocken baust."},{"en":"variable","unit":"Robotics & Control","ex":"Make a variable called score and set it to 0.","es":{"t":"la variable","e":"Crea una variable llamada score y ponla a 0.","u":"Una caja con nombre donde el programa guarda un número o un texto, por ejemplo «score». El valor puede cambiar mientras corre el programa."},"fr":{"t":"la variable","e":"Crée une variable appelée score et mets-la à 0.","u":"Une boîte avec un nom où le programme garde un nombre ou un texte, par exemple « score ». Sa valeur peut changer pendant que le programme tourne."},"de":{"t":"die Variable","e":"Erstelle eine Variable namens score und setze sie auf 0.","u":"Eine Box mit Namen, in der das Programm eine Zahl oder einen Text speichert, zum Beispiel „score“. Der Wert kann sich ändern, während das Programm läuft."},"_k":"variable robotics & control make a variable called score and set it to 0. la variable la variable die variable crea una variable llamada score y ponla a 0. cree une variable appelee score et mets-la a 0. erstelle eine variable namens score und setze sie auf 0."},{"en":"loop","unit":"Robotics & Control","ex":"Put the blocks inside a repeat loop so they run four times.","es":{"t":"el bucle","e":"Mete los bloques dentro de un bucle repeat para que corran cuatro veces.","u":"⚠ No es un lazo ni una vuelta en coche. Un loop repite los mismos bloques varias veces. En MakeCode, «repeat», «while» y «forever» son loops."},"fr":{"t":"la boucle","e":"Mets les blocs dans une boucle repeat pour qu'ils s'exécutent quatre fois.","u":"Un loop répète les mêmes blocs plusieurs fois. Dans MakeCode, « repeat », « while » et « forever » sont des loops. Le mot français est « boucle », comme une boucle de ceinture."},"de":{"t":"die Schleife","e":"Setze die Blöcke in eine repeat-Schleife, damit sie viermal laufen.","u":"Eine Schleife wiederholt dieselben Blöcke mehrmals. In MakeCode sind „repeat“, „while“ und „forever“ Schleifen. Auf Deutsch sagt man oft auch „Loop“."},"_k":"loop robotics & control put the blocks inside a repeat loop so they run four times. el bucle la boucle die schleife mete los bloques dentro de un bucle repeat para que corran cuatro veces. mets les blocs dans une boucle repeat pour qu'ils s'executent quatre fois. setze die blocke in eine repeat-schleife, damit sie viermal laufen."},{"en":"iteration","unit":"Robotics & Control","ex":"Use iteration instead of copying the same block ten times.","es":{"t":"la iteración","e":"Usa la iteración en vez de copiar el mismo bloque diez veces.","u":"⚠ Tiene dos sentidos en esta clase. En programación es repetir (un loop). En el ciclo de diseño es mejorar tu diseño versión tras versión: «iterate» = probar, cambiar, probar otra vez."},"fr":{"t":"l'itération","e":"Utilise l'itération au lieu de copier le même bloc dix fois.","u":"⚠ Deux sens dans ce cours. En programmation, c'est répéter (un loop). Dans le cycle de design, c'est améliorer ton projet version après version : « iterate » = tester, changer, retester."},"de":{"t":"die Iteration","e":"Nutze Iteration, statt denselben Block zehnmal zu kopieren.","u":"⚠ Zwei Bedeutungen in diesem Fach. Beim Programmieren heißt es wiederholen (eine Schleife). Im Design-Zyklus heißt es, deinen Entwurf Version für Version zu verbessern: „iterate“ = testen, ändern, wieder testen."},"_k":"iteration robotics & control use iteration instead of copying the same block ten times. la iteracion l'iteration die iteration usa la iteracion en vez de copiar el mismo bloque diez veces. utilise l'iteration au lieu de copier le meme bloc dix fois. nutze iteration, statt denselben block zehnmal zu kopieren."},{"en":"block","unit":"Robotics & Control","ex":"Drag the show leds block into on start.","es":{"t":"el bloque","e":"Arrastra el bloque show leds dentro de on start.","u":"En MakeCode cada pieza de color que arrastras es un block; encajan como piezas de LEGO. ⚠ Nada que ver con «bloquear»."},"fr":{"t":"le bloc","e":"Fais glisser le bloc show leds dans on start.","u":"Dans MakeCode, chaque pièce de couleur que tu fais glisser est un block ; ils s'emboîtent comme des LEGO. ⚠ Rien à voir avec « bloquer »."},"de":{"t":"der Block","e":"Ziehe den Block show leds in on start.","u":"In MakeCode ist jedes bunte Teil, das du ziehst, ein block; sie stecken zusammen wie LEGO. Auf Deutsch sagt man genauso „Block“."},"_k":"block robotics & control drag the show leds block into on start. el bloque le bloc der block arrastra el bloque show leds dentro de on start. fais glisser le bloc show leds dans on start. ziehe den block show leds in on start."},{"en":"pin","unit":"Robotics & Control","ex":"Connect the crocodile clip to pin 0.","es":{"t":"el pin","e":"Conecta la pinza de cocodrilo al pin 0.","u":"⚠ No es el PIN de tu tarjeta ni un alfiler. Los pins son los contactos dorados del borde del micro:bit (0, 1, 2, 3V, GND). Por ahí conectas cables, motores y sensores."},"fr":{"t":"la broche (le pin)","e":"Branche la pince crocodile sur la broche 0.","u":"⚠ Ce n'est pas le code PIN de ta carte. Les pins sont les contacts dorés au bord du micro:bit (0, 1, 2, 3V, GND). C'est là que tu branches les fils, les moteurs et les capteurs. En français on dit aussi « broche »."},"de":{"t":"der Pin","e":"Verbinde die Krokodilklemme mit Pin 0.","u":"⚠ Nicht die PIN deiner Bankkarte. Die pins sind die goldenen Kontakte am Rand des micro:bit (0, 1, 2, 3V, GND). Dort schließt du Kabel, Motoren und Sensoren an."},"_k":"pin robotics & control connect the crocodile clip to pin 0. el pin la broche (le pin) der pin conecta la pinza de cocodrilo al pin 0. branche la pince crocodile sur la broche 0. verbinde die krokodilklemme mit pin 0."},{"en":"radio","unit":"Robotics & Control","ex":"Use radio send number to talk to your partner's micro:bit.","es":{"t":"la radio","e":"Usa radio send number para hablar con el micro:bit de tu compañero.","u":"⚠ No es la radio de música. En el micro:bit radio significa enviar mensajes sin cables a otro micro:bit. Los dos tienen que estar en el mismo «radio group»."},"fr":{"t":"la radio","e":"Utilise radio send number pour parler au micro:bit de ton binôme.","u":"⚠ Ce n'est pas la radio qu'on écoute. Sur le micro:bit, radio veut dire envoyer des messages sans fil à un autre micro:bit. Les deux doivent être dans le même « radio group »."},"de":{"t":"der Funk (das Radio)","e":"Nutze radio send number, um mit dem micro:bit deines Partners zu sprechen.","u":"⚠ Nicht das Radio mit Musik. Beim micro:bit heißt radio: Nachrichten ohne Kabel an einen anderen micro:bit schicken (Funk). Beide müssen in derselben „radio group“ sein."},"_k":"radio robotics & control use radio send number to talk to your partner's micro:bit. la radio la radio der funk (das radio) usa radio send number para hablar con el micro:bit de tu companero. utilise radio send number pour parler au micro:bit de ton binome. nutze radio send number, um mit dem micro:bit deines partners zu sprechen."},{"en":"event","unit":"Robotics & Control","ex":"on button A pressed runs when that event happens.","es":{"t":"el evento","e":"on button A pressed se ejecuta cuando ocurre ese evento.","u":"⚠ No es una fiesta. Un event es algo que pasa: pulsar A, agitar, recibir un mensaje. Los bloques «on …» esperan a ese evento y entonces corren."},"fr":{"t":"l'événement","e":"on button A pressed s'exécute quand cet événement arrive.","u":"⚠ Ce n'est pas une fête. Un event, c'est quelque chose qui arrive : appuyer sur A, secouer, recevoir un message. Les blocs « on … » attendent cet événement, puis s'exécutent."},"de":{"t":"das Ereignis (der Event)","e":"on button A pressed läuft, wenn dieses Ereignis passiert.","u":"⚠ Keine Party. Ein event ist etwas, das passiert: A drücken, schütteln, eine Nachricht bekommen. Die „on …“-Blöcke warten auf dieses Ereignis und laufen dann los."},"_k":"event robotics & control on button a pressed runs when that event happens. el evento l'evenement das ereignis (der event) on button a pressed se ejecuta cuando ocurre ese evento. on button a pressed s'execute quand cet evenement arrive. on button a pressed lauft, wenn dieses ereignis passiert."},{"en":"bug","unit":"Robotics & Control","ex":"There is a bug: the score goes up when I press the wrong button.","es":{"t":"el error (bug)","e":"Hay un bug: la puntuación sube cuando pulso el botón equivocado.","u":"⚠ No es un insecto. Un bug es un error en tu programa: corre, pero no hace lo que querías. Buscar y arreglar bugs se llama «debugging»."},"fr":{"t":"le bug (le bogue)","e":"Il y a un bug : le score monte quand j'appuie sur le mauvais bouton.","u":"⚠ Ce n'est pas un insecte. Un bug est une erreur dans ton programme : il tourne, mais ne fait pas ce que tu voulais. Chercher et corriger les bugs, c'est le « debugging »."},"de":{"t":"der Bug (der Fehler)","e":"Da ist ein Bug: Der Punktestand steigt, wenn ich den falschen Knopf drücke.","u":"⚠ Kein Insekt. Ein bug ist ein Fehler in deinem Programm: Es läuft, macht aber nicht, was du wolltest. Fehler suchen und beheben heißt „debugging“."},"_k":"bug robotics & control there is a bug: the score goes up when i press the wrong button. el error (bug) le bug (le bogue) der bug (der fehler) hay un bug: la puntuacion sube cuando pulso el boton equivocado. il y a un bug : le score monte quand j'appuie sur le mauvais bouton. da ist ein bug: der punktestand steigt, wenn ich den falschen knopf drucke."},{"en":"string","unit":"Robotics & Control","ex":"show string scrolls the text across the screen.","es":{"t":"la cadena (de texto)","e":"show string hace pasar el texto por la pantalla.","u":"⚠ No es una cuerda. En programación un string es un texto: letras, palabras, frases. «Hello» es un string; 5 es un número."},"fr":{"t":"la chaîne (de caractères)","e":"show string fait défiler le texte sur l'écran.","u":"⚠ Ce n'est pas une ficelle. En programmation, un string est un texte : des lettres, des mots, des phrases. « Hello » est un string ; 5 est un nombre."},"de":{"t":"der String (die Zeichenkette)","e":"show string lässt den Text über den Bildschirm laufen.","u":"⚠ Keine Schnur. Beim Programmieren ist ein string ein Text: Buchstaben, Wörter, Sätze. „Hello“ ist ein String; 5 ist eine Zahl. Auch auf Deutsch sagt man meist „String“."},"_k":"string robotics & control show string scrolls the text across the screen. la cadena (de texto) la chaine (de caracteres) der string (die zeichenkette) show string hace pasar el texto por la pantalla. show string fait defiler le texte sur l'ecran. show string lasst den text uber den bildschirm laufen."},{"en":"pause","unit":"Robotics & Control","ex":"Add a pause of 500 ms between the two pictures.","es":{"t":"la pausa","e":"Añade una pausa de 500 ms entre las dos imágenes.","u":"El bloque pause hace que el micro:bit espere. Se mide en milisegundos (ms): 1000 ms = 1 segundo. Sin pause, las imágenes pasan tan rápido que no las ves."},"fr":{"t":"la pause","e":"Ajoute une pause de 500 ms entre les deux images.","u":"Le bloc pause fait attendre le micro:bit. Il se mesure en millisecondes (ms) : 1000 ms = 1 seconde. Sans pause, les images passent trop vite pour être vues."},"de":{"t":"die Pause","e":"Füge eine Pause von 500 ms zwischen den beiden Bildern ein.","u":"⚠ Nicht die große Pause in der Schule. Der pause-Block lässt den micro:bit warten, in Millisekunden (ms): 1000 ms = 1 Sekunde. Ohne pause sind die Bilder zu schnell weg."},"_k":"pause robotics & control add a pause of 500 ms between the two pictures. la pausa la pause die pause anade una pausa de 500 ms entre las dos imagenes. ajoute une pause de 500 ms entre les deux images. fuge eine pause von 500 ms zwischen den beiden bildern ein."},{"en":"prototype","unit":"Robotics & Control","ex":"Build a quick prototype before you make the final version.","es":{"t":"el prototipo","e":"Construye un prototipo rápido antes de hacer la versión final.","u":"Una primera versión, rápida y sencilla, para probar si la idea funciona. No tiene que ser bonita. Después la mejoras (iterate)."},"fr":{"t":"le prototype","e":"Construis un prototype rapide avant de faire la version finale.","u":"Une première version, rapide et simple, pour tester si l'idée marche. Elle n'a pas besoin d'être belle. Ensuite tu l'améliores (iterate)."},"de":{"t":"der Prototyp","e":"Baue einen schnellen Prototyp, bevor du die endgültige Version machst.","u":"Eine erste, schnelle und einfache Version, um zu testen, ob die Idee funktioniert. Sie muss nicht schön sein. Danach verbesserst du sie (iterate)."},"_k":"prototype robotics & control build a quick prototype before you make the final version. el prototipo le prototype der prototyp construye un prototipo rapido antes de hacer la version final. construis un prototype rapide avant de faire la version finale. baue einen schnellen prototyp, bevor du die endgultige version machst."},{"en":"design cycle","unit":"MYP Design cycle","ex":"Every project in this course follows the design cycle.","es":{"t":"el ciclo de diseño","e":"Todos los proyectos de esta asignatura siguen el ciclo de diseño.","u":"Los cuatro pasos de cualquier proyecto: inquiring and analysing (A), developing ideas (B), creating the solution (C), evaluating (D). Es un círculo: después de evaluar, vuelves a mejorar."},"fr":{"t":"le cycle de design (de conception)","e":"Chaque projet de ce cours suit le cycle de design.","u":"Les quatre étapes de tout projet : inquiring and analysing (A), developing ideas (B), creating the solution (C), evaluating (D). C'est un cercle : après avoir évalué, tu recommences pour améliorer."},"de":{"t":"der Design-Zyklus","e":"Jedes Projekt in diesem Fach folgt dem Design-Zyklus.","u":"Die vier Schritte jedes Projekts: inquiring and analysing (A), developing ideas (B), creating the solution (C), evaluating (D). Es ist ein Kreis: Nach dem Bewerten verbesserst du weiter."},"_k":"design cycle myp design cycle every project in this course follows the design cycle. el ciclo de diseno le cycle de design (de conception) der design-zyklus todos los proyectos de esta asignatura siguen el ciclo de diseno. chaque projet de ce cours suit le cycle de design. jedes projekt in diesem fach folgt dem design-zyklus."},{"en":"inquiring and analysing (Criterion A)","unit":"MYP Design cycle","ex":"Criterion A, inquiring and analysing: explain why a solution is needed.","es":{"t":"investigar y analizar (Criterio A)","e":"Criterio A, investigar y analizar: explica por qué hace falta una solución.","u":"⚠ «Inquiring» no es «inquirir»; significa investigar, informarse. En el Criterio A explicas cuál es el problema, buscas cómo lo han resuelto otros y escribes tu design brief."},"fr":{"t":"recherche et analyse (Critère A)","e":"Critère A, recherche et analyse : explique pourquoi une solution est nécessaire.","u":"« Inquiring » veut dire faire des recherches, se renseigner. Dans le Critère A, tu expliques quel est le problème, tu regardes comment d'autres l'ont résolu, et tu écris ton design brief."},"de":{"t":"Untersuchen und Analysieren (Kriterium A)","e":"Kriterium A, Untersuchen und Analysieren: Erkläre, warum eine Lösung nötig ist.","u":"„Inquiring“ heißt nachforschen, sich informieren. Bei Kriterium A erklärst du, was das Problem ist, schaust, wie andere es gelöst haben, und schreibst deinen design brief."},"_k":"inquiring and analysing (criterion a) myp design cycle criterion a, inquiring and analysing: explain why a solution is needed. investigar y analizar (criterio a) recherche et analyse (critere a) untersuchen und analysieren (kriterium a) criterio a, investigar y analizar: explica por que hace falta una solucion. critere a, recherche et analyse : explique pourquoi une solution est necessaire. kriterium a, untersuchen und analysieren: erklare, warum eine losung notig ist."},{"en":"developing ideas (Criterion B)","unit":"MYP Design cycle","ex":"Criterion B, developing ideas: sketch several designs and justify the one you choose.","es":{"t":"desarrollar ideas (Criterio B)","e":"Criterio B, desarrollar ideas: dibuja varios diseños y justifica el que eliges.","u":"En el Criterio B escribes tu design specification, dibujas varias ideas («sketches», bocetos rápidos) y explicas por qué eliges una. Varias ideas, no solo la primera."},"fr":{"t":"développement des idées (Critère B)","e":"Critère B, développement des idées : dessine plusieurs designs et justifie celui que tu choisis.","u":"Dans le Critère B, tu écris ta design specification, tu dessines plusieurs idées (des « sketches », des croquis) et tu expliques pourquoi tu en choisis une. Plusieurs idées, pas seulement la première."},"de":{"t":"Ideen entwickeln (Kriterium B)","e":"Kriterium B, Ideen entwickeln: Skizziere mehrere Entwürfe und begründe den, den du wählst.","u":"Bei Kriterium B schreibst du deine design specification, zeichnest mehrere Ideen („sketches“, Skizzen) und erklärst, warum du eine davon wählst. Mehrere Ideen, nicht nur die erste."},"_k":"developing ideas (criterion b) myp design cycle criterion b, developing ideas: sketch several designs and justify the one you choose. desarrollar ideas (criterio b) developpement des idees (critere b) ideen entwickeln (kriterium b) criterio b, desarrollar ideas: dibuja varios disenos y justifica el que eliges. critere b, developpement des idees : dessine plusieurs designs et justifie celui que tu choisis. kriterium b, ideen entwickeln: skizziere mehrere entwurfe und begrunde den, den du wahlst."},{"en":"creating the solution (Criterion C)","unit":"MYP Design cycle","ex":"Criterion C, creating the solution: follow your plan and record the changes you make.","es":{"t":"crear la solución (Criterio C)","e":"Criterio C, crear la solución: sigue tu plan y apunta los cambios que haces.","u":"⚠ El Criterio C NO es «¿funcionó el robot?». Es construir siguiendo tu plan y apuntar cada cambio que haces y por qué. Un robot que falla, si explicas por qué, puede sacar más nota."},"fr":{"t":"création de la solution (Critère C)","e":"Critère C, création de la solution : suis ton plan et note les changements que tu fais.","u":"⚠ Le Critère C, ce n'est PAS « le robot a-t-il marché ? ». C'est construire en suivant ton plan et noter chaque changement que tu fais, et pourquoi. Un robot qui rate, si tu expliques pourquoi, peut avoir une meilleure note."},"de":{"t":"die Lösung erstellen (Kriterium C)","e":"Kriterium C, die Lösung erstellen: Folge deinem Plan und notiere die Änderungen, die du machst.","u":"⚠ Kriterium C ist NICHT „hat der Roboter funktioniert?“. Es heißt: nach deinem Plan bauen und jede Änderung aufschreiben, mit Grund. Ein Roboter, der nicht klappt, kann besser bewertet werden, wenn du erklären kannst, warum."},"_k":"creating the solution (criterion c) myp design cycle criterion c, creating the solution: follow your plan and record the changes you make. crear la solucion (criterio c) creation de la solution (critere c) die losung erstellen (kriterium c) criterio c, crear la solucion: sigue tu plan y apunta los cambios que haces. critere c, creation de la solution : suis ton plan et note les changements que tu fais. kriterium c, die losung erstellen: folge deinem plan und notiere die anderungen, die du machst."},{"en":"evaluating (Criterion D)","unit":"MYP Design cycle","ex":"Criterion D, evaluating: test your robot against the specification and say what you would improve.","es":{"t":"evaluar (Criterio D)","e":"Criterio D, evaluar: prueba tu robot contra la especificación y di qué mejorarías.","u":"Evaluar es juzgar con honestidad: ¿cumple tu solución la design specification? Necesitas pruebas con datos, lo bueno y lo malo, y qué cambiarías. «Está bien» no es evaluar."},"fr":{"t":"évaluation (Critère D)","e":"Critère D, évaluation : teste ton robot par rapport au cahier des charges et dis ce que tu améliorerais.","u":"Évaluer, c'est juger honnêtement : ta solution respecte-t-elle la design specification ? Il faut des tests avec des données, les points forts et les points faibles, et ce que tu changerais. « C'est bien » n'est pas une évaluation."},"de":{"t":"Bewerten (Kriterium D)","e":"Kriterium D, Bewerten: Teste deinen Roboter gegen die Anforderungsliste und sag, was du verbessern würdest.","u":"Bewerten heißt ehrlich urteilen: Erfüllt deine Lösung die design specification? Du brauchst Tests mit Daten, Stärken und Schwächen, und was du ändern würdest. „Ist gut“ ist keine Bewertung."},"_k":"evaluating (criterion d) myp design cycle criterion d, evaluating: test your robot against the specification and say what you would improve. evaluar (criterio d) evaluation (critere d) bewerten (kriterium d) criterio d, evaluar: prueba tu robot contra la especificacion y di que mejorarias. critere d, evaluation : teste ton robot par rapport au cahier des charges et dis ce que tu ameliorerais. kriterium d, bewerten: teste deinen roboter gegen die anforderungsliste und sag, was du verbessern wurdest."},{"en":"design brief","unit":"MYP Design cycle","ex":"Write a design brief that says what the robot must do and for whom.","es":{"t":"el encargo de diseño (design brief)","e":"Escribe un encargo de diseño que diga qué debe hacer el robot y para quién.","u":"⚠ «Brief» normalmente significa breve, corto. Aquí el design brief es un texto corto que explica el problema: qué hay que hacer, para quién y por qué. Va ANTES de la especificación."},"fr":{"t":"le brief de conception","e":"Rédige un brief de conception qui dit ce que le robot doit faire et pour qui.","u":"⚠ « Brief » veut normalement dire court. Ici, le design brief est un petit texte qui explique le problème : quoi faire, pour qui, et pourquoi. Il vient AVANT le cahier des charges."},"de":{"t":"der Designauftrag (das Briefing)","e":"Schreibe einen Designauftrag, der sagt, was der Roboter tun muss und für wen.","u":"⚠ „Brief“ heißt hier weder Brief (letter) noch kurz. Der design brief ist ein kurzer Text, der das Problem erklärt: was gebaut werden soll, für wen und warum. Er kommt VOR der Anforderungsliste."},"_k":"design brief myp design cycle write a design brief that says what the robot must do and for whom. el encargo de diseno (design brief) le brief de conception der designauftrag (das briefing) escribe un encargo de diseno que diga que debe hacer el robot y para quien. redige un brief de conception qui dit ce que le robot doit faire et pour qui. schreibe einen designauftrag, der sagt, was der roboter tun muss und fur wen."},{"en":"design specification","unit":"MYP Design cycle","ex":"Write a design specification before you start making.","es":{"t":"la especificación de diseño","e":"Escribe una especificación de diseño antes de empezar a construir.","u":"Una lista de lo que tu solución DEBE hacer, escrita de forma que se pueda comprobar: «el robot para a menos de 5 cm del obstáculo». Después la usas para evaluar."},"fr":{"t":"le cahier des charges","e":"Rédige un cahier des charges avant de commencer à fabriquer.","u":"Une liste de ce que ta solution DOIT faire, écrite de façon vérifiable : « le robot s'arrête à moins de 5 cm de l'obstacle ». Tu t'en sers ensuite pour évaluer."},"de":{"t":"die Anforderungsliste","e":"Schreibe eine Anforderungsliste, bevor du mit dem Bauen beginnst.","u":"Eine Liste von allem, was deine Lösung tun MUSS, so geschrieben, dass man es prüfen kann: „Der Roboter stoppt weniger als 5 cm vor dem Hindernis.“ Später bewertest du damit."},"_k":"design specification myp design cycle write a design specification before you start making. la especificacion de diseno le cahier des charges die anforderungsliste escribe una especificacion de diseno antes de empezar a construir. redige un cahier des charges avant de commencer a fabriquer. schreibe eine anforderungsliste, bevor du mit dem bauen beginnst."},{"en":"success criteria","unit":"MYP Design cycle","ex":"One of my success criteria is that the robot follows the line without stopping.","es":{"t":"los criterios de éxito","e":"Uno de mis criterios de éxito es que el robot siga la línea sin pararse.","u":"Cada línea de tu especificación es un criterio de éxito: algo que puedes medir o comprobar con un sí o un no. Si no se puede comprobar, no es un buen criterio."},"fr":{"t":"les critères de réussite","e":"Un de mes critères de réussite : le robot suit la ligne sans s'arrêter.","u":"Chaque ligne de ton cahier des charges est un critère de réussite : quelque chose que tu peux mesurer ou vérifier par oui ou non. Si on ne peut pas le vérifier, ce n'est pas un bon critère."},"de":{"t":"die Erfolgskriterien","e":"Eines meiner Erfolgskriterien: Der Roboter folgt der Linie, ohne anzuhalten.","u":"Jede Zeile deiner Anforderungsliste ist ein Erfolgskriterium: etwas, das du messen oder mit Ja/Nein prüfen kannst. Wenn man es nicht prüfen kann, ist es kein gutes Kriterium."},"_k":"success criteria myp design cycle one of my success criteria is that the robot follows the line without stopping. los criterios de exito les criteres de reussite die erfolgskriterien uno de mis criterios de exito es que el robot siga la linea sin pararse. un de mes criteres de reussite : le robot suit la ligne sans s'arreter. eines meiner erfolgskriterien: der roboter folgt der linie, ohne anzuhalten."},{"en":"target audience (client)","unit":"MYP Design cycle","ex":"Who is the target audience for your robot, and would it really work for them?","es":{"t":"el público objetivo (el cliente)","e":"¿Quién es el público objetivo de tu robot, y de verdad le serviría?","u":"⚠ «Audience» no es solo el público de un teatro. El target audience son las personas que usarán tu solución. El «client» es quien la pide. En el Criterio D explicas qué efecto tiene en ellos."},"fr":{"t":"le public cible (le client)","e":"Quel est le public cible de ton robot, et est-ce qu'il lui serait vraiment utile ?","u":"⚠ « Audience » ne veut pas dire seulement les spectateurs. Le target audience, ce sont les personnes qui utiliseront ta solution. Le « client », c'est celui qui la demande. Dans le Critère D, tu expliques l'effet sur eux."},"de":{"t":"die Zielgruppe (der Kunde)","e":"Wer ist die Zielgruppe für deinen Roboter, und würde er ihr wirklich helfen?","u":"⚠ „Audience“ heißt hier nicht Publikum im Theater. Die target audience sind die Menschen, die deine Lösung benutzen werden. Der „client“ ist, wer sie in Auftrag gibt. Bei Kriterium D erklärst du die Wirkung auf sie."},"_k":"target audience (client) myp design cycle who is the target audience for your robot, and would it really work for them? el publico objetivo (el cliente) le public cible (le client) die zielgruppe (der kunde) ¿quien es el publico objetivo de tu robot, y de verdad le serviria? quel est le public cible de ton robot, et est-ce qu'il lui serait vraiment utile ? wer ist die zielgruppe fur deinen roboter, und wurde er ihr wirklich helfen?"},{"en":"testing","unit":"MYP Design cycle","ex":"Design a testing method that gives you data, not just 'it worked'.","es":{"t":"las pruebas (testing)","e":"Diseña un método de pruebas que te dé datos, no solo «funcionó».","u":"⚠ Un test aquí no es un examen. Testing es probar tu solución de forma planificada y apuntar los resultados: cuántas veces, qué pasó, con números. «Funcionó» no es un dato."},"fr":{"t":"les tests","e":"Conçois une méthode de test qui te donne des données, pas seulement « ça a marché ».","u":"⚠ Ici, un test n'est pas un contrôle en classe. Testing, c'est essayer ta solution de façon organisée et noter les résultats : combien de fois, ce qui s'est passé, avec des chiffres. « Ça a marché » n'est pas une donnée."},"de":{"t":"das Testen","e":"Entwirf eine Testmethode, die dir Daten liefert, nicht nur „hat funktioniert“.","u":"⚠ Ein test ist hier keine Klassenarbeit. Testing heißt, deine Lösung planvoll auszuprobieren und die Ergebnisse aufzuschreiben: wie oft, was passiert ist, mit Zahlen. „Hat funktioniert“ ist kein Ergebnis."},"_k":"testing myp design cycle design a testing method that gives you data, not just 'it worked'. las pruebas (testing) les tests das testen disena un metodo de pruebas que te de datos, no solo «funciono». concois une methode de test qui te donne des donnees, pas seulement « ca a marche ». entwirf eine testmethode, die dir daten liefert, nicht nur „hat funktioniert“."},{"en":"state","unit":"MYP command terms","ex":"State the input in your program.","es":{"t":"indicar / escribir","e":"Indica el input de tu programa.","u":"⚠ Palabra de instrucción. «State» significa escribe la respuesta corta, sin explicar. No la confundas con «state» como nombre: el estado (encendido / apagado)."},"fr":{"t":"indiquer / donner","e":"Indique l'input de ton programme.","u":"⚠ Mot de consigne. « State » veut dire : donne la réponse courte, sans expliquer. Ne le confonds pas avec « state » comme nom : l'état (allumé / éteint)."},"de":{"t":"nennen / angeben","e":"Nenne den Input deines Programms.","u":"⚠ Aufgabenwort. „State“ heißt: Schreib nur die kurze Antwort, ohne Erklärung. Nicht verwechseln mit „state“ als Nomen: der Zustand (an / aus)."},"_k":"state myp command terms state the input in your program. indicar / escribir indiquer / donner nennen / angeben indica el input de tu programa. indique l'input de ton programme. nenne den input deines programms."},{"en":"describe","unit":"MYP command terms","ex":"Describe how your robot avoids an obstacle.","es":{"t":"describir","e":"Describe cómo evita tu robot un obstáculo.","u":"⚠ Palabra de instrucción. «Describe» significa di QUÉ hace, paso a paso, sin decir por qué. Si te piden el porqué, la palabra es «explain»."},"fr":{"t":"décrire","e":"Décris comment ton robot évite un obstacle.","u":"⚠ Mot de consigne. « Describe » veut dire : dis CE QUE ça fait, étape par étape, sans dire pourquoi. Pour le pourquoi, le mot est « explain »."},"de":{"t":"beschreiben","e":"Beschreibe, wie dein Roboter einem Hindernis ausweicht.","u":"⚠ Aufgabenwort. „Describe“ heißt: Sag, WAS passiert, Schritt für Schritt, ohne das Warum. Für das Warum heißt das Wort „explain“."},"_k":"describe myp command terms describe how your robot avoids an obstacle. describir decrire beschreiben describe como evita tu robot un obstaculo. decris comment ton robot evite un obstacle. beschreibe, wie dein roboter einem hindernis ausweicht."},{"en":"explain","unit":"MYP command terms","ex":"Explain why you changed the pause from 100 ms to 500 ms.","es":{"t":"explicar","e":"Explica por qué cambiaste la pausa de 100 ms a 500 ms.","u":"⚠ Palabra de instrucción. «Explain» significa di qué hiciste Y por qué. Casi siempre necesitas la palabra «because» en tu respuesta."},"fr":{"t":"expliquer","e":"Explique pourquoi tu as changé la pause de 100 ms à 500 ms.","u":"⚠ Mot de consigne. « Explain » veut dire : dis ce que tu as fait ET pourquoi. Il te faut presque toujours le mot « because » dans ta réponse."},"de":{"t":"erklären","e":"Erkläre, warum du die Pause von 100 ms auf 500 ms geändert hast.","u":"⚠ Aufgabenwort. „Explain“ heißt: Sag, was du gemacht hast UND warum. Fast immer brauchst du das Wort „because“ in deiner Antwort."},"_k":"explain myp command terms explain why you changed the pause from 100 ms to 500 ms. explicar expliquer erklaren explica por que cambiaste la pausa de 100 ms a 500 ms. explique pourquoi tu as change la pause de 100 ms a 500 ms. erklare, warum du die pause von 100 ms auf 500 ms geandert hast."},{"en":"outline","unit":"MYP command terms","ex":"Outline the steps of your plan.","es":{"t":"resumir / explicar brevemente","e":"Resume los pasos de tu plan.","u":"⚠ Palabra de instrucción. No es dibujar un contorno. «Outline» significa da los pasos principales, en pocas frases, sin todos los detalles."},"fr":{"t":"résumer / présenter les grandes lignes","e":"Résume les étapes de ton plan.","u":"⚠ Mot de consigne. Ce n'est pas tracer un contour. « Outline » veut dire : donne les étapes principales, en quelques phrases, sans tous les détails."},"de":{"t":"kurz darstellen / in Grundzügen beschreiben","e":"Stelle die Schritte deines Plans kurz dar.","u":"⚠ Aufgabenwort. Nicht „Umriss zeichnen“. „Outline“ heißt: Nenne die wichtigsten Schritte in wenigen Sätzen, ohne alle Details."},"_k":"outline myp command terms outline the steps of your plan. resumir / explicar brevemente resumer / presenter les grandes lignes kurz darstellen / in grundzugen beschreiben resume los pasos de tu plan. resume les etapes de ton plan. stelle die schritte deines plans kurz dar."},{"en":"justify","unit":"MYP command terms","ex":"Justify the design you chose.","es":{"t":"justificar","e":"Justifica el diseño que elegiste.","u":"⚠ Palabra de instrucción. «Justify» significa da razones o pruebas de por qué tu elección es la buena, comparándola con las otras. Sale mucho en los Criterios B y C. No es pedir perdón ni poner excusas."},"fr":{"t":"justifier","e":"Justifie le design que tu as choisi.","u":"⚠ Mot de consigne. « Justify » veut dire : donne des raisons ou des preuves pour montrer que ton choix est le bon, en le comparant aux autres. Très fréquent aux Critères B et C. Ce n'est pas s'excuser."},"de":{"t":"begründen","e":"Begründe den Entwurf, den du gewählt hast.","u":"⚠ Aufgabenwort. „Justify“ heißt: Gib Gründe oder Belege, warum deine Wahl die richtige ist, im Vergleich zu den anderen. Kommt bei Kriterium B und C oft vor. Nicht „sich rechtfertigen“, als hättest du etwas falsch gemacht."},"_k":"justify myp command terms justify the design you chose. justificar justifier begrunden justifica el diseno que elegiste. justifie le design que tu as choisi. begrunde den entwurf, den du gewahlt hast."},{"en":"analyse","unit":"MYP command terms","ex":"Analyse an existing robot: what are its inputs, process and outputs?","es":{"t":"analizar","e":"Analiza un robot que ya existe: ¿cuáles son sus inputs, su proceso y sus outputs?","u":"⚠ Palabra de instrucción. «Analyse» significa separa la cosa en partes y di cómo se relacionan. En Diseño: ¿qué inputs tiene, qué hace y qué outputs da? En inglés británico se escribe «analyse», con s."},"fr":{"t":"analyser","e":"Analyse un robot qui existe déjà : quels sont ses inputs, son traitement et ses outputs ?","u":"⚠ Mot de consigne. « Analyse » veut dire : découpe la chose en parties et dis comment elles sont liées. En Design : quels inputs, quel traitement, quels outputs ? En anglais britannique, ça s'écrit « analyse », avec un s."},"de":{"t":"analysieren","e":"Analysiere einen Roboter, den es schon gibt: Was sind seine Inputs, sein Prozess und seine Outputs?","u":"⚠ Aufgabenwort. „Analyse“ heißt: Zerlege die Sache in Teile und sag, wie sie zusammenhängen. In Design: Welche inputs, was passiert, welche outputs? Britisch schreibt man „analyse“ mit s."},"_k":"analyse myp command terms analyse an existing robot: what are its inputs, process and outputs? analizar analyser analysieren analiza un robot que ya existe: ¿cuales son sus inputs, su proceso y sus outputs? analyse un robot qui existe deja : quels sont ses inputs, son traitement et ses outputs ? analysiere einen roboter, den es schon gibt: was sind seine inputs, sein prozess und seine outputs?"}],"langs":["es","fr","de"],"units":["MYP Design cycle","MYP command terms","Robotics & Control"],"ui":{"es":{"ph":"Escribe una palabra — en español o en inglés","all":"Todos los temas","none":"No se ha encontrado nada.","sort_en":"Orden: inglés","sort_xx":"Orden: español","count":"términos"},"fr":{"ph":"Tape un mot — en français ou en anglais","all":"Tous les thèmes","none":"Aucun résultat.","sort_en":"Tri : anglais","sort_xx":"Tri : français","count":"termes"},"de":{"ph":"Gib ein Wort ein — auf Deutsch oder Englisch","all":"Alle Themen","none":"Nichts gefunden.","sort_en":"Sortierung: Englisch","sort_xx":"Sortierung: Deutsch","count":"Begriffe"}},"beta":{"es":"Esta página la ha escrito <strong>Alfred</strong>, el sistema de IA del Sr. Rawson, para ayudarte a estudiar en inglés. <strong>Es nueva, y Alfred todavía está aprendiendo tu idioma, así que algunas cosas estarán mal.</strong> Si una palabra te parece incorrecta, seguramente tengas razón: díselo al Sr. Rawson y la corregimos. Si falta una palabra que necesitas, o se te ocurre cómo mejorar esta página, díselo también. Cambia siempre que lo pidas.","fr":"Cette page a été écrite par <strong>Alfred</strong>, le système d'IA de M. Rawson, pour t'aider à étudier en anglais. <strong>Elle est toute nouvelle, et Alfred apprend encore ta langue : certaines choses seront donc fausses.</strong> Si un mot te semble incorrect, tu as sans doute raison : dis-le à M. Rawson et nous le corrigerons. S'il manque un mot dont tu as besoin, ou si tu as une idée pour améliorer cette page, dis-le-lui aussi. Elle change dès que tu le demandes.","de":"Diese Seite hat <strong>Alfred</strong> geschrieben, das KI-System von Mr Rawson, damit du auf Englisch lernen kannst. <strong>Sie ist ganz neu, und Alfred lernt deine Sprache noch — manches wird also falsch sein.</strong> Wenn dir ein Wort falsch vorkommt, hast du wahrscheinlich recht: Sag Mr Rawson Bescheid, dann korrigieren wir es. Wenn ein Wort fehlt, das du brauchst, oder dir einfällt, wie diese Seite besser wird, sag ihm das auch. Sie ändert sich, sobald du es sagst."},"name":{"es":"Español","fr":"Français","de":"Deutsch"}};
const KEY = "vocab-lang";
const fold = s => (s||"").toString().toLowerCase()
  .normalize("NFD").replace(/[\u0300-\u036f]/g, "");

function pick() {
  const q = new URLSearchParams(location.search).get("lang");
  if (q && D.langs.includes(q)) { try { localStorage.setItem(KEY, q); } catch (e) {} return q; }
  let s = null; try { s = localStorage.getItem(KEY); } catch (e) {}
  if (s && D.langs.includes(s)) return s;
  return D.langs[0];
}
let L = pick();

function setLang(v) {
  L = v; try { localStorage.setItem(KEY, v); } catch (e) {}
  chrome(); render();
}

function chrome() {
  document.getElementById("langbar").innerHTML = D.langs.map(x =>
    `<button data-l="${x}" aria-pressed="${x === L}">${D.name[x]}</button>`).join("");
  document.querySelectorAll("#langbar button").forEach(b =>
    b.onclick = () => setLang(b.dataset.l));
  document.getElementById("beta").innerHTML = D.beta[L];
  const u = D.ui[L];
  document.getElementById("q").placeholder = u.ph;
  const sel = document.getElementById("unit"), keep = sel.value;
  sel.innerHTML = `<option value="">${u.all}</option>` +
    D.units.map(x => `<option>${x}</option>`).join("");
  sel.value = keep;
  const so = document.getElementById("sort"), ks = so.value;
  so.innerHTML = `<option value="en">${u.sort_en}</option><option value="xx">${u.sort_xx}</option>`;
  so.value = ks || "en";
}

function render() {
  const u = D.ui[L];
  const q = fold(document.getElementById("q").value.trim());
  const unit = document.getElementById("unit").value;
  const sort = document.getElementById("sort").value || "en";
  let rows = D.terms.filter(t => t[L]);
  if (unit) rows = rows.filter(t => t.unit === unit);
  if (q) rows = rows.filter(t => t._k.includes(q));
  rows.sort((a, b) => (sort === "xx" ? fold(a[L].t).localeCompare(fold(b[L].t))
                                     : fold(a.en).localeCompare(fold(b.en))));
  document.getElementById("n").textContent = rows.length + " " + u.count;
  document.getElementById("list").innerHTML = rows.length ? rows.map(t => {
    const w = t[L].u.indexOf("\u26a0") === 0 ? " warn" : "";
    return `<div class="row">
      <div><h3>${esc(t.en)}</h3><p class="xx">${esc(t[L].t)}</p>
        ${t.unit ? `<p class="unit">${esc(t.unit)}</p>` : ""}</div>
      <div>${t.ex ? `<p class="ex">${esc(t.ex)}</p>` : ""}
        <p class="ex tr">${esc(t[L].e)}</p>
        <p class="use${w}">${esc(t[L].u)}</p></div>
    </div>`;
  }).join("") : `<p class="n">${u.none}</p>`;
}

function esc(s) {
  return (s || "").replace(/[&<>"']/g, c =>
    ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"})[c]);
}

document.getElementById("q").addEventListener("input", render);
document.getElementById("unit").addEventListener("change", render);
document.getElementById("sort").addEventListener("change", render);
// A laptop is the only device these students may have in class (spec §2), so the
// keyboard is the fast path: "/" jumps to the box from anywhere on the page.
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement.id !== "q") {
    e.preventDefault(); document.getElementById("q").focus();
  }
});
chrome(); render();
</script>
</body>
</html>
