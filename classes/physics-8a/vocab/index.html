<script>
const D = {"terms":[{"en":"force","unit":"Forces & Materials","ex":"A force can change the speed of an object.","es":{"t":"la fuerza","e":"Una fuerza puede cambiar la velocidad de un objeto.","u":"⚠ En español «fuerza» también significa ser fuerte. En física una force es un empujón o un tirón, y tiene tamaño y dirección."},"fr":{"t":"la force","e":"Une force peut changer la vitesse d'un objet.","u":"⚠ En français, « la force » veut aussi dire être fort. En physique, une force est une poussée ou une traction : elle a une taille et une direction."},"de":{"t":"die Kraft","e":"Eine Kraft kann die Geschwindigkeit eines Objekts ändern.","u":"⚠ „Force“ heißt nicht „Stärke“. In der Physik ist eine force ein Schieben oder Ziehen, mit Größe und Richtung. Sag nie „power“, wenn du Kraft meinst."},"_k":"force forces & materials a force can change the speed of an object. la fuerza la force die kraft una fuerza puede cambiar la velocidad de un objeto. une force peut changer la vitesse d'un objet. eine kraft kann die geschwindigkeit eines objekts andern."},{"en":"mass","unit":"Forces & Materials","ex":"The mass of the block is 2 kg.","es":{"t":"la masa","e":"La masa del bloque es de 2 kg.","u":"Se mide en kilogramos (kg) y no cambia nunca, ni siquiera en la Luna. No la confundas con «weight»."},"fr":{"t":"la masse","e":"La masse du bloc est de 2 kg.","u":"Se mesure en kilogrammes (kg) et ne change jamais, même sur la Lune. Ne la confonds pas avec « weight »."},"de":{"t":"die Masse","e":"Die Masse des Blocks beträgt 2 kg.","u":"Wird in Kilogramm (kg) gemessen und ändert sich nie, auch nicht auf dem Mond. Verwechsle sie nicht mit „weight“."},"_k":"mass forces & materials the mass of the block is 2 kg. la masa la masse die masse la masa del bloque es de 2 kg. la masse du bloc est de 2 kg. die masse des blocks betragt 2 kg."},{"en":"weight","unit":"Forces & Materials","ex":"The weight of the block is 20 N.","es":{"t":"el peso","e":"El peso del bloque es de 20 N.","u":"⚠ Mucho cuidado con esta. En física weight es una FUERZA y se mide en newtons (N), no en kilos. Tu masa es la misma en la Luna, pero tu weight es menor."},"fr":{"t":"le poids","e":"Le poids du bloc est de 20 N.","u":"⚠ Attention. En physique, weight est une FORCE et se mesure en newtons (N), pas en kilos. Ta masse est la même sur la Lune, mais ton weight est plus petit."},"de":{"t":"das Gewicht","e":"Das Gewicht des Blocks beträgt 20 N.","u":"⚠ Vorsicht. Im Alltag heißt Gewicht „so viele Kilo“, aber in der Physik ist weight eine KRAFT in Newton (N). Deine Masse ist auf dem Mond gleich, dein weight ist kleiner."},"_k":"weight forces & materials the weight of the block is 20 n. el peso le poids das gewicht el peso del bloque es de 20 n. le poids du bloc est de 20 n. das gewicht des blocks betragt 20 n."},{"en":"gravity","unit":"Forces & Materials","ex":"Gravity pulls everything towards the centre of the Earth.","es":{"t":"la gravedad","e":"La gravedad atrae todo hacia el centro de la Tierra.","u":"Es una fuerza a distancia: actúa sin tocar el objeto."},"fr":{"t":"la gravité","e":"La gravité attire tout vers le centre de la Terre.","u":"C'est une force à distance : elle agit sans toucher l'objet. On dit aussi « la pesanteur »."},"de":{"t":"die Schwerkraft","e":"Die Schwerkraft zieht alles zum Mittelpunkt der Erde.","u":"Wirkt aus der Ferne, ohne das Objekt zu berühren. Auf Englisch sagt man auch „gravitational force“."},"_k":"gravity forces & materials gravity pulls everything towards the centre of the earth. la gravedad la gravite die schwerkraft la gravedad atrae todo hacia el centro de la tierra. la gravite attire tout vers le centre de la terre. die schwerkraft zieht alles zum mittelpunkt der erde."},{"en":"newton (N)","unit":"Forces & Materials","ex":"The force is 5 newtons.","es":{"t":"el newton","e":"La fuerza es de 5 newtons.","u":"⚠ La palabra se escribe en minúscula («newton») pero el símbolo lleva mayúscula: N. En inglés el plural es «newtons»."},"fr":{"t":"le newton","e":"La force est de 5 newtons.","u":"⚠ Le mot s'écrit en minuscule (« newton »), mais le symbole prend une majuscule : N. En anglais, le pluriel est « newtons »."},"de":{"t":"das Newton","e":"Die Kraft beträgt 5 Newton.","u":"⚠ Auf Deutsch bleibt es „5 Newton“ ohne -s, auf Englisch heißt es „5 newtons“. Das Wort ist klein, das Symbol groß: N."},"_k":"newton (n) forces & materials the force is 5 newtons. el newton le newton das newton la fuerza es de 5 newtons. la force est de 5 newtons. die kraft betragt 5 newton."},{"en":"density","unit":"Forces & Materials","ex":"Ice is less dense than water, so it floats.","es":{"t":"la densidad","e":"El hielo es menos denso que el agua, por eso flota.","u":"density = mass ÷ volume. Ojo con las dos palabras en inglés: «dense» es el adjetivo (denso) y «density» el sustantivo (densidad)."},"fr":{"t":"la masse volumique (la densité)","e":"La glace est moins dense que l'eau, donc elle flotte.","u":"density = mass ÷ volume. En classe en France on dit souvent « masse volumique » ; en anglais c'est toujours « density ». « dense » est l'adjectif, « density » le nom."},"de":{"t":"die Dichte","e":"Eis ist weniger dicht als Wasser, deshalb schwimmt es.","u":"density = mass ÷ volume. Zwei Wörter auf Englisch: „dense“ ist das Adjektiv (dicht), „density“ das Nomen (Dichte)."},"_k":"density forces & materials ice is less dense than water, so it floats. la densidad la masse volumique (la densite) die dichte el hielo es menos denso que el agua, por eso flota. la glace est moins dense que l'eau, donc elle flotte. eis ist weniger dicht als wasser, deshalb schwimmt es."},{"en":"pressure","unit":"Forces & Materials","ex":"Pressure is the force pressing on each square metre.","es":{"t":"la presión","e":"La presión es la fuerza que actúa sobre cada metro cuadrado.","u":"pressure = force ÷ area. Cuanto menor es el área, mayor es la presión."},"fr":{"t":"la pression","e":"La pression est la force qui appuie sur chaque mètre carré.","u":"pressure = force ÷ area. Plus la surface est petite, plus la pression est grande."},"de":{"t":"der Druck","e":"Der Druck ist die Kraft, die auf jeden Quadratmeter wirkt.","u":"pressure = force ÷ area. Je kleiner die Fläche, desto größer der Druck."},"_k":"pressure forces & materials pressure is the force pressing on each square metre. la presion la pression der druck la presion es la fuerza que actua sobre cada metro cuadrado. la pression est la force qui appuie sur chaque metre carre. der druck ist die kraft, die auf jeden quadratmeter wirkt."},{"en":"area","unit":"Forces & Materials","ex":"Find the area of the base in square metres.","es":{"t":"el área","e":"Calcula el área de la base en metros cuadrados.","u":"⚠ «área» es femenina pero lleva «el» (el área, las áreas). En inglés eso no pasa: siempre «the area»."},"fr":{"t":"l'aire (la surface)","e":"Calcule l'aire de la base en mètres carrés.","u":"⚠ Ne confonds pas « l'aire » (la surface, en m²) et « l'air » (que l'on respire). En anglais, « area » veut dire l'aire ; l'air, c'est « air »."},"de":{"t":"die Fläche","e":"Berechne die Fläche der Grundseite in Quadratmetern.","u":"⚠ „Area“ heißt hier Fläche (in m² oder cm²), nicht „Gebiet“. Auf Englisch sagt man für Flächeninhalt und Oberfläche beides „area“."},"_k":"area forces & materials find the area of the base in square metres. el area l'aire (la surface) die flache calcula el area de la base en metros cuadrados. calcule l'aire de la base en metres carres. berechne die flache der grundseite in quadratmetern."},{"en":"upthrust","unit":"Forces & Materials","ex":"The upthrust from the water pushes the boat up.","es":{"t":"el empuje","e":"El empuje del agua empuja el barco hacia arriba.","u":"⚠ «upthrust» solo se usa para el empuje de un líquido o un gas. No digas «up force»."},"fr":{"t":"la poussée d'Archimède","e":"La poussée de l'eau pousse le bateau vers le haut.","u":"⚠ « Upthrust » ne s'utilise que pour la poussée d'un liquide ou d'un gaz. Ne dis pas « up force ». En anglais, on ne dit presque jamais « Archimedes » : le mot du cours est « upthrust »."},"de":{"t":"der Auftrieb","e":"Der Auftrieb des Wassers drückt das Boot nach oben.","u":"⚠ „Upthrust“ ist nur der Auftrieb in einer Flüssigkeit oder einem Gas. Sag nicht „up force“. Der Auftrieb beim Fliegen heißt auf Englisch „lift“."},"_k":"upthrust forces & materials the upthrust from the water pushes the boat up. el empuje la poussee d'archimede der auftrieb el empuje del agua empuja el barco hacia arriba. la poussee de l'eau pousse le bateau vers le haut. der auftrieb des wassers druckt das boot nach oben."},{"en":"to float","unit":"Forces & Materials","ex":"The boat floats because the upthrust equals its weight.","es":{"t":"flotar","e":"El barco flota porque el empuje es igual a su peso.","u":"Un objeto flota cuando su density es menor que la del agua."},"fr":{"t":"flotter","e":"Le bateau flotte parce que la poussée est égale à son poids.","u":"Un objet flotte quand sa density est plus petite que celle de l'eau."},"de":{"t":"schwimmen (auf dem Wasser liegen)","e":"Das Boot schwimmt, weil der Auftrieb gleich seinem Gewicht ist.","u":"⚠ Auf Deutsch sagt man „das Holz schwimmt“, aber auf Englisch ist „to swim“ nur für Menschen und Tiere. Ein Objekt „floats“."},"_k":"to float forces & materials the boat floats because the upthrust equals its weight. flotar flotter schwimmen (auf dem wasser liegen) el barco flota porque el empuje es igual a su peso. le bateau flotte parce que la poussee est egale a son poids. das boot schwimmt, weil der auftrieb gleich seinem gewicht ist."},{"en":"to sink","unit":"Forces & Materials","ex":"The stone sinks because it is denser than water.","es":{"t":"hundirse","e":"La piedra se hunde porque es más densa que el agua.","u":"⚠ En español es reflexivo («se hunde»); en inglés no. Se dice «it sinks», nunca «it sinks itself»."},"fr":{"t":"couler","e":"La pierre coule parce qu'elle est plus dense que l'eau.","u":"Le contraire de « to float ». On dit « it sinks » ; au passé, « it sank »."},"de":{"t":"sinken / untergehen","e":"Der Stein sinkt, weil er dichter ist als Wasser.","u":"Das Gegenteil von „to float“. Man sagt „it sinks“; die Vergangenheit ist „it sank“."},"_k":"to sink forces & materials the stone sinks because it is denser than water. hundirse couler sinken / untergehen la piedra se hunde porque es mas densa que el agua. la pierre coule parce qu'elle est plus dense que l'eau. der stein sinkt, weil er dichter ist als wasser."},{"en":"friction","unit":"Forces & Materials","ex":"Friction between the tyre and the road slows the car down.","es":{"t":"el rozamiento (la fricción)","e":"El rozamiento entre el neumático y la carretera frena el coche.","u":"⚠ En clase de física en español se dice más «rozamiento» que «fricción», pero en inglés siempre «friction»."},"fr":{"t":"le frottement (la friction)","e":"Le frottement entre le pneu et la route ralentit la voiture.","u":"⚠ En cours de physique en français on dit plutôt « frottement » ; en anglais c'est toujours « friction »."},"de":{"t":"die Reibung","e":"Die Reibung zwischen Reifen und Straße bremst das Auto.","u":"Reibung heißt auf Englisch immer „friction“. Sie bremst jede Bewegung, auch in der Luft (air resistance)."},"_k":"friction forces & materials friction between the tyre and the road slows the car down. el rozamiento (la friccion) le frottement (la friction) die reibung el rozamiento entre el neumatico y la carretera frena el coche. le frottement entre le pneu et la route ralentit la voiture. die reibung zwischen reifen und straße bremst das auto."},{"en":"air resistance","unit":"Forces & Materials","ex":"Air resistance acts against the movement of the parachute.","es":{"t":"la resistencia del aire","e":"La resistencia del aire actúa en contra del movimiento del paracaídas.","u":"Es un tipo de friction. En inglés también se dice «drag»."},"fr":{"t":"la résistance de l'air","e":"La résistance de l'air agit contre le mouvement du parachute.","u":"C'est une sorte de friction. En anglais on dit aussi « drag »."},"de":{"t":"der Luftwiderstand","e":"Der Luftwiderstand wirkt gegen die Bewegung des Fallschirms.","u":"Eine Art von friction. Auf Englisch sagt man auch „drag“."},"_k":"air resistance forces & materials air resistance acts against the movement of the parachute. la resistencia del aire la resistance de l'air der luftwiderstand la resistencia del aire actua en contra del movimiento del paracaidas. la resistance de l'air agit contre le mouvement du parachute. der luftwiderstand wirkt gegen die bewegung des fallschirms."},{"en":"balanced forces","unit":"Forces & Materials","ex":"When the forces are balanced, the speed does not change.","es":{"t":"fuerzas equilibradas","e":"Cuando las fuerzas están equilibradas, la velocidad no cambia.","u":"«balanced» no significa que no haya fuerzas: significa que se anulan entre ellas."},"fr":{"t":"des forces équilibrées","e":"Quand les forces sont équilibrées, la vitesse ne change pas.","u":"« Balanced » ne veut pas dire qu'il n'y a pas de forces : elles s'annulent entre elles."},"de":{"t":"ausgeglichene Kräfte","e":"Wenn die Kräfte ausgeglichen sind, ändert sich die Geschwindigkeit nicht.","u":"„Balanced“ heißt nicht, dass es keine Kräfte gibt: Sie heben sich gegenseitig auf. Auf Deutsch sagt man auch „im Gleichgewicht“."},"_k":"balanced forces forces & materials when the forces are balanced, the speed does not change. fuerzas equilibradas des forces equilibrees ausgeglichene krafte cuando las fuerzas estan equilibradas, la velocidad no cambia. quand les forces sont equilibrees, la vitesse ne change pas. wenn die krafte ausgeglichen sind, andert sich die geschwindigkeit nicht."},{"en":"unbalanced forces","unit":"Forces & Materials","ex":"Unbalanced forces make the object speed up.","es":{"t":"fuerzas desequilibradas","e":"Las fuerzas desequilibradas hacen que el objeto acelere.","u":"El prefijo «un-» en inglés significa «no»: balanced → unbalanced. Lo verás en muchas palabras."},"fr":{"t":"des forces non équilibrées","e":"Des forces non équilibrées font accélérer l'objet.","u":"Le préfixe « un- » en anglais veut dire « non » : balanced → unbalanced. Tu le verras dans beaucoup de mots."},"de":{"t":"unausgeglichene Kräfte","e":"Unausgeglichene Kräfte lassen das Objekt schneller werden.","u":"Die Vorsilbe „un-“ heißt auf Englisch wie auf Deutsch „nicht“: balanced → unbalanced."},"_k":"unbalanced forces forces & materials unbalanced forces make the object speed up. fuerzas desequilibradas des forces non equilibrees unausgeglichene krafte las fuerzas desequilibradas hacen que el objeto acelere. des forces non equilibrees font accelerer l'objet. unausgeglichene krafte lassen das objekt schneller werden."},{"en":"tension","unit":"Forces & Materials","ex":"The tension in the rope pulls the box forwards.","es":{"t":"la tensión","e":"La tensión de la cuerda tira de la caja hacia delante.","u":"⚠ En inglés «tension» también significa nervios o estrés. En física es la fuerza con la que tira un hilo o una cuerda."},"fr":{"t":"la tension","e":"La tension de la corde tire la boîte vers l'avant.","u":"⚠ Ce n'est PAS la tension électrique, qui se dit « voltage » en anglais. En physique, tension est la force avec laquelle un fil ou une corde tire."},"de":{"t":"die Zugkraft (die Spannung)","e":"Die Zugkraft im Seil zieht die Kiste nach vorn.","u":"⚠ Nicht die elektrische Spannung – die heißt auf Englisch „voltage“. Tension ist die Kraft, mit der ein Seil oder Faden zieht."},"_k":"tension forces & materials the tension in the rope pulls the box forwards. la tension la tension die zugkraft (die spannung) la tension de la cuerda tira de la caja hacia delante. la tension de la corde tire la boite vers l'avant. die zugkraft im seil zieht die kiste nach vorn."},{"en":"normal force","unit":"Forces & Materials","ex":"The normal force from the table pushes the book upwards.","es":{"t":"la fuerza normal","e":"La fuerza normal de la mesa empuja el libro hacia arriba.","u":"⚠ Aquí «normal» NO significa «corriente» ni «lo habitual». Significa perpendicular a la superficie."},"fr":{"t":"la force normale (la réaction du support)","e":"La force normale de la table pousse le livre vers le haut.","u":"⚠ Ici « normal » ne veut PAS dire « habituel ». Ça veut dire perpendiculaire à la surface."},"de":{"t":"die Normalkraft","e":"Die Normalkraft des Tisches drückt das Buch nach oben.","u":"⚠ „Normal“ heißt hier NICHT „gewöhnlich“. Es bedeutet senkrecht zur Oberfläche."},"_k":"normal force forces & materials the normal force from the table pushes the book upwards. la fuerza normal la force normale (la reaction du support) die normalkraft la fuerza normal de la mesa empuja el libro hacia arriba. la force normale de la table pousse le livre vers le haut. die normalkraft des tisches druckt das buch nach oben."},{"en":"non-contact force","unit":"Forces & Materials","ex":"Magnetism is a non-contact force.","es":{"t":"fuerza a distancia","e":"El magnetismo es una fuerza a distancia.","u":"⚠ En español se dice «a distancia», no «sin contacto». En inglés siempre «non-contact»."},"fr":{"t":"une force à distance","e":"Le magnétisme est une force à distance.","u":"⚠ En français on dit « à distance », pas « sans contact ». En anglais, c'est toujours « non-contact »."},"de":{"t":"die Fernkraft (berührungslose Kraft)","e":"Magnetismus ist eine Fernkraft.","u":"⚠ Auf Deutsch sagt man „Fernkraft“, auf Englisch immer „non-contact force“. Das Gegenteil ist „contact force“."},"_k":"non-contact force forces & materials magnetism is a non-contact force. fuerza a distancia une force a distance die fernkraft (beruhrungslose kraft) el magnetismo es una fuerza a distancia. le magnetisme est une force a distance. magnetismus ist eine fernkraft."},{"en":"ray","unit":"Light & EM Spectrum","ex":"Draw the reflected ray on the diagram.","es":{"t":"el rayo (de luz)","e":"Dibuja el rayo reflejado en el diagrama.","u":"⚠ En español «rayo» también es el relámpago de una tormenta. En física, un ray es una línea recta con una flecha que muestra por dónde va la luz."},"fr":{"t":"le rayon (de lumière)","e":"Trace le rayon réfléchi sur le schéma.","u":"⚠ « Rayon » veut aussi dire le rayon d'un cercle : en anglais, ça c'est « radius ». En optique, un ray est une ligne droite avec une flèche qui montre le chemin de la lumière."},"de":{"t":"der Lichtstrahl","e":"Zeichne den reflektierten Strahl in die Skizze.","u":"Ein ray ist eine gerade Linie mit Pfeil, die den Weg des Lichts zeigt. Ein breites Lichtbündel heißt auf Englisch „beam“."},"_k":"ray light & em spectrum draw the reflected ray on the diagram. el rayo (de luz) le rayon (de lumiere) der lichtstrahl dibuja el rayo reflejado en el diagrama. trace le rayon reflechi sur le schema. zeichne den reflektierten strahl in die skizze."},{"en":"normal (the normal line)","unit":"Light & EM Spectrum","ex":"Measure the angle between the ray and the normal.","es":{"t":"la normal","e":"Mide el ángulo entre el rayo y la normal.","u":"⚠ Aquí «normal» NO significa «corriente». Es la línea de puntos a 90° con el espejo. Los ángulos siempre se miden desde la normal, no desde el espejo."},"fr":{"t":"la normale","e":"Mesure l'angle entre le rayon et la normale.","u":"⚠ Ici « normal » ne veut PAS dire « habituel ». C'est la ligne en pointillés à 90° du miroir. On mesure toujours les angles à partir de la normale, pas du miroir."},"de":{"t":"das Lot (die Normale)","e":"Miss den Winkel zwischen dem Strahl und dem Lot.","u":"⚠ „Normal“ heißt hier NICHT „gewöhnlich“. Es ist die gestrichelte Linie im 90°-Winkel zum Spiegel. Winkel misst man immer vom Lot aus, nie vom Spiegel."},"_k":"normal (the normal line) light & em spectrum measure the angle between the ray and the normal. la normal la normale das lot (die normale) mide el angulo entre el rayo y la normal. mesure l'angle entre le rayon et la normale. miss den winkel zwischen dem strahl und dem lot."},{"en":"angle of incidence","unit":"Light & EM Spectrum","ex":"The angle of incidence equals the angle of reflection.","es":{"t":"el ángulo de incidencia","e":"El ángulo de incidencia es igual al ángulo de reflexión.","u":"Es el ángulo del rayo que LLEGA al espejo, medido desde la normal. El rayo que llega se llama «incident ray»."},"fr":{"t":"l'angle d'incidence","e":"L'angle d'incidence est égal à l'angle de réflexion.","u":"C'est l'angle du rayon qui ARRIVE sur le miroir, mesuré depuis la normale. Le rayon qui arrive s'appelle « incident ray »."},"de":{"t":"der Einfallswinkel","e":"Der Einfallswinkel ist gleich dem Reflexionswinkel.","u":"Der Winkel des Strahls, der auf den Spiegel TRIFFT, gemessen vom Lot. Der ankommende Strahl heißt „incident ray“ – das hat nichts mit einem Vorfall zu tun."},"_k":"angle of incidence light & em spectrum the angle of incidence equals the angle of reflection. el angulo de incidencia l'angle d'incidence der einfallswinkel el angulo de incidencia es igual al angulo de reflexion. l'angle d'incidence est egal a l'angle de reflexion. der einfallswinkel ist gleich dem reflexionswinkel."},{"en":"refraction","unit":"Light & EM Spectrum","ex":"Refraction happens because light changes speed in the glass.","es":{"t":"la refracción","e":"La refracción ocurre porque la luz cambia de velocidad en el vidrio.","u":"Es cuando la luz se DOBLA al pasar de un material a otro. No la confundas con «reflection», que es cuando rebota."},"fr":{"t":"la réfraction","e":"La réfraction se produit parce que la lumière change de vitesse dans le verre.","u":"C'est quand la lumière se PLIE en passant d'un matériau à un autre. Ne confonds pas avec « reflection », quand elle rebondit."},"de":{"t":"die Brechung","e":"Brechung passiert, weil das Licht im Glas seine Geschwindigkeit ändert.","u":"⚠ Auf Deutsch „Brechung“, aber auf Englisch nie „breaking“ – immer „refraction“. Das Licht knickt ab, wenn es von einem Material ins andere geht. „Reflection“ ist, wenn es zurückprallt."},"_k":"refraction light & em spectrum refraction happens because light changes speed in the glass. la refraccion la refraction die brechung la refraccion ocurre porque la luz cambia de velocidad en el vidrio. la refraction se produit parce que la lumiere change de vitesse dans le verre. brechung passiert, weil das licht im glas seine geschwindigkeit andert."},{"en":"medium","unit":"Light & EM Spectrum","ex":"Light bends when it changes medium.","es":{"t":"el medio (material)","e":"La luz se dobla cuando cambia de medio.","u":"⚠ Aquí «medium» no es «mediano» ni una talla. Es el material por el que viaja la luz: aire, agua o vidrio. El plural en inglés es «media»."},"fr":{"t":"le milieu","e":"La lumière se plie quand elle change de milieu.","u":"⚠ Ici « medium » ne veut pas dire « moyen » ni une taille. C'est le matériau que la lumière traverse : l'air, l'eau ou le verre. Le pluriel en anglais est « media »."},"de":{"t":"das Medium","e":"Licht knickt ab, wenn es das Medium wechselt.","u":"⚠ „Medium“ heißt hier nicht „mittel“ (wie bei Größe M). Es ist der Stoff, durch den das Licht läuft: Luft, Wasser oder Glas. Der Plural ist „media“."},"_k":"medium light & em spectrum light bends when it changes medium. el medio (material) le milieu das medium la luz se dobla cuando cambia de medio. la lumiere se plie quand elle change de milieu. licht knickt ab, wenn es das medium wechselt."},{"en":"umbra and penumbra","unit":"Light & EM Spectrum","ex":"Label the umbra and the penumbra on the eclipse diagram.","es":{"t":"la umbra y la penumbra","e":"Marca la umbra y la penumbra en el diagrama del eclipse.","u":"La umbra es la sombra total, donde no llega nada de luz. La penumbra es la sombra parcial, alrededor. Un eclipse total se ve desde la umbra."},"fr":{"t":"l'ombre et la pénombre","e":"Indique l'ombre et la pénombre sur le schéma de l'éclipse.","u":"⚠ En anglais, le mot du cours est « umbra », pas « shadow ». L'umbra est l'ombre totale, sans aucune lumière. La penumbra est l'ombre partielle, autour."},"de":{"t":"der Kernschatten und der Halbschatten","e":"Beschrifte Kernschatten und Halbschatten in der Skizze der Finsternis.","u":"⚠ Ganz andere Wörter als auf Deutsch. Umbra = Kernschatten (kein Licht). Penumbra = Halbschatten (nur ein Teil der Sonne ist verdeckt)."},"_k":"umbra and penumbra light & em spectrum label the umbra and the penumbra on the eclipse diagram. la umbra y la penumbra l'ombre et la penombre der kernschatten und der halbschatten marca la umbra y la penumbra en el diagrama del eclipse. indique l'ombre et la penombre sur le schema de l'eclipse. beschrifte kernschatten und halbschatten in der skizze der finsternis."},{"en":"to rise / to set (the Sun)","unit":"Celestial Bodies","ex":"In summer the Sun rises in the north-east and sets in the north-west.","es":{"t":"salir / ponerse (el Sol)","e":"En verano el Sol sale por el noreste y se pone por el noroeste.","u":"⚠ «To set» tiene muchos significados en inglés; aquí es «ponerse» el Sol. «Sunrise» es el amanecer y «sunset» el atardecer. Las estrellas y la Luna también «rise» y «set»."},"fr":{"t":"se lever / se coucher (le Soleil)","e":"En été, le Soleil se lève au nord-est et se couche au nord-ouest.","u":"⚠ « To set » a beaucoup de sens en anglais ; ici, c'est le Soleil qui se couche. « Sunrise » est le lever du soleil et « sunset » le coucher. Les étoiles et la Lune « rise » et « set » aussi."},"de":{"t":"aufgehen / untergehen (die Sonne)","e":"Im Sommer geht die Sonne im Nordosten auf und im Nordwesten unter.","u":"⚠ „To set“ hat viele Bedeutungen; hier heißt es untergehen. „Sunrise“ ist der Sonnenaufgang, „sunset“ der Sonnenuntergang. Sterne und der Mond „rise“ und „set“ auch."},"_k":"to rise / to set (the sun) celestial bodies in summer the sun rises in the north-east and sets in the north-west. salir / ponerse (el sol) se lever / se coucher (le soleil) aufgehen / untergehen (die sonne) en verano el sol sale por el noreste y se pone por el noroeste. en ete, le soleil se leve au nord-est et se couche au nord-ouest. im sommer geht die sonne im nordosten auf und im nordwesten unter."},{"en":"tilt","unit":"Celestial Bodies","ex":"The tilt of the Earth's axis causes the seasons.","es":{"t":"la inclinación (del eje)","e":"La inclinación del eje de la Tierra causa las estaciones.","u":"El eje de la Tierra está inclinado 23,5°. También es verbo: «the Earth is tilted». Las estaciones NO se deben a la distancia al Sol."},"fr":{"t":"l'inclinaison (de l'axe)","e":"L'inclinaison de l'axe de la Terre cause les saisons.","u":"L'axe de la Terre est incliné de 23,5°. C'est aussi un verbe : « the Earth is tilted ». Les saisons ne viennent PAS de la distance au Soleil."},"de":{"t":"die Neigung (der Erdachse)","e":"Die Neigung der Erdachse verursacht die Jahreszeiten.","u":"Die Erdachse ist um 23,5° geneigt. Auch als Verb: „the Earth is tilted“. Die Jahreszeiten kommen NICHT vom Abstand zur Sonne."},"_k":"tilt celestial bodies the tilt of the earth's axis causes the seasons. la inclinacion (del eje) l'inclinaison (de l'axe) die neigung (der erdachse) la inclinacion del eje de la tierra causa las estaciones. l'inclinaison de l'axe de la terre cause les saisons. die neigung der erdachse verursacht die jahreszeiten."},{"en":"waxing / waning","unit":"Celestial Bodies","ex":"A waxing moon is getting bigger each night.","es":{"t":"creciente / menguante","e":"Una Luna creciente se ve más grande cada noche.","u":"⚠ No tiene nada que ver con «wax» (cera). Waxing = creciente, waning = menguante. Desde Escocia, la Luna creciente está iluminada por la derecha."},"fr":{"t":"croissante / décroissante","e":"Une Lune croissante grossit chaque nuit.","u":"⚠ Rien à voir avec « wax » (la cire). Waxing = croissante, waning = décroissante. Depuis l'Écosse, la Lune croissante est éclairée à droite."},"de":{"t":"zunehmend / abnehmend","e":"Ein zunehmender Mond wird jede Nacht größer.","u":"⚠ Hat nichts mit „wax“ (Wachs) zu tun. Waxing = zunehmend, waning = abnehmend. Von Schottland aus ist der zunehmende Mond rechts beleuchtet."},"_k":"waxing / waning celestial bodies a waxing moon is getting bigger each night. creciente / menguante croissante / decroissante zunehmend / abnehmend una luna creciente se ve mas grande cada noche. une lune croissante grossit chaque nuit. ein zunehmender mond wird jede nacht großer."},{"en":"crescent","unit":"Celestial Bodies","ex":"Draw the Sun, Earth and Moon for a waxing crescent.","es":{"t":"la Luna en forma de hoz (creciente o menguante cóncava)","e":"Dibuja el Sol, la Tierra y la Luna para una Luna creciente en forma de hoz.","u":"⚠ «Crescent» es la FORMA fina de la Luna, como una C. No significa «creciente» (eso es «waxing»). Existe un «waning crescent»: una Luna fina que mengua."},"fr":{"t":"le croissant (de Lune)","e":"Dessine le Soleil, la Terre et la Lune pour un premier croissant.","u":"⚠ « Crescent » est la FORME fine de la Lune, comme un C. Ça ne veut pas dire « croissante » (ça, c'est « waxing »). « Waxing crescent » = premier croissant, « waning crescent » = dernier croissant."},"de":{"t":"die Mondsichel","e":"Zeichne Sonne, Erde und Mond für eine zunehmende Mondsichel.","u":"„Crescent“ ist die dünne Sichel-FORM des Mondes, wie ein C. Es sagt nicht, ob er zu- oder abnimmt: „waxing crescent“ = zunehmende Sichel, „waning crescent“ = abnehmende Sichel."},"_k":"crescent celestial bodies draw the sun, earth and moon for a waxing crescent. la luna en forma de hoz (creciente o menguante concava) le croissant (de lune) die mondsichel dibuja el sol, la tierra y la luna para una luna creciente en forma de hoz. dessine le soleil, la terre et la lune pour un premier croissant. zeichne sonne, erde und mond fur eine zunehmende mondsichel."},{"en":"gibbous","unit":"Celestial Bodies","ex":"Venus at position (a) looks gibbous.","es":{"t":"gibosa","e":"Venus en la posición (a) se ve gibosa.","u":"Una Luna gibbous está iluminada MÁS de la mitad, pero no está llena. Es la fase entre «half» y «full». En inglés se pronuncia «guíbus»."},"fr":{"t":"gibbeuse","e":"Vénus à la position (a) paraît gibbeuse.","u":"Une Lune gibbous est éclairée à PLUS de la moitié, mais pas pleine. C'est la phase entre « half » et « full ». Ça se prononce « guibeuss »."},"de":{"t":"der Dreiviertelmond (gibbous)","e":"Venus an Position (a) sieht aus wie ein Dreiviertelmond.","u":"⚠ Auf Deutsch gibt es kein eigenes Wort dafür. Ein gibbous moon ist MEHR als halb beleuchtet, aber nicht voll: die Phase zwischen „half“ und „full“. Man spricht es „gibbus“ aus."},"_k":"gibbous celestial bodies venus at position (a) looks gibbous. gibosa gibbeuse der dreiviertelmond (gibbous) venus en la posicion (a) se ve gibosa. venus a la position (a) parait gibbeuse. venus an position (a) sieht aus wie ein dreiviertelmond."},{"en":"inferior planet","unit":"Celestial Bodies","ex":"Venus is an inferior planet, so we only see it in the evening or morning.","es":{"t":"el planeta inferior","e":"Venus es un planeta inferior, por eso solo lo vemos al atardecer o al amanecer.","u":"⚠ «Inferior» NO significa peor. Un inferior planet está más cerca del Sol que la Tierra (Mercurio y Venus). Los demás son «superior planets»."},"fr":{"t":"la planète inférieure","e":"Vénus est une planète inférieure, donc on ne la voit que le soir ou le matin.","u":"⚠ « Inferior » ne veut PAS dire moins bien. Une inferior planet est plus proche du Soleil que la Terre (Mercure et Vénus). Les autres sont des « superior planets »."},"de":{"t":"der untere Planet","e":"Venus ist ein unterer Planet, deshalb sehen wir sie nur abends oder morgens.","u":"⚠ „Inferior“ heißt hier NICHT „schlechter“. Ein inferior planet ist näher an der Sonne als die Erde (Merkur und Venus). Die anderen heißen „superior planets“."},"_k":"inferior planet celestial bodies venus is an inferior planet, so we only see it in the evening or morning. el planeta inferior la planete inferieure der untere planet venus es un planeta inferior, por eso solo lo vemos al atardecer o al amanecer. venus est une planete inferieure, donc on ne la voit que le soir ou le matin. venus ist ein unterer planet, deshalb sehen wir sie nur abends oder morgens."},{"en":"to twinkle","unit":"Celestial Bodies","ex":"Stars twinkle, but planets give a steady light.","es":{"t":"titilar / centellear","e":"Las estrellas titilan, pero los planetas dan una luz fija.","u":"Parpadear muy rápido. Sirve para saber si miras una estrella o un planeta: los planetas no twinkle. «Steady» significa fijo, sin cambios."},"fr":{"t":"scintiller","e":"Les étoiles scintillent, mais les planètes donnent une lumière fixe.","u":"Clignoter très vite. Ça permet de savoir si tu regardes une étoile ou une planète : les planètes ne « twinkle » pas. « Steady » veut dire fixe, sans changement."},"de":{"t":"funkeln / flimmern","e":"Sterne funkeln, aber Planeten leuchten gleichmäßig.","u":"Schnell flackern. So erkennst du, ob du einen Stern oder einen Planeten siehst: Planeten „twinkle“ nicht. „Steady“ heißt ruhig, ohne Flackern."},"_k":"to twinkle celestial bodies stars twinkle, but planets give a steady light. titilar / centellear scintiller funkeln / flimmern las estrellas titilan, pero los planetas dan una luz fija. les etoiles scintillent, mais les planetes donnent une lumiere fixe. sterne funkeln, aber planeten leuchten gleichmaßig."},{"en":"state","unit":"Exam command words","ex":"State the unit of weight.","es":{"t":"indicar / escribir","e":"Indica la unidad del peso.","u":"⚠ Palabra de examen. «State» significa escribe la respuesta corta, sin explicar. No pierdas tiempo dando razones: no dan puntos por ellas."},"fr":{"t":"indiquer / donner","e":"Indique l'unité du poids.","u":"⚠ Mot d'examen. « State » veut dire : écris la réponse courte, sans expliquer. Ne perds pas de temps à donner des raisons : elles ne rapportent pas de points."},"de":{"t":"nennen / angeben","e":"Nenne die Einheit des Gewichts.","u":"⚠ Prüfungswort. „State“ heißt: Schreib nur die kurze Antwort, ohne Erklärung. Begründungen bringen hier keine Punkte."},"_k":"state exam command words state the unit of weight. indicar / escribir indiquer / donner nennen / angeben indica la unidad del peso. indique l'unite du poids. nenne die einheit des gewichts."},{"en":"explain","unit":"Exam command words","ex":"Explain why the boat floats.","es":{"t":"explicar","e":"Explica por qué flota el barco.","u":"⚠ Palabra de examen. «Explain» significa di qué pasa Y por qué. Casi siempre necesitas la palabra «because» en tu respuesta."},"fr":{"t":"expliquer","e":"Explique pourquoi le bateau flotte.","u":"⚠ Mot d'examen. « Explain » veut dire : dis ce qui se passe ET pourquoi. Il te faut presque toujours le mot « because » dans ta réponse."},"de":{"t":"erklären","e":"Erkläre, warum das Boot schwimmt.","u":"⚠ Prüfungswort. „Explain“ heißt: Sag, was passiert UND warum. Fast immer brauchst du das Wort „because“ in deiner Antwort."},"_k":"explain exam command words explain why the boat floats. explicar expliquer erklaren explica por que flota el barco. explique pourquoi le bateau flotte. erklare, warum das boot schwimmt."},{"en":"describe","unit":"Exam command words","ex":"Describe the passage of the Sun across the sky in winter.","es":{"t":"describir","e":"Describe el recorrido del Sol por el cielo en invierno.","u":"⚠ Palabra de examen. «Describe» significa di QUÉ pasa, paso a paso, sin decir por qué. Si te piden el porqué, la palabra es «explain»."},"fr":{"t":"décrire","e":"Décris le trajet du Soleil dans le ciel en hiver.","u":"⚠ Mot d'examen. « Describe » veut dire : dis CE QUI se passe, étape par étape, sans dire pourquoi. Pour le pourquoi, le mot est « explain »."},"de":{"t":"beschreiben","e":"Beschreibe den Weg der Sonne über den Himmel im Winter.","u":"⚠ Prüfungswort. „Describe“ heißt: Sag, WAS passiert, Schritt für Schritt, ohne das Warum. Für das Warum heißt das Wort „explain“."},"_k":"describe exam command words describe the passage of the sun across the sky in winter. describir decrire beschreiben describe el recorrido del sol por el cielo en invierno. decris le trajet du soleil dans le ciel en hiver. beschreibe den weg der sonne uber den himmel im winter."},{"en":"outline","unit":"Exam command words","ex":"Outline what infrared is used for and how it works.","es":{"t":"resumir / explicar brevemente","e":"Resume para qué se usa el infrarrojo y cómo funciona.","u":"⚠ Palabra de examen. No es dibujar un contorno. «Outline» significa da los puntos principales, en pocas frases, sin todos los detalles."},"fr":{"t":"résumer / présenter les grandes lignes","e":"Résume à quoi sert l'infrarouge et comment il fonctionne.","u":"⚠ Mot d'examen. Ce n'est pas tracer un contour. « Outline » veut dire : donne les points principaux, en quelques phrases, sans tous les détails."},"de":{"t":"kurz darstellen / in Grundzügen beschreiben","e":"Stelle kurz dar, wofür Infrarot benutzt wird und wie es funktioniert.","u":"⚠ Prüfungswort. Nicht „Umriss zeichnen“. „Outline“ heißt: Nenne die wichtigsten Punkte in wenigen Sätzen, ohne alle Details."},"_k":"outline exam command words outline what infrared is used for and how it works. resumir / explicar brevemente resumer / presenter les grandes lignes kurz darstellen / in grundzugen beschreiben resume para que se usa el infrarrojo y como funciona. resume a quoi sert l'infrarouge et comment il fonctionne. stelle kurz dar, wofur infrarot benutzt wird und wie es funktioniert."},{"en":"suggest","unit":"Exam command words","ex":"Suggest somewhere that the green line might be for.","es":{"t":"sugerir / proponer","e":"Sugiere un lugar al que podría corresponder la línea verde.","u":"⚠ Palabra de examen. «Suggest» significa que no hay una única respuesta correcta: da una idea razonable con lo que sabes. No la dejes en blanco por miedo a equivocarte."},"fr":{"t":"proposer / suggérer","e":"Propose un endroit auquel la ligne verte pourrait correspondre.","u":"⚠ Mot d'examen. « Suggest » veut dire qu'il n'y a pas une seule bonne réponse : donne une idée raisonnable avec ce que tu sais. Ne laisse jamais la case vide."},"de":{"t":"vorschlagen","e":"Schlage einen Ort vor, zu dem die grüne Linie passen könnte.","u":"⚠ Prüfungswort. „Suggest“ heißt: Es gibt nicht nur eine richtige Antwort, also gib eine sinnvolle Idee mit dem, was du weißt. Lass die Frage nie leer."},"_k":"suggest exam command words suggest somewhere that the green line might be for. sugerir / proponer proposer / suggerer vorschlagen sugiere un lugar al que podria corresponder la linea verde. propose un endroit auquel la ligne verte pourrait correspondre. schlage einen ort vor, zu dem die grune linie passen konnte."}],"langs":["es","fr","de"],"units":["Celestial Bodies","Exam command words","Forces & Materials","Light & EM Spectrum"],"ui":{"es":{"ph":"Escribe una palabra — en español o en inglés","all":"Todos los temas","none":"No se ha encontrado nada.","sort_en":"Orden: inglés","sort_xx":"Orden: español","count":"términos"},"fr":{"ph":"Tape un mot — en français ou en anglais","all":"Tous les thèmes","none":"Aucun résultat.","sort_en":"Tri : anglais","sort_xx":"Tri : français","count":"termes"},"de":{"ph":"Gib ein Wort ein — auf Deutsch oder Englisch","all":"Alle Themen","none":"Nichts gefunden.","sort_en":"Sortierung: Englisch","sort_xx":"Sortierung: Deutsch","count":"Begriffe"}},"beta":{"es":"Esta página la ha escrito <strong>Alfred</strong>, el sistema de IA del Sr. Rawson, para ayudarte a estudiar en inglés. <strong>Es nueva, y Alfred todavía está aprendiendo tu idioma, así que algunas cosas estarán mal.</strong> Si una palabra te parece incorrecta, seguramente tengas razón: díselo al Sr. Rawson y la corregimos. Si falta una palabra que necesitas, o se te ocurre cómo mejorar esta página, díselo también. Cambia siempre que lo pidas.","fr":"Cette page a été écrite par <strong>Alfred</strong>, le système d'IA de M. Rawson, pour t'aider à étudier en anglais. <strong>Elle est toute nouvelle, et Alfred apprend encore ta langue : certaines choses seront donc fausses.</strong> Si un mot te semble incorrect, tu as sans const KEY = "vocab-lang";
const fold = s => (s||"").toString().toLowerCase()
  .normalize("NFD").replace(/[\u0300-\u036f]/g, "");

function pick() {
  const q = new URLSearchParams(location.search).get("lang");
  if (q && D.langs.includes(q)) { try { localStorage.setItem(KEY, q); } catch (e) {} return q; }
  let s = null; try { s = localStorage.getItem(KEY); } catch (e) {}
  if (s && D.langs.includes(s)) return s;
  return D.langs[0];
}
let L = pick();

function setLang(v) {
  L = v; try { localStorage.setItem(KEY, v); } catch (e) {}
  chrome(); render();
}

function chrome() {
  document.getElementById("langbar").innerHTML = D.langs.map(x =>
    `<button data-l="${x}" aria-pressed="${x === L}">${D.name[x]}</button>`).join("");
  document.querySelectorAll("#langbar button").forEach(b =>
    b.onclick = () => setLang(b.dataset.l));
  document.getElementById("beta").innerHTML = D.beta[L];
  const u = D.ui[L];
  document.getElementById("q").placeholder = u.ph;
  const sel = document.getElementById("unit"), keep = sel.value;
  sel.innerHTML = `<option value="">${u.all}</option>` +
    D.units.map(x => `<option>${x}</option>`).join("");
  sel.value = keep;
  const so = document.getElementById("sort"), ks = so.value;
  so.innerHTML = `<option value="en">${u.sort_en}</option><option value="xx">${u.sort_xx}</option>`;
  so.value = ks || "en";
}

function render() {
  const u = D.ui[L];
  const q = fold(document.getElementById("q").value.trim());
  const unit = document.getElementById("unit").value;
  const sort = document.getElementById("sort").value || "en";
  let rows = D.terms.filter(t => t[L]);
  if (unit) rows = rows.filter(t => t.unit === unit);
  if (q) rows = rows.filter(t => t._k.includes(q));
  rows.sort((a, b) => (sort === "xx" ? fold(a[L].t).localeCompare(fold(b[L].t))
                                     : fold(a.en).localeCompare(fold(b.en))));
  document.getElementById("n").textContent = rows.length + " " + u.count;
  document.getElementById("list").innerHTML = rows.length ? rows.map(t => {
    const w = t[L].u.indexOf("\u26a0") === 0 ? " warn" : "";
    return `<div class="row">
      <div><h3>${esc(t.en)}</h3><p class="xx">${esc(t[L].t)}</p>
        ${t.unit ? `<p class="unit">${esc(t.unit)}</p>` : ""}</div>
      <div>${t.ex ? `<p class="ex">${esc(t.ex)}</p>` : ""}
        <p class="ex tr">${esc(t[L].e)}</p>
        <p class="use${w}">${esc(t[L].u)}</p></div>
    </div>`;
  }).join("") : `<p class="n">${u.none}</p>`;
}

function esc(s) {
  return (s || "").replace(/[&<>"']/g, c =>
    ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"})[c]);
}

document.getElementById("q").addEventListener("input", render);
document.getElementById("unit").addEventListener("change", render);
document.getElementById("sort").addEventListener("change", render);
// A laptop is the only device these students may have in class (spec §2), so the
// keyboard is the fast path: "/" jumps to the box from anywhere on the page.
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement.id !== "q") {
    e.preventDefault(); document.getElementById("q").focus();
  }
});
chrome(); render();
</script>
