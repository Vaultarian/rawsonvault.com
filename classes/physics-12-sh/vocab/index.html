<script>
const D = {"terms":[{"en":"uncertainty","unit":"A · Space, time and motion","ex":"State the uncertainty in your measurement.","es":{"t":"la incertidumbre","e":"Indica la incertidumbre de tu medida.","u":"⚠ No es «duda». En física es un intervalo con número: 2,40 ± 0,05 s. En el IB se escribe con la misma precisión que la medida, y «error» es otra cosa: la diferencia con el valor real."},"fr":{"t":"l'incertitude","e":"Indiquez l'incertitude de votre mesure.","u":"⚠ Pas un doute : une fourchette chiffrée, 2,40 ± 0,05 s, écrite avec la même précision que la mesure. « error » existe aussi, mais désigne l'écart avec la vraie valeur, pas l'incertitude."},"de":{"t":"die Messunsicherheit","e":"Gib die Messunsicherheit deiner Messung an.","u":"⚠ Kein Zweifel, sondern ein Zahlenbereich: 2,40 ± 0,05 s, mit derselben Genauigkeit wie der Messwert. Auf Englisch einfach „uncertainty“, nie „insecurity“."},"_k":"uncertainty a · space, time and motion state the uncertainty in your measurement. la incertidumbre l'incertitude die messunsicherheit indica la incertidumbre de tu medida. indiquez l'incertitude de votre mesure. gib die messunsicherheit deiner messung an."},{"en":"displacement","unit":"A · Space, time and motion","ex":"The displacement is the change in position, not the distance travelled.","es":{"t":"el desplazamiento","e":"El desplazamiento es el cambio de posición, no la distancia recorrida.","u":"Es un vector: tiene módulo y dirección, y puede ser cero aunque hayas recorrido mucha distancia. «distance» es solo el número. En C.1 la misma palabra es la elongación de una oscilación."},"fr":{"t":"le déplacement","e":"Le déplacement est la variation de position, pas la distance parcourue.","u":"⚠ En anglais, « displacement » est un vecteur : il a un sens et peut être nul après un long trajet. « distance » n'est qu'un nombre. En C.1, le même mot désigne l'élongation d'une oscillation."},"de":{"t":"die Verschiebung","e":"Die Verschiebung ist die Änderung der Position, nicht die zurückgelegte Strecke.","u":"Ein Vektor mit Richtung, der null sein kann, obwohl du weit gelaufen bist. „distance“ ist nur die Weglänge. Bei Schwingungen (C.1) heißt „displacement“ die Auslenkung."},"_k":"displacement a · space, time and motion the displacement is the change in position, not the distance travelled. el desplazamiento le deplacement die verschiebung el desplazamiento es el cambio de posicion, no la distancia recorrida. le deplacement est la variation de position, pas la distance parcourue. die verschiebung ist die anderung der position, nicht die zuruckgelegte strecke."},{"en":"resultant force","unit":"A · Space, time and motion","ex":"Draw a free-body diagram and find the resultant force.","es":{"t":"la fuerza resultante","e":"Dibuja el diagrama de cuerpo libre y calcula la fuerza resultante.","u":"La suma vectorial de todas las fuerzas. En inglés también se dice «net force»; es lo mismo. Si vale cero, el cuerpo está en «equilibrium». «free-body diagram» = un solo cuerpo con todas sus fuerzas."},"fr":{"t":"la résultante des forces","e":"Tracez le diagramme des forces et déterminez la résultante.","u":"La somme vectorielle de toutes les forces. « net force » veut dire exactement la même chose. « free-body diagram » = le schéma d'un seul corps isolé avec toutes les forces qu'il subit."},"de":{"t":"die resultierende Kraft","e":"Zeichne das Kräftediagramm und bestimme die resultierende Kraft.","u":"Die Vektorsumme aller Kräfte, auf Deutsch auch „Gesamtkraft“. „net force“ heißt dasselbe. „free-body diagram“ = ein einzelner Körper mit allen Kräften, die auf ihn wirken."},"_k":"resultant force a · space, time and motion draw a free-body diagram and find the resultant force. la fuerza resultante la resultante des forces die resultierende kraft dibuja el diagrama de cuerpo libre y calcula la fuerza resultante. tracez le diagramme des forces et determinez la resultante. zeichne das kraftediagramm und bestimme die resultierende kraft."},{"en":"normal","unit":"A · Space, time and motion","ex":"The normal force acts perpendicular to the surface.","es":{"t":"normal (la fuerza normal)","e":"La fuerza normal actúa perpendicular a la superficie.","u":"⚠ No significa «corriente» ni «habitual». En física, normal = perpendicular. En óptica (C.3), «the normal» es la recta perpendicular a la superficie desde la que se miden los ángulos."},"fr":{"t":"normal (la force normale, la normale)","e":"La force normale agit perpendiculairement à la surface.","u":"⚠ Rien à voir avec « ordinaire ». En physique, normal = perpendiculaire. En optique (C.3), « the normal » est la droite perpendiculaire à la surface, à partir de laquelle on mesure les angles."},"de":{"t":"normal (die Normalkraft)","e":"Die Normalkraft wirkt senkrecht zur Oberfläche.","u":"⚠ Heißt hier nicht „gewöhnlich“, sondern senkrecht. In der Optik (C.3) ist „the normal“ das Lot – die Senkrechte auf der Oberfläche, von der aus du die Winkel misst."},"_k":"normal a · space, time and motion the normal force acts perpendicular to the surface. normal (la fuerza normal) normal (la force normale, la normale) normal (die normalkraft) la fuerza normal actua perpendicular a la superficie. la force normale agit perpendiculairement a la surface. die normalkraft wirkt senkrecht zur oberflache."},{"en":"work","unit":"A · Space, time and motion","ex":"Calculate the work done by the force.","es":{"t":"el trabajo","e":"Calcula el trabajo realizado por la fuerza.","u":"⚠ No es un empleo ni una tarea. work = fuerza × desplazamiento en la dirección de la fuerza (W = Fs cos θ), en julios. Se dice «work done», nunca «work made»."},"fr":{"t":"le travail","e":"Calculez le travail effectué par la force.","u":"⚠ Pas un emploi. work = force × déplacement dans la direction de la force (W = Fs cos θ), en joules. On dit « work done by / on », jamais « work made »."},"de":{"t":"die Arbeit","e":"Berechne die von der Kraft verrichtete Arbeit.","u":"⚠ Kein Job. work = Kraft × Weg in Kraftrichtung (W = Fs cos θ), in Joule. Auf Englisch „work done“, nicht „work made“."},"_k":"work a · space, time and motion calculate the work done by the force. el trabajo le travail die arbeit calcula el trabajo realizado por la fuerza. calculez le travail effectue par la force. berechne die von der kraft verrichtete arbeit."},{"en":"power","unit":"A · Space, time and motion","ex":"Determine the power developed by the motor.","es":{"t":"la potencia","e":"Determina la potencia desarrollada por el motor.","u":"⚠ No es «el poder». power = energía transferida por segundo (P = W/t = Fv), en vatios. «powerful» en física significa de gran potencia, no fuerte."},"fr":{"t":"la puissance","e":"Déterminez la puissance développée par le moteur.","u":"⚠ Pas « le pouvoir ». power = énergie transférée par seconde (P = W/t = Fv), en watts. Ne pas confondre avec « force » ni avec « energy »."},"de":{"t":"die Leistung","e":"Bestimme die vom Motor entwickelte Leistung.","u":"⚠ Nicht „Macht“ und nicht „Kraft“. power = übertragene Energie pro Sekunde (P = W/t = Fv), in Watt. Ein „powerful“ Motor hat eine hohe Leistung."},"_k":"power a · space, time and motion determine the power developed by the motor. la potencia la puissance die leistung determina la potencia desarrollada por el motor. determinez la puissance developpee par le moteur. bestimme die vom motor entwickelte leistung."},{"en":"momentum","unit":"A · Space, time and motion","ex":"Momentum is conserved in the collision.","es":{"t":"la cantidad de movimiento (el momento lineal)","e":"La cantidad de movimiento se conserva en la colisión.","u":"⚠ En inglés no es «moment» (eso es el momento de una fuerza). momentum = p = mv, un vector. El plural es «momenta», aunque casi nunca lo verás."},"fr":{"t":"la quantité de mouvement","e":"La quantité de mouvement est conservée lors de la collision.","u":"⚠ Ne pas confondre avec « moment » (moment d'une force) ni avec « impulse ». momentum = p = mv, un vecteur. Beaucoup de francophones disent « impulsion » ; en anglais ce serait un contresens."},"de":{"t":"der Impuls","e":"Der Impuls bleibt beim Stoß erhalten.","u":"⚠ Falscher Freund in beide Richtungen: der deutsche Impuls (p = mv) heißt auf Englisch „momentum“, während das englische „impulse“ der Kraftstoß FΔt ist. Im Examen nie verwechseln."},"_k":"momentum a · space, time and motion momentum is conserved in the collision. la cantidad de movimiento (el momento lineal) la quantite de mouvement der impuls la cantidad de movimiento se conserva en la colision. la quantite de mouvement est conservee lors de la collision. der impuls bleibt beim stoß erhalten."},{"en":"impulse","unit":"A · Space, time and motion","ex":"The impulse equals the change in momentum.","es":{"t":"el impulso","e":"El impulso es igual a la variación de la cantidad de movimiento.","u":"⚠ No es «un impulso» de ganas de hacer algo. impulse = J = FΔt, fuerza media × tiempo de contacto, y es igual a Δp. No lo confundas con «momentum»."},"fr":{"t":"l'impulsion","e":"L'impulsion est égale à la variation de la quantité de mouvement.","u":"⚠ En anglais, « impulse » = J = FΔt, force moyenne × durée du contact, égal à Δp. Ce n'est PAS la quantité de mouvement, même si en français « impulsion » sert parfois pour les deux."},"de":{"t":"der Kraftstoß","e":"Der Kraftstoß ist gleich der Impulsänderung.","u":"⚠ Das englische „impulse“ ist NICHT der deutsche Impuls. impulse = J = FΔt = Δp, der Kraftstoß. Der deutsche Impuls (mv) heißt „momentum“."},"_k":"impulse a · space, time and motion the impulse equals the change in momentum. el impulso l'impulsion der kraftstoß el impulso es igual a la variacion de la cantidad de movimiento. l'impulsion est egale a la variation de la quantite de mouvement. der kraftstoß ist gleich der impulsanderung."},{"en":"tension","unit":"A · Space, time and motion","ex":"The tension in the string provides the centripetal force.","es":{"t":"la tensión (de una cuerda)","e":"La tensión de la cuerda proporciona la fuerza centrípeta.","u":"⚠ En mecánica, tension es la fuerza con la que tira una cuerda o un cable, en newtons. No la uses para el voltaje: en inglés eso es «potential difference» o «voltage», nunca «tension»."},"fr":{"t":"la tension (d'un fil)","e":"La tension du fil fournit la force centripète.","u":"⚠ Gros piège. En anglais, « tension » n'est QUE la force dans un fil ou un câble, en newtons. La tension électrique se dit « potential difference » ou « voltage », jamais « tension »."},"de":{"t":"die Zugkraft (die Seilkraft)","e":"Die Zugkraft im Faden liefert die Zentripetalkraft.","u":"⚠ Nicht „Spannung“! Das englische „tension“ ist nur die Kraft in einem Seil oder Faden, in Newton. Die elektrische Spannung heißt „potential difference“ oder „voltage“."},"_k":"tension a · space, time and motion the tension in the string provides the centripetal force. la tension (de una cuerda) la tension (d'un fil) die zugkraft (die seilkraft) la tension de la cuerda proporciona la fuerza centripeta. la tension du fil fournit la force centripete. die zugkraft im faden liefert die zentripetalkraft."},{"en":"torque","unit":"A · Space, time and motion","ex":"Calculate the torque of the force about the axis.","es":{"t":"el momento de fuerza (el par)","e":"Calcula el momento de la fuerza respecto al eje.","u":"El efecto de giro de una fuerza: τ = Fr sin θ, en N m. El DP dice «torque»; en el GCSE se decía «moment», y significa lo mismo. No es «un momento» de tiempo."},"fr":{"t":"le moment d'une force (le couple)","e":"Calculez le moment de la force par rapport à l'axe.","u":"⚠ « torque » = le moment d'une force, τ = Fr sin θ, en N m. En anglais, « couple » existe aussi, mais désigne seulement deux forces égales et opposées ; le DP dit « torque »."},"de":{"t":"das Drehmoment","e":"Berechne das Drehmoment der Kraft bezüglich der Achse.","u":"Die Drehwirkung einer Kraft: τ = Fr sin θ, in N m. Das IB sagt „torque“; in GCSE-Büchern steht oft „moment“, gemeint ist dasselbe. Kein Zeitmoment."},"_k":"torque a · space, time and motion calculate the torque of the force about the axis. el momento de fuerza (el par) le moment d'une force (le couple) das drehmoment calcula el momento de la fuerza respecto al eje. calculez le moment de la force par rapport a l'axe. berechne das drehmoment der kraft bezuglich der achse."},{"en":"efficiency","unit":"A · Space, time and motion","ex":"The efficiency of the engine is 35%.","es":{"t":"el rendimiento (la eficiencia)","e":"El rendimiento del motor es del 35 %.","u":"energía útil ÷ energía aportada, sin unidades y siempre menor que 1. En física en español se dice más «rendimiento»; en inglés siempre «efficiency». El símbolo η también se usa para la viscosidad en A.2: mira el contexto."},"fr":{"t":"le rendement","e":"Le rendement du moteur est de 35 %.","u":"⚠ Pas « efficacité ». En physique, efficiency = énergie utile ÷ énergie fournie, sans unité, toujours inférieur à 1. Le symbole η (êta) sert aussi pour la viscosité en A.2 : vérifie le contexte."},"de":{"t":"der Wirkungsgrad","e":"Der Wirkungsgrad des Motors beträgt 35 %.","u":"⚠ Nicht „Effizienz“. efficiency = Nutzenergie ÷ zugeführte Energie, einheitenlos, immer kleiner als 1. Das Symbol η (eta) steht in A.2 auch für die Viskosität – auf den Kontext achten."},"_k":"efficiency a · space, time and motion the efficiency of the engine is 35%. el rendimiento (la eficiencia) le rendement der wirkungsgrad el rendimiento del motor es del 35 %. le rendement du moteur est de 35 %. der wirkungsgrad des motors betragt 35 %."},{"en":"internal energy","unit":"B · The particulate nature of matter","ex":"The internal energy of an ideal gas depends only on its temperature.","es":{"t":"la energía interna","e":"La energía interna de un gas ideal depende solo de su temperatura.","u":"Suma de la energía cinética aleatoria de las moléculas y de su energía potencial intermolecular. No es «heat»: heat es energía en tránsito; internal energy es lo que está almacenado."},"fr":{"t":"l'énergie interne","e":"L'énergie interne d'un gaz parfait ne dépend que de sa température.","u":"Somme de l'énergie cinétique aléatoire des molécules et de leur énergie potentielle intermoléculaire. Ce n'est pas « heat » : heat est l'énergie en transit, internal energy est ce qui est stocké."},"de":{"t":"die innere Energie","e":"Die innere Energie eines idealen Gases hängt nur von seiner Temperatur ab.","u":"Summe der ungeordneten kinetischen Energie der Teilchen und ihrer potenziellen Energie zueinander. Nicht mit „heat“ verwechseln: heat ist Energie im Übergang, internal energy ist gespeichert."},"_k":"internal energy b · the particulate nature of matter the internal energy of an ideal gas depends only on its temperature. la energia interna l'energie interne die innere energie la energia interna de un gas ideal depende solo de su temperatura. l'energie interne d'un gaz parfait ne depend que de sa temperature. die innere energie eines idealen gases hangt nur von seiner temperatur ab."},{"en":"specific heat capacity","unit":"B · The particulate nature of matter","ex":"Water has a high specific heat capacity.","es":{"t":"el calor específico","e":"El agua tiene un calor específico alto.","u":"⚠ Aquí «specific» significa «por kilogramo», no «concreto». Energía necesaria para subir 1 K la temperatura de 1 kg: c, en J kg⁻¹ K⁻¹. Sin «specific», «heat capacity» es la del objeto entero, en J K⁻¹."},"fr":{"t":"la capacité thermique massique","e":"L'eau a une capacité thermique massique élevée.","u":"⚠ « specific » veut dire ici « par kilogramme », pas « particulier ». c en J kg⁻¹ K⁻¹. Sans « specific », « heat capacity » désigne l'objet entier, en J K⁻¹."},"de":{"t":"die spezifische Wärmekapazität","e":"Wasser hat eine hohe spezifische Wärmekapazität.","u":"Energie, um 1 kg um 1 K zu erwärmen: c in J kg⁻¹ K⁻¹. „specific“ heißt hier „pro Kilogramm“. Ohne „specific“ meint „heat capacity“ den ganzen Körper, in J K⁻¹."},"_k":"specific heat capacity b · the particulate nature of matter water has a high specific heat capacity. el calor especifico la capacite thermique massique die spezifische warmekapazitat el agua tiene un calor especifico alto. l'eau a une capacite thermique massique elevee. wasser hat eine hohe spezifische warmekapazitat."},{"en":"latent heat","unit":"B · The particulate nature of matter","ex":"The specific latent heat of vaporization of water is 2.26 MJ/kg.","es":{"t":"el calor latente","e":"El calor latente específico de vaporización del agua es de 2,26 MJ/kg.","u":"⚠ «latent heat of fusion» es el calor de fundirse, no la fusión nuclear de E.5. Energía para cambiar de estado sin cambiar la temperatura: Q = mL. «latent» = oculto, porque el termómetro no lo ve."},"fr":{"t":"la chaleur latente","e":"La chaleur latente massique de vaporisation de l'eau vaut 2,26 MJ/kg.","u":"⚠ « latent heat of fusion » = chaleur de fonte, pas la fusion nucléaire de E.5. Énergie pour changer d'état sans changer de température : Q = mL. « latent » = caché, car le thermomètre ne la voit pas."},"de":{"t":"die latente Wärme (die Umwandlungswärme)","e":"Die spezifische Verdampfungswärme von Wasser beträgt 2,26 MJ/kg.","u":"⚠ „latent heat of fusion“ ist die Schmelzwärme, nicht die Kernfusion aus E.5. Energie für einen Phasenwechsel ohne Temperaturänderung: Q = mL. „latent“ = verborgen, weil das Thermometer nichts anzeigt."},"_k":"latent heat b · the particulate nature of matter the specific latent heat of vaporization of water is 2.26 mj/kg. el calor latente la chaleur latente die latente warme (die umwandlungswarme) el calor latente especifico de vaporizacion del agua es de 2,26 mj/kg. la chaleur latente massique de vaporisation de l'eau vaut 2,26 mj/kg. die spezifische verdampfungswarme von wasser betragt 2,26 mj/kg."},{"en":"ideal gas","unit":"B · The particulate nature of matter","ex":"Assume the gas behaves as an ideal gas.","es":{"t":"el gas ideal","e":"Supón que el gas se comporta como un gas ideal.","u":"Un modelo: moléculas puntuales, sin fuerzas entre ellas, choques elásticos. Aproxima bien un gas real a baja presión y alta temperatura. «ideal» = del modelo, no «perfecto para ti»."},"fr":{"t":"le gaz parfait","e":"Supposez que le gaz se comporte comme un gaz parfait.","u":"⚠ En français on dit « parfait », en anglais toujours « ideal », jamais « perfect gas ». C'est un modèle : molécules ponctuelles, sans interactions, chocs élastiques."},"de":{"t":"das ideale Gas","e":"Nimm an, das Gas verhält sich wie ein ideales Gas.","u":"Ein Modell: punktförmige Teilchen, keine Kräfte zwischen ihnen, elastische Stöße. Gilt für reale Gase bei niedrigem Druck und hoher Temperatur. Auf Englisch „ideal gas“, nie „perfect gas“."},"_k":"ideal gas b · the particulate nature of matter assume the gas behaves as an ideal gas. el gas ideal le gaz parfait das ideale gas supon que el gas se comporta como un gas ideal. supposez que le gaz se comporte comme un gaz parfait. nimm an, das gas verhalt sich wie ein ideales gas."},{"en":"black body","unit":"B · The particulate nature of matter","ex":"A black body absorbs all radiation incident on it.","es":{"t":"el cuerpo negro","e":"Un cuerpo negro absorbe toda la radiación que incide sobre él.","u":"Un emisor y absorbente perfecto; no tiene por qué verse negro: el Sol se modela como cuerpo negro. «incident» significa que llega a la superficie, no un incidente."},"fr":{"t":"le corps noir","e":"Un corps noir absorbe tout le rayonnement incident.","u":"Un émetteur et absorbeur parfait, pas forcément noir à l'œil : le Soleil est modélisé comme un corps noir. « incident » = qui arrive sur la surface, pas un incident."},"de":{"t":"der schwarze Körper","e":"Ein schwarzer Körper absorbiert die gesamte auftreffende Strahlung.","u":"Ein idealer Strahler und Absorber, der nicht schwarz aussehen muss: die Sonne wird als schwarzer Körper modelliert. „incident radiation“ = auftreffende Strahlung, kein Vorfall."},"_k":"black body b · the particulate nature of matter a black body absorbs all radiation incident on it. el cuerpo negro le corps noir der schwarze korper un cuerpo negro absorbe toda la radiacion que incide sobre el. un corps noir absorbe tout le rayonnement incident. ein schwarzer korper absorbiert die gesamte auftreffende strahlung."},{"en":"emf","unit":"B · The particulate nature of matter","ex":"The cell has an emf of 1.5 V and an internal resistance of 0.5 Ω.","es":{"t":"la fuerza electromotriz (fem)","e":"La pila tiene una fem de 1,5 V y una resistencia interna de 0,5 Ω.","u":"⚠ A pesar del nombre, no es una fuerza: es energía por unidad de carga, en voltios. Es el voltaje de la pila sin nada conectado. En inglés se pronuncia letra a letra: e-m-f."},"fr":{"t":"la force électromotrice (f.é.m.)","e":"La pile a une f.é.m. de 1,5 V et une résistance interne de 0,5 Ω.","u":"⚠ Malgré le nom, ce n'est pas une force : c'est une énergie par unité de charge, en volts. C'est la tension de la pile à vide. En anglais on l'épelle : e-m-f."},"de":{"t":"die elektromotorische Kraft (EMK)","e":"Die Zelle hat eine EMK von 1,5 V und einen Innenwiderstand von 0,5 Ω.","u":"⚠ Trotz des Namens keine Kraft: Energie pro Ladung, in Volt – die Quellenspannung ohne Last. Auf Englisch wird „emf“ buchstabiert: i-em-ef."},"_k":"emf b · the particulate nature of matter the cell has an emf of 1.5 v and an internal resistance of 0.5 ω. la fuerza electromotriz (fem) la force electromotrice (f.e.m.) die elektromotorische kraft (emk) la pila tiene una fem de 1,5 v y una resistencia interna de 0,5 ω. la pile a une f.e.m. de 1,5 v et une resistance interne de 0,5 ω. die zelle hat eine emk von 1,5 v und einen innenwiderstand von 0,5 ω."},{"en":"potential difference","unit":"B · The particulate nature of matter","ex":"Measure the potential difference across the resistor.","es":{"t":"la diferencia de potencial (el voltaje)","e":"Mide la diferencia de potencial entre los extremos de la resistencia.","u":"⚠ En inglés no se dice «tension» para el voltaje: se dice «potential difference» (p.d.) o «voltage». Y se mide «across» un componente, es decir, entre sus dos extremos."},"fr":{"t":"la tension (la différence de potentiel)","e":"Mesurez la tension aux bornes de la résistance.","u":"⚠ Ne traduis jamais « tension » par « tension » : en anglais, la tension électrique est « potential difference » (p.d.) ou « voltage ». « across the resistor » = aux bornes de la résistance."},"de":{"t":"die Spannung (die Potentialdifferenz)","e":"Miss die Spannung am Widerstand.","u":"⚠ Nie „tension“ sagen – das ist die Seilkraft. Die elektrische Spannung heißt „potential difference“ (p.d.) oder „voltage“. „across the resistor“ = zwischen den beiden Enden des Widerstands."},"_k":"potential difference b · the particulate nature of matter measure the potential difference across the resistor. la diferencia de potencial (el voltaje) la tension (la difference de potentiel) die spannung (die potentialdifferenz) mide la diferencia de potencial entre los extremos de la resistencia. mesurez la tension aux bornes de la resistance. miss die spannung am widerstand."},{"en":"resistivity","unit":"B · The particulate nature of matter","ex":"Resistivity is a property of the material, not of the wire.","es":{"t":"la resistividad","e":"La resistividad es una propiedad del material, no del cable.","u":"ρ = RA/L, en Ω m. No la confundas con «resistance» (R, en Ω): la resistencia depende de la longitud y el grosor; la resistividad, solo del material."},"fr":{"t":"la résistivité","e":"La résistivité est une propriété du matériau, pas du fil.","u":"ρ = RA/L, en Ω m. À distinguer de « resistance » (R, en Ω) : la résistance dépend de la longueur et de la section, la résistivité seulement du matériau."},"de":{"t":"der spezifische Widerstand","e":"Der spezifische Widerstand ist eine Eigenschaft des Materials, nicht des Drahtes.","u":"⚠ Auf Englisch ein eigenes Wort, „resistivity“ – nicht „specific resistance“. ρ = RA/L, in Ω m. „resistance“ (R, in Ω) hängt von Länge und Querschnitt ab; resistivity nur vom Material."},"_k":"resistivity b · the particulate nature of matter resistivity is a property of the material, not of the wire. la resistividad la resistivite der spezifische widerstand la resistividad es una propiedad del material, no del cable. la resistivite est une propriete du materiau, pas du fil. der spezifische widerstand ist eine eigenschaft des materials, nicht des drahtes."},{"en":"simple harmonic motion","unit":"C · Wave behaviour","ex":"State the conditions for simple harmonic motion.","es":{"t":"el movimiento armónico simple (MAS)","e":"Enuncia las condiciones del movimiento armónico simple.","u":"⚠ En inglés se abrevia SHM, no MAS. Condiciones: la aceleración es proporcional al desplazamiento y de sentido contrario (a = −ω²x). «harmonic» aquí no tiene nada que ver con la música."},"fr":{"t":"le mouvement harmonique simple","e":"Énoncez les conditions du mouvement harmonique simple.","u":"Abréviation anglaise : SHM. Conditions : accélération proportionnelle à l'élongation et de sens opposé (a = −ω²x). L'élongation se dit « displacement » en anglais."},"de":{"t":"die harmonische Schwingung","e":"Nenne die Bedingungen für eine harmonische Schwingung.","u":"Auf Englisch „simple harmonic motion“, abgekürzt SHM. Bedingung: Beschleunigung proportional zur Auslenkung und entgegengesetzt (a = −ω²x). Die Auslenkung heißt „displacement“."},"_k":"simple harmonic motion c · wave behaviour state the conditions for simple harmonic motion. el movimiento armonico simple (mas) le mouvement harmonique simple die harmonische schwingung enuncia las condiciones del movimiento armonico simple. enoncez les conditions du mouvement harmonique simple. nenne die bedingungen fur eine harmonische schwingung."},{"en":"period","unit":"C · Wave behaviour","ex":"The period of the pendulum is 2.0 s.","es":{"t":"el período","e":"El período del péndulo es de 2,0 s.","u":"⚠ No es una época ni una clase del horario. period = tiempo de una oscilación completa, T, en segundos; T = 1/f. En inglés también se dice «time period»."},"fr":{"t":"la période","e":"La période du pendule est de 2,0 s.","u":"⚠ Pas une époque. period = durée d'une oscillation complète, T, en secondes ; T = 1/f. En anglais on dit aussi « time period »."},"de":{"t":"die Periodendauer (die Schwingungsdauer)","e":"Die Periodendauer des Pendels beträgt 2,0 s.","u":"⚠ Auf Englisch heißt es nur „period“ oder „time period“, nicht „period duration“. T = Zeit für eine volle Schwingung, in Sekunden; T = 1/f."},"_k":"period c · wave behaviour the period of the pendulum is 2.0 s. el periodo la periode die periodendauer (die schwingungsdauer) el periodo del pendulo es de 2,0 s. la periode du pendule est de 2,0 s. die periodendauer des pendels betragt 2,0 s."},{"en":"phase","unit":"C · Wave behaviour","ex":"The two waves are in phase.","es":{"t":"la fase","e":"Las dos ondas están en fase.","u":"⚠ No es una etapa. phase = en qué punto de su ciclo está una oscilación. «in phase» = coinciden; «out of phase» o «in antiphase» = desfasadas media longitud de onda. Pero «phase change» en B.1 es un cambio de estado."},"fr":{"t":"la phase","e":"Les deux ondes sont en phase.","u":"⚠ Pas une étape. phase = position dans le cycle d'une oscillation. « in phase » = synchronisées ; « out of phase » / « in antiphase » = décalées d'une demi-période. Mais « phase change » en B.1 = changement d'état."},"de":{"t":"die Phase","e":"Die beiden Wellen sind in Phase.","u":"⚠ Kein Abschnitt. phase = Stelle im Schwingungszyklus. „in phase“ = gleichphasig; „out of phase“ / „in antiphase“ = um eine halbe Periode versetzt. „phase change“ in B.1 ist dagegen ein Wechsel des Aggregatzustands."},"_k":"phase c · wave behaviour the two waves are in phase. la fase la phase die phase las dos ondas estan en fase. les deux ondes sont en phase. die beiden wellen sind in phase."},{"en":"refraction","unit":"C · Wave behaviour","ex":"Refraction occurs when the wave changes speed at the boundary.","es":{"t":"la refracción","e":"La refracción ocurre cuando la onda cambia de velocidad en la frontera entre dos medios.","u":"Cambio de dirección al cambiar de medio, por el cambio de velocidad. No la confundas con «reflection» (rebota) ni con «diffraction» (se abre al pasar por una rendija). «boundary» = la superficie entre dos medios."},"fr":{"t":"la réfraction","e":"La réfraction se produit quand l'onde change de vitesse à l'interface entre deux milieux.","u":"Changement de direction au changement de milieu, dû au changement de vitesse. Ne pas confondre avec « reflection » (rebond) ni « diffraction » (étalement derrière une fente). « boundary » = l'interface entre deux milieux."},"de":{"t":"die Brechung","e":"Brechung tritt auf, wenn die Welle an der Grenzfläche ihre Geschwindigkeit ändert.","u":"⚠ Auf Englisch „refraction“ – nicht mit „reflection“ (Reflexion) oder „diffraction“ (Beugung) verwechseln, die Wörter sehen sich ähnlich. „boundary“ = die Grenzfläche zwischen zwei Medien."},"_k":"refraction c · wave behaviour refraction occurs when the wave changes speed at the boundary. la refraccion la refraction die brechung la refraccion ocurre cuando la onda cambia de velocidad en la frontera entre dos medios. la refraction se produit quand l'onde change de vitesse a l'interface entre deux milieux. brechung tritt auf, wenn die welle an der grenzflache ihre geschwindigkeit andert."},{"en":"standing wave","unit":"C · Wave behaviour","ex":"A standing wave forms on the string.","es":{"t":"la onda estacionaria","e":"Se forma una onda estacionaria en la cuerda.","u":"⚠ En inglés es «standing wave», no «stationary wave» (existe, pero el IB no lo usa). Los nodos («nodes») no se mueven; los antinodos («antinodes») oscilan al máximo. El modo más bajo es el «first harmonic»: en el DP no se dice «fundamental»."},"fr":{"t":"l'onde stationnaire","e":"Une onde stationnaire se forme sur la corde.","u":"⚠ En anglais « standing wave », pas « stationary wave ». Nœuds = « nodes », ventres = « antinodes ». Le mode le plus bas s'appelle « first harmonic » : le DP n'emploie pas « fundamental »."},"de":{"t":"die stehende Welle","e":"Auf der Saite bildet sich eine stehende Welle.","u":"Knoten = „nodes“, Bäuche = „antinodes“. Die tiefste Schwingungsform heißt im DP „first harmonic“ – die Wörter „fundamental“ und „overtone“ werden im Kurs nicht verwendet."},"_k":"standing wave c · wave behaviour a standing wave forms on the string. la onda estacionaria l'onde stationnaire die stehende welle se forma una onda estacionaria en la cuerda. une onde stationnaire se forme sur la corde. auf der saite bildet sich eine stehende welle."},{"en":"damping","unit":"C · Wave behaviour","ex":"Heavy damping reduces the amplitude at resonance.","es":{"t":"la amortiguación","e":"Una amortiguación fuerte reduce la amplitud en la resonancia.","u":"Pérdida de energía de una oscilación, normalmente por rozamiento. Tres grados: «light», «critical», «heavy». «critical damping» = vuelve al equilibrio lo más rápido posible sin oscilar."},"fr":{"t":"l'amortissement","e":"Un amortissement fort réduit l'amplitude à la résonance.","u":"⚠ Rien à voir avec un prêt. damping = perte d'énergie d'une oscillation, souvent par frottement. Trois degrés : « light », « critical », « heavy ». « critical damping » = retour à l'équilibre le plus vite possible sans osciller."},"de":{"t":"die Dämpfung","e":"Starke Dämpfung verringert die Amplitude bei Resonanz.","u":"Energieverlust einer Schwingung, meist durch Reibung. Drei Stufen: „light“, „critical“, „heavy“. „critical damping“ = schnellstmögliche Rückkehr in die Ruhelage ohne Überschwingen."},"_k":"damping c · wave behaviour heavy damping reduces the amplitude at resonance. la amortiguacion l'amortissement die dampfung una amortiguacion fuerte reduce la amplitud en la resonancia. un amortissement fort reduit l'amplitude a la resonance. starke dampfung verringert die amplitude bei resonanz."},{"en":"coherent","unit":"C · Wave behaviour","ex":"Interference requires two coherent sources.","es":{"t":"coherente","e":"La interferencia requiere dos fuentes coherentes.","u":"⚠ No significa «lógico». Dos fuentes son coherent si tienen la misma frecuencia y una diferencia de fase constante. Sin eso no hay un patrón de interferencia estable."},"fr":{"t":"cohérent","e":"L'interférence nécessite deux sources cohérentes.","u":"⚠ Pas « logique ». Deux sources sont coherent si elles ont la même fréquence et un déphasage constant. Sans cela, pas de figure d'interférence stable."},"de":{"t":"kohärent","e":"Interferenz erfordert zwei kohärente Quellen.","u":"⚠ Heißt hier nicht „schlüssig“. Zwei Quellen sind coherent, wenn sie dieselbe Frequenz und eine konstante Phasendifferenz haben. Sonst gibt es kein stabiles Interferenzmuster."},"_k":"coherent c · wave behaviour interference requires two coherent sources. coherente coherent koharent la interferencia requiere dos fuentes coherentes. l'interference necessite deux sources coherentes. interferenz erfordert zwei koharente quellen."},{"en":"fringe","unit":"C · Wave behaviour","ex":"Calculate the fringe separation on the screen.","es":{"t":"la franja (de interferencia)","e":"Calcula la separación entre franjas en la pantalla.","u":"⚠ No es el flequillo ni el borde. Las fringes son las bandas claras y oscuras del patrón de interferencia: «bright fringe», «dark fringe». s = λD/d es la distancia entre dos consecutivas."},"fr":{"t":"la frange (d'interférence)","e":"Calculez l'interfrange sur l'écran.","u":"⚠ Pas la frange des cheveux. Les fringes sont les bandes claires et sombres de la figure d'interférence : « bright fringe », « dark fringe ». « fringe separation » = l'interfrange, s = λD/d."},"de":{"t":"der Interferenzstreifen","e":"Berechne den Streifenabstand auf dem Schirm.","u":"⚠ Kein Rand und keine Haarfransen. fringes sind die hellen und dunklen Streifen des Interferenzmusters: „bright fringe“, „dark fringe“. „fringe separation“ = Streifenabstand s = λD/d."},"_k":"fringe c · wave behaviour calculate the fringe separation on the screen. la franja (de interferencia) la frange (d'interference) der interferenzstreifen calcula la separacion entre franjas en la pantalla. calculez l'interfrange sur l'ecran. berechne den streifenabstand auf dem schirm."},{"en":"field","unit":"D · Fields","ex":"A mass placed in a gravitational field experiences a force.","es":{"t":"el campo","e":"Una masa situada en un campo gravitatorio experimenta una fuerza.","u":"⚠ No es el campo de fútbol ni el campo de cultivo. field = región del espacio donde una masa, una carga o un imán experimenta una fuerza. Se dibuja con «field lines»."},"fr":{"t":"le champ","e":"Une masse placée dans un champ gravitationnel subit une force.","u":"⚠ Pas un champ de blé. field = région de l'espace où une masse, une charge ou un aimant subit une force. On le représente par des « field lines », les lignes de champ."},"de":{"t":"das Feld","e":"Eine Masse in einem Gravitationsfeld erfährt eine Kraft.","u":"⚠ Kein Acker und kein Spielfeld. field = Raumbereich, in dem eine Masse, eine Ladung oder ein Magnet eine Kraft erfährt. Dargestellt mit „field lines“, den Feldlinien."},"_k":"field d · fields a mass placed in a gravitational field experiences a force. el campo le champ das feld una masa situada en un campo gravitatorio experimenta una fuerza. une masse placee dans un champ gravitationnel subit une force. eine masse in einem gravitationsfeld erfahrt eine kraft."},{"en":"field strength","unit":"D · Fields","ex":"Gravitational field strength is the force per unit mass.","es":{"t":"la intensidad del campo","e":"La intensidad del campo gravitatorio es la fuerza por unidad de masa.","u":"⚠ En inglés es «strength», no «intensity»: g = F/m (N kg⁻¹) o E = F/q (N C⁻¹). Es un vector. Cuanto más juntas están las «field lines», mayor es la field strength."},"fr":{"t":"l'intensité du champ","e":"L'intensité du champ gravitationnel est la force par unité de masse.","u":"⚠ En anglais on dit « strength », pas « intensity » ni « force du champ » : g = F/m (N kg⁻¹) ou E = F/q (N C⁻¹). C'est un vecteur ; plus les lignes de champ sont serrées, plus elle est grande."},"de":{"t":"die Feldstärke","e":"Die Gravitationsfeldstärke ist die Kraft pro Masse.","u":"g = F/m (N kg⁻¹) oder E = F/q (N C⁻¹), ein Vektor. Je dichter die „field lines“, desto größer die field strength. „strength“ meint hier den Betrag, nicht Stärke im Sinne von Muskeln."},"_k":"field strength d · fields gravitational field strength is the force per unit mass. la intensidad del campo l'intensite du champ die feldstarke la intensidad del campo gravitatorio es la fuerza por unidad de masa. l'intensite du champ gravitationnel est la force par unite de masse. die gravitationsfeldstarke ist die kraft pro masse."},{"en":"potential","unit":"D · Fields","ex":"Gravitational potential is defined as zero at infinity.","es":{"t":"el potencial","e":"El potencial gravitatorio se define como cero en el infinito.","u":"⚠ No es «tener potencial». potential = trabajo por unidad de masa (o de carga) para traer un cuerpo desde el infinito. Es escalar y, para la gravedad, siempre negativo. «potential difference» es la diferencia entre dos puntos."},"fr":{"t":"le potentiel","e":"Le potentiel gravitationnel est nul à l'infini par définition.","u":"⚠ Pas « avoir du potentiel ». potential = travail par unité de masse (ou de charge) pour amener un corps depuis l'infini. Un scalaire, toujours négatif pour la gravitation. « potential difference » = différence entre deux points."},"de":{"t":"das Potential","e":"Das Gravitationspotential ist im Unendlichen per Definition null.","u":"⚠ Nicht „Potenzial haben“. potential = Arbeit pro Masse (oder Ladung), um einen Körper aus dem Unendlichen heranzuholen. Ein Skalar, bei Gravitation immer negativ. „potential difference“ = Unterschied zwischen zwei Punkten."},"_k":"potential d · fields gravitational potential is defined as zero at infinity. el potencial le potentiel das potential el potencial gravitatorio se define como cero en el infinito. le potentiel gravitationnel est nul a l'infini par definition. das gravitationspotential ist im unendlichen per definition null."},{"en":"charge","unit":"D · Fields","ex":"The force between two point charges obeys Coulomb's law.","es":{"t":"la carga (eléctrica)","e":"La fuerza entre dos cargas puntuales obedece la ley de Coulomb.","u":"⚠ No es un peso ni una mercancía. charge = propiedad eléctrica, q, en culombios (C). «charged» = con carga; «point charge» = carga puntual, sin tamaño. Como verbo, «to charge» = cargar (una batería)."},"fr":{"t":"la charge (électrique)","e":"La force entre deux charges ponctuelles obéit à la loi de Coulomb.","u":"⚠ Pas un fardeau ni des frais. charge = propriété électrique, q, en coulombs (C). « charged » = chargé ; « point charge » = charge ponctuelle. « to charge » = charger (une batterie)."},"de":{"t":"die Ladung (elektrische)","e":"Die Kraft zwischen zwei Punktladungen folgt dem Coulomb-Gesetz.","u":"⚠ Keine Fracht. charge = elektrische Ladung, q, in Coulomb (C). „charged“ = geladen; „point charge“ = Punktladung. Als Verb: „to charge“ = aufladen."},"_k":"charge d · fields the force between two point charges obeys coulomb's law. la carga (electrica) la charge (electrique) die ladung (elektrische) la fuerza entre dos cargas puntuales obedece la ley de coulomb. la force entre deux charges ponctuelles obeit a la loi de coulomb. die kraft zwischen zwei punktladungen folgt dem coulomb-gesetz."},{"en":"escape speed","unit":"D · Fields","ex":"Calculate the escape speed from the surface of the planet.","es":{"t":"la velocidad de escape","e":"Calcula la velocidad de escape desde la superficie del planeta.","u":"v = √(2GM/r): la velocidad mínima para alejarse hasta el infinito sin propulsión. El IB dice «speed» y no «velocity» porque solo importa el módulo, no la dirección."},"fr":{"t":"la vitesse de libération","e":"Calculez la vitesse de libération à la surface de la planète.","u":"⚠ En anglais « escape speed », pas « liberation speed ». v = √(2GM/r) : vitesse minimale pour s'éloigner à l'infini sans propulsion. « speed » et non « velocity », car seule la valeur compte."},"de":{"t":"die Fluchtgeschwindigkeit","e":"Berechne die Fluchtgeschwindigkeit an der Oberfläche des Planeten.","u":"v = √(2GM/r): die Mindestgeschwindigkeit, um ohne Antrieb ins Unendliche zu gelangen. Das IB sagt „speed“, nicht „velocity“, weil nur der Betrag zählt."},"_k":"escape speed d · fields calculate the escape speed from the surface of the planet. la velocidad de escape la vitesse de liberation die fluchtgeschwindigkeit calcula la velocidad de escape desde la superficie del planeta. calculez la vitesse de liberation a la surface de la planete. berechne die fluchtgeschwindigkeit an der oberflache des planeten."},{"en":"conductor","unit":"D · Fields","ex":"A current-carrying conductor in a magnetic field experiences a force.","es":{"t":"el conductor","e":"Un conductor por el que circula corriente experimenta una fuerza en un campo magnético.","u":"⚠ No es quien conduce el coche. conductor = material por el que fluyen las cargas, como un cable. Lo contrario es «insulator» (aislante). «current-carrying» = por el que pasa corriente."},"fr":{"t":"le conducteur","e":"Un conducteur parcouru par un courant subit une force dans un champ magnétique.","u":"⚠ Pas le chauffeur. conductor = matériau dans lequel les charges circulent, un fil par exemple. Le contraire est « insulator » (isolant). « current-carrying » = parcouru par un courant."},"de":{"t":"der Leiter","e":"Ein stromdurchflossener Leiter erfährt im Magnetfeld eine Kraft.","u":"⚠ Auf Englisch „conductor“ – kein Dirigent und keine Leiter zum Klettern. Ein Material, in dem Ladungen fließen. Gegenteil: „insulator“ (Isolator). „current-carrying“ = stromdurchflossen."},"_k":"conductor d · fields a current-carrying conductor in a magnetic field experiences a force. el conductor le conducteur der leiter un conductor por el que circula corriente experimenta una fuerza en un campo magnetico. un conducteur parcouru par un courant subit une force dans un champ magnetique. ein stromdurchflossener leiter erfahrt im magnetfeld eine kraft."},{"en":"nucleon","unit":"E · Nuclear and quantum physics","ex":"The nucleon number A is the number of protons plus neutrons.","es":{"t":"el nucleón","e":"El número de nucleones A es el número de protones más neutrones.","u":"⚠ El IB dice «nucleon number» donde en español dirías «número másico», y «proton number» Z donde dirías «número atómico». Es lo mismo con otras palabras. Nucleón = protón o neutrón."},"fr":{"t":"le nucléon","e":"Le nombre de nucléons A est le nombre de protons plus neutrons.","u":"⚠ Le DP dit « nucleon number » là où tu dirais « nombre de masse », et « proton number » Z pour « numéro atomique ». Même chose, autres mots. Nucléon = proton ou neutron."},"de":{"t":"das Nukleon","e":"Die Nukleonenzahl A ist die Zahl der Protonen plus Neutronen.","u":"⚠ Das IB sagt „nucleon number“ statt Massenzahl und „proton number“ Z statt Ordnungszahl. Gleiche Sache, andere Wörter. Nukleon = Proton oder Neutron."},"_k":"nucleon e · nuclear and quantum physics the nucleon number a is the number of protons plus neutrons. el nucleon le nucleon das nukleon el numero de nucleones a es el numero de protones mas neutrones. le nombre de nucleons a est le nombre de protons plus neutrons. die nukleonenzahl a ist die zahl der protonen plus neutronen."},{"en":"binding energy","unit":"E · Nuclear and quantum physics","ex":"Binding energy per nucleon is greatest for iron.","es":{"t":"la energía de enlace (nuclear)","e":"La energía de enlace por nucleón es máxima para el hierro.","u":"⚠ Aquí «binding» no es un enlace químico: es la fuerza nuclear fuerte. Energía necesaria para separar el núcleo en sus nucleones; equivale al «mass defect» (defecto de masa) por E = mc²."},"fr":{"t":"l'énergie de liaison (nucléaire)","e":"L'énergie de liaison par nucléon est maximale pour le fer.","u":"⚠ Il s'agit du noyau, pas d'une liaison chimique. Énergie nécessaire pour séparer le noyau en nucléons ; elle correspond au « mass defect » (défaut de masse) via E = mc²."},"de":{"t":"die Bindungsenergie","e":"Die Bindungsenergie pro Nukleon ist bei Eisen am größten.","u":"Energie, um einen Kern in seine Nukleonen zu zerlegen; entspricht dem „mass defect“ (Massendefekt) über E = mc². Gemeint ist die Kernbindung, keine chemische Bindung."},"_k":"binding energy e · nuclear and quantum physics binding energy per nucleon is greatest for iron. la energia de enlace (nuclear) l'energie de liaison (nucleaire) die bindungsenergie la energia de enlace por nucleon es maxima para el hierro. l'energie de liaison par nucleon est maximale pour le fer. die bindungsenergie pro nukleon ist bei eisen am großten."},{"en":"half-life","unit":"E · Nuclear and quantum physics","ex":"The half-life of the isotope is 5730 years.","es":{"t":"el período de semidesintegración (la semivida)","e":"El período de semidesintegración del isótopo es de 5730 años.","u":"⚠ En inglés es una sola palabra corta, «half-life»: el tiempo en que se desintegra la mitad de los núcleos. No es «media vida». T½ = ln 2 / λ, donde λ es la «decay constant»."},"fr":{"t":"la demi-vie","e":"La demi-vie de l'isotope est de 5730 ans.","u":"Temps au bout duquel la moitié des noyaux se sont désintégrés. Ne pas dire « half of life ». T½ = ln 2 / λ, où λ est la « decay constant »."},"de":{"t":"die Halbwertszeit","e":"Die Halbwertszeit des Isotops beträgt 5730 Jahre.","u":"Zeit, nach der die Hälfte der Kerne zerfallen ist. Auf Englisch kurz „half-life“ – nicht „half value time“. T½ = ln 2 / λ, mit λ als „decay constant“."},"_k":"half-life e · nuclear and quantum physics the half-life of the isotope is 5730 years. el periodo de semidesintegracion (la semivida) la demi-vie die halbwertszeit el periodo de semidesintegracion del isotopo es de 5730 anos. la demi-vie de l'isotope est de 5730 ans. die halbwertszeit des isotops betragt 5730 jahre."},{"en":"activity","unit":"E · Nuclear and quantum physics","ex":"The activity of the sample is 200 Bq.","es":{"t":"la actividad","e":"La actividad de la muestra es de 200 Bq.","u":"⚠ No es hacer ejercicio. activity = número de desintegraciones por segundo, A = λN, en becquerelios (Bq). Distinto de «count rate», que es lo que registra el detector y siempre es menor."},"fr":{"t":"l'activité","e":"L'activité de l'échantillon est de 200 Bq.","u":"⚠ Pas une activité sportive. activity = nombre de désintégrations par seconde, A = λN, en becquerels (Bq). À distinguer du « count rate », ce que le détecteur enregistre, toujours plus faible."},"de":{"t":"die Aktivität","e":"Die Aktivität der Probe beträgt 200 Bq.","u":"⚠ Keine Freizeitaktivität. activity = Zerfälle pro Sekunde, A = λN, in Becquerel (Bq). Nicht dasselbe wie „count rate“ – das ist, was der Zähler misst, und immer weniger."},"_k":"activity e · nuclear and quantum physics the activity of the sample is 200 bq. la actividad l'activite die aktivitat la actividad de la muestra es de 200 bq. l'activite de l'echantillon est de 200 bq. die aktivitat der probe betragt 200 bq."},{"en":"decay","unit":"E · Nuclear and quantum physics","ex":"Radioactive decay is random and spontaneous.","es":{"t":"la desintegración","e":"La desintegración radiactiva es aleatoria y espontánea.","u":"⚠ En inglés decay también significa pudrirse, pero aquí es un núcleo inestable que emite radiación y se transforma. Verbo: «to decay» («the nucleus decays»). En español, «desintegración», no «decaimiento»."},"fr":{"t":"la désintégration","e":"La désintégration radioactive est aléatoire et spontanée.","u":"⚠ Pas « déclin » ni « pourriture », même si decay a ce sens ailleurs. Un noyau instable émet un rayonnement et se transforme. Verbe : « to decay » (« the nucleus decays »)."},"de":{"t":"der Zerfall","e":"Der radioaktive Zerfall ist zufällig und spontan.","u":"⚠ decay heißt sonst „Verfall“ oder „Fäulnis“; hier: ein instabiler Kern sendet Strahlung aus und wandelt sich um. Verb: „to decay“ („the nucleus decays“). „decay constant“ = Zerfallskonstante λ."},"_k":"decay e · nuclear and quantum physics radioactive decay is random and spontaneous. la desintegracion la desintegration der zerfall la desintegracion radiactiva es aleatoria y espontanea. la desintegration radioactive est aleatoire et spontanee. der radioaktive zerfall ist zufallig und spontan."},{"en":"luminosity","unit":"E · Nuclear and quantum physics","ex":"The luminosity of the star is 100 times that of the Sun.","es":{"t":"la luminosidad","e":"La luminosidad de la estrella es 100 veces la del Sol.","u":"⚠ No es lo brillante que se ve. luminosity = potencia total que emite la estrella, en vatios (L = σAT⁴, en B.1). Lo que ves desde la Tierra es el «apparent brightness», b = L/4πd²."},"fr":{"t":"la luminosité","e":"La luminosité de l'étoile vaut 100 fois celle du Soleil.","u":"⚠ Pas la clarté que tu perçois. luminosity = puissance totale rayonnée par l'étoile, en watts (L = σAT⁴, vu en B.1). Ce que tu vois depuis la Terre est l'« apparent brightness », b = L/4πd²."},"de":{"t":"die Leuchtkraft","e":"Die Leuchtkraft des Sterns ist 100-mal so groß wie die der Sonne.","u":"⚠ Nicht „Luminosität“ und nicht die Helligkeit, die du siehst. luminosity = gesamte abgestrahlte Leistung in Watt (L = σAT⁴, aus B.1). Was auf der Erde ankommt, ist die „apparent brightness“, b = L/4πd²."},"_k":"luminosity e · nuclear and quantum physics the luminosity of the star is 100 times that of the sun. la luminosidad la luminosite die leuchtkraft la luminosidad de la estrella es 100 veces la del sol. la luminosite de l'etoile vaut 100 fois celle du soleil. die leuchtkraft des sterns ist 100-mal so groß wie die der sonne."},{"en":"moderator","unit":"E · Nuclear and quantum physics","ex":"The moderator slows the neutrons so that they can cause fission.","es":{"t":"el moderador","e":"El moderador frena los neutrones para que puedan provocar la fisión.","u":"⚠ No es quien presenta un debate. En un reactor, el moderator (agua, grafito) frena los neutrones rápidos. No lo confundas con las «control rods», que absorben neutrones para regular la reacción."},"fr":{"t":"le modérateur","e":"Le modérateur ralentit les neutrons pour qu'ils puissent provoquer la fission.","u":"⚠ Pas l'animateur d'un débat. Dans un réacteur, le moderator (eau, graphite) ralentit les neutrons rapides. À ne pas confondre avec les « control rods », qui absorbent des neutrons pour régler la réaction."},"de":{"t":"der Moderator","e":"Der Moderator bremst die Neutronen ab, damit sie Kernspaltung auslösen können.","u":"⚠ Kein Fernsehmoderator. Im Reaktor bremst der moderator (Wasser, Graphit) schnelle Neutronen ab. Nicht mit den „control rods“ (Steuerstäben) verwechseln, die Neutronen absorbieren und die Reaktion regeln."},"_k":"moderator e · nuclear and quantum physics the moderator slows the neutrons so that they can cause fission. el moderador le moderateur der moderator el moderador frena los neutrones para que puedan provocar la fision. le moderateur ralentit les neutrons pour qu'ils puissent provoquer la fission. der moderator bremst die neutronen ab, damit sie kernspaltung auslosen konnen."},{"en":"state","unit":"IB command terms","ex":"State the unit of magnetic flux.","es":{"t":"indicar / enunciar","e":"Indica la unidad del flujo magnético.","u":"⚠ Como palabra de examen no es «el estado» (eso es el sustantivo: state of matter). Significa respuesta breve, sin explicación ni cálculo: un nombre, un valor, una línea."},"fr":{"t":"indiquer / énoncer","e":"Indiquez l'unité du flux magnétique.","u":"⚠ En tant que verbe d'examen : une réponse brève, sans explication ni calcul — un nom, une valeur, une ligne. Le nom « state » (state of matter) est un autre mot : l'état."},"de":{"t":"nennen / angeben","e":"Gib die Einheit des magnetischen Flusses an.","u":"⚠ Als Operator: kurze Antwort ohne Erklärung oder Rechnung – ein Wert, ein Name, eine Zeile. Das Substantiv „state“ (state of matter) ist ein anderes Wort: der Zustand."},"_k":"state ib command terms state the unit of magnetic flux. indicar / enunciar indiquer / enoncer nennen / angeben indica la unidad del flujo magnetico. indiquez l'unite du flux magnetique. gib die einheit des magnetischen flusses an."},{"en":"outline","unit":"IB command terms","ex":"Outline how a standing wave is formed on a string.","es":{"t":"describir brevemente / esbozar","e":"Describe brevemente cómo se forma una onda estacionaria en una cuerda.","u":"«Give a brief account or summary»: los puntos esenciales, sin detalle. Normalmente vale 1–2 puntos. Más corto que «describe», mucho más corto que «explain»."},"fr":{"t":"décrire brièvement / présenter les grandes lignes","e":"Décrivez brièvement comment une onde stationnaire se forme sur une corde.","u":"« Give a brief account or summary » : les points essentiels, sans détail. En général 1–2 points. Plus court que « describe », bien plus court que « explain »."},"de":{"t":"kurz darstellen / umreißen","e":"Stelle kurz dar, wie auf einer Saite eine stehende Welle entsteht.","u":"„Give a brief account or summary“: nur das Wesentliche, keine Details. Meist 1–2 Punkte. Kürzer als „describe“, deutlich kürzer als „explain“."},"_k":"outline ib command terms outline how a standing wave is formed on a string. describir brevemente / esbozar decrire brievement / presenter les grandes lignes kurz darstellen / umreißen describe brevemente como se forma una onda estacionaria en una cuerda. decrivez brievement comment une onde stationnaire se forme sur une corde. stelle kurz dar, wie auf einer saite eine stehende welle entsteht."},{"en":"describe","unit":"IB command terms","ex":"Describe the motion of the particle in the magnetic field.","es":{"t":"describir","e":"Describe el movimiento de la partícula en el campo magnético.","u":"«Give a detailed account»: di QUÉ ocurre, con detalle, pero sin dar razones. El porqué es «explain»; aquí no suma puntos."},"fr":{"t":"décrire","e":"Décrivez le mouvement de la particule dans le champ magnétique.","u":"« Give a detailed account » : dire CE QUI se passe, en détail, sans les causes. Le pourquoi, c'est « explain » ; ici il ne rapporte rien."},"de":{"t":"beschreiben","e":"Beschreibe die Bewegung des Teilchens im Magnetfeld.","u":"„Give a detailed account“: sag genau, WAS passiert – ohne Gründe. Das Warum gehört zu „explain“ und bringt hier keine Punkte."},"_k":"describe ib command terms describe the motion of the particle in the magnetic field. describir decrire beschreiben describe el movimiento de la particula en el campo magnetico. decrivez le mouvement de la particule dans le champ magnetique. beschreibe die bewegung des teilchens im magnetfeld."},{"en":"explain","unit":"IB command terms","ex":"Explain why the kinetic energy of the particle stays constant.","es":{"t":"explicar","e":"Explica por qué la energía cinética de la partícula permanece constante.","u":"«Give a detailed account including reasons or causes»: qué pasa Y por qué. Cada afirmación necesita su «because». Palabra de AO3, casi siempre 2–3 puntos."},"fr":{"t":"expliquer","e":"Expliquez pourquoi l'énergie cinétique de la particule reste constante.","u":"« Give a detailed account including reasons or causes » : ce qui se passe ET pourquoi. Chaque affirmation appelle un « because ». Verbe AO3, presque toujours 2–3 points."},"de":{"t":"erklären","e":"Erkläre, warum die kinetische Energie des Teilchens konstant bleibt.","u":"„Give a detailed account including reasons or causes“: was passiert UND warum. Jede Aussage braucht ihr „because“. AO3-Operator, fast immer 2–3 Punkte."},"_k":"explain ib command terms explain why the kinetic energy of the particle stays constant. explicar expliquer erklaren explica por que la energia cinetica de la particula permanece constante. expliquez pourquoi l'energie cinetique de la particule reste constante. erklare, warum die kinetische energie des teilchens konstant bleibt."},{"en":"deduce","unit":"IB command terms","ex":"Deduce the direction of the induced current.","es":{"t":"deducir","e":"Deduce el sentido de la corriente inducida.","u":"«Reach a conclusion from the information given»: llega a la conclusión partiendo de los datos o del razonamiento anterior, y muestra el camino. No es «determine»: aquí importa la cadena lógica, no solo el resultado."},"fr":{"t":"déduire","e":"Déduisez le sens du courant induit.","u":"« Reach a conclusion from the information given » : tirer la conclusion à partir des données ou de ce qui précède, en montrant le raisonnement. Différent de « determine » : ici c'est la chaîne logique qui compte, pas seulement le résultat."},"de":{"t":"folgern / ableiten","e":"Folgere die Richtung des induzierten Stroms.","u":"„Reach a conclusion from the information given“: aus den gegebenen Daten oder dem Vorherigen auf das Ergebnis schließen und den Weg zeigen. Nicht dasselbe wie „determine“: hier zählt die Schlusskette, nicht nur die Zahl."},"_k":"deduce ib command terms deduce the direction of the induced current. deducir deduire folgern / ableiten deduce el sentido de la corriente inducida. deduisez le sens du courant induit. folgere die richtung des induzierten stroms."},{"en":"determine","unit":"IB command terms","ex":"Determine the spring constant from the graph.","es":{"t":"determinar / hallar","e":"Determina la constante del muelle a partir de la gráfica.","u":"«Obtain the only possible answer»: hay una única respuesta correcta y hay que llegar a ella, normalmente con un cálculo o leyendo la gráfica (pendiente, ordenada en el origen). Muestra el método; no es una estimación."},"fr":{"t":"déterminer","e":"Déterminez la constante de raideur à partir du graphique.","u":"« Obtain the only possible answer » : il y a une seule bonne réponse et il faut y arriver, en général par un calcul ou une lecture graphique (pente, ordonnée à l'origine). Montrer la méthode ; ce n'est pas une estimation."},"de":{"t":"bestimmen / ermitteln","e":"Bestimme die Federkonstante aus dem Diagramm.","u":"„Obtain the only possible answer“: es gibt genau eine richtige Antwort, meist über eine Rechnung oder das Ablesen aus dem Diagramm (Steigung, Achsenabschnitt). Rechenweg zeigen; keine Schätzung."},"_k":"determine ib command terms determine the spring constant from the graph. determinar / hallar determiner bestimmen / ermitteln determina la constante del muelle a partir de la grafica. determinez la constante de raideur a partir du graphique. bestimme die federkonstante aus dem diagramm."},{"en":"discuss","unit":"IB command terms","ex":"Discuss whether the ideal gas model is appropriate here.","es":{"t":"analizar / discutir (con argumentos)","e":"Analiza si el modelo de gas ideal es adecuado en este caso.","u":"⚠ No es discutir en el sentido de pelearse. «Offer a considered and balanced review»: argumentos a favor Y en contra, con evidencia, y una conclusión clara. Palabra de AO3."},"fr":{"t":"discuter / débattre","e":"Discutez de la pertinence du modèle du gaz parfait dans ce cas.","u":"⚠ Pas une dispute. « Offer a considered and balanced review » : arguments pour ET contre, appuyés sur des faits, puis une conclusion nette. Verbe AO3."},"de":{"t":"erörtern / diskutieren","e":"Erörtere, ob das Modell des idealen Gases hier angemessen ist.","u":"⚠ Kein Streit. „Offer a considered and balanced review“: Argumente dafür UND dagegen, mit Belegen, und am Ende ein klares Fazit. AO3-Operator."},"_k":"discuss ib command terms discuss whether the ideal gas model is appropriate here. analizar / discutir (con argumentos) discuter / debattre erortern / diskutieren analiza si el modelo de gas ideal es adecuado en este caso. discutez de la pertinence du modele du gaz parfait dans ce cas. erortere, ob das modell des idealen gases hier angemessen ist."},{"en":"justify","unit":"IB command terms","ex":"Justify your choice of graph.","es":{"t":"justificar","e":"Justifica tu elección de gráfica.","u":"«Give valid reasons or evidence to support an answer»: no basta con afirmar, hay que apoyar la respuesta con razones o datos. Aparece sobre todo en la evaluación interna (IA)."},"fr":{"t":"justifier","e":"Justifiez votre choix de graphique.","u":"« Give valid reasons or evidence to support an answer » : affirmer ne suffit pas, il faut étayer la réponse par des raisons ou des données. Fréquent surtout dans l'évaluation interne (IA)."},"de":{"t":"begründen","e":"Begründe die Wahl deines Diagramms.","u":"„Give valid reasons or evidence to support an answer“: Behaupten reicht nicht – die Antwort mit Gründen oder Daten stützen. Kommt vor allem in der Internal Assessment (IA) vor."},"_k":"justify ib command terms justify your choice of graph. justificar justifier begrunden justifica tu eleccion de grafica. justifiez votre choix de graphique. begrunde die wahl deines diagramms."},{"en":"sketch","unit":"IB command terms","ex":"Sketch a graph of velocity against time for the fall.","es":{"t":"esbozar / dibujar de forma aproximada","e":"Esboza la gráfica de la velocidad frente al tiempo durante la caída.","u":"«Represent by means of a diagram or graph»: la forma general y los rasgos importantes (ejes, intersecciones, curvatura), sin escala exacta. Si el enunciado dice «draw», sí necesitas precisión, regla y escala."},"fr":{"t":"esquisser / tracer l'allure","e":"Esquissez l'allure de la vitesse en fonction du temps pendant la chute.","u":"« Represent by means of a diagram or graph » : la forme générale et les traits importants (axes, intersections, courbure), sans échelle précise. Si la question dit « draw », il faut la précision, la règle et l'échelle."},"de":{"t":"skizzieren","e":"Skizziere ein Geschwindigkeit-Zeit-Diagramm für den Fall.","u":"„Represent by means of a diagram or graph“: die grobe Form mit den wichtigen Merkmalen (Achsen, Schnittpunkte, Krümmung), ohne genaue Skala. Steht „draw“, brauchst du Genauigkeit, Lineal und Maßstab."},"_k":"sketch ib command terms sketch a graph of velocity against time for the fall. esbozar / dibujar de forma aproximada esquisser / tracer l'allure skizzieren esboza la grafica de la velocidad frente al tiempo durante la caida. esquissez l'allure de la vitesse en fonction du temps pendant la chute. skizziere ein geschwindigkeit-zeit-diagramm fur den fall."},{"en":"annotate","unit":"IB command terms","ex":"Annotate the diagram to show the direction of the forces.","es":{"t":"anotar / añadir notas","e":"Añade notas al diagrama para mostrar la dirección de las fuerzas.","u":"«Add brief notes to a diagram or graph»: etiquetas cortas y flechas sobre el dibujo, no un párrafo aparte. No es «label» (solo el nombre): annotate suele pedir un breve porqué."},"fr":{"t":"annoter","e":"Annotez le schéma pour indiquer le sens des forces.","u":"« Add brief notes to a diagram or graph » : de courtes notes et des flèches sur le dessin, pas un paragraphe à côté. Différent de « label » (juste le nom) : annotate demande souvent un bref pourquoi."},"de":{"t":"beschriften / kommentieren","e":"Beschrifte das Diagramm so, dass die Richtung der Kräfte erkennbar ist.","u":"„Add brief notes to a diagram or graph“: kurze Notizen und Pfeile direkt in die Zeichnung, kein Absatz daneben. Mehr als „label“ (nur der Name): annotate verlangt oft ein kurzes Warum."},"_k":"annotate ib command terms annotate the diagram to show the direction of the forces. anotar / anadir notas annoter beschriften / kommentieren anade notas al diagrama para mostrar la direccion de las fuerzas. annotez le schema pour indiquer le sens des forces. beschrifte das diagramm so, dass die richtung der krafte erkennbar ist."}],"langs":["es","fr","de"],"units":["A · Space, time and motion","B · The particulate nature of matter","C · Wave behaviour","D · Fields","E · Nuclear and quantum physics","IB command terms"],"ui":{"es":{"ph":"Escribe una palabra — en español o en inglés","all":"Todos los temas","none":"No se ha encontrado nada.","sort_en":"Orden: inglés","sort_xx":"Orden: español","count":"términos"},"fr":{"ph":"Tape un mot — en français ou en anglais","all":"Tous les thèmes","none":"Aucun résultat.","sort_en":"Tri : anglais","sort_xx":"Tri : français","count":"termes"},"de":{"ph":"Gib ein Wort ein — auf Deutsch oder Englisch","all":"Alle Themen","none":"Nichts gefunden.","sort_en":"Sortierung: Englisch","sort_xx":"Sortierung: Deutsch","count":"Begriffe"}},"beta":{"es":"Esta página la ha escrito <strong>Alfred</strong>, el sistema de IA del Sr. Rawson, para ayudarte a estudiar en inglés. <strong>Es nueva, y Alfred todavía está aprendiendo tu idioma, así que algunas cosas estarán mal.</strong> Si una palabra te parece incorrecta, seguramente tengas razón: díselo al Sr. Rawson y la corregimos. Si falta una palabra que necesitas, o se te ocurre cómo mejorar esta página, díselo también. Cambia siempre que lo pidas.","fr":"Cette page a été écrite par <strong>Alfred</strong>, le système d'IA de M. Rawson, pour t'aider à étudier en anglais. <strong>Elle est toute nouvelle, et Alfred apprend encore ta langue : certaines choses seront donc fausses.</strong> Si un mot te semble incorrect, tu as sans doute raison : dis-le à M. Rawson et nous le corrigerons. S'il manque un mot dont tu as besoin, ou si tu as une idée pour améliorer cette page, dis-le-lui aussi. Elle change dès que tu le demandes.","de":"Diese Seite hat <strong>Alfred</strong> geschrieben, das KI-System von Mr Rawson, damit du auf Englisch lernen kannst. <strong>Sie ist ganz neu, und Alfred lernt deine Sprache noch — manches wird also falsch sein.</strong> Wenn dir ein Wort falsch vorkommt, hast du wahrscheinlich recht: Sag Mr Rawson Bescheid, dann korrigieren wir es. Wenn ein Wort fehlt, das du brauchst, oder dir einfällt, wie diese Seite besser wird, sag ihm das auch. Sie ändert sich, sobald du es sagst."},"name":{"es":"Español","fr":"Français","de":"Deutsch"}};
const KEY = "vocab-lang";
const fold = s => (s||"").toString().toLowerCase()
  .normalize("NFD").replace(/[\u0300-\u036f]/g, "");

function pick() {
  const q = new URLSearchParams(location.search).get("lang");
  if (q && D.langs.includes(q)) { try { localStorage.setItem(KEY, q); } catch (e) {} return q; }
  let s = null; try { s = localStorage.getItem(KEY); } catch (e) {}
  if (s && D.langs.includes(s)) return s;
  return D.langs[0];
}
let L = pick();

function setLang(v) {
  L = v; try { localStorage.setItem(KEY, v); } catch (e) {}
  chrome(); render();
}

function chrome() {
  document.getElementById("langbar").innerHTML = D.langs.map(x =>
    `<button data-l="${x}" aria-pressed="${x === L}">${D.name[x]}</button>`).join("");
  document.querySelectorAll("#langbar button").forEach(b =>
    b.onclick = () => setLang(b.dataset.l));
  document.getElementById("beta").innerHTML = D.beta[L];
  const u = D.ui[L];
  document.getElementById("q").placeholder = u.ph;
  const sel = document.getElementById("unit"), keep = sel.value;
  sel.innerHTML = `<option value="">${u.all}</option>` +
    D.units.map(x => `<option>${x}</option>`).join("");
  sel.value = keep;
  const so = document.getElementById("sort"), ks = so.value;
  so.innerHTML = `<option value="en">${u.sort_en}</option><option value="xx">${u.sort_xx}</option>`;
  so.value = ks || "en";
}

function render() {
  const u = D.ui[L];
  const q = fold(document.getElementById("q").value.trim());
  const unit = document.getElementById("unit").value;
  const sort = document.getElementById("sort").value || "en";
  let rows = D.terms.filter(t => t[L]);
  if (unit) rows = rows.filter(t => t.unit === unit);
  if (q) rows = rows.filter(t => t._k.includes(q));
  rows.sort((a, b) => (sort === "xx" ? fold(a[L].t).localeCompare(fold(b[L].t))
                                     : fold(a.en).localeCompare(fold(b.en))));
  document.getElementById("n").textContent = rows.length + " " + u.count;
  document.getElementById("list").innerHTML = rows.length ? rows.map(t => {
    const w = t[L].u.indexOf("\u26a0") === 0 ? " warn" : "";
    return `<div class="row">
      <div><h3>${esc(t.en)}</h3><p class="xx">${esc(t[L].t)}</p>
        ${t.unit ? `<p class="unit">${esc(t.unit)}</p>` : ""}</div>
      <div>${t.ex ? `<p class="ex">${esc(t.ex)}</p>` : ""}
        <p class="ex tr">${esc(t[L].e)}</p>
        <p class="use${w}">${esc(t[L].u)}</p></div>
    </div>`;
  }).join("") : `<p class="n">${u.none}</p>`;
}

function esc(s) {
  return (s || "").replace(/[&<>"']/g, c =>
    ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"})[c]);
}

document.getElementById("q").addEventListener("input", render);
document.getElementById("unit").addEventListener("change", render);
document.getElementById("sort").addEventListener("change", render);
// A laptop is the only device these students may have in class (spec §2), so the
// keyboard is the fast path: "/" jumps to the box from anywhere on the page.
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement.id !== "q") {
    e.preventDefault(); document.getElementById("q").focus();
  }
});
chrome(); render();
</script>
