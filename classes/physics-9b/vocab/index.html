<script>
const D = {"terms":[{"en":"oscillation","unit":"Oscillations & Waves","ex":"One oscillation is one complete swing of the pendulum, there and back.","es":{"t":"la oscilación","e":"Una oscilación es un vaivén completo del péndulo, ida y vuelta.","u":"En inglés el verbo es «to oscillate». Cuenta oscilaciones completas: ida y vuelta es UNA, no dos."},"fr":{"t":"l'oscillation","e":"Une oscillation est un aller-retour complet du pendule.","u":"Le verbe est « to oscillate ». Un aller-retour complet compte pour UNE oscillation, pas deux."},"de":{"t":"die Schwingung","e":"Eine Schwingung ist ein vollständiges Hin und Her des Pendels.","u":"⚠ Auf Englisch heißt es „oscillation“, nicht „swinging“. Hin und zurück zusammen ist EINE Schwingung, nicht zwei."},"_k":"oscillation oscillations & waves one oscillation is one complete swing of the pendulum, there and back. la oscilacion l'oscillation die schwingung una oscilacion es un vaiven completo del pendulo, ida y vuelta. une oscillation est un aller-retour complet du pendule. eine schwingung ist ein vollstandiges hin und her des pendels."},{"en":"period","unit":"Oscillations & Waves","ex":"The period of the pendulum is 1.2 s.","es":{"t":"el período","e":"El período del péndulo es de 1,2 s.","u":"⚠ En el horario, «period» es una clase (Period 3). En física es el tiempo de UNA oscilación completa. Símbolo T, se mide en segundos."},"fr":{"t":"la période","e":"La période du pendule est de 1,2 s.","u":"⚠ Dans l'emploi du temps, « period » veut dire un cours (Period 3). En physique, c'est le temps d'UNE oscillation complète. Symbole T, en secondes."},"de":{"t":"die Periodendauer (die Schwingungsdauer)","e":"Die Periodendauer des Pendels beträgt 1,2 s.","u":"⚠ Im Stundenplan bedeutet „period“ eine Unterrichtsstunde (Period 3). In der Physik ist es die Zeit für EINE volle Schwingung. Symbol T, in Sekunden."},"_k":"period oscillations & waves the period of the pendulum is 1.2 s. el periodo la periode die periodendauer (die schwingungsdauer) el periodo del pendulo es de 1,2 s. la periode du pendule est de 1,2 s. die periodendauer des pendels betragt 1,2 s."},{"en":"frequency","unit":"Oscillations & Waves","ex":"The frequency is 2 Hz, so there are two oscillations every second.","es":{"t":"la frecuencia","e":"La frecuencia es de 2 Hz, así que hay dos oscilaciones cada segundo.","u":"Cuántas oscilaciones hay en un segundo. Se mide en hertz (Hz), y f = 1/T. Símbolo f."},"fr":{"t":"la fréquence","e":"La fréquence est de 2 Hz : il y a deux oscillations par seconde.","u":"Le nombre d'oscillations en une seconde. Unité : le hertz (Hz), et f = 1/T. Symbole f."},"de":{"t":"die Frequenz","e":"Die Frequenz beträgt 2 Hz, also zwei Schwingungen pro Sekunde.","u":"Wie viele Schwingungen in einer Sekunde. Einheit Hertz (Hz), und f = 1/T. Symbol f."},"_k":"frequency oscillations & waves the frequency is 2 hz, so there are two oscillations every second. la frecuencia la frequence die frequenz la frecuencia es de 2 hz, asi que hay dos oscilaciones cada segundo. la frequence est de 2 hz : il y a deux oscillations par seconde. die frequenz betragt 2 hz, also zwei schwingungen pro sekunde."},{"en":"wavelength","unit":"Oscillations & Waves","ex":"The wavelength is the distance from one peak to the next.","es":{"t":"la longitud de onda","e":"La longitud de onda es la distancia de una cresta a la siguiente.","u":"Una sola palabra en inglés: wave + length. Su símbolo es la letra griega λ (lambda) y se mide en metros."},"fr":{"t":"la longueur d'onde","e":"La longueur d'onde est la distance entre un sommet et le suivant.","u":"Un seul mot en anglais : wave + length. Symbole λ (lambda), en mètres."},"de":{"t":"die Wellenlänge","e":"Die Wellenlänge ist der Abstand von einem Wellenberg zum nächsten.","u":"Genau wie im Deutschen ein Wort: wave + length. Symbol λ (Lambda), in Metern."},"_k":"wavelength oscillations & waves the wavelength is the distance from one peak to the next. la longitud de onda la longueur d'onde die wellenlange la longitud de onda es la distancia de una cresta a la siguiente. la longueur d'onde est la distance entre un sommet et le suivant. die wellenlange ist der abstand von einem wellenberg zum nachsten."},{"en":"spring","unit":"Oscillations & Waves","ex":"Hang the mass on the spring and measure the extension.","es":{"t":"el muelle (el resorte)","e":"Cuelga la masa del muelle y mide la extensión.","u":"⚠ «spring» también significa primavera y manantial. En el laboratorio es el muelle metálico que se estira. En Latinoamérica se dice «resorte»."},"fr":{"t":"le ressort","e":"Accroche la masse au ressort et mesure l'allongement.","u":"⚠ « spring » veut aussi dire printemps et source. Au labo, c'est le ressort en métal qu'on étire."},"de":{"t":"die Feder","e":"Hänge die Masse an die Feder und miss die Verlängerung.","u":"⚠ „spring“ heißt auch Frühling und Quelle. Im Labor ist es die Metallfeder, die man dehnt. Und die Vogelfeder heißt auf Englisch „feather“, nicht „spring“."},"_k":"spring oscillations & waves hang the mass on the spring and measure the extension. el muelle (el resorte) le ressort die feder cuelga la masa del muelle y mide la extension. accroche la masse au ressort et mesure l'allongement. hange die masse an die feder und miss die verlangerung."},{"en":"extension","unit":"Oscillations & Waves","ex":"The extension is the new length minus the natural length.","es":{"t":"la extensión (el alargamiento)","e":"La extensión es la longitud nueva menos la longitud natural.","u":"⚠ En una hoja de ejercicios, «Extension» significa preguntas extra para quien acaba. En la ley de Hooke es cuánto se ha alargado el muelle, no su longitud total."},"fr":{"t":"l'allongement","e":"L'allongement est la nouvelle longueur moins la longueur naturelle.","u":"⚠ Sur une fiche, « Extension » veut dire des questions en plus pour ceux qui ont fini. Dans la loi de Hooke, c'est de combien le ressort s'est allongé, pas sa longueur totale."},"de":{"t":"die Verlängerung (die Dehnung)","e":"Die Verlängerung ist die neue Länge minus die natürliche Länge.","u":"⚠ Auf einem Arbeitsblatt bedeutet „Extension“ Zusatzaufgaben für Schnelle. Beim Hookeschen Gesetz ist es, um wie viel länger die Feder geworden ist, nicht ihre ganze Länge."},"_k":"extension oscillations & waves the extension is the new length minus the natural length. la extension (el alargamiento) l'allongement die verlangerung (die dehnung) la extension es la longitud nueva menos la longitud natural. l'allongement est la nouvelle longueur moins la longueur naturelle. die verlangerung ist die neue lange minus die naturliche lange."},{"en":"directly proportional","unit":"Oscillations & Waves","ex":"The extension is directly proportional to the force.","es":{"t":"directamente proporcional","e":"La extensión es directamente proporcional a la fuerza.","u":"Si una cantidad se duplica, la otra también. En una gráfica es una línea recta que pasa por el origen (0,0). Solo recta no basta: tiene que pasar por el origen."},"fr":{"t":"directement proportionnel","e":"L'allongement est directement proportionnel à la force.","u":"Si l'une double, l'autre double aussi. Sur un graphique, c'est une droite qui passe par l'origine (0,0). Une droite qui ne passe pas par l'origine ne suffit pas."},"de":{"t":"direkt proportional","e":"Die Verlängerung ist direkt proportional zur Kraft.","u":"Verdoppelt sich das eine, verdoppelt sich auch das andere. Im Diagramm: eine Gerade durch den Ursprung (0,0). Eine Gerade allein reicht nicht, sie muss durch den Ursprung gehen."},"_k":"directly proportional oscillations & waves the extension is directly proportional to the force. directamente proporcional directement proportionnel direkt proportional la extension es directamente proporcional a la fuerza. l'allongement est directement proportionnel a la force. die verlangerung ist direkt proportional zur kraft."},{"en":"line of best fit","unit":"Oscillations & Waves","ex":"Draw a line of best fit through your points.","es":{"t":"la recta de mejor ajuste (la línea de tendencia)","e":"Traza la recta de mejor ajuste entre tus puntos.","u":"Una sola línea suave que pasa lo más cerca posible de todos los puntos. ⚠ No unas los puntos uno a uno: eso en inglés se llama «dot-to-dot» y está mal."},"fr":{"t":"la droite de meilleur ajustement (la courbe de tendance)","e":"Trace la droite de meilleur ajustement entre tes points.","u":"Une seule ligne lisse qui passe au plus près de tous les points. ⚠ Ne relie pas les points un par un : ça, c'est faux."},"de":{"t":"die Ausgleichsgerade (die Trendlinie)","e":"Zeichne eine Ausgleichsgerade durch deine Messpunkte.","u":"Eine einzige glatte Linie, die so nah wie möglich an allen Punkten vorbeigeht. ⚠ Verbinde die Punkte nicht einzeln, das ist falsch."},"_k":"line of best fit oscillations & waves draw a line of best fit through your points. la recta de mejor ajuste (la linea de tendencia) la droite de meilleur ajustement (la courbe de tendance) die ausgleichsgerade (die trendlinie) traza la recta de mejor ajuste entre tus puntos. trace la droite de meilleur ajustement entre tes points. zeichne eine ausgleichsgerade durch deine messpunkte."},{"en":"medium","unit":"Oscillations & Waves","ex":"Sound needs a medium to travel through, so it cannot cross a vacuum.","es":{"t":"el medio","e":"El sonido necesita un medio para propagarse, por eso no atraviesa el vacío.","u":"⚠ Aquí «medium» no es una talla ni «mediano». Es el material (aire, agua, metal) por el que pasa la onda. El plural en inglés es «media»."},"fr":{"t":"le milieu","e":"Le son a besoin d'un milieu pour se propager : il ne traverse pas le vide.","u":"⚠ Ce n'est pas « moyen » ni une taille, et pas « médium » comme le voyant. C'est la matière (air, eau, métal) que l'onde traverse."},"de":{"t":"das Medium","e":"Schall braucht ein Medium, deshalb kommt er nicht durch ein Vakuum.","u":"⚠ Nicht die Größe „medium“ und nicht die Medien (Fernsehen). Hier ist es der Stoff (Luft, Wasser, Metall), durch den die Welle läuft. Plural auf Englisch: „media“."},"_k":"medium oscillations & waves sound needs a medium to travel through, so it cannot cross a vacuum. el medio le milieu das medium el sonido necesita un medio para propagarse, por eso no atraviesa el vacio. le son a besoin d'un milieu pour se propager : il ne traverse pas le vide. schall braucht ein medium, deshalb kommt er nicht durch ein vakuum."},{"en":"resonance","unit":"Oscillations & Waves","ex":"Resonance happens when the driving frequency matches the natural frequency.","es":{"t":"la resonancia","e":"La resonancia se produce cuando la frecuencia de excitación coincide con la frecuencia natural.","u":"El verbo en inglés es «to resonate». Las oscilaciones se hacen muy grandes y pueden romper puentes o edificios. Es el tema de tu informe del criterio D."},"fr":{"t":"la résonance","e":"La résonance se produit quand la fréquence d'excitation est égale à la fréquence propre.","u":"Le verbe est « to resonate ». Les oscillations deviennent énormes et peuvent casser un pont ou un bâtiment. C'est le sujet de ton rapport du critère D."},"de":{"t":"die Resonanz","e":"Resonanz entsteht, wenn die Erregerfrequenz mit der Eigenfrequenz übereinstimmt.","u":"Das Verb heißt „to resonate“. Die Schwingungen werden riesig und können Brücken oder Gebäude zerstören. Das ist das Thema deines Berichts für Kriterium D."},"_k":"resonance oscillations & waves resonance happens when the driving frequency matches the natural frequency. la resonancia la resonance die resonanz la resonancia se produce cuando la frecuencia de excitacion coincide con la frecuencia natural. la resonance se produit quand la frequence d'excitation est egale a la frequence propre. resonanz entsteht, wenn die erregerfrequenz mit der eigenfrequenz ubereinstimmt."},{"en":"velocity","unit":"Mechanics","ex":"Acceleration is the change in velocity divided by the time taken.","es":{"t":"la velocidad","e":"La aceleración es el cambio de velocidad dividido entre el tiempo.","u":"⚠ El español tiene una palabra; el inglés tiene dos. «speed» es solo lo rápido que va; «velocity» es la rapidez con una dirección. En Year 9 son casi iguales, pero las gráficas se llaman «velocity-time»."},"fr":{"t":"la vitesse","e":"L'accélération est la variation de vitesse divisée par le temps.","u":"⚠ Le français a un mot, l'anglais en a deux. « speed » = à quelle vitesse ; « velocity » = la vitesse avec une direction. En Year 9 c'est presque pareil, mais les graphiques s'appellent « velocity-time »."},"de":{"t":"die Geschwindigkeit","e":"Die Beschleunigung ist die Änderung der Geschwindigkeit geteilt durch die Zeit.","u":"⚠ Deutsch hat ein Wort, Englisch hat zwei. „speed“ = wie schnell; „velocity“ = wie schnell und in welche Richtung. In Year 9 fast dasselbe, aber die Diagramme heißen „velocity-time“."},"_k":"velocity mechanics acceleration is the change in velocity divided by the time taken. la velocidad la vitesse die geschwindigkeit la aceleracion es el cambio de velocidad dividido entre el tiempo. l'acceleration est la variation de vitesse divisee par le temps. die beschleunigung ist die anderung der geschwindigkeit geteilt durch die zeit."},{"en":"acceleration","unit":"Mechanics","ex":"The car accelerates from rest at 2 m/s².","es":{"t":"la aceleración","e":"El coche acelera desde el reposo a 2 m/s².","u":"Cualquier cambio de velocidad: ir más rápido, más despacio o cambiar de dirección. Frenar también se llama «deceleration». Verbo: «to accelerate»."},"fr":{"t":"l'accélération","e":"La voiture accélère à partir de l'arrêt à 2 m/s².","u":"Tout changement de vitesse : aller plus vite, ralentir ou tourner. Ralentir se dit aussi « deceleration ». Verbe : « to accelerate »."},"de":{"t":"die Beschleunigung","e":"Das Auto beschleunigt aus dem Stand mit 2 m/s².","u":"Jede Änderung der Geschwindigkeit: schneller, langsamer oder die Richtung ändern. Bremsen heißt auch „deceleration“. Verb: „to accelerate“."},"_k":"acceleration mechanics the car accelerates from rest at 2 m/s². la aceleracion l'acceleration die beschleunigung el coche acelera desde el reposo a 2 m/s². la voiture accelere a partir de l'arret a 2 m/s². das auto beschleunigt aus dem stand mit 2 m/s²."},{"en":"gradient","unit":"Mechanics","ex":"The gradient of a distance-time graph gives the speed.","es":{"t":"la pendiente","e":"La pendiente de la gráfica distancia-tiempo es la velocidad.","u":"⚠ No digas «gradiente»: es la pendiente, como en mates. En inglés se dice «gradient» o «slope», y se calcula como subida ÷ avance (rise ÷ run)."},"fr":{"t":"la pente","e":"La pente du graphique distance-temps donne la vitesse.","u":"⚠ Pas « gradient » en français : c'est la pente, le coefficient directeur de maths. En anglais on dit « gradient » ou « slope », calculé rise ÷ run."},"de":{"t":"die Steigung","e":"Die Steigung im Weg-Zeit-Diagramm ist die Geschwindigkeit.","u":"⚠ Nicht „Gradient“ sagen, sondern Steigung, wie in Mathe. Auf Englisch „gradient“ oder „slope“, gerechnet als rise ÷ run."},"_k":"gradient mechanics the gradient of a distance-time graph gives the speed. la pendiente la pente die steigung la pendiente de la grafica distancia-tiempo es la velocidad. la pente du graphique distance-temps donne la vitesse. die steigung im weg-zeit-diagramm ist die geschwindigkeit."},{"en":"rate","unit":"Mechanics","ex":"All objects fall at the same rate if there is no air resistance.","es":{"t":"el ritmo (la rapidez)","e":"Todos los objetos caen al mismo ritmo si no hay resistencia del aire.","u":"⚠ No es «rato» ni una tarifa. «rate» es cuánto cambia algo por cada segundo. «at the same rate» = igual de rápido; «rate of change» = ritmo de cambio."},"fr":{"t":"le rythme (la vitesse à laquelle…)","e":"Tous les objets tombent au même rythme s'il n'y a pas de résistance de l'air.","u":"⚠ Pas un tarif ni une note. « rate » veut dire de combien quelque chose change par seconde. « at the same rate » = aussi vite ; « rate of change » = vitesse de variation."},"de":{"t":"die Rate (das Tempo)","e":"Alle Körper fallen gleich schnell, wenn es keinen Luftwiderstand gibt.","u":"⚠ Kein Preis und keine Ratenzahlung. „rate“ heißt, wie viel sich etwas pro Sekunde ändert. „at the same rate“ = gleich schnell; „rate of change“ = Änderungsrate."},"_k":"rate mechanics all objects fall at the same rate if there is no air resistance. el ritmo (la rapidez) le rythme (la vitesse a laquelle…) die rate (das tempo) todos los objetos caen al mismo ritmo si no hay resistencia del aire. tous les objets tombent au meme rythme s'il n'y a pas de resistance de l'air. alle korper fallen gleich schnell, wenn es keinen luftwiderstand gibt."},{"en":"circuit","unit":"Electricity & Energy","ex":"Draw a circuit diagram with a cell, a switch and a bulb.","es":{"t":"el circuito","e":"Dibuja un diagrama de circuito con una pila, un interruptor y una bombilla.","u":"Un camino cerrado por el que fluye la corriente. Se pronuncia «SER-kit»: la «u» no suena. Un «short circuit» es un cortocircuito."},"fr":{"t":"le circuit","e":"Dessine un schéma de circuit avec une pile, un interrupteur et une lampe.","u":"Un chemin fermé où le courant circule. Ça se prononce « seur-kit », le « u » ne s'entend pas. « short circuit » = court-circuit."},"de":{"t":"der Stromkreis","e":"Zeichne einen Schaltplan mit einer Zelle, einem Schalter und einer Lampe.","u":"⚠ Der Stromkreis heißt auf Englisch einfach „circuit“, gesprochen „sör-kit“. Ein „circuit diagram“ ist ein Schaltplan, ein „short circuit“ ein Kurzschluss."},"_k":"circuit electricity & energy draw a circuit diagram with a cell, a switch and a bulb. el circuito le circuit der stromkreis dibuja un diagrama de circuito con una pila, un interruptor y una bombilla. dessine un schema de circuit avec une pile, un interrupteur et une lampe. zeichne einen schaltplan mit einer zelle, einem schalter und einer lampe."},{"en":"current","unit":"Electricity & Energy","ex":"The ammeter measures the current in amps (A).","es":{"t":"la corriente","e":"El amperímetro mide la corriente en amperios (A).","u":"⚠ En inglés «current» también significa actual (current year = este año). En física es cuántos electrones pasan por un punto cada segundo. Símbolo I, unidad amperio (A)."},"fr":{"t":"le courant","e":"L'ampèremètre mesure le courant en ampères (A).","u":"⚠ « current » veut aussi dire actuel (current year = cette année). En physique, c'est le nombre d'électrons qui passent par seconde. Symbole I, unité l'ampère (A)."},"de":{"t":"der Strom (die Stromstärke)","e":"Das Amperemeter misst den Strom in Ampere (A).","u":"⚠ „current“ heißt auch aktuell (current year = dieses Jahr). In der Physik: wie viele Elektronen pro Sekunde vorbeifließen. Symbol I, Einheit Ampere (A). Sag nicht „electricity“, wenn du Strom meinst."},"_k":"current electricity & energy the ammeter measures the current in amps (a). la corriente le courant der strom (die stromstarke) el amperimetro mide la corriente en amperios (a). l'amperemetre mesure le courant en amperes (a). das amperemeter misst den strom in ampere (a)."},{"en":"potential difference (voltage)","unit":"Electricity & Energy","ex":"The potential difference across the bulb is 3 V.","es":{"t":"la diferencia de potencial (el voltaje)","e":"La diferencia de potencial en la bombilla es de 3 V.","u":"Las dos palabras significan lo mismo: «voltage» es la corta, «potential difference» la correcta en un examen. Se mide con un voltímetro en voltios (V). ⚠ Nada que ver con «tener potencial»."},"fr":{"t":"la tension (la différence de potentiel)","e":"La tension aux bornes de la lampe est de 3 V.","u":"⚠ Piège : en français on dit « tension », mais en anglais « tension » est la force dans une corde. Pour les volts, dis « voltage » ou « potential difference ». Unité : le volt (V), mesuré avec un voltmètre."},"de":{"t":"die Spannung","e":"Die Spannung an der Lampe beträgt 3 V.","u":"⚠ Spannung heißt auf Englisch „voltage“ oder „potential difference“, nie „tension“ (das ist die Zugkraft in einem Seil). Einheit rgiespeicher la pila tiene un almacen de energia quimica; el coche en movimiento, uno de energia cinetica. la pile a une reserve d'energie chimique ; la voiture en mouvement a une reserve d'energie cinetique. die batterie hat einen chemischen energiespeicher; das fahrende auto einen kinetischen."},{"en":"independent variable","unit":"Investigation skills","ex":"The independent variable is the length of the pendulum; I change it on purpose.","es":{"t":"la variable independiente","e":"La variable independiente es la longitud del péndulo; la cambio yo a propósito.","u":"La que TÚ cambias. Va en el eje x de la gráfica y en la primera columna de la tabla. Truco: la «I» de independent = «I change it»."},"fr":{"t":"la variable indépendante","e":"La variable indépendante est la longueur du pendule ; c'est moi qui la change.","u":"Celle que TU changes. Elle va sur l'axe des x et dans la première colonne du tableau. Astuce : le « I » de independent = « I change it »."},"de":{"t":"die unabhängige Variable","e":"Die unabhängige Variable ist die Länge des Pendels; ich ändere sie absichtlich.","u":"Die, die DU änderst. Sie kommt auf die x-Achse und in die erste Spalte der Tabelle. Merkhilfe: das „I“ in independent = „I change it“."},"_k":"independent variable investigation skills the independent variable is the length of the pendulum; i change it on purpose. la variable independiente la variable independante die unabhangige variable la variable independiente es la longitud del pendulo; la cambio yo a proposito. la variable independante est la longueur du pendule ; c'est moi qui la change. die unabhangige variable ist die lange des pendels; ich andere sie absichtlich."},{"en":"dependent variable","unit":"Investigation skills","ex":"The dependent variable is the period; I measure it.","es":{"t":"la variable dependiente","e":"La variable dependiente es el período; es la que mido.","u":"La que MIDES. Depende de la independiente. Va en el eje y de la gráfica."},"fr":{"t":"la variable a es una variable controlada: mantenla igual siempre. la masse de la boule est une variable controlee : garde-la identique a chaque fois. die masse des pendelkorpers ist eine kontrollvariable, halte sie also jedes mal gleich."},{"en":"state","unit":"Exam command words","ex":"State the unit of frequency.","es":{"t":"indicar / escribir","e":"Indica la unidad de la frecuencia.","u":"⚠ Palabra de examen. «State» significa escribe la respuesta corta, sin explicar. No pierdas tiempo dando razones: no dan puntos por ellas."},"fr":{"t":"indiquer / donner","e":"Indique l'unité de la fréquence.","u":"⚠ Mot d'examen. « State » = écris la réponse courte, sans expliquer. Pas la peine de justifier : ça ne rapporte aucun point."},"de":{"t":"angeben / nennen","e":"Gib die Einheit der Frequenz an.","u":"⚠ Prüfungswort. „State“ = schreib die kurze Antwort hin, ohne Erklärung. Begründungen bringen hier keine Punkte."},"_k":"state exam command words state the unit of frequency. indicar / escribir indiquer / donner angeben / nennen indica la unidad de la frecuencia. indique l'unite de la frequence. gib die einheit der frequenz an."},{"en":"describe","unit":"Exam command words","ex":"Describe the motion of the car in the first 40 seconds.","es":{"t":"describir","e":"Describe el movimiento del coche en los primeros 40 segundos.","u":"⚠ Palabra de examen. «Describe» = di QUÉ pasa, no por qué. En una gráfica: «it speeds up, then travels at constant speed». Si añades «because», ya estás haciendo «explain»."},"fr":{"t":"décrire","e":"Décris le mouvement de la voiture pendant les 40 premières secondes.","u":"⚠ Mot d'examen. « Describe » = dis CE QUI se passe, pas pourquoi. Sur un graphique : « it speeds up, then travels at constant speed ». Dès que tu écris « because », tu es en train d'expliquer."},"de":{"t":"beschreiben","e":"Beschreibe die Bewegung des Autos in den ersten 40 Sekunden.","u":"⚠ Prüfungswort. „Describe“ = sag, WAS passiert, nicht warum. Bei einem Diagramm: „it speeds up, then ,"fr":{"t":"justifier","e":"Justifie ton choix de cinq valeurs pour la variable indépendante.","u":"⚠ Mot d'examen (critère B). « Justify » = donne les raisons pour lesquelles ton choix est bon, avec des preuves ou de la science. Répéter ton choix ne suffit pas."},"de":{"t":"begründen","e":"Begründe deine Wahl von fünf Werten für die unabhängige Variable.","u":"⚠ Prüfungswort (Kriterium B). „Justify“ = gib Gründe, warum deine Wahl gut ist, mit Belegen oder Physik. Nur die Wahl zu wiederholen reicht nicht."},"_k":"justify exam command words justify your choice of five values for the independent variable. justificar justifier begrunden justifica tu eleccion de cinco valores para la variable independiente. justifie ton choix de cinq valeurs pour la variable independante. begrunde deine wahl von funf werten fur die unabhangige variable."}],"langs":["es","fr","de"],"units":["Electricity & Energy","Exam command words","Investigation skills","Mechanics","Oscillations & Waves"],"ui":{"es":{"ph":"Escribe una palabra — en español o en inglés","all":"Todos los temas","none":"No se ha encontrado nada.","sort_en":"Orden: inglés","sort_xx":"Orden: español","count":"términos"},"fr":{"ph":"Tape un mot — en français ou en anglais","all":"Tous les thèmes","none":"Aucun résultat.","sort_en":"Tri : anglais","sort_xx":"Tri : français","count":"termes"},"de":{"ph":"Gib ein Wort ein — auf Deutsch oder Englisch","all":"Alle Themen","none":"Nichts gefunden.","sort_en":"Sortierung: Englisch","sort_xx":"Sortierung: Deutsch","count":"Begriffe"}},"beta":{"es":"Esta página la ha escrito <strong>Alfred</strong>, el sistema de IA del Sr. Rawson, para ayudarte a estudiar en inglés. <strong>Es nueva, y Alfred todavía está aprendiendo tu idioma, así que algunas cosas estarán mal.</strong> Si una palabra te parece incorrecta, seguramente tengas razón: díselo al Sr. Rawson y la corregimos. Si falta una palabra que necesitas, o se te ocurre cómo mejorar esta página, díselo también. Cambia siempre que lo const KEY = "vocab-lang";
const fold = s => (s||"").toString().toLowerCase()
  .normalize("NFD").replace(/[\u0300-\u036f]/g, "");

function pick() {
  const q = new URLSearchParams(location.search).get("lang");
  if (q && D.langs.includes(q)) { try { localStorage.setItem(KEY, q); } catch (e) {} return q; }
  let s = null; try { s = localStorage.getItem(KEY); } catch (e) {}
  if (s && D.langs.includes(s)) return s;
  return D.langs[0];
}
let L = pick();

function setLang(v) {
  L = v; try { localStorage.setItem(KEY, v); } catch (e) {}
  chrome(); render();
}

function chrome() {
  document.getElementById("langbar").innerHTML = D.langs.map(x =>
    `<button data-l="${x}" aria-pressed="${x === L}">${D.name[x]}</button>`).join("");
  document.querySelectorAll("#langbar button").forEach(b =>
    b.onclick = () => setLang(b.dataset.l));
  document.getElementById("beta").innerHTML = D.beta[L];
  const u = D.ui[L];
  document.getElementById("q").placeholder = u.ph;
  const sel = document.getElementById("unit"), keep = sel.value;
  sel.innerHTML = `<option value="">${u.all}</option>` +
    D.units.map(x => `<option>${x}</option>`).join("");
  sel.value = keep;
  const so = document.getElementById("sort"), ks = so.value;
  so.innerHTML = `<option value="en">${u.sort_en}</option><option value="xx">${u.sort_xx}</option>`;
  so.value = ks || "en";
}

function render() {
  const u = D.ui[L];
  const q = fold(document.getElementById("q").value.trim());
  const unit = document.getElementById("unit").value;
  const sort = document.getElementById("sort").value || "en";
  let rows = D.terms.filter(t => t[L]);
  if (unit) rows = rows.filter(t => t.unit === unit);
  if (q) rows = rows.filter(t => t._k.includes(q));
  rows.sort((a, b) => (sort === "xx" ? fold(a[L].t).localeCompare(fold(b[L].t))
                                     : fold(a.en).localeCompare(fold(b.en))));
  document.getElementById("n").textContent = rows.length + " " + u.count;
  document.getElementById("list").innerHTML = rows.length ? rows.map(t => {
    const w = t[L].u.indexOf("\u26a0") === 0 ? " warn" : "";
    return `<div class="row">
      <div><h3>${esc(t.en)}</h3><p class="xx">${esc(t[L].t)}</p>
        ${t.unit ? `<p class="unit">${esc(t.unit)}</p>` : ""}</div>
      <div>${t.ex ? `<p class="ex">${esc(t.ex)}</p>` : ""}
        <p class="ex tr">${esc(t[L].e)}</p>
        <p class="use${w}">${esc(t[L].u)}</p></div>
    </div>`;
  }).join("") : `<p class="n">${u.none}</p>`;
}

function esc(s) {
  return (s || "").replace(/[&<>"']/g, c =>
    ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"})[c]);
}

document.getElementById("q").addEventListener("input", render);
document.getElementById("unit").addEventListener("change", render);
document.getElementById("sort").addEventListener("change", render);
// A laptop is the only device these students may have in class (spec §2), so the
// keyboard is the fast path: "/" jumps to the box from anywhere on the page.
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement.id !== "q") {
    e.preventDefault(); document.getElementById("q").focus();
  }
});
chrome(); render();
</script>
</body>
</html>
