<script>
const D = {"terms":[{"en":"sprite","unit":"Unit 3a · Game Lab","ex":"Create a sprite and set its x and y position.","es":{"t":"el sprite","e":"Crea un sprite y define su posición x e y.","u":"En español también se dice «sprite», no lo traduzcas. Es un personaje u objeto con su propia imagen que puedes mover: tiene posición, tamaño y velocidad. Se crea con createSprite(x, y)."},"fr":{"t":"le sprite","e":"Crée un sprite et définis sa position x et y.","u":"En français aussi on dit « sprite », ne le traduis pas. C'est un personnage ou un objet avec sa propre image, que tu peux déplacer : il a une position, une taille, une vitesse. On le crée avec createSprite(x, y)."},"de":{"t":"das Sprite","e":"Erstelle ein Sprite und lege seine x- und y-Position fest.","u":"Auch auf Deutsch sagt man „Sprite“, nicht übersetzen. Ein Sprite ist eine Figur oder ein Objekt mit eigenem Bild, das du bewegen kannst: Es hat Position, Größe und Geschwindigkeit. Du erstellst es mit createSprite(x, y)."},"_k":"sprite unit 3a · game lab create a sprite and set its x and y position. el sprite le sprite das sprite crea un sprite y define su posicion x e y. cree un sprite et definis sa position x et y. erstelle ein sprite und lege seine x- und y-position fest."},{"en":"canvas","unit":"Unit 3a · Game Lab","ex":"The canvas in Game Lab is 400 pixels wide and 400 pixels tall.","es":{"t":"el lienzo (el canvas)","e":"El lienzo de Game Lab mide 400 píxeles de ancho y 400 de alto.","u":"⚠ No es un lienzo para pintar. En programación, el canvas es la zona de la pantalla donde dibuja tu programa. En Game Lab mide 400 × 400, y en clase se suele decir «canvas» en inglés."},"fr":{"t":"le canevas (le canvas)","e":"Le canevas de Game Lab fait 400 pixels de large et 400 pixels de haut.","u":"⚠ Rien à voir avec la toile d'un peintre ni le canevas de broderie. En programmation, le canvas est la zone de l'écran où ton programme dessine. Dans Game Lab il fait 400 × 400, et on dit le plus souvent « canvas » en anglais."},"de":{"t":"die Zeichenfläche (der Canvas)","e":"Die Zeichenfläche in Game Lab ist 400 Pixel breit und 400 Pixel hoch.","u":"⚠ Nicht die Leinwand eines Malers. Beim Programmieren ist der canvas der Bereich auf dem Bildschirm, in den dein Programm zeichnet. In Game Lab ist er 400 × 400 Pixel groß; oft sagt man auch auf Deutsch einfach „Canvas“."},"_k":"canvas unit 3a · game lab the canvas in game lab is 400 pixels wide and 400 pixels tall. el lienzo (el canvas) le canevas (le canvas) die zeichenflache (der canvas) el lienzo de game lab mide 400 pixeles de ancho y 400 de alto. le canevas de game lab fait 400 pixels de large et 400 pixels de haut. die zeichenflache in game lab ist 400 pixel breit und 400 pixel hoch."},{"en":"coordinate","unit":"Unit 3a · Game Lab","ex":"The origin (0, 0) is the top-left corner, and y increases as you go down.","es":{"t":"la coordenada","e":"El origen (0, 0) está en la esquina superior izquierda, y la y aumenta hacia abajo.","u":"⚠ En matemáticas la y sube; en Game Lab la y BAJA. El (0, 0), el «origin», está arriba a la izquierda. Una coordenada es la pareja (x, y) que dice dónde va algo en el canvas."},"fr":{"t":"la coordonnée","e":"L'origine (0, 0) est le coin en haut à gauche, et y augmente quand on descend.","u":"⚠ En maths, y monte ; dans Game Lab, y DESCEND. Le (0, 0), l'« origin », est en haut à gauche. Une coordonnée, c'est le couple (x, y) qui dit où placer quelque chose sur le canvas."},"de":{"t":"die Koordinate","e":"Der Ursprung (0, 0) ist die Ecke oben links, und y wird größer, wenn du nach unten gehst.","u":"⚠ In Mathe geht y nach oben, in Game Lab geht y nach UNTEN. Der Punkt (0, 0), der „origin“, liegt oben links. Eine Koordinate ist das Paar (x, y), das sagt, wo etwas auf dem Canvas steht."},"_k":"coordinate unit 3a · game lab the origin (0, 0) is the top-left corner, and y increases as you go down. la coordenada la coordonnee die koordinate el origen (0, 0) esta en la esquina superior izquierda, y la y aumenta hacia abajo. l'origine (0, 0) est le coin en haut a gauche, et y augmente quand on descend. der ursprung (0, 0) ist die ecke oben links, und y wird großer, wenn du nach unten gehst."},{"en":"draw loop","unit":"Unit 3a · Game Lab","ex":"Anything inside the draw loop runs again and again, many times a second.","es":{"t":"el bucle draw (draw loop)","e":"Todo lo que está dentro del draw loop se ejecuta una y otra vez, muchas veces por segundo.","u":"⚠ Aquí «loop» es un bucle: código que se repite, no un lazo ni un rizo. En Game Lab, function draw() se repite unas 30 veces por segundo, y así se crea el movimiento. Se dice «draw loop» también en español."},"fr":{"t":"la boucle draw (draw loop)","e":"Tout ce qui est dans la boucle draw s'exécute encore et encore, plusieurs fois par seconde.","u":"⚠ « Loop » n'est pas une boucle de cheveux : c'est du code qui se répète. Dans Game Lab, function draw() tourne environ 30 fois par seconde, et c'est ça qui crée le mouvement. On dit « draw loop » en français aussi."},"de":{"t":"die Draw-Schleife (draw loop)","e":"Alles in der Draw-Schleife läuft immer wieder, viele Male pro Sekunde.","u":"Ein loop ist eine Schleife: Code, der sich wiederholt. In Game Lab läuft function draw() etwa 30-mal pro Sekunde, und genau das erzeugt Bewegung. Meistens sagt man auch auf Deutsch „draw loop“."},"_k":"draw loop unit 3a · game lab anything inside the draw loop runs again and again, many times a second. el bucle draw (draw loop) la boucle draw (draw loop) die draw-schleife (draw loop) todo lo que esta dentro del draw loop se ejecuta una y otra vez, muchas veces por segundo. tout ce qui est dans la boucle draw s'execute encore et encore, plusieurs fois par seconde. alles in der draw-schleife lauft immer wieder, viele male pro sekunde."},{"en":"parameter","unit":"Unit 3a · Game Lab","ex":"The ellipse block has four parameters: x, y, width and height.","es":{"t":"el parámetro","e":"El bloque ellipse tiene cuatro parámetros: x, y, ancho y alto.","u":"Los huecos que rellenas en un bloque: ellipse(x, y, width, height). El ORDEN importa: el tercero siempre es el ancho, el cuarto el alto. Pasa el ratón por el bloque para ver sus nombres."},"fr":{"t":"le paramètre","e":"Le bloc ellipse a quatre paramètres : x, y, largeur et hauteur.","u":"Les cases que tu remplis dans un bloc : ellipse(x, y, width, height). L'ORDRE compte : le troisième est toujours la largeur, le quatrième la hauteur. Passe la souris sur le bloc pour voir leurs noms."},"de":{"t":"der Parameter","e":"Der Ellipse-Block hat vier Parameter: x, y, Breite und Höhe.","u":"Die Lücken, die du in einem Block ausfüllst: ellipse(x, y, width, height). Die REIHENFOLGE zählt: Der dritte ist immer die Breite, der vierte die Höhe. Fahr mit der Maus über den Block, um die Namen zu sehen."},"_k":"parameter unit 3a · game lab the ellipse block has four parameters: x, y, width and height. el parametro le parametre der parameter el bloque ellipse tiene cuatro parametros: x, y, ancho y alto. le bloc ellipse a quatre parametres : x, y, largeur et hauteur. der ellipse-block hat vier parameter: x, y, breite und hohe."},{"en":"argument","unit":"Unit 3a · Game Lab","ex":"In rect(50, 50, 100, 20), the arguments are 50, 50, 100 and 20.","es":{"t":"el argumento","e":"En rect(50, 50, 100, 20), los argumentos son 50, 50, 100 y 20.","u":"⚠ No es una discusión ni el argumento de una película. Un argument es el valor real que escribes en un hueco: el parameter es el hueco (width), el argument es lo que pones dentro (100). En clase casi siempre decimos «parameter» para los dos."},"fr":{"t":"l'argument","e":"Dans rect(50, 50, 100, 20), les arguments sont 50, 50, 100 et 20.","u":"⚠ Ce n'est ni une dispute ni une raison dans un débat. Un argument est la valeur réelle que tu écris dans une case : le parameter est la case (width), l'argument est ce que tu y mets (100). En classe, on dit presque toujours « parameter » pour les deux."},"de":{"t":"das Argument","e":"In rect(50, 50, 100, 20) sind die Argumente 50, 50, 100 und 20.","u":"⚠ Kein Streit und kein Grund in einer Diskussion. Ein argument ist der echte Wert, den du in eine Lücke schreibst: Der parameter ist die Lücke (width), das argument ist, was du hineinschreibst (100). Im Unterricht sagen wir für beides meist „parameter“."},"_k":"argument unit 3a · game lab in rect(50, 50, 100, 20), the arguments are 50, 50, 100 and 20. el argumento l'argument das argument en rect(50, 50, 100, 20), los argumentos son 50, 50, 100 y 20. dans rect(50, 50, 100, 20), les arguments sont 50, 50, 100 et 20. in rect(50, 50, 100, 20) sind die argumente 50, 50, 100 und 20."},{"en":"variable","unit":"Unit 3a · Game Lab","ex":"Store the score in a variable so you can change it later.","es":{"t":"la variable","e":"Guarda la puntuación en una variable para poder cambiarla después.","u":"Una caja con nombre que guarda un valor: var score = 0. Puedes cambiar lo que hay dentro con el counter pattern. Un sprite es en realidad una variable que guarda muchas cosas a la vez."},"fr":{"t":"la variable","e":"Range le score dans une variable pour pouvoir le changer plus tard.","u":"Une boîte avec un nom qui garde une valeur : var score = 0. Tu peux changer ce qu'il y a dedans avec le counter pattern. Un sprite est en fait une variable qui garde plein de choses à la fois."},"de":{"t":"die Variable","e":"Speichere den Punktestand in einer Variablen, damit du ihn später ändern kannst.","u":"Eine Box mit Namen, die einen Wert aufbewahrt: var score = 0. Mit dem counter pattern kannst du den Inhalt verändern. Ein Sprite ist eigentlich eine Variable, die viele Dinge auf einmal speichert."},"_k":"variable unit 3a · game lab store the score in a variable so you can change it later. la variable la variable die variable guarda la puntuacion en una variable para poder cambiarla despues. range le score dans une variable pour pouvoir le changer plus tard. speichere den punktestand in einer variablen, damit du ihn spater andern kannst."},{"en":"property","unit":"Unit 3a · Game Lab","ex":"Change the sprite's scale property to make it bigger.","es":{"t":"la propiedad","e":"Cambia la propiedad scale del sprite para hacerlo más grande.","u":"⚠ No es una propiedad como una casa o un terreno. Una property es una característica de un sprite que puedes leer o cambiar: sprite.x, sprite.scale, sprite.rotation, sprite.visible. Se escribe con un punto después del nombre del sprite."},"fr":{"t":"la propriété","e":"Change la propriété scale du sprite pour l'agrandir.","u":"⚠ Rien à voir avec une propriété comme une maison ou un terrain. Une property est une caractéristique d'un sprite que tu peux lire ou modifier : sprite.x, sprite.scale, sprite.rotation, sprite.visible. Ça s'écrit avec un point après le nom du sprite."},"de":{"t":"die Eigenschaft (Property)","e":"Ändere die Eigenschaft scale des Sprites, um es größer zu machen.","u":"⚠ Nicht „Besitz“ und kein Grundstück. Eine property ist ein Merkmal eines Sprites, das du lesen oder ändern kannst: sprite.x, sprite.scale, sprite.rotation, sprite.visible. Man schreibt einen Punkt nach dem Namen des Sprites."},"_k":"property unit 3a · game lab change the sprite's scale property to make it bigger. la propiedad la propriete die eigenschaft (property) cambia la propiedad scale del sprite para hacerlo mas grande. change la propriete scale du sprite pour l'agrandir. andere die eigenschaft scale des sprites, um es großer zu machen."},{"en":"random","unit":"Unit 3a · Game Lab","ex":"Use randomNumber(0, 400) to put the sprite somewhere random on the canvas.","es":{"t":"aleatorio","e":"Usa randomNumber(0, 400) para poner el sprite en un lugar aleatorio del canvas.","u":"⚠ En español coloquial «random» significa raro o sin sentido; en programación significa al azar, y cada vez sale un número distinto. randomNumber(0, 400) da un número entero entre 0 y 400, los dos incluidos."},"fr":{"t":"aléatoire","e":"Utilise randomNumber(0, 400) pour mettre le sprite à un endroit aléatoire du canvas.","u":"⚠ En français familier, « random » veut dire bizarre ou n'importe quoi ; en programmation, ça veut dire au hasard, et le nombre change à chaque fois. randomNumber(0, 400) donne un nombre entier entre 0 et 400, les deux compris."},"de":{"t":"zufällig","e":"Benutze randomNumber(0, 400), um das Sprite an eine zufällige Stelle auf dem Canvas zu setzen.","u":"Random heißt zufällig: Jedes Mal kommt eine andere Zahl heraus. randomNumber(0, 400) gibt eine ganze Zahl zwischen 0 und 400, beide eingeschlossen. Setz es in die Draw-Schleife, und das Sprite zittert."},"_k":"random unit 3a · game lab use randomnumber(0, 400) to put the sprite somewhere random on the canvas. aleatorio aleatoire zufallig usa randomnumber(0, 400) para poner el sprite en un lugar aleatorio del canvas. utilise randomnumber(0, 400) pour mettre le sprite a un endroit aleatoire du canvas. benutze randomnumber(0, 400), um das sprite an eine zufallige stelle auf dem canvas zu setzen."},{"en":"counter pattern","unit":"Unit 3a · Game Lab","ex":"The counter pattern sprite.x = sprite.x + 1 moves the sprite right, one pixel each frame.","es":{"t":"el patrón contador (counter pattern)","e":"El counter pattern sprite.x = sprite.x + 1 mueve el sprite a la derecha, un píxel en cada frame.","u":"Nombre de code.org, no lo traduzcas. «Coge el valor viejo, súmale algo, guárdalo otra vez.» Dentro del draw loop se repite, así que el sprite se mueve poco a poco. Para ir a la izquierda, resta."},"fr":{"t":"le motif compteur (counter pattern)","e":"Le counter pattern sprite.x = sprite.x + 1 déplace le sprite vers la droite, d'un pixel à chaque image.","u":"Nom donné par code.org, garde-le en anglais. « Prends l'ancienne valeur, ajoute quelque chose, range-la à nouveau. » Dans le draw loop, ça se répète, donc le sprite avance petit à petit. Pour aller à gauche, soustrais."},"de":{"t":"das Zählmuster (counter pattern)","e":"Das counter pattern sprite.x = sprite.x + 1 bewegt das Sprite nach rechts, einen Pixel pro Bild.","u":"Ein Name von code.org, bleibt auf Englisch. „Nimm den alten Wert, zähle etwas dazu, speichere ihn wieder.“ In der Draw-Schleife wiederholt sich das, also bewegt sich das Sprite Stück für Stück. Nach links: abziehen."},"_k":"counter pattern unit 3a · game lab the counter pattern sprite.x = sprite.x + 1 moves the sprite right, one pixel each frame. el patron contador (counter pattern) le motif compteur (counter pattern) das zahlmuster (counter pattern) el counter pattern sprite.x = sprite.x + 1 mueve el sprite a la derecha, un pixel en cada frame. le counter pattern sprite.x = sprite.x + 1 deplace le sprite vers la droite, d'un pixel a chaque image. das counter pattern sprite.x = sprite.x + 1 bewegt das sprite nach rechts, einen pixel pro bild."},{"en":"conditional","unit":"Unit 3a · Game Lab","ex":"Write a conditional so the sprite only moves when the space bar is pressed.","es":{"t":"el condicional (la sentencia if)","e":"Escribe un condicional para que el sprite solo se mueva cuando se pulsa la barra espaciadora.","u":"Un if: «si esto es verdad, haz esto». if (keyDown('space')) { ... }. Con else puedes decir qué pasa si no. Tu tarjeta necesita al menos tres condicionales."},"fr":{"t":"la condition (l'instruction if)","e":"Écris une condition pour que le sprite bouge seulement quand on appuie sur la barre d'espace.","u":"Un if : « si c'est vrai, fais ceci ». if (keyDown('space')) { ... }. Avec else, tu dis ce qui se passe sinon. Ta carte doit avoir au moins trois conditions."},"de":{"t":"die Bedingung (die if-Anweisung)","e":"Schreib eine Bedingung, damit sich das Sprite nur bewegt, wenn die Leertaste gedrückt wird.","u":"Ein if: „Wenn das wahr ist, tu dies.“ if (keyDown('space')) { ... }. Mit else sagst du, was sonst passiert. Deine Karte braucht mindestens drei Bedingungen."},"_k":"conditional unit 3a · game lab write a conditional so the sprite only moves when the space bar is pressed. el condicional (la sentencia if) la condition (l'instruction if) die bedingung (die if-anweisung) escribe un condicional para que el sprite solo se mueva cuando se pulsa la barra espaciadora. ecris une condition pour que le sprite bouge seulement quand on appuie sur la barre d'espace. schreib eine bedingung, damit sich das sprite nur bewegt, wenn die leertaste gedruckt wird."},{"en":"boolean","unit":"Unit 3a · Game Lab","ex":"keyDown('up') gives a boolean: true while the key is held, false otherwise.","es":{"t":"el booleano","e":"keyDown('up') da un booleano: true mientras la tecla está pulsada, false si no.","u":"Un valor que solo puede ser true o false (verdadero o falso). Es lo que va dentro de los paréntesis de un if. En el código se escribe «boolean»; en español, «booleano». Viene de un matemático, George Boole."},"fr":{"t":"le booléen","e":"keyDown('up') donne un booléen : true tant que la touche est enfoncée, false sinon.","u":"Une valeur qui ne peut être que true ou false (vrai ou faux). C'est ce qui va entre les parenthèses d'un if. En code, c'est « boolean » ; en français, « booléen ». Ça vient d'un mathématicien, George Boole."},"de":{"t":"der Boolesche Wert (boolean)","e":"keyDown('up') liefert einen Booleschen Wert: true, solange die Taste gedrückt ist, sonst false.","u":"Ein Wert, der nur true oder false sein kann (wahr oder falsch). Das steht in den Klammern eines if. Im Code heißt es „boolean“; auf Deutsch sagt man auch „boolesch“. Benannt nach dem Mathematiker George Boole."},"_k":"boolean unit 3a · game lab keydown('up') gives a boolean: true while the key is held, false otherwise. el booleano le booleen der boolesche wert (boolean) keydown('up') da un booleano: true mientras la tecla esta pulsada, false si no. keydown('up') donne un booleen : true tant que la touche est enfoncee, false sinon. keydown('up') liefert einen booleschen wert: true, solange die taste gedruckt ist, sonst false."},{"en":"input (user input)","unit":"Unit 3a · Game Lab","ex":"Your card needs two conditionals that respond to user input, such as a key press or a mouse click.","es":{"t":"la entrada (del usuario)","e":"Tu tarjeta necesita dos condicionales que respondan a la entrada del usuario, como pulsar una tecla o hacer clic.","u":"⚠ Aquí «input» no es la entrada de un edificio: es lo que hace la persona que usa tu programa (teclado o ratón). Bloques: keyDown(), mouseDown(), mousePressedOver(sprite). En clase se dice «input» muchas veces sin traducir."},"fr":{"t":"l'entrée (utilisateur)","e":"Ta carte a besoin de deux conditions qui réagissent à une entrée de l'utilisateur, comme une touche ou un clic.","u":"⚠ Ici « input » n'est pas l'entrée d'un bâtiment : c'est ce que fait la personne qui utilise ton programme (clavier ou souris). Blocs : keyDown(), mouseDown(), mousePressedOver(sprite). En classe on dit souvent « input » sans traduire."},"de":{"t":"die Eingabe (Benutzereingabe)","e":"Deine Karte braucht zwei Bedingungen, die auf eine Eingabe reagieren, etwa einen Tastendruck oder einen Mausklick.","u":"Input ist das, was die Person macht, die dein Programm benutzt: Tastatur oder Maus. Blöcke: keyDown(), mouseDown(), mousePressedOver(sprite). Im Unterricht sagt man oft einfach „input“."},"_k":"input (user input) unit 3a · game lab your card needs two conditionals that respond to user input, such as a key press or a mouse click. la entrada (del usuario) l'entree (utilisateur) die eingabe (benutzereingabe) tu tarjeta necesita dos condicionales que respondan a la entrada del usuario, como pulsar una tecla o hacer clic. ta carte a besoin de deux conditions qui reagissent a une entree de l'utilisateur, comme une touche ou un clic. deine karte braucht zwei bedingungen, die auf eine eingabe reagieren, etwa einen tastendruck oder einen mausklick."},{"en":"animation","unit":"Unit 3a · Game Lab","ex":"Use the Animation Tab to draw the sprite's animation, then load it with setAnimation.","es":{"t":"la animación","e":"Usa la pestaña Animation para dibujar la animación del sprite y cárgala con setAnimation.","u":"⚠ En Game Lab «animation» tiene dos sentidos. Uno es el normal: cosas que se mueven en pantalla. El otro es la IMAGEN (o las imágenes) de un sprite, que se dibuja en la pestaña Animation: sprite.setAnimation('gato'). Fíjate en cuál te piden."},"fr":{"t":"l'animation","e":"Utilise l'onglet Animation pour dessiner l'animation du sprite, puis charge-la avec setAnimation.","u":"⚠ Dans Game Lab, « animation » a deux sens. Le sens normal : des choses qui bougent à l'écran. Et aussi l'IMAGE (ou les images) d'un sprite, dessinée dans l'onglet Animation : sprite.setAnimation('chat'). Regarde bien lequel on te demande."},"de":{"t":"die Animation","e":"Zeichne die Animation des Sprites im Animation-Tab und lade sie mit setAnimation.","u":"⚠ In Game Lab hat „animation“ zwei Bedeutungen. Die normale: Dinge, die sich auf dem Bildschirm bewegen. Und dann das BILD (oder die Bilder) eines Sprites, gezeichnet im Animation-Tab: sprite.setAnimation('katze'). Achte darauf, welche gemeint ist."},"_k":"animation unit 3a · game lab use the animation tab to draw the sprite's animation, then load it with setanimation. la animacion l'animation die animation usa la pestana animation para dibujar la animacion del sprite y cargala con setanimation. utilise l'onglet animation pour dessiner l'animation du sprite, puis charge-la avec setanimation. zeichne die animation des sprites im animation-tab und lade sie mit setanimation."},{"en":"fill / stroke","unit":"Unit 3a · Game Lab","ex":"Set the fill to red and the stroke to black before you draw the circle.","es":{"t":"el relleno / el contorno","e":"Pon el relleno en rojo y el contorno en negro antes de dibujar el círculo.","u":"⚠ «Stroke» no es una brazada ni un derrame: aquí es la línea del borde de una figura. fill('red') pinta el interior; stroke('black') pinta el borde; strokeWeight(4) lo hace más grueso. noFill() y noStroke() los quitan. El color se aplica a todo lo que dibujes DESPUÉS."},"fr":{"t":"le remplissage / le contour","e":"Mets le remplissage en rouge et le contour en noir avant de dessiner le cercle.","u":"⚠ « Stroke » n'est ni un coup ni une nage : ici, c'est la ligne du bord d'une forme. fill('red') colore l'intérieur ; stroke('black') colore le bord ; strokeWeight(4) l'épaissit. noFill() et noStroke() les enlèvent. La couleur s'applique à tout ce que tu dessines APRÈS."},"de":{"t":"die Füllung / der Rand (die Kontur)","e":"Setze die Füllung auf Rot und den Rand auf Schwarz, bevor du den Kreis zeichnest.","u":"⚠ „Stroke“ ist hier kein Schlag und kein Schlaganfall: Es ist die Linie am Rand einer Form. fill('red') färbt das Innere; stroke('black') den Rand; strokeWeight(4) macht ihn dicker. noFill() und noStroke() schalten sie aus. Die Farbe gilt für alles, was du DANACH zeichnest."},"_k":"fill / stroke unit 3a · game lab set the fill to red and the stroke to black before you draw the circle. el relleno / el contorno le remplissage / le contour die fullung / der rand (die kontur) pon el relleno en rojo y el contorno en negro antes de dibujar el circulo. mets le remplissage en rouge et le contour en noir avant de dessiner le cercle. setze die fullung auf rot und den rand auf schwarz, bevor du den kreis zeichnest."},{"en":"string","unit":"Unit 3a · Game Lab","ex":"text('Happy Birthday', 200, 50) — the message in quotes is a string.","es":{"t":"la cadena de texto (el string)","e":"text('Feliz cumpleaños', 200, 50): el mensaje entre comillas es un string.","u":"⚠ No es una cuerda. Un string es texto: letras entre comillas. Sin comillas, el ordenador cree que es el nombre de una variable y da error. En clase se dice «string» o «cadena»."},"fr":{"t":"la chaîne de caractères (le string)","e":"text('Joyeux anniversaire', 200, 50) : le message entre guillemets est un string.","u":"⚠ Pas une ficelle. Un string, c'est du texte : des lettres entre guillemets. Sans guillemets, l'ordinateur croit que c'est le nom d'une variable et ça plante. En classe on dit « string » ou « chaîne »."},"de":{"t":"die Zeichenkette (der String)","e":"text('Alles Gute', 200, 50): Die Nachricht in Anführungszeichen ist ein String.","u":"⚠ Keine Schnur. Ein string ist Text: Buchstaben in Anführungszeichen. Ohne Anführungszeichen denkt der Computer, es sei ein Variablenname, und es gibt einen Fehler. Auch auf Deutsch sagt man meist „String“."},"_k":"string unit 3a · game lab text('happy birthday', 200, 50) — the message in quotes is a string. la cadena de texto (el string) la chaine de caracteres (le string) die zeichenkette (der string) text('feliz cumpleanos', 200, 50): el mensaje entre comillas es un string. text('joyeux anniversaire', 200, 50) : le message entre guillemets est un string. text('alles gute', 200, 50): die nachricht in anfuhrungszeichen ist ein string."},{"en":"bug / to debug","unit":"Unit 3a · Game Lab","ex":"There is a bug: the sprite disappears. Debug it one line at a time.","es":{"t":"el error (el bug) / depurar","e":"Hay un bug: el sprite desaparece. Depúralo línea a línea.","u":"⚠ Un bug no es un bicho: es un error en el código. «To debug» es buscarlo y arreglarlo. En español también se dice «bug» y «debuguear», aunque lo correcto es «depurar». Consejo: cambia una cosa, pulsa Run, mira qué pasa."},"fr":{"t":"le bug (le bogue) / déboguer","e":"Il y a un bug : le sprite disparaît. Débogue-le ligne par ligne.","u":"⚠ Un bug n'est pas un insecte : c'est une erreur dans le code. « To debug », c'est le chercher et le corriger. En français on dit « bug » ou « bogue », et « déboguer ». Astuce : change une chose, clique sur Run, regarde ce qui se passe."},"de":{"t":"der Bug (der Fehler) / debuggen","e":"Da ist ein Bug: Das Sprite verschwindet. Debugge Zeile für Zeile.","u":"⚠ Ein bug ist kein Käfer: Es ist ein Fehler im Code. „To debug“ heißt, ihn suchen und beheben. Auf Deutsch sagt man genauso „Bug“ und „debuggen“. Tipp: Ändere eine Sache, klick auf Run, schau, was passiert."},"_k":"bug / to debug unit 3a · game lab there is a bug: the sprite disappears. debug it one line at a time. el error (el bug) / depurar le bug (le bogue) / deboguer der bug (der fehler) / debuggen hay un bug: el sprite desaparece. depuralo linea a linea. il y a un bug : le sprite disparait. debogue-le ligne par ligne. da ist ein bug: das sprite verschwindet. debugge zeile fur zeile."},{"en":"to run (a program)","unit":"Unit 3a · Game Lab","ex":"Click Run to see what your code does.","es":{"t":"ejecutar","e":"Haz clic en Run para ver qué hace tu código.","u":"⚠ No es «correr» con las piernas. En programación, to run es ejecutar: el ordenador sigue tus instrucciones. «Run» es el botón verde de Game Lab; «Reset» lo para y vuelve al principio."},"fr":{"t":"exécuter (lancer)","e":"Clique sur Run pour voir ce que fait ton code.","u":"⚠ Ce n'est pas « courir ». En programmation, to run veut dire exécuter : l'ordinateur suit tes instructions. « Run » est le bouton vert de Game Lab ; « Reset » l'arrête et revient au début."},"de":{"t":"ausführen (starten)","e":"Klick auf Run, um zu sehen, was dein Code macht.","u":"⚠ Nicht „rennen“. Beim Programmieren heißt to run ausführen: Der Computer folgt deinen Anweisungen. „Run“ ist der grüne Knopf in Game Lab; „Reset“ stoppt und geht zum Anfang zurück. Auf Deutsch sagt man auch „das Programm läuft“."},"_k":"to run (a program) unit 3a · game lab click run to see what your code does. ejecutar executer (lancer) ausfuhren (starten) haz clic en run para ver que hace tu codigo. clique sur run pour voir ce que fait ton code. klick auf run, um zu sehen, was dein code macht."},{"en":"design cycle","unit":"MYP Design cycle","ex":"The interactive card takes you through the whole design cycle, Criteria A to D.","es":{"t":"el ciclo de diseño","e":"La tarjeta interactiva te lleva por todo el ciclo de diseño, de los criterios A a D.","u":"Los cuatro pasos del diseño en el MYP, y cada uno es un criterio: A Investigación y análisis, B Desarrollo de ideas, C Creación de la solución, D Evaluación. En este curso, cada summative es uno de ellos."},"fr":{"t":"le cycle de conception","e":"La carte interactive te fait passer par tout le cycle de conception, critères A à D.","u":"Les quatre étapes du design au MYP, et chacune est un critère : A Recherche et analyse, B Développement des idées, C Création de la solution, D Évaluation. Dans ce cours, chaque summative en est une."},"de":{"t":"der Designzyklus","e":"Die interaktive Karte führt dich durch den ganzen Designzyklus, Kriterien A bis D.","u":"Die vier Schritte des Designs im MYP, und jeder ist ein Kriterium: A Erkunden und Analysieren, B Ideen entwickeln, C Die Lösung erstellen, D Bewerten. In diesem Kurs ist jedes Summative einer davon."},"_k":"design cycle myp design cycle the interactive card takes you through the whole design cycle, criteria a to d. el ciclo de diseno le cycle de conception der designzyklus la tarjeta interactiva te lleva por todo el ciclo de diseno, de los criterios a a d. la carte interactive te fait passer par tout le cycle de conception, criteres a a d. die interaktive karte fuhrt dich durch den ganzen designzyklus, kriterien a bis d."},{"en":"criterion / criteria","unit":"MYP Design cycle","ex":"Review the game against three criteria of your choice.","es":{"t":"el criterio / los criterios","e":"Analiza el juego según tres criterios que elijas tú.","u":"⚠ «Criteria» es PLURAL; uno solo es «a criterion». Tiene dos usos en este curso: los criterios del MYP (A, B, C, D) con los que se te evalúa, y los criterios que eliges tú para juzgar un juego (dificultad, gráficos, sonido…)."},"fr":{"t":"le critère / les critères","e":"Analyse le jeu selon trois critères de ton choix.","u":"⚠ « Criteria » est un PLURIEL ; au singulier c'est « a criterion ». Deux usages dans ce cours : les critères du MYP (A, B, C, D) sur lesquels tu es noté, et les critères que tu choisis toi-même pour juger un jeu (difficulté, graphismes, son…)."},"de":{"t":"das Kriterium / die Kriterien","e":"Bewerte das Spiel nach drei Kriterien deiner Wahl.","u":"⚠ „Criteria“ ist MEHRZAHL; eins allein heißt „a criterion“. Zwei Bedeutungen im Kurs: die MYP-Kriterien (A, B, C, D), nach denen du benotet wirst, und die Kriterien, die du selbst wählst, um ein Spiel zu beurteilen (Schwierigkeit, Grafik, Sound …)."},"_k":"criterion / criteria myp design cycle review the game against three criteria of your choice. el criterio / los criterios le critere / les criteres das kriterium / die kriterien analiza el juego segun tres criterios que elijas tu. analyse le jeu selon trois criteres de ton choix. bewerte das spiel nach drei kriterien deiner wahl."},{"en":"design brief","unit":"MYP Design cycle","ex":"Your design brief says who the game is for, what genre it is, and sums it up in a sentence.","es":{"t":"el brief de diseño (el encargo)","e":"Tu design brief dice para quién es el juego, de qué género es y lo resume en una frase.","u":"⚠ «Brief» normalmente significa «breve», pero aquí es un sustantivo: la descripción corta del encargo. Es la parte final del Summative A: público objetivo, estilo o género, y un resumen de una o dos frases. No es lo mismo que la «specification»."},"fr":{"t":"le brief de conception (le cahier des charges initial)","e":"Ton design brief dit à qui le jeu est destiné, quel est son genre, et le résume en une phrase.","u":"⚠ « Brief » veut normalement dire « bref », mais ici c'est un nom : la courte description de la commande. C'est la fin du Summative A : public cible, style ou genre, et un résumé en une ou deux phrases. Ce n'est pas la même chose que la « specification »."},"de":{"t":"der Design-Brief (die Aufgabenstellung)","e":"Dein Design-Brief sagt, für wen das Spiel ist, welches Genre es hat, und fasst es in einem Satz zusammen.","u":"⚠ „Brief“ heißt hier nicht „kurz“ und ist auch kein Brief zum Verschicken: Es ist die kurze Beschreibung des Auftrags. Das ist das Ende von Summative A: Zielgruppe, Stil oder Genre und eine Zusammenfassung in ein, zwei Sätzen. Nicht dasselbe wie die „specification“."},"_k":"design brief myp design cycle your design brief says who the game is for, what genre it is, and sums it up in a sentence. el brief de diseno (el encargo) le brief de conception (le cahier des charges initial) der design-brief (die aufgabenstellung) tu design brief dice para quien es el juego, de que genero es y lo resume en una frase. ton design brief dit a qui le jeu est destine, quel est son genre, et le resume en une phrase. dein design-brief sagt, fur wen das spiel ist, welches genre es hat, und fasst es in einem satz zusammen."},{"en":"design specification","unit":"MYP Design cycle","ex":"A design specification is a list of requirements you can test later: does the card do this, yes or no?","es":{"t":"la especificación de diseño","e":"Una especificación de diseño es una lista de requisitos que puedes comprobar después: ¿la tarjeta hace esto, sí o no?","u":"La lista de lo que tu tarjeta DEBE hacer: para qué ocasión, para quién, qué elementos (algunos interactivos) y otros requisitos como fuentes, colores o sonido. Se evalúa en el Summative B, y en el D compruebas si la cumpliste. Si la escribe una IA, cero."},"fr":{"t":"le cahier des charges (la spécification)","e":"Un cahier des charges est une liste d'exigences que tu pourras tester plus tard : la carte fait-elle ceci, oui ou non ?","u":"La liste de ce que ta carte DOIT faire : pour quelle occasion, pour qui, quels éléments (dont des interactifs) et d'autres exigences comme les polices, les couleurs ou le son. C'est noté au Summative B, et au D tu vérifies si tu l'as respectée. Si c'est une IA qui l'écrit, zéro."},"de":{"t":"die Design-Spezifikation (die Anforderungsliste)","e":"Eine Design-Spezifikation ist eine Liste von Anforderungen, die du später prüfen kannst: Tut die Karte das, ja oder nein?","u":"Die Liste dessen, was deine Karte tun MUSS: für welchen Anlass, für wen, welche Elemente (einige interaktiv) und weitere Anforderungen wie Schriften, Farben oder Sound. Benotet in Summative B; in D prüfst du, ob du sie erfüllt hast. Schreibt sie eine KI, gibt es null Punkte."},"_k":"design specification myp design cycle a design specification is a list of requirements you can test later: does the card do this, yes or no? la especificacion de diseno le cahier des charges (la specification) die design-spezifikation (die anforderungsliste) una especificacion de diseno es una lista de requisitos que puedes comprobar despues: ¿la tarjeta hace esto, si o no? un cahier des charges est une liste d'exigences que tu pourras tester plus tard : la carte fait-elle ceci, oui ou non ? eine design-spezifikation ist eine liste von anforderungen, die du spater prufen kannst: tut die karte das, ja oder nein?"},{"en":"target audience / target market","unit":"MYP Design cycle","ex":"Describe your target market: their age, interests, skill level and what they might pay.","es":{"t":"el público objetivo (el mercado objetivo)","e":"Describe tu público objetivo: su edad, sus intereses, su nivel y cuánto pagarían.","u":"⚠ «Target» no es una diana para disparar. El target audience es la gente para la que diseñas. En el Summative A se llama «target market»: la misma idea, pensando en quién lo compraría."},"fr":{"t":"le public cible (le marché cible)","e":"Décris ton marché cible : l'âge, les centres d'intérêt, le niveau et ce qu'ils paieraient.","u":"⚠ « Target » n'est pas une cible de tir. Le target audience, ce sont les gens pour qui tu conçois. Dans le Summative A on dit « target market » : la même idée, en pensant à qui l'achèterait."},"de":{"t":"die Zielgruppe","e":"Beschreibe deine Zielgruppe: Alter, Interessen, Können und was sie zahlen würden.","u":"„Target“ ist hier keine Zielscheibe. Die target audience sind die Leute, für die du entwirfst. In Summative A heißt es „target market“: dieselbe Idee, nur mit der Frage, wer es kaufen würde."},"_k":"target audience / target market myp design cycle describe your target market: their age, interests, skill level and what they might pay. el publico objetivo (el mercado objetivo) le public cible (le marche cible) die zielgruppe describe tu publico objetivo: su edad, sus intereses, su nivel y cuanto pagarian. decris ton marche cible : l'age, les centres d'interet, le niveau et ce qu'ils paieraient. beschreibe deine zielgruppe: alter, interessen, konnen und was sie zahlen wurden."},{"en":"test plan","unit":"MYP Design cycle","ex":"Write a test plan with three columns: action, effect, does it work?","es":{"t":"el plan de pruebas","e":"Escribe un plan de pruebas con tres columnas: acción, efecto, ¿funciona?","u":"⚠ Aquí «test» no es un examen. Un test es probar una cosa concreta de tu tarjeta: «pulso la S, cambia de pantalla, ¿sí o no?». Mínimo cinco. Un test que falla y lo apuntas vale MÁS que uno que borras."},"fr":{"t":"le plan de test","e":"Écris un plan de test avec trois colonnes : action, effet, ça marche ?","u":"⚠ Ici « test » n'est pas un contrôle. Un test, c'est essayer une chose précise de ta carte : « j'appuie sur S, l'écran change, oui ou non ? ». Au moins cinq. Un test qui échoue et que tu notes vaut PLUS qu'un test que tu effaces."},"de":{"t":"der Testplan","e":"Schreib einen Testplan mit drei Spalten: Aktion, Wirkung, funktioniert es?","u":"⚠ „Test“ ist hier keine Klassenarbeit. Ein test heißt, eine bestimmte Sache an deiner Karte auszuprobieren: „Ich drücke S, der Bildschirm wechselt, ja oder nein?“ Mindestens fünf. Ein Test, der scheitert und den du aufschreibst, bringt MEHR Punkte als einer, den du löschst."},"_k":"test plan myp design cycle write a test plan with three columns: action, effect, does it work? el plan de pruebas le plan de test der testplan escribe un plan de pruebas con tres columnas: accion, efecto, ¿funciona? ecris un plan de test avec trois colonnes : action, effet, ca marche ? schreib einen testplan mit drei spalten: aktion, wirkung, funktioniert es?"},{"en":"feedback","unit":"MYP Design cycle","ex":"Ask three classmates for constructive, critical feedback on your card.","es":{"t":"los comentarios (el feedback)","e":"Pide a tres compañeros comentarios constructivos y críticos sobre tu tarjeta.","u":"En español se dice «feedback» sin traducir, o «comentarios». «Critical» aquí no es «negativo»: es honesto y útil. Un amigo que dice «está genial» no te da feedback. Pregunta qué les confundió y qué no funcionó."},"fr":{"t":"les retours (le feedback)","e":"Demande à trois camarades un feedback constructif et critique sur ta carte.","u":"En français on dit « feedback » sans traduire, ou « retours ». « Critical » ici ne veut pas dire « méchant » : ça veut dire honnête et utile. Un ami qui dit « c'est génial » ne te donne pas de feedback. Demande ce qui les a perdus et ce qui n'a pas marché."},"de":{"t":"das Feedback (die Rückmeldung)","e":"Bitte drei Mitschüler um konstruktives, kritisches Feedback zu deiner Karte.","u":"Auf Deutsch sagt man genauso „Feedback“. „Critical“ heißt hier nicht „gemein“, sondern ehrlich und nützlich. Wer nur „super!“ sagt, gibt kein Feedback. Frag, was verwirrend war und was nicht funktioniert hat."},"_k":"feedback myp design cycle ask three classmates for constructive, critical feedback on your card. los comentarios (el feedback) les retours (le feedback) das feedback (die ruckmeldung) pide a tres companeros comentarios constructivos y criticos sobre tu tarjeta. demande a trois camarades un feedback constructif et critique sur ta carte. bitte drei mitschuler um konstruktives, kritisches feedback zu deiner karte."},{"en":"describe","unit":"MYP command terms","ex":"Describe your scene in a few sentences.","es":{"t":"describir","e":"Describe tu escena en unas pocas frases.","u":"⚠ Término del MYP. «Describe» significa cuenta QUÉ hay y qué pasa, con detalle, sin decir por qué. «Buenos gráficos» no es describir; «pixel art sencillo con colores que destacan sobre el fondo» sí."},"fr":{"t":"décrire","e":"Décris ta scène en quelques phrases.","u":"⚠ Terme du MYP. « Describe » veut dire : raconte CE QU'il y a et ce qui se passe, en détail, sans dire pourquoi. « De bons graphismes », ce n'est pas décrire ; « du pixel art simple avec des couleurs qui ressortent sur le fond », oui."},"de":{"t":"beschreiben","e":"Beschreibe deine Szene in ein paar Sätzen.","u":"⚠ MYP-Begriff. „Describe“ heißt: Sag genau, WAS da ist und was passiert, ohne das Warum. „Gute Grafik“ ist keine Beschreibung; „einfache Pixelgrafik mit Farben, die sich vom Hintergrund abheben“ schon."},"_k":"describe myp command terms describe your scene in a few sentences. describir decrire beschreiben describe tu escena en unas pocas frases. decris ta scene en quelques phrases. beschreibe deine szene in ein paar satzen."},{"en":"explain","unit":"MYP command terms","ex":"Explain why the order of the instructions changes the drawing.","es":{"t":"explicar","e":"Explica por qué el orden de las instrucciones cambia el dibujo.","u":"⚠ Término del MYP. «Explain» significa da razones y causas: qué pasa Y por qué. Casi siempre necesitas «because». Si solo dices qué pasa, eso es «describe» y vale menos puntos."},"fr":{"t":"expliquer","e":"Explique pourquoi l'ordre des instructions change le dessin.","u":"⚠ Terme du MYP. « Explain » veut dire : donne les raisons et les causes, ce qui se passe ET pourquoi. Il te faut presque toujours « because ». Si tu dis juste ce qui se passe, c'est « describe », et ça rapporte moins."},"de":{"t":"erklären","e":"Erkläre, warum die Reihenfolge der Anweisungen die Zeichnung verändert.","u":"⚠ MYP-Begriff. „Explain“ heißt: Gib Gründe und Ursachen an, was passiert UND warum. Fast immer brauchst du „because“. Wer nur sagt, was passiert, hat „describe“ gemacht, und das gibt weniger Punkte."},"_k":"explain myp command terms explain why the order of the instructions changes the drawing. explicar expliquer erklaren explica por que el orden de las instrucciones cambia el dibujo. explique pourquoi l'ordre des instructions change le dessin. erklare, warum die reihenfolge der anweisungen die zeichnung verandert."},{"en":"justify","unit":"MYP command terms","ex":"Justify your choice of design by referring to your specification.","es":{"t":"justificar","e":"Justifica tu elección de diseño haciendo referencia a tu especificación.","u":"⚠ Término del MYP. «Justify» significa da razones válidas o pruebas que apoyen tu decisión. No es «me gusta más»: es «cumple los requisitos 2 y 5 de mi especificación y el otro no». Con esto se gana la nota alta en el Summative B."},"fr":{"t":"justifier","e":"Justifie ton choix de design en te référant à ton cahier des charges.","u":"⚠ Terme du MYP. « Justify » veut dire : donne des raisons valables ou des preuves qui soutiennent ta décision. Pas « je préfère », mais « il respecte les exigences 2 et 5 de mon cahier des charges, et l'autre non ». C'est ça qui donne la note haute au Summative B."},"de":{"t":"begründen","e":"Begründe deine Wahl des Designs mit Bezug auf deine Spezifikation.","u":"⚠ MYP-Begriff. „Justify“ heißt: Gib gültige Gründe oder Belege für deine Entscheidung. Nicht „gefällt mir besser“, sondern „es erfüllt Anforderung 2 und 5 meiner Spezifikation, das andere nicht“. Das bringt die hohe Note in Summative B."},"_k":"justify myp command terms justify your choice of design by referring to your specification. justificar justifier begrunden justifica tu eleccion de diseno haciendo referencia a tu especificacion. justifie ton choix de design en te referant a ton cahier des charges. begrunde deine wahl des designs mit bezug auf deine spezifikation."},{"en":"evaluate","unit":"MYP command terms","ex":"Evaluate your card: what works, what does not, and how you would improve it.","es":{"t":"evaluar","e":"Evalúa tu tarjeta: qué funciona, qué no y cómo la mejorarías.","u":"⚠ Término del MYP y nombre del Criterio D. «Evaluate» significa pesa los puntos fuertes Y los débiles y llega a un juicio. Solo alabar no es evaluar. Usa tus tests y el feedback como pruebas."},"fr":{"t":"évaluer","e":"Évalue ta carte : ce qui marche, ce qui ne marche pas, et comment tu l'améliorerais.","u":"⚠ Terme du MYP et nom du Critère D. « Evaluate » veut dire : pèse les points forts ET les points faibles, puis donne un jugement. Seulement féliciter, ce n'est pas évaluer. Utilise tes tests et le feedback comme preuves."},"de":{"t":"bewerten","e":"Bewerte deine Karte: Was funktioniert, was nicht, und wie würdest du sie verbessern?","u":"⚠ MYP-Begriff und Name von Kriterium D. „Evaluate“ heißt: Wäge Stärken UND Schwächen ab und komm zu einem Urteil. Nur loben ist kein Bewerten. Nutze deine Tests und das Feedback als Belege."},"_k":"evaluate myp command terms evaluate your card: what works, what does not, and how you would improve it. evaluar evaluer bewerten evalua tu tarjeta: que funciona, que no y como la mejorarias. evalue ta carte : ce qui marche, ce qui ne marche pas, et comment tu l'ameliorerais. bewerte deine karte: was funktioniert, was nicht, und wie wurdest du sie verbessern?"},{"en":"annotate","unit":"MYP command terms","ex":"Sketch three design ideas and annotate the interactive parts.","es":{"t":"anotar (poner notas explicativas)","e":"Dibuja tres ideas de diseño y anota las partes interactivas.","u":"⚠ Término del MYP. No es «apuntar» algo en la agenda: «annotate» es añadir notas cortas alrededor de un dibujo que expliquen qué hace cada parte. Un sketch sin annotations no se puede interpretar y pierde puntos."},"fr":{"t":"annoter","e":"Dessine trois idées de design et annote les parties interactives.","u":"⚠ Terme du MYP. « Annotate », c'est ajouter des notes courtes autour d'un croquis pour expliquer ce que fait chaque partie. Un sketch sans annotations ne peut pas être interprété, et ça coûte des points."},"de":{"t":"beschriften (mit Anmerkungen versehen)","e":"Skizziere drei Designideen und beschrifte die interaktiven Teile.","u":"⚠ MYP-Begriff. „Annotate“ heißt: Schreib kurze Notizen um eine Skizze herum, die erklären, was jeder Teil macht. Eine Skizze ohne annotations kann niemand verstehen, und das kostet Punkte."},"_k":"annotate myp command terms sketch three design ideas and annotate the interactive parts. anotar (poner notas explicativas) annoter beschriften (mit anmerkungen versehen) dibuja tres ideas de diseno y anota las partes interactivas. dessine trois idees de design et annote les parties interactives. skizziere drei designideen und beschrifte die interaktiven teile."}],"langs":["es","fr","de"],"units":["MYP Design cycle","MYP command terms","Unit 3a · Game Lab"],"ui":{"es":{"ph":"Escribe una palabra — en español o en inglés","all":"Todos los temas","none":"No se ha encontrado nada.","sort_en":"Orden: inglés","sort_xx":"Orden: español","count":"términos"},"fr":{"ph":"Tape un mot — en français ou en anglais","all":"Tous les thèmes","none":"Aucun résultat.","sort_en":"Tri : anglais","sort_xx":"Tri : français","count":"termes"},"de":{"ph":"Gib ein Wort ein — auf Deutsch oder Englisch","all":"Alle Themen","none":"Nichts gefunden.","sort_en":"Sortierung: Englisch","sort_xx":"Sortierung: Deutsch","count":"Begriffe"}},"beta":{"es":"Esta página la ha escrito <strong>Alfred</strong>, el sistema de IA del Sr. Rawson, para ayudarte a estudiar en inglés. <strong>Es nueva, y Alfred todavía está aprendiendo tu idioma, así que algunas cosas estarán mal.</strong> Si una palabra te parece incorrecta, seguramente tengas razón: díselo al Sr. Rawson y la corregimos. Si falta una palabra que necesitas, o se te ocurre cómo mejorar esta página, díselo también. Cambia siempre que lo pidas.","fr":"Cette page a été écrite par <strong>Alfred</strong>, le système d'IA de M. Rawson, pour t'aider à étudier en anglais. <strong>Elle est toute nouvelle, et Alfred apprend encore ta langue : certaines choses seront donc fausses.</strong> Si un mot te semble incorrect, tu as sans doute raison : dis-le à M. Rawson et nous le corrigerons. S'il manque un mot dont tu as besoin, ou si tu as une idée pour améliorer cette page, dis-le-lui aussi. Elle change dès que tu le demandes.","de":"Diese Seite hat <strong>Alfred</strong> geschrieben, das KI-System von Mr Rawson, damit du auf Englisch lernen kannst. <strong>Sie ist ganz neu, und Alfred lernt deine Sprache noch — manches wird also falsch sein.</strong> Wenn dir ein Wort falsch vorkommt, hast du wahrscheinlich recht: Sag Mr Rawson Bescheid, dann korrigieren wir es. Wenn ein Wort fehlt, das du brauchst, oder dir einfällt, wie diese Seite besser wird, sag ihm das auch. Sie ändert sich, sobald du es sagst."},"name":{"es":"Español","fr":"Français","de":"Deutsch"}};
const KEY = "vocab-lang";
const fold = s => (s||"").toString().toLowerCase()
  .normalize("NFD").replace(/[\u0300-\u036f]/g, "");

function pick() {
  const q = new URLSearchParams(location.search).get("lang");
  if (q && D.langs.includes(q)) { try { localStorage.setItem(KEY, q); } catch (e) {} return q; }
  let s = null; try { s = localStorage.getItem(KEY); } catch (e) {}
  if (s && D.langs.includes(s)) return s;
  return D.langs[0];
}
let L = pick();

function setLang(v) {
  L = v; try { localStorage.setItem(KEY, v); } catch (e) {}
  chrome(); render();
}

function chrome() {
  document.getElementById("langbar").innerHTML = D.langs.map(x =>
    `<button data-l="${x}" aria-pressed="${x === L}">${D.name[x]}</button>`).join("");
  document.querySelectorAll("#langbar button").forEach(b =>
    b.onclick = () => setLang(b.dataset.l));
  document.getElementById("beta").innerHTML = D.beta[L];
  const u = D.ui[L];
  document.getElementById("q").placeholder = u.ph;
  const sel = document.getElementById("unit"), keep = sel.value;
  sel.innerHTML = `<option value="">${u.all}</option>` +
    D.units.map(x => `<option>${x}</option>`).join("");
  sel.value = keep;
  const so = document.getElementById("sort"), ks = so.value;
  so.innerHTML = `<option value="en">${u.sort_en}</option><option value="xx">${u.sort_xx}</option>`;
  so.value = ks || "en";
}

function render() {
  const u = D.ui[L];
  const q = fold(document.getElementById("q").value.trim());
  const unit = document.getElementById("unit").value;
  const sort = document.getElementById("sort").value || "en";
  let rows = D.terms.filter(t => t[L]);
  if (unit) rows = rows.filter(t => t.unit === unit);
  if (q) rows = rows.filter(t => t._k.includes(q));
  rows.sort((a, b) => (sort === "xx" ? fold(a[L].t).localeCompare(fold(b[L].t))
                                     : fold(a.en).localeCompare(fold(b.en))));
  document.getElementById("n").textContent = rows.length + " " + u.count;
  document.getElementById("list").innerHTML = rows.length ? rows.map(t => {
    const w = t[L].u.indexOf("\u26a0") === 0 ? " warn" : "";
    return `<div class="row">
      <div><h3>${esc(t.en)}</h3><p class="xx">${esc(t[L].t)}</p>
        ${t.unit ? `<p class="unit">${esc(t.unit)}</p>` : ""}</div>
      <div>${t.ex ? `<p class="ex">${esc(t.ex)}</p>` : ""}
        <p class="ex tr">${esc(t[L].e)}</p>
        <p class="use${w}">${esc(t[L].u)}</p></div>
    </div>`;
  }).join("") : `<p class="n">${u.none}</p>`;
}

function esc(s) {
  return (s || "").replace(/[&<>"']/g, c =>
    ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"})[c]);
}

document.getElementById("q").addEventListener("input", render);
document.getElementById("unit").addEventListener("change", render);
document.getElementById("sort").addEventListener("change", render);
// A laptop is the only device these students may have in class (spec §2), so the
// keyboard is the fast path: "/" jumps to the box from anywhere on the page.
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement.id !== "q") {
    e.preventDefault(); document.getElementById("q").focus();
  }
});
chrome(); render();
</script>
